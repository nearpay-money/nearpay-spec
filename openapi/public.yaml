        - has_more
        - url
      type: object
    PaymentOption:
      additionalProperties: {}
      description: An indicative way to pay (not a quote).
      properties:
        available:
          description: Whether this option can be used now.
          type: boolean
        chain:
          description: Chain of that asset.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        decimals:
          description: Token decimals.
          maximum: 255
          minimum: 0
          type: integer
        estimated_amount_in:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Indicative amount to pay, base units (null if unknown).
        method:
          description: "`route_quote`: deposit to a 1Click address from any chain. `intents_transfer`: signed transfer from a NEAR Intents balance."
          enum:
            - route_quote
            - intents_transfer
          type: string
        min_deadline_s:
          description: Minimum deposit window this chain needs, seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        origin_asset_id:
          description: Asset the payer would pay with.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        reason:
          anyOf:
            - description: Why it is unavailable.
              type: string
              x-extensible-enum:
                - route_too_slow
                - amount_too_low
                - route_unavailable
                - pricing_unavailable
            - type: "null"
        route_class:
          description: Route class.
          type: string
          x-extensible-enum:
            - same_asset
            - stable_pair
            - volatile
            - intents_transfer
        symbol:
          description: Token symbol.
          type: string
      required:
        - method
        - origin_asset_id
        - chain
        - symbol
        - decimals
        - estimated_amount_in
        - route_class
        - min_deadline_s
        - available
        - reason
      type: object
    PaymentOptions:
      additionalProperties: {}
      description: Indicative payment options.
      properties:
        object:
          const: payment_options
          description: Always `payment_options`.
          type: string
        options:
          description: Options, best first.
          items:
            $ref: "#/components/schemas/PaymentOption"
          type: array
      required:
        - object
        - options
      type: object
    Ping:
      additionalProperties: {}
      description: Test delivery to a webhook endpoint.
      properties:
        object:
          const: ping
          description: Always `ping`.
          type: string
        webhook_endpoint:
          description: webhook_endpoint id (`we_` + 26 base32 chars).
          examples:
            - we_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^we_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
      required:
        - object
        - webhook_endpoint
      type: object
    PublicCheckoutSession:
      additionalProperties: {}
      description: A checkout session as the payer sees it.
      properties:
        allowed_origins:
          description: Origins allowed to embed this session.
          items:
            type: string
          type: array
        amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "Fiat: integer minor units. Asset: base units as a decimal string."
        asset_id:
          anyOf:
            - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            - type: "null"
          description: Pricing asset when `currency` is `asset`.
        attempt:
          anyOf:
            - $ref: "#/components/schemas/PayerAttempt"
            - type: "null"
          description: The current visible attempt, if any.
        cancel_url:
          anyOf:
            - description: Absolute URL.
              format: uri
              maxLength: 2048
              type: string
            - type: "null"
          description: Redirect target on cancel.
        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: ISO 4217 code for fiat pricing, or `asset` when priced in an asset (then `asset_id` is set).
        display:
          additionalProperties: {}
          description: What the payer is paying for.
          properties:
            description:
              description: Payment description.
              type:
                - string
                - "null"
            merchant_name_unverified:
              description: Merchant display name (not authenticated; the attested name comes from sentinel).
              type: string
          required:
            - merchant_name_unverified
            - description
          type: object
        expires_at:
          description: When the session stops accepting new payments.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        id:
          description: checkout_session id (`cs_` + 26 base32 chars).
          examples:
            - cs_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cs_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        intent_status:
          description: Payment intent status (domain-model §4.2).
          type: string
          x-extensible-enum:
            - requires_payment
            - processing
            - requires_review
            - succeeded
            - canceled
            - expired
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        object:
          const: checkout_session
          description: Always `checkout_session`.
          type: string
        payment_intent:
          description: Payment intent of this session (embedded checkout reports it in `np:complete`).
          examples:
            - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        settlement:
          additionalProperties: {}
          description: How the merchant is paid (never the raw address).
          properties:
            asset_id:
              description: Asset the merchant receives.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            chain:
              description: Chain the merchant receives on.
              examples:
                - eip155:8453
              pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
              type: string
            type:
              description: "Where funds settle: an address on a chain, or a NEAR Intents account."
              enum:
                - chain_address
                - intents_account
              type: string
          required:
            - asset_id
            - chain
            - type
          type: object
        status:
          description: Session status; `expiring` means past `expires_at` with money possibly in flight (INV-3).
          type: string
          x-extensible-enum:
            - open
            - expiring
            - complete
            - expired
        success_url:
          description: Redirect target after success (`?session_id=` appended).
          format: uri
          maxLength: 2048
          type: string
        ui_mode:
          description: Hosted page or embedded iframe.
          enum:
            - hosted
            - embedded
          type: string
      required:
        - id
        - object
        - livemode
        - status
        - payment_intent
        - intent_status
        - amount
        - currency
        - asset_id
        - display
        - expires_at
        - settlement
        - ui_mode
        - allowed_origins
        - success_url
        - cancel_url
        - attempt
      type: object
    RawEd25519MultiPayload:
      additionalProperties: {}
      description: Payload signed with raw ed25519.
      properties:
        payload:
          description: JSON string of `IntentMessage`.
          minLength: 2
          type: string
        public_key:
          description: ed25519 key of the signer.
          pattern: ^(ed25519|secp256k1):[1-9A-HJ-NP-Za-km-z]{32,90}$
          type: string
        signature:
          description: ed25519 signature over the UTF-8 payload.
          pattern: ^(ed25519|secp256k1):[1-9A-HJ-NP-Za-km-z]{64,100}$
          type: string
        standard:
          const: raw_ed25519
          description: Raw ed25519 over the payload bytes (agents).
          type: string
      required:
        - standard
        - payload
        - public_key
        - signature
      type: object
    Registration:
      additionalProperties: {}
      description: A verified email ready for passkey registration.
      properties:
        email:
          description: Verified email.
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
          type: string
        expires_at:
          description: Registration token expiry.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        object:
          const: registration
          description: Always `registration`.
          type: string
        registration_token:
          description: Single-use token for passkey registration (5 minutes).
          minLength: 32
          type: string
      required:
        - object
        - registration_token
        - email
        - expires_at
      type: object
    SentinelKey:
      additionalProperties: {}
      description: A sentinel signing key.
      properties:
        kid:
          description: Key id.
          type: string
        not_after:
          description: Key retirement time.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        public_key:
          description: Raw 32-byte Ed25519 public key, base64url.
          pattern: ^[A-Za-z0-9_-]+$
          type: string
      required:
        - kid
        - public_key
        - not_after
