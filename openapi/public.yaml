          x-extensible-enum:
            - checkout
            - invoice
            - payment_link
            - api
        status:
          description: Payment intent status (domain-model §4.2).
          type: string
          x-extensible-enum:
            - requires_payment
            - processing
            - requires_review
            - succeeded
            - canceled
            - expired
        succeeded_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the intent succeeded.
