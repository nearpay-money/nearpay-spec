  /x402/requirements:
    post:
      description: "Never cache or share the result between clients: each binding is single-use."
      operationId: x402Requirements
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                amount:
                  description: Amount the merchant receives, base units of the asset.
                  pattern: ^(0|[1-9][0-9]{0,77})$
                  type: string
                asset_id:
                  description: "Asset; default: the asset of the default Intents destination."
                  examples:
                    - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
                  maxLength: 256
                  pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
                  type: string
                max_timeout_s:
                  default: 120
                  description: Settlement window, seconds.
                  maximum: 300
                  minimum: 30
                  type: integer
                pay_to:
                  description: Merchant Intents account; must be an active Intents destination.
                  pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
                  type: string
                resource:
                  additionalProperties: false
                  description: The resource being paid for.
                  properties:
                    description:
                      description: What is being paid for.
                      maxLength: 500
                      type: string
                    mimeType:
                      description: MIME type.
                      maxLength: 100
                      type: string
                    url:
                      description: Resource URL.
                      format: uri
                      type: string
                  required:
                    - url
                  type: object
              required:
                - resource
                - amount
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/X402PaymentRequired"
          description: Issue single-use payment requirements for one 402 response.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `asset_unsupported`."
          x-error-codes:
            - asset_unsupported
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `account_not_live`."
          x-error-codes:
            - account_not_live
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `destination_not_intents_account`."
          x-error-codes:
            - destination_not_intents_account
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `amount_below_minimum`."
          x-error-codes:
            - amount_below_minimum
        default:
          content:
            application/json:
