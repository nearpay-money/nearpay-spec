              type:
                const: public-key
                description: Credential type.
                type: string
            required:
              - id
              - type
            type: object
          type: array
        pubKeyCredParams:
          description: Accepted algorithms (-8 Ed25519, -7 ES256, -257 RS256).
          items:
            additionalProperties: {}
            properties:
              alg:
                description: COSE algorithm id.
                maximum: 9007199254740991
                minimum: -9007199254740991
                type: integer
              type:
                const: public-key
                description: Type.
                type: string
            required:
              - type
              - alg
            type: object
          type: array
        rp:
          additionalProperties: {}
          description: Relying party.
          properties:
            id:
              description: Relying party id (`nearpay.money` / `nearpay.localhost`).
              type: string
            name:
              description: Relying party name.
              type: string
          required:
            - id
            - name
          type: object
        timeout:
          description: Timeout in milliseconds.
          maximum: 9007199254740991
          minimum: -9007199254740991
          type: integer
        user:
          additionalProperties: {}
          description: User entity.
          properties:
            displayName:
              description: Display name.
              type: string
            id:
              description: User handle, base64url.
              pattern: ^[A-Za-z0-9_-]+$
              type: string
            name:
              description: User name (email).
              type: string
          required:
            - id
            - name
            - displayName
          type: object
      required:
        - challenge
        - rp
        - user
        - pubKeyCredParams
      type: object
    WebAuthnRegistrationResponse:
      additionalProperties: {}
      description: RegistrationResponseJSON from `navigator.credentials.create()`.
      properties:
        authenticatorAttachment:
          description: Attachment.
          type:
            - string
            - "null"
        clientExtensionResults:
          additionalProperties: {}
          description: Extension results.
          propertyNames:
            type: string
          type: object
        id:
          description: Credential id.
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        rawId:
          description: Raw credential id.
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        response:
          additionalProperties: {}
          description: Attestation response.
          properties:
            attestationObject:
              description: Attestation object, base64url.
              pattern: ^[A-Za-z0-9_-]+$
              type: string
            clientDataJSON:
              description: Client data, base64url.
              pattern: ^[A-Za-z0-9_-]+$
              type: string
            transports:
              description: Transports.
              items:
                type: string
              type: array
          required:
            - clientDataJSON
            - attestationObject
          type: object
        type:
          const: public-key
          description: Credential type.
          type: string
      required:
        - id
        - rawId
        - type
        - response
        - clientExtensionResults
      type: object
    WebAuthnRequestOptions:
      additionalProperties: {}
      description: PublicKeyCredentialRequestOptionsJSON.
      properties:
        allowCredentials:
          description: Allowed credentials (empty = discoverable).
          items:
            additionalProperties: {}
            description: Credential descriptor.
            properties:
              id:
                description: Credential id, base64url.
                pattern: ^[A-Za-z0-9_-]+$
                type: string
              transports:
                description: Authenticator transports hint.
                items:
                  type: string
                type: array
              type:
                const: public-key
                description: Credential type.
                type: string
            required:
              - id
              - type
            type: object
          type: array
        challenge:
          description: Server challenge, base64url.
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        rpId:
          description: Relying party id.
          type: string
        timeout:
          description: Timeout in milliseconds.
          maximum: 9007199254740991
          minimum: -9007199254740991
          type: integer
        userVerification:
          description: User verification requirement.
          type: string
      required:
        - challenge
      type: object
    WebhookDelivery:
      additionalProperties: {}
      description: One event's delivery to one endpoint, with a summary of its attempts.
      properties:
        attempts:
          description: Attempts made so far, including a successful one.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        event:
          description: event id (`evt_` + 26 base32 chars).
          examples:
            - evt_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^evt_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        event_type:
          description: Event type.
          type: string
          x-extensible-enum:
            - checkout.session.completed
            - checkout.session.expired
            - payment_intent.created
            - payment_intent.processing
            - payment_intent.succeeded
            - payment_intent.payment_failed
            - payment_intent.requires_review
            - payment_intent.overpaid
            - payment_intent.canceled
            - agent_payment.settled
            - agent_payment.failed
            - ping
        id:
          description: webhook_delivery id (`whd_` + 26 base32 chars).
          examples:
            - whd_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^whd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        last_error:
          description: Why the last attempt failed (timeout, connection refused, non-2xx, egress policy); null if none.
          type:
            - string
            - "null"
        last_status_code:
          anyOf:
            - maximum: 599
              minimum: 100
              type: integer
            - type: "null"
          description: HTTP status of the last attempt; null before the first attempt or when it got no response.
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        next_attempt_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the next attempt is due; null once the delivery is `succeeded` or `abandoned`.
        object:
          const: webhook_delivery
          description: Always `webhook_delivery`.
          type: string
        status:
          description: "`pending`: not attempted yet. `failed`: the last attempt failed and a retry is scheduled. `succeeded`: an attempt got a 2xx. `abandoned`: no more attempts (72 h passed or the endpoint was deleted)."
          type: string
          x-extensible-enum:
            - pending
            - succeeded
            - failed
            - abandoned
        succeeded_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When an attempt succeeded.
        webhook_endpoint:
          description: webhook_endpoint id (`we_` + 26 base32 chars).
          examples:
            - we_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^we_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
      required:
        - id
        - object
        - created
        - livemode
        - webhook_endpoint
        - event
        - event_type
        - status
        - attempts
        - last_status_code
        - last_error
        - next_attempt_at
        - succeeded_at
      type: object
    WebhookDeliveryList:
      additionalProperties: {}
      description: A page of webhook deliveries.
      properties:
        data:
          description: Objects on this page.
          items:
            $ref: "#/components/schemas/WebhookDelivery"
          type: array
        has_more:
          description: Whether more objects exist after this page.
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          description: Path of this list endpoint.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    WebhookEndpoint:
      additionalProperties: {}
      description: A URL that receives signed events.
      properties:
        api_version:
          description: Payloads are rendered in this API version.
          enum:
            - 2026-11-01
          type: string
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        description:
          description: Description.
          type:
            - string
            - "null"
        disabled_reason:
          anyOf:
            - description: Why the endpoint is disabled.
              type: string
              x-extensible-enum:
                - merchant
                - failing
            - type: "null"
        enabled_events:
          description: Event types delivered (`*` = all).
          items:
            type: string
          type: array
        id:
          description: webhook_endpoint id (`we_` + 26 base32 chars).
          examples:
            - we_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^we_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        object:
          const: webhook_endpoint
          description: Always `webhook_endpoint`.
          type: string
        secret:
          description: Signing secret; returned only when the endpoint is created.
          pattern: ^whsec_[0-9A-Za-z]{32,64}$
          type: string
        status:
          description: Whether deliveries are made.
          type: string
          x-extensible-enum:
            - enabled
            - disabled
        url:
          description: Delivery URL.
          format: uri
          type: string
      required:
        - id
        - object
        - created
        - livemode
        - url
        - enabled_events
        - api_version
        - description
        - status
        - disabled_reason
      type: object
    WebhookEndpointList:
      additionalProperties: {}
      description: A page of webhook endpoints.
      properties:
        data:
          description: Objects on this page.
          items:
            $ref: "#/components/schemas/WebhookEndpoint"
          type: array
        has_more:
          description: Whether more objects exist after this page.
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          description: Path of this list endpoint.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    WebhookSigningJwk:
      additionalProperties: {}
      description: An Ed25519 webhook signing key.
      properties:
        alg:
          const: EdDSA
          description: Algorithm.
          type: string
        crv:
          const: Ed25519
          description: Curve.
          type: string
        kid:
          description: Key id (matches `kid=` in the signature header).
          type: string
        kty:
          const: OKP
          description: Key type.
          type: string
        use:
          const: sig
          description: Use.
          type: string
        x:
          description: Public key, base64url.
          pattern: ^[A-Za-z0-9_-]+$
          type: string
      required:
        - kty
        - crv
        - x
        - kid
        - alg
        - use
      type: object
    WebhookSigningKeys:
      additionalProperties: {}
      description: JWKS of webhook signing keys.
      properties:
        keys:
          description: Signing keys.
          items:
            $ref: "#/components/schemas/WebhookSigningJwk"
          type: array
      required:
        - keys
      type: object
    X402IntentsTransferExtra:
      additionalProperties: {}
      description: NearPay `intents-transfer` requirement details.
      properties:
        assetTransferMethod:
          const: intents-transfer
          description: NearPay transfer method.
          type: string
        binding:
          description: Binding memo `np1:` + base58(sha256(…)) tying a signed transfer to one requirement.
          pattern: ^np1:[1-9A-HJ-NP-Za-km-z]{43,44}$
          type: string
        deadline:
          description: Absolute expiry of this issued requirement (RFC 3339; the binding's `expires_at`). Sign a Verifier `deadline` at or before it; absent from facilitators older than spec 0.1.5, then derive the window from `maxTimeoutSeconds`.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        fee:
          additionalProperties: {}
          description: NearPay fee transfer the payload must also contain.
          properties:
            amount:
              description: Fee in base units of the same asset.
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            to:
              description: NearPay treasury Intents account.
              pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
              type: string
          required:
            - to
            - amount
          type: object
        paymentFlow:
          const: authorization
          description: Payer signs; facilitator relays.
          type: string
        verifyingContract:
          const: intents.near
          description: Verifier contract.
          type: string
      required:
        - assetTransferMethod
        - paymentFlow
        - fee
        - binding
        - verifyingContract
      type: object
    X402PaymentPayload:
      additionalProperties: {}
      description: Body of `PAYMENT-SIGNATURE` (base64 JSON).
      properties:
        accepted:
          $ref: "#/components/schemas/X402PaymentRequirements"
          description: The requirement the payer chose (must equal one in `accepts`).
        extensions:
          additionalProperties: {}
          description: Protocol extensions.
          propertyNames:
            type: string
          type: object
        payload:
          additionalProperties: {}
          description: Signed Verifier payload with exactly the two transfers.
          properties:
            signed:
              $ref: "#/components/schemas/MultiPayload"
          required:
            - signed
          type: object
        resource:
          $ref: "#/components/schemas/X402ResourceInfo"
        x402Version:
          const: 2
          description: x402 protocol version.
          type: number
      required:
        - x402Version
        - accepted
        - payload
      type: object
    X402PaymentRequired:
      additionalProperties: {}
      description: Body of `PAYMENT-REQUIRED` (base64 JSON).
      properties:
        accepts:
          description: Accepted payment requirements.
          items:
            $ref: "#/components/schemas/X402PaymentRequirements"
          minItems: 1
          type: array
        error:
          description: Why payment is (still) required.
          type: string
        extensions:
          additionalProperties: {}
          description: Protocol extensions.
          propertyNames:
            type: string
          type: object
        resource:
          $ref: "#/components/schemas/X402ResourceInfo"
        x402Version:
          const: 2
          description: x402 protocol version.
          type: number
      required:
        - x402Version
        - resource
        - accepts
      type: object
    X402PaymentRequirements:
      additionalProperties: {}
      description: One accepted way to pay (`accepts[]` entry).
      properties:
        amount:
          description: Amount the merchant receives, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset:
          description: Asset to pay (NEAR Intents asset id).
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        extra:
          $ref: "#/components/schemas/X402IntentsTransferExtra"
        maxTimeoutSeconds:
          description: Payment must be settled within this time.
          maximum: 300
          minimum: 30
          type: integer
        network:
          const: near:mainnet
          description: Network.
          type: string
        payTo:
          description: Merchant Intents account.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        scheme:
          const: exact
          description: x402 scheme.
          type: string
      required:
        - scheme
        - network
        - amount
        - asset
        - payTo
        - maxTimeoutSeconds
        - extra
      type: object
    X402ResourceInfo:
      additionalProperties: {}
      description: The resource a payment unlocks.
      properties:
        description:
          description: What is being paid for.
          maxLength: 500
          type: string
        mimeType:
          description: MIME type of the resource.
          maxLength: 100
          type: string
        url:
          description: URL of the paid resource.
          format: uri
          type: string
      required:
        - url
      type: object
    X402SettleResponse:
      additionalProperties: {}
      description: Facilitator `/settle` result; body of `PAYMENT-RESPONSE`.
      properties:
        amount:
          description: Amount settled to `payTo`.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        errorMessage:
          description: Human-readable detail.
          type: string
        errorReason:
          description: Why settlement did not (yet) succeed; `settlement_pending` is not terminal.
          type: string
          x-extensible-enum:
            - invalid_x402_version
            - invalid_scheme
            - invalid_network
            - invalid_payment_requirements
            - requirement_unknown
            - requirement_expired
            - requirement_consumed
            - invalid_payload
            - invalid_signature
            - recipient_mismatch
            - amount_mismatch
            - deadline_invalid
            - insufficient_funds
            - nonce_used
            - payer_blocked
            - quota_exceeded
            - settlement_pending
            - unexpected_settle_error
        network:
          const: near:mainnet
          description: Network.
          type: string
        payer:
          description: Payer Intents account.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        replayed:
          description: True when this payment payload was settled before and this response repeats that result (settle is idempotent on the payload); deliver the resource at most once per settlement.
          type: boolean
        success:
          description: Settled on NEAR (final).
          type: boolean
        transaction:
          anyOf:
            - description: Transaction hash in the chain's text form.
              maxLength: 128
              minLength: 8
              type: string
            - const: ""
              type: string
          description: NEAR transaction hash (empty when not submitted).
      required:
        - success
        - transaction
        - network
      type: object
    X402SupportedResponse:
      additionalProperties: {}
      description: Facilitator `/supported`.
      properties:
        extensions:
          description: Supported extensions.
          items:
            type: string
          type: array
        kinds:
          description: Supported kinds.
          items:
            additionalProperties: {}
            description: A supported scheme/network.
            properties:
              extra:
                additionalProperties: {}
                description: Details.
                properties:
                  assetTransferMethod:
                    const: intents-transfer
                    description: Method.
                    type: string
                required:
                  - assetTransferMethod
                type: object
              network:
                const: near:mainnet
                description: Network.
                type: string
              scheme:
                const: exact
                description: Scheme.
                type: string
              x402Version:
                const: 2
                description: Version.
                type: number
            required:
              - x402Version
              - scheme
              - network
              - extra
            type: object
          type: array
        signers:
          additionalProperties:
            items:
              type: string
            type: array
          description: Network pattern → relayer accounts that submit transactions.
          propertyNames:
            type: string
          type: object
      required:
        - kinds
        - extensions
        - signers
      type: object
    X402VerifyRequest:
      additionalProperties: {}
      description: Facilitator `/verify` and `/settle` request.
      properties:
        paymentPayload:
          $ref: "#/components/schemas/X402PaymentPayload"
        paymentRequirements:
          $ref: "#/components/schemas/X402PaymentRequirements"
        x402Version:
          const: 2
          description: x402 protocol version.
          type: number
      required:
        - x402Version
        - paymentPayload
        - paymentRequirements
      type: object
    X402VerifyResponse:
      additionalProperties: {}
      description: Facilitator `/verify` result.
      properties:
        invalidMessage:
          description: Human-readable detail.
          type: string
        invalidReason:
          description: Why a payment payload is invalid.
          type: string
          x-extensible-enum:
            - invalid_x402_version
            - invalid_scheme
            - invalid_network
            - invalid_payment_requirements
            - requirement_unknown
            - requirement_expired
            - requirement_consumed
            - invalid_payload
            - invalid_signature
            - recipient_mismatch
            - amount_mismatch
            - deadline_invalid
            - insufficient_funds
            - nonce_used
            - payer_blocked
            - quota_exceeded
        isValid:
          description: Whether the payload would settle.
          type: boolean
        payer:
          description: Payer Intents account.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
      required:
        - isValid
      type: object
  securitySchemes:
    apiKey:
      description: Secret (`sk_`), restricted (`rk_`) or publishable (`pk_`) key.
      scheme: bearer
      type: http
    clientSecret:
      description: Checkout session client secret (payer API).
      in: header
      name: X-NearPay-Client-Secret
      type: apiKey
    session:
      description: Dashboard session (+ `X-CSRF-Token` on unsafe methods).
      in: cookie
      name: __Host-np_session
      type: apiKey
info:
  description: NearPay public API. Generated from `nearpay-spec` (zod sources); do not edit by hand.
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  title: NearPay API
  version: 0.1.5
openapi: 3.1.0
paths:
  /v1/account:
    get:
      operationId: getAccount
      parameters:
        - description: "API version (default: the account's pinned version)."
          in: header
          name: NearPay-Version
          schema:
            description: "API version (default: the account's pinned version)."
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: Retrieve the account.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - session: []
      summary: Retrieve the account.
      tags:
        - identity
      x-nearpay:
        auth:
          - session
        idempotent: false
        service: identity
        stage: 1
    patch:
      description: Changing `fee_bearer`, `settings.late_payments` or `settings.underpay_tolerance_bps` needs a fresh step-up (`step_up_required` otherwise).
      operationId: updateAccount
      parameters:
        - description: Makes the request safe to retry for 24 h (same key + same body = same result).
          in: header
          name: Idempotency-Key
          schema:
            description: Makes the request safe to retry for 24 h (same key + same body = same result).
            maxLength: 255
            minLength: 1
            type: string
        - description: "API version (default: the account's pinned version)."
          in: header
          name: NearPay-Version
          schema:
            description: "API version (default: the account's pinned version)."
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                country:
                  description: Country.
                  pattern: ^[A-Z]{2}$
                  type: string
                display_name:
                  description: Display name.
                  maxLength: 100
                  minLength: 1
                  type: string
                fee_bearer:
                  description: Who bears NearPay's fee.
                  enum:
                    - payer
                    - merchant
                  type: string
                settings:
                  additionalProperties: false
                  description: Settings to change.
                  properties:
                    branding:
                      additionalProperties: false
                      description: Checkout branding.
                      properties:
                        accent_color:
                          anyOf:
                            - pattern: ^#[0-9a-fA-F]{6}$
                              type: string
                            - type: "null"
                          description: Accent colour.
                        logo_url:
                          anyOf:
                            - description: Absolute URL.
                              format: uri
                              maxLength: 2048
                              type: string
                            - type: "null"
                          description: HTTPS logo URL.
                      type: object
                    email_receipts:
                      description: Email receipts to customers.
                      type: boolean
                    late_payments:
                      description: Accept late settlements.
