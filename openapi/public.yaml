components:
  schemas:
    Account:
      additionalProperties: {}
      description: A merchant account.
      properties:
        api_version:
          description: API version pinned for this account.
          enum:
            - 2026-11-01
          type: string
        country:
          anyOf:
            - description: ISO 3166-1 alpha-2 country code, upper-case.
              pattern: ^[A-Z]{2}$
              type: string
            - type: "null"
          description: Country of the merchant.
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        display_name:
          description: Name shown to payers until KYB verifies a legal name.
          maxLength: 100
          minLength: 1
          type: string
        fee_bearer:
          description: "Who bears NearPay's fee: the payer pays it on top (default) or it is deducted from the settlement."
          enum:
            - payer
            - merchant
          type: string
        id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        kyb_status:
          description: KYB status.
          type: string
          x-extensible-enum:
            - not_started
            - pending
            - needs_info
            - approved
            - rejected
        live_enabled:
          description: "Live mode is enabled: KYB approved, an active live destination, status active."
          type: boolean
        object:
          const: account
          description: Always `account`.
          type: string
        settings:
          $ref: "#/components/schemas/AccountSettings"
        status:
          description: Account status.
          type: string
          x-extensible-enum:
            - active
            - suspended
            - closed
        verified_legal_name:
          description: Legal name verified by KYB, shown on checkout once set.
          type:
            - string
            - "null"
      required:
        - id
        - object
        - created
        - display_name
        - verified_legal_name
        - country
        - status
        - kyb_status
        - live_enabled
        - fee_bearer
        - api_version
        - settings
      type: object
    AccountRequirements:
      additionalProperties: {}
      description: What an account still needs to go live (FR-ACC-05).
      properties:
        live_enabled:
          description: Whether live mode is enabled.
          type: boolean
        missing:
          description: What is still needed before live mode is enabled.
          items:
            description: A missing live-mode requirement.
            type: string
            x-extensible-enum:
              - kyb
              - destination
              - account_status
          type: array
        object:
          const: account_requirements
          description: Always `account_requirements`.
          type: string
      required:
        - object
        - live_enabled
        - missing
      type: object
    AccountSettings:
      additionalProperties: {}
      description: Merchant settings that change checkout behaviour.
      properties:
        branding:
          additionalProperties: {}
          description: Checkout branding.
          properties:
            accent_color:
              anyOf:
                - pattern: ^#[0-9a-fA-F]{6}$
                  type: string
                - type: "null"
              description: Accent colour `#RRGGBB`.
            logo_url:
              anyOf:
                - description: Absolute URL.
                  format: uri
                  maxLength: 2048
                  type: string
                - type: "null"
              description: HTTPS URL of a square logo.
          required:
            - accent_color
            - logo_url
          type: object
        email_receipts:
          description: Email a receipt to the customer when a payment succeeds.
          type: boolean
        late_payments:
          description: Accept settlements that arrive after a session expired (INV-3); default false.
          type: boolean
        session_ttl_default:
          description: Default checkout-session lifetime in seconds.
          maximum: 86400
          minimum: 300
          type: integer
        underpay_tolerance_bps:
          description: Accept short settlements within this tolerance (0–100 bps); default 0.
          maximum: 10000
          minimum: 0
          type: integer
      required:
        - late_payments
        - underpay_tolerance_bps
        - session_ttl_default
        - email_receipts
        - branding
      type: object
    AgentPayRequirements:
      additionalProperties: {}
      description: What an agent must sign to pay a checkout session. Agents MUST obtain and verify a sentinel attestation for `requirement` before signing.
      properties:
        attempt_id:
          description: payment_attempt id (`pa_` + 26 base32 chars).
          examples:
            - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        attestation_ticket:
          description: "`base64url(JCS payload).base64url(Ed25519 signature)` issued by payments; pass it to sentinel unchanged."
          pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
          type: string
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        object:
          const: agent_pay_requirements
          description: Always `agent_pay_requirements`.
          type: string
        requirement:
          $ref: "#/components/schemas/IntentsRequirement"
      required:
        - object
        - livemode
        - attempt_id
        - attestation_ticket
        - requirement
      type: object
    AgentPaySubmission:
      additionalProperties: {}
      description: An accepted agent payment for a checkout session.
      properties:
        agent_payment:
          description: agent_payment id (`ap_` + 26 base32 chars).
          examples:
            - ap_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^ap_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        attempt:
          $ref: "#/components/schemas/PayerAttempt"
        object:
          const: agent_pay_submission
          description: Always `agent_pay_submission`.
          type: string
        status:
          const: submitted
          description: The payload was queued for relay.
          type: string
      required:
        - object
        - status
        - agent_payment
        - attempt
      type: object
    AgentPayment:
      additionalProperties: {}
      description: A payer-signed NEAR Intents payment relayed by NearPay.
      properties:
        amount:
          description: Amount to the merchant, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          description: Asset.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        binding:
          description: Binding memo `np1:` + base58(sha256(…)) tying a signed transfer to one requirement.
          pattern: ^np1:[1-9A-HJ-NP-Za-km-z]{43,44}$
          type: string
        block_height:
          anyOf:
            - maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Block of the transaction.
        checkout_session:
          anyOf:
            - description: checkout_session id (`cs_` + 26 base32 chars).
              examples:
                - cs_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^cs_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Checkout session paid (checkout kind).
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        error_reason:
          description: Why it failed.
          type:
            - string
            - "null"
        fee_amount:
          description: NearPay fee, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        id:
          description: agent_payment id (`ap_` + 26 base32 chars).
          examples:
            - ap_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^ap_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        kind:
          description: What the signed payload paid for.
          type: string
          x-extensible-enum:
            - x402
            - checkout
            - refund
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        object:
          const: agent_payment
          description: Always `agent_payment`.
          type: string
        pay_to:
          description: Merchant Intents account.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        payer:
          description: Payer Intents account (signer).
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        resource_url:
          anyOf:
            - format: uri
              type: string
            - type: "null"
          description: Paid resource (x402).
        sequence:
          description: Increases with every change; discard webhook objects with a lower sequence. Servers MUST send it (optional in the 0.1.x schema only so readers built on 0.1.4 stay compatible).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        settled_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When it settled (final).
        status:
          description: Relay status.
          type: string
          x-extensible-enum:
            - verified
            - queued
            - submitted
            - settled
            - failed
        tx_hash:
          anyOf:
            - description: Transaction hash in the chain's text form.
              maxLength: 128
              minLength: 8
              type: string
            - type: "null"
          description: NEAR transaction that executed the payload.
      required:
        - id
        - object
        - created
        - livemode
        - kind
        - status
        - payer
        - pay_to
        - asset_id
        - amount
        - fee_amount
        - binding
        - resource_url
        - checkout_session
        - tx_hash
        - block_height
        - error_reason
        - settled_at
      type: object
    AgentPaymentList:
      additionalProperties: {}
      description: A page of agent payments.
      properties:
        data:
          description: Objects on this page.
          items:
            $ref: "#/components/schemas/AgentPayment"
          type: array
        has_more:
          description: Whether more objects exist after this page.
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          description: Path of this list endpoint.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    ApiKey:
      additionalProperties: {}
      description: An API key record (the secret itself is shown once).
      properties:
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        display_prefix:
          description: Key prefix, e.g. `sk_live_`.
          type: string
        expires_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Expiry, if set.
        id:
          description: api_key id (`key_` + 26 base32 chars).
          examples:
            - key_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^key_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        ip_allowlist:
          description: CIDR ranges allowed to use the key; empty = any.
          items:
            type: string
          type: array
        last4:
          description: Last four characters of the key.
          maxLength: 4
          minLength: 4
          type: string
        last_used_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Last use (updated at most every minute).
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        name:
          description: Name given when the key was created.
          type: string
        object:
          const: api_key
          description: Always `api_key`.
          type: string
        scopes:
          description: Scopes of a restricted key; empty for secret and publishable keys.
          items:
            type: string
          type: array
        secret:
          description: The full key. Returned only once, when the key is created or rolled.
          pattern: ^(sk|pk|rk)_(live|test)_[0-9A-Za-z]{48}$
          type: string
        type:
          description: Key type.
          type: string
          x-extensible-enum:
            - secret
            - publishable
            - restricted
      required:
        - id
        - object
        - created
        - livemode
        - type
        - name
        - display_prefix
        - last4
        - scopes
        - ip_allowlist
        - expires_at
        - last_used_at
      type: object
    ApiKeyList:
      additionalProperties: {}
      description: A page of API keys.
      properties:
        data:
          description: Objects on this page.
          items:
            $ref: "#/components/schemas/ApiKey"
          type: array
        has_more:
          description: Whether more objects exist after this page.
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          description: Path of this list endpoint.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    Asset:
      additionalProperties: {}
      description: An asset NearPay can price, route and settle.
      properties:
        asset_id:
          description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        chain:
          description: Chain the asset lives on.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        decimals:
          description: Decimals.
          maximum: 255
          minimum: 0
          type: integer
        family:
          description: Asset family for same-asset routing (`USDC`, `USDT`, `ETH`, …).
          type: string
        is_usd_stable:
          description: A USD stablecoin.
          type: boolean
        object:
          const: asset
          description: Always `asset`.
          type: string
        symbol:
          description: Token symbol.
          type: string
      required:
        - asset_id
        - object
        - chain
        - symbol
        - decimals
        - family
        - is_usd_stable
      type: object
    AssetList:
      additionalProperties: {}
      description: All enabled assets.
      properties:
        data:
          description: Enabled assets.
          items:
            $ref: "#/components/schemas/Asset"
          type: array
        has_more:
          const: false
          description: Always `false` (not paginated).
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          const: /v1/assets
          description: Path.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    Attestation:
      additionalProperties: {}
      description: What sentinel vouches for.
      properties:
        attempt_id:
          description: payment_attempt id (`pa_` + 26 base32 chars).
          examples:
            - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        deposit:
          $ref: "#/components/schemas/AttestedDeposit"
          description: Present for `route_quote`.
        destination:
          additionalProperties: {}
          description: Matched settlement destination.
          properties:
            asset_id:
              description: Settlement asset.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            chain:
              description: Settlement chain.
              examples:
                - eip155:8453
              pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
              type: string
            fingerprint:
              description: Destination fingerprint (also shown in the merchant dashboard).
              pattern: ^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{2}$
              type: string
          required:
            - asset_id
            - chain
            - fingerprint
          type: object
        expires_at:
          description: Expiry; never after the deposit/payload deadline.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        issued_at:
          description: Issue time.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        kind:
          description: What is being attested.
          enum:
            - route_quote
            - intents_transfer
          type: string
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        merchant:
          additionalProperties: {}
          description: Who receives the payment.
          properties:
            kyb_verified:
              description: Whether `name` is KYB-verified.
              type: boolean
            name:
              description: Merchant name (KYB-verified legal name when available).
              type: string
          required:
            - name
            - kyb_verified
          type: object
        requirement:
          $ref: "#/components/schemas/IntentsRequirement"
          description: Present for `intents_transfer`.
        v:
          const: 1
          description: Attestation format version.
          type: number
      required:
        - v
        - kind
        - attempt_id
        - livemode
        - merchant
        - destination
        - issued_at
        - expires_at
      type: object
    AttestationChallenge:
      additionalProperties: {}
      description: Message proving control of a settlement destination (FR-SET-02).
      properties:
        expires_at:
          description: Challenge expiry (10 minutes).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        id:
          description: attestation_challenge id (`chl_` + 26 base32 chars).
          examples:
            - chl_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^chl_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        message:
          description: Exact UTF-8 message the destination key must sign.
          type: string
        nonce:
          anyOf:
            - pattern: ^[A-Za-z0-9+/]{43}=$
              type: string
            - type: "null"
          description: NEP-413 nonce (32 bytes, base64); null for other standards.
        recipient:
          description: NEP-413 recipient (`nearpay.money`); null for other standards.
          type:
            - string
            - "null"
        signing_standard:
          description: How to sign the message.
          type: string
          x-extensible-enum:
            - nep413
            - eip191
            - solana
            - bip322
      required:
        - id
        - message
        - signing_standard
        - nonce
        - recipient
        - expires_at
      type: object
    AttestedDeposit:
      additionalProperties: {}
      description: Deposit instructions as attested.
      properties:
        address:
          description: Deposit address.
          maxLength: 256
          minLength: 1
          type: string
        amount_in:
          description: Amount to send, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        chain:
          description: Origin chain.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        deadline:
          description: Deposit deadline.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        memo:
          description: Deposit memo, or null.
          type:
            - string
            - "null"
        origin_asset_id:
          description: Asset to send.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
      required:
        - address
        - memo
        - chain
        - origin_asset_id
        - amount_in
        - deadline
      type: object
    BalanceTransaction:
      additionalProperties: {}
      description: "A statement line: what settled where, with its evidence."
      properties:
        created:
          description: When the line was recorded.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        evidence:
          $ref: "#/components/schemas/Evidence"
          description: On-chain proof behind the line.
        fee:
          anyOf:
            - additionalProperties: {}
              properties:
                amount_estimated:
                  description: Estimated fee in the fee asset, base units.
                  pattern: ^(0|[1-9][0-9]{0,77})$
                  type: string
                asset_id:
                  description: Asset the fee was taken in.
                  examples:
                    - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
                  maxLength: 256
                  pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
                  type: string
                bps:
                  description: Fee rate applied.
                  maximum: 10000
                  minimum: 0
                  type: integer
              required:
                - bps
                - amount_estimated
                - asset_id
              type: object
            - type: "null"
          description: Fee for `payment` lines.
        gross:
          anyOf:
            - additionalProperties: {}
              properties:
                amount:
                  description: Fiat amount in minor units (e.g. cents), integer.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                currency:
                  description: ISO 4217 currency code, lower-case (e.g. `usd`).
                  pattern: ^[a-z]{3}$
                  type: string
              required:
                - amount
                - currency
              type: object
            - type: "null"
          description: Priced amount for `payment` lines of fiat-priced intents (minor units).
        id:
          description: balance_transaction id (`txn_` + 26 base32 chars).
          examples:
            - txn_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^txn_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        object:
          const: balance_transaction
          description: Always `balance_transaction`.
          type: string
        payment_intent:
          anyOf:
            - description: payment_intent id (`pi_` + 26 base32 chars).
              examples:
                - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Payment intent the line belongs to.
        refund:
          anyOf:
            - description: refund id (`re_` + 26 base32 chars).
              examples:
                - re_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^re_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Refund the line belongs to (refund lines, Stage 2).
        settled:
          $ref: "#/components/schemas/SettlementValue"
          description: Amount of the settlement asset the line records (received by, or returned from, the destination).
        type:
          description: "What the line records: a succeeded payment, extra settlement, a refund (Stage 2) or a reconciliation fee correction (Stage 2)."
          type: string
          x-extensible-enum:
            - payment
            - overpayment
            - refund
            - fee_adjustment
      required:
        - id
        - object
        - created
        - livemode
        - type
        - payment_intent
        - refund
        - gross
        - settled
        - fee
        - evidence
      type: object
    BalanceTransactionList:
      additionalProperties: {}
      description: A page of statement lines.
      properties:
        data:
          description: Objects on this page.
          items:
            $ref: "#/components/schemas/BalanceTransaction"
          type: array
        has_more:
          description: Whether more objects exist after this page.
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          description: Path of this list endpoint.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    CheckoutSession:
      additionalProperties: {}
      description: A checkout page or embed for one payment intent.
      properties:
        allowed_origins:
          description: Origins that may embed the session (embedded mode).
          items:
            type: string
          type: array
        amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "Fiat: integer minor units. Asset: base units as a decimal string."
        asset_id:
          anyOf:
            - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            - type: "null"
          description: Pricing asset when `currency` is `asset`.
        cancel_url:
          anyOf:
            - description: Absolute URL.
              format: uri
              maxLength: 2048
              type: string
            - type: "null"
          description: Where the payer goes on cancel.
        client_secret:
          anyOf:
            - pattern: ^cs_[0-9a-z]{26}_secret_[0-9A-Za-z]{32}$
              type: string
            - type: "null"
          description: Secret for the payer-facing API; returned only when the session is created.
        completed_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the session completed.
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: ISO 4217 code for fiat pricing, or `asset` when priced in an asset (then `asset_id` is set).
        description:
          description: Description shown to the payer.
          type:
            - string
            - "null"
        expires_at:
          description: When the session stops accepting new payments.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        id:
          description: checkout_session id (`cs_` + 26 base32 chars).
          examples:
            - cs_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cs_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        late:
          description: Completed by a settlement after expiry.
          type: boolean
        late_payments:
          description: Accept settlements after expiry.
          type: boolean
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        locale:
          description: Checkout locale.
          type:
            - string
            - "null"
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Up to 50 key/value pairs (key ≤ 40 chars, value ≤ 500 chars) for your own use.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        object:
          const: checkout_session
          description: Always `checkout_session`.
          type: string
        payment_intent:
          anyOf:
            - description: payment_intent id (`pi_` + 26 base32 chars).
              examples:
                - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - $ref: "#/components/schemas/PaymentIntent"
          description: Payment intent id, or the object with `expand[]=payment_intent`.
        sequence:
          description: Increases with every change; discard webhook objects with a lower sequence. Servers MUST send it (optional in the 0.1.x schema only so readers built on 0.1.4 stay compatible).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        settlement_destination:
          description: settlement_destination id (`sd_` + 26 base32 chars).
          examples:
            - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        status:
          description: Session status; `expiring` means past `expires_at` with money possibly in flight (INV-3).
          type: string
          x-extensible-enum:
            - open
            - expiring
            - complete
            - expired
        success_url:
          description: Where the payer goes after paying (`?session_id=` is appended).
          format: uri
          maxLength: 2048
          type: string
        ui_mode:
          description: Hosted page or embedded iframe.
          enum:
            - hosted
            - embedded
          type: string
        url:
          anyOf:
            - description: Absolute URL.
              format: uri
              maxLength: 2048
              type: string
            - type: "null"
          description: Checkout URL including the client secret; returned only when the session is created.
      required:
        - id
        - object
        - created
        - livemode
        - status
        - url
        - client_secret
        - expires_at
        - payment_intent
        - amount
        - currency
        - asset_id
        - settlement_destination
        - ui_mode
        - success_url
        - cancel_url
        - description
        - allowed_origins
        - late_payments
        - locale
        - completed_at
        - late
        - metadata
      type: object
    CheckoutSessionCreate:
      additionalProperties: false
      description: Parameters to create a checkout session.
      properties:
        allowed_origins:
          description: Required for `embedded`.
          items:
            description: Origin `https://host[:port]` (`http://localhost:*` allowed in test mode).
            pattern: ^(https:\/\/[^/\s]+|http:\/\/localhost(:\d{1,5})?)$
            type: string
          maxItems: 10
          type: array
        amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "Fiat: integer minor units. Asset: base units as a decimal string."
        asset_id:
          description: Pricing asset; required when `currency` is `asset`.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        cancel_url:
          description: Redirect on cancel.
          format: uri
          maxLength: 2048
          type: string
        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: ISO 4217 code for fiat pricing, or `asset` when priced in an asset (then `asset_id` is set).
        customer_email:
          description: Payer email for the receipt (never in events).
          format: email
          maxLength: 254
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
          type: string
        description:
          description: Shown to the payer.
          maxLength: 500
          type: string
        expires_in:
          description: Lifetime in seconds (default from account settings, 3600).
          maximum: 86400
          minimum: 300
          type: integer
        late_payments:
          description: Override the account setting.
          type: boolean
        locale:
          description: Checkout locale (BCP 47).
          maxLength: 16
          type: string
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Up to 50 key/value pairs (key ≤ 40 chars, value ≤ 500 chars) for your own use.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        settlement_destination:
          description: "Destination to settle to; default: the asset or account default."
          examples:
            - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        success_url:
          description: Redirect after payment.
          format: uri
          maxLength: 2048
          type: string
        ui_mode:
          default: hosted
          description: Hosted page or embedded iframe.
          enum:
            - hosted
            - embedded
          type: string
      required:
        - amount
        - currency
        - success_url
      type: object
    CheckoutSessionList:
      additionalProperties: {}
      description: A page of checkout sessions.
      properties:
        data:
          description: Objects on this page.
          items:
            $ref: "#/components/schemas/CheckoutSession"
          type: array
        has_more:
          description: Whether more objects exist after this page.
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          description: Path of this list endpoint.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    DashboardSession:
      additionalProperties: {}
      description: A dashboard session. Sign-in responses set the session cookie `__Host-np_session`; `GET /v1/auth/session` returns the current session without setting it.
      properties:
        account:
          additionalProperties: {}
          description: Account the session acts for.
          properties:
            display_name:
              description: Account display name.
              type: string
            id:
              description: account id (`acct_` + 26 base32 chars).
              examples:
                - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
          required:
            - id
            - display_name
          type: object
        csrf_token:
          description: Send as `X-CSRF-Token` on every unsafe request.
          minLength: 32
          type: string
        expires_at:
          description: Absolute session expiry.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        object:
          const: dashboard_session
          description: Always `dashboard_session`.
          type: string
        role:
          description: Role of the user in the account.
          enum:
            - owner
            - admin
            - developer
            - finance
            - support
            - viewer
          type: string
        user:
          additionalProperties: {}
          description: Signed-in user.
          properties:
            email:
              description: Email of the signed-in user.
              format: email
              pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              type: string
            id:
              description: user id (`usr_` + 26 base32 chars).
              examples:
                - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
          required:
            - id
            - email
          type: object
      required:
        - object
        - user
        - account
        - role
        - csrf_token
        - expires_at
      type: object
    DepositInstructions:
      additionalProperties: {}
      description: Where and how much the payer sends (render only after sentinel attestation).
      properties:
        address:
          description: 1Click deposit address.
          maxLength: 256
          minLength: 1
          type: string
        amount_in:
          description: Amount to send, base units of the origin asset.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        chain:
          description: Chain to send on.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        deadline:
          description: Send before this time; later deposits are refunded.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        memo:
          description: Memo the deposit must carry, if any.
          type:
            - string
            - "null"
        min_amount_in:
          description: Minimum the provider accepts; below it the deposit is refunded.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        origin_asset_id:
          description: Asset to send.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
      required:
        - address
        - memo
        - amount_in
        - min_amount_in
        - deadline
        - chain
        - origin_asset_id
      type: object
    DepositInstructionsAttestationRequest:
      additionalProperties: false
      description: Instructions checkout wants co-signed.
      properties:
        attempt_id:
          description: payment_attempt id (`pa_` + 26 base32 chars).
          examples:
            - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        attestation_ticket:
          description: "`base64url(JCS payload).base64url(Ed25519 signature)` issued by payments; pass it to sentinel unchanged."
          pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
          type: string
        deposit:
          additionalProperties: false
          description: Required for `route_quote`.
          properties:
            address:
              description: Deposit address.
              maxLength: 256
              minLength: 1
              type: string
            amount_in:
              description: Amount to send, base units.
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            chain:
              description: Origin chain.
              examples:
                - eip155:8453
              pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
              type: string
            deadline:
              description: Deposit deadline.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            memo:
              description: Deposit memo, or null.
              type:
                - string
                - "null"
            origin_asset_id:
              description: Asset to send.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
          required:
            - address
            - memo
            - chain
            - origin_asset_id
            - amount_in
            - deadline
          type: object
        kind:
          description: What is being attested.
          enum:
            - route_quote
            - intents_transfer
          type: string
        livemode:
          description: Mode of the attempt.
          type: boolean
        requirement:
          additionalProperties: false
          description: Required for `intents_transfer`.
          properties:
            amount:
              description: Amount.
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            binding:
              description: Binding memo.
              type: string
            deadline:
              description: Payload deadline.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            fee_amount:
              description: Fee.
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            fee_to:
              description: Treasury Intents account.
              type: string
            pay_to:
              description: Merchant Intents account.
              type: string
            token:
              description: Asset.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
          required:
            - pay_to
            - token
            - amount
            - fee_to
            - fee_amount
            - binding
            - deadline
          type: object
      required:
        - livemode
        - kind
        - attempt_id
        - attestation_ticket
      type: object
    DestinationSnapshot:
      additionalProperties: {}
      description: Settlement destination as snapshotted at creation (INV-6).
      properties:
        address:
          description: Settlement address or Intents account.
          maxLength: 256
          minLength: 1
          type: string
        asset_id:
          description: Settlement asset.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        chain:
          description: Settlement chain.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        settlement_destination:
          description: settlement_destination id (`sd_` + 26 base32 chars).
          examples:
            - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        type:
          description: "Where funds settle: an address on a chain, or a NEAR Intents account."
          enum:
            - chain_address
            - intents_account
          type: string
      required:
        - settlement_destination
        - asset_id
        - type
        - chain
        - address
      type: object
    Erc191MultiPayload:
      additionalProperties: {}
      description: Payload signed with ERC-191.
      properties:
        payload:
          description: JSON string of `IntentMessage`.
          minLength: 2
          type: string
        signature:
          description: secp256k1 signature r‖s‖v (v ∈ {0,1}), base58.
          pattern: ^(ed25519|secp256k1):[1-9A-HJ-NP-Za-km-z]{64,100}$
          type: string
        standard:
          const: erc191
          description: ERC-191 `personal_sign` (EVM wallets).
          type: string
      required:
        - standard
        - payload
        - signature
      type: object
    Error:
      additionalProperties: {}
      description: Envelope returned with every non-2xx response.
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
      required:
        - error
      type: object
    ErrorBody:
      additionalProperties: {}
      description: Details of a failed request.
      properties:
        code:
          description: Machine-readable error code from the error catalogue.
          type: string
          x-extensible-enum:
            - invalid_request
            - resource_missing
            - authentication_required
            - invalid_api_key
            - permission_denied
            - csrf_token_invalid
            - ip_not_allowed
            - account_suspended
            - step_up_required
            - rate_limited
            - idempotency_key_reused
            - idempotency_in_progress
            - api_error
            - state_conflict
            - livemode_forbidden
            - link_expired
            - link_used
            - webauthn_failed
            - invalid_client
            - turnstile_failed
