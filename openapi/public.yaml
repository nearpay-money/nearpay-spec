        - id
        - object
        - created
        - livemode
        - status
        - amount
        - currency
        - asset_id
        - description
        - source
        - checkout_session
        - destination
        - fee
        - settlement_asset_id
        - amount_settled
        - amount_refunded
        - succeeded_at
        - late
        - canceled_at
        - cancellation_reason
        - review_reason
        - attempts
        - overpayments
        - sequence
        - metadata
      type: object
    PaymentIntentList:
      additionalProperties: {}
      description: A page of payment intents.
      properties:
        data:
          description: Objects on this page.
          items:
            $ref: "#/components/schemas/PaymentIntent"
          type: array
        has_more:
          description: Whether more objects exist after this page.
          type: boolean
        object:
          const: list
