    Evidence:
      additionalProperties: {}
      description: Independent on-chain proof that a settlement reached the merchant (INV-2).
      properties:
        amount:
          description: Amount received by the recipient, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          description: Asset that settled.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        block_ref:
          description: Block height or hash containing the transaction.
          type:
            - string
            - "null"
        chain:
          description: Chain where the settlement happened.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        explorer_url:
          anyOf:
            - format: uri
              type: string
            - type: "null"
          description: Block-explorer link for the transaction.
        finality:
          description: Finality reached when the evidence was accepted.
          type: string
          x-extensible-enum:
            - final
            - finalized
            - confirmed
        observed_at:
          description: When NearPay accepted the evidence.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        recipient:
          description: Recipient that received the funds (the merchant destination).
          maxLength: 256
          minLength: 1
          type: string
        source:
          description: Detector that produced the evidence.
          type: string
          x-extensible-enum:
            - watcher
            - indexer
            - verifier
            - provider
            - operator
        tier:
          description: "Verification tier: A = independently verified on chain, B = provider-attested within limits."
          type: string
          x-extensible-enum:
            - A
            - B
        tx_hash:
          description: Settlement transaction (NEAR receipt / tx hash for Intents).
          maxLength: 128
          minLength: 8
          type: string
      required:
        - chain
        - tx_hash
        - block_ref
        - recipient
        - asset_id
        - amount
        - finality
        - tier
        - source
        - observed_at
        - explorer_url
      type: object
    FeeSummary:
      additionalProperties: {}
      description: Fee snapshot of a payment (INV-6).
      properties:
        bearer:
          description: Who bears the fee.
          enum:
            - payer
            - merchant
          type: string
        total_bps:
          description: NearPay fee applied to this payment's route, in basis points.
          maximum: 10000
          minimum: 0
          type: integer
      required:
        - bearer
        - total_bps
      type: object
    IntentStreamEvent:
      additionalProperties: {}
      description: Payment intent status pushed to the checkout page.
      properties:
        amount_settled:
          description: Settled amount, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        id:
          description: payment_intent id (`pi_` + 26 base32 chars).
          examples:
            - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        late:
          description: Settled after expiry.
          type: boolean
        status:
          description: Payment intent status (domain-model §4.2).
          type: string
          x-extensible-enum:
            - requires_payment
            - processing
            - requires_review
            - succeeded
            - canceled
            - expired
      required:
        - id
        - status
        - amount_settled
        - late
      type: object
    IntentsRequirement:
      additionalProperties: {}
      description: "What a payer must sign: transfer(pay_to, amount) and transfer(fee_to, fee_amount), both with memo = binding."
      properties:
        amount:
          description: Amount the merchant receives, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        binding:
          description: Memo that both transfers must carry.
          pattern: ^np1:[1-9A-HJ-NP-Za-km-z]{43,44}$
          type: string
        deadline:
          description: Latest acceptable payload deadline.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        fee_amount:
          description: NearPay fee, base units, in the same asset.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        fee_to:
          description: NearPay treasury Intents account.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        pay_to:
          description: Merchant Intents account that receives the payment.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        token:
          description: Asset to transfer (equals the settlement asset).
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
      required:
        - pay_to
        - token
        - amount
        - fee_to
        - fee_amount
        - binding
        - deadline
      type: object
    KybCase:
      additionalProperties: {}
      description: The account's KYB case.
      properties:
        object:
          const: kyb_case
          description: Always `kyb_case`.
          type: string
        status:
          description: KYB case status.
          type: string
          x-extensible-enum:
            - not_started
            - pending
            - needs_info
            - approved
            - rejected
        vendor_flow_url:
          anyOf:
            - format: uri
              type: string
            - type: "null"
          description: Vendor-hosted verification flow (Stage 2); null while KYB is decided manually.
      required:
        - object
        - status
        - vendor_flow_url
      type: object
    MultiPayload:
      description: A signed Verifier payload (`MultiPayload`).
      discriminator:
        mapping:
          erc191: "#/components/schemas/Erc191MultiPayload"
          nep413: "#/components/schemas/Nep413MultiPayload"
          raw_ed25519: "#/components/schemas/RawEd25519MultiPayload"
        propertyName: standard
      oneOf:
        - $ref: "#/components/schemas/Nep413MultiPayload"
        - $ref: "#/components/schemas/Erc191MultiPayload"
        - $ref: "#/components/schemas/RawEd25519MultiPayload"
      type: object
    Nep413MultiPayload:
      additionalProperties: {}
      description: Payload signed with NEP-413.
      properties:
        payload:
          additionalProperties: {}
          description: NEP-413 payload.
          properties:
            callbackUrl:
              description: NEP-413 callback URL (NearPay never sets it).
              type:
                - string
                - "null"
            message:
              description: JSON string of `Nep413IntentMessage`.
              minLength: 2
              type: string
            nonce:
              description: 32-byte nonce (4-byte Verifier salt ‖ 28 random bytes), standard base64.
              pattern: ^[A-Za-z0-9+/]{43}=$
              type: string
            recipient:
              const: intents.near
              description: NEP-413 recipient (the Verifier).
              type: string
          required:
            - recipient
            - nonce
            - message
          type: object
        public_key:
          description: ed25519 key of the signer.
          pattern: ^(ed25519|secp256k1):[1-9A-HJ-NP-Za-km-z]{32,90}$
          type: string
        signature:
          description: ed25519 signature over the NEP-413 borsh hash.
          pattern: ^(ed25519|secp256k1):[1-9A-HJ-NP-Za-km-z]{64,100}$
          type: string
        standard:
          const: nep413
          description: NEP-413 (NEAR wallets `signMessage`).
          type: string
      required:
        - standard
        - payload
        - public_key
        - signature
      type: object
    PayerAttempt:
