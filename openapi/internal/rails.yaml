        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: "Pricing currency of the payment (spec 0.2.0; rails 0.2.0+ always sends it): an ISO code, or `asset`."
        fx:
          description: FX rate pricing currency → USD (decimal string), null for USD.
          type:
            - string
            - "null"
        par:
          description: Settled at par (USD stablecoin, depeg guard passed).
          type: boolean
        par_currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - type: "null"
          description: Currency the settlement asset was taken at par with (`usd` for USD stablecoins), or null (spec 0.2.0).
        primary_usd:
          description: Primary USD price of the settlement asset (decimal string).
          type:
            - string
            - "null"
        rates:
          description: "Every rate used, exact, with source, `as_of` and `valid_until` (spec 0.2.0; rails 0.2.0+ always sends it): the FX rate of a non-USD currency and the primary + secondary prices of a non-par asset."
          items:
            $ref: "#/components/schemas/PriceRate"
          type: array
        secondary_usd:
          description: Secondary USD price (decimal string).
          type:
            - string
            - "null"
      required:
        - primary_usd
        - secondary_usd
        - fx
        - par
        - as_of
      type: object
    ProviderObservation:
      additionalProperties: {}
      description: One raw provider/tracker observation of an execution (evidence trail).
      properties:
        applied:
          description: The observation changed the execution (monotonic, changed-status rules, rails §5).
          type: boolean
        archive:
          anyOf:
            - additionalProperties: {}
              properties:
                archived_at:
                  description: When the payload moved.
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  type: string
                object_key:
                  description: Object-storage key of the Parquet file.
                  maxLength: 1024
                  minLength: 1
                  type: string
                row:
                  description: Row index inside the file.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
              required:
                - object_key
                - row
                - archived_at
              type: object
            - type: "null"
          description: Where the payload lives after the 90-day archive (rails §8.11), or null.
        execution_id:
          description: execution id (`ex_` + 26 base32 chars).
          examples:
            - ex_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^ex_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        id:
          description: provider_observation id (`obs_` + 26 base32 chars).
          examples:
            - obs_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^obs_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        observed_at:
          description: When rails recorded it.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        payload:
          anyOf:
            - {}
            - type: "null"
          description: Raw provider payload (JSON); null once archived (fetch it with `archive`).
        payload_sha256:
          description: SHA-256 (hex) of the raw payload bytes as received; kept forever.
          pattern: ^[0-9a-f]{64}$
          type: string
        provider_status:
          description: Provider status in the payload (raw), if any.
          type:
            - string
            - "null"
        provider_updated_at:
          anyOf:
            - description: RFC 3339 UTC timestamp, e.g. `2026-11-05T10:00:00.000Z`.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            - type: "null"
          description: Provider's update time, if any.
        source:
          description: Detector that recorded the observation (rails §4 `provider_observations.source`).
          type: string
          x-extensible-enum:
            - quote
            - submit
            - hot_poll
            - explorer
            - indexer
            - watcher
            - verifier
            - operator
      required:
        - id
        - execution_id
        - source
        - provider_status
        - provider_updated_at
        - applied
        - observed_at
        - payload_sha256
        - payload
        - archive
      type: object
    ProviderObservationPage:
      additionalProperties: {}
      description: Observations of an execution.
      properties:
        data:
          description: Observations, oldest first.
          items:
            $ref: "#/components/schemas/ProviderObservation"
          type: array
        has_more:
          description: More pages.
          type: boolean
      required:
        - data
        - has_more
      type: object
    Ratio:
      additionalProperties: {}
      description: An exact rational number `num / den` (integer strings, never a float).
      properties:
        den:
          description: Denominator (positive integer string).
          pattern: ^[1-9][0-9]{0,77}$
          type: string
        num:
          description: Numerator (integer string).
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
      required:
        - num
        - den
      type: object
    RefundTransfer:
      additionalProperties: {}
      description: "What a merchant signs for a refund leg from an Intents account: exactly one transfer, memo = binding."
      properties:
        amount:
          description: Amount, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        deadline:
          description: Latest acceptable payload deadline.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        memo:
          description: Binding memo the transfer must carry (agentpay matches it; the indexer attributes by it).
          pattern: ^np1:[1-9A-HJ-NP-Za-km-z]{43,44}$
          type: string
        nonce:
          anyOf:
            - description: 32-byte nonce (4-byte Verifier salt ‖ 28 random bytes), standard base64.
              pattern: ^[A-Za-z0-9+/]{43}=$
              type: string
            - type: "null"
          description: Nonce to sign with (current Verifier salt ‖ 28 random bytes), issued by rails when it prepares the leg; payments copies it into `next_action` unchanged. Absent from rails before 0.2.1 (payments then derives it from the salt itself).
        receiver_id:
          description: Payer Intents account (`intents_transfer` leg) or the 1Click INTENTS deposit address (`route_quote` leg).
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        signer_id:
          description: Merchant Intents account (the settlement destination) that signs.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        token:
          description: Asset transferred (the settlement asset).
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
      required:
        - signer_id
        - receiver_id
        - token
        - amount
        - memo
        - deadline
      type: object
    SettlementEstimate:
      additionalProperties: {}
      description: Indicative valuation of a price in USD and in a settlement asset (not a quote; rails §8.2).
      properties:
        price_snapshot:
          $ref: "#/components/schemas/PriceSnapshot"
        pricing:
          additionalProperties: {}
          description: What was valued.
          properties:
            amount:
              anyOf:
                - description: Fiat amount in minor units (e.g. cents), integer.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
                  pattern: ^(0|[1-9][0-9]{0,77})$
                  type: string
              description: "Fiat: integer minor units. Asset: base units as a decimal string."
            asset_id:
              anyOf:
                - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
                  examples:
                    - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
                  maxLength: 256
                  pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
                  type: string
                - type: "null"
              description: Pricing asset when `currency` is `asset`.
            currency:
              anyOf:
                - description: ISO 4217 currency code, lower-case (e.g. `usd`).
                  pattern: ^[a-z]{3}$
                  type: string
                - const: asset
                  type: string
              description: ISO 4217 code for fiat pricing, or `asset` when priced in an asset (then `asset_id` is set).
          required:
            - amount
            - currency
            - asset_id
          type: object
        settlement:
          anyOf:
            - additionalProperties: {}
              properties:
                amount_base:
                  description: Settlement amount before fees and tag, rounded down (rails §8.2; the attempt computes the binding amount).
                  pattern: ^(0|[1-9][0-9]{0,77})$
                  type: string
                asset_id:
                  description: Settlement asset.
                  examples:
                    - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
                  maxLength: 256
                  pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
                  type: string
                par:
                  description: Taken at par (stablecoin of the pricing currency, depeg guard passed).
                  type: boolean
              required:
                - asset_id
                - amount_base
                - par
              type: object
            - type: "null"
          description: Settlement amount in `settlement_asset`, when one was asked for.
        usd_micros:
          description: Value in USD micros, rounded down (integer string).
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
      required:
        - pricing
        - usd_micros
        - settlement
        - price_snapshot
      type: object
    SolanaEvidence:
      additionalProperties: {}
      description: Solana-specific settlement detail (token-balance delta).
      properties:
        block_time:
          anyOf:
            - maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Block time, unix seconds; null when the node has none.
        mint:
          anyOf:
            - description: "Solana address: base58 of 32 bytes (ed25519 public key or program-derived address)."
              examples:
                - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
              pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
              type: string
            - type: "null"
          description: SPL mint that settled; null for native SOL (lamports).
        owner:
          description: Wallet whose balance rose (= `Evidence.recipient`, the merchant destination).
          examples:
            - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
          type: string
        post_amount:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Owner's balance of the mint after the transaction; null when the detector did not read balances (test mode).
        pre_amount:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Owner's balance of the mint before the transaction (`meta.preTokenBalances` / `preBalances`); null when the detector did not read balances (test mode).
        signature:
          description: Transaction signature (= `Evidence.tx_hash`).
          pattern: ^[1-9A-HJ-NP-Za-km-z]{64,88}$
          type: string
        slot:
          description: Slot of the block that contains the transaction (= `Evidence.block_ref`).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        token_accounts:
          description: Token accounts of `owner` for `mint` whose balance changed (usually its ATA); empty for SOL.
          items:
            description: "Solana address: base58 of 32 bytes (ed25519 public key or program-derived address)."
            examples:
              - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
            pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
            type: string
          type: array
        token_program:
          anyOf:
            - description: "Solana address: base58 of 32 bytes (ed25519 public key or program-derived address)."
              examples:
                - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
              pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
              type: string
            - type: "null"
          description: Owner program of the mint (`TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA` in v1); null for SOL.
      required:
        - signature
        - slot
        - block_time
        - mint
        - token_program
        - owner
        - token_accounts
        - pre_amount
        - post_amount
      type: object
    TokenContract:
      additionalProperties: {}
      description: How to transfer an asset on its chain (wallet path).
      properties:
        address:
          anyOf:
            - maxLength: 256
              minLength: 1
              type: string
            - type: "null"
          description: Contract address (EVM `0x…`), token account (NEAR) or SPL mint (Solana, base58; spec 0.4.0 wallet path); null for `native`.
        standard:
          description: "`erc20`: ERC-20 contract on an EVM chain; `native`: the chain's native coin (no contract); `nep141`: NEP-141 token on NEAR; `spl`: SPL mint on Solana; `other`: no wallet transfer recipe (manual path)."
          type: string
          x-extensible-enum:
            - erc20
            - native
            - nep141
            - spl
            - other
      required:
        - standard
        - address
      type: object
  securitySchemes:
    internalToken:
      description: "Internal Ed25519 JWT: request token or service token."
      in: header
      name: X-NearPay-Token
      type: apiKey
    serviceClient:
      description: Service client credentials (`client_id` + secret file).
      scheme: basic
      type: http
info:
  description: NearPay internal service API. Generated from `nearpay-spec`; do not edit by hand.
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  title: nearpay-rails internal API
  version: 0.5.0
openapi: 3.1.0
paths:
  /internal/assets/{asset_id}:
    get:
      operationId: getInternalAsset
      parameters:
        - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
          in: path
          name: asset_id
          required: true
          schema:
            description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
            examples:
              - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
            maxLength: 256
            pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
            type: string
        - description: "Mode whose token registry answers (test = sandbox registry). Omitted: live, falling back to test."
          in: query
          name: livemode
          schema:
            description: "Mode whose token registry answers (test = sandbox registry). Omitted: live, falling back to test."
            enum:
              - "true"
              - "false"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalAsset"
          description: Asset decimals and price state.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `asset_unsupported`."
          x-error-codes:
            - asset_unsupported
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Asset decimals and price state.
      tags:
        - rails
      x-nearpay:
        auth:
          - service:rails.read
        idempotent: false
        service: rails
        stage: 1
  /internal/chain-profiles:
    get:
      operationId: listChainProfiles
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainProfiles"
          description: Enabled chain profiles.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Enabled chain profiles.
      tags:
        - rails
      x-nearpay:
        auth:
          - service:rails.read
        idempotent: false
        service: rails
        stage: 1
  /internal/destination-minimums:
    get:
      operationId: getDestinationMinimums
      parameters:
        - description: Comma-separated destination keys.
          in: query
          name: keys
          required: true
          schema:
            description: Comma-separated destination keys.
            maxLength: 8192
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationMinimums"
          description: Minimum payment per destination key (`chain|address_norm|asset_id`).
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Minimum payment per destination key (`chain|address_norm|asset_id`).
      tags:
        - rails
      x-nearpay:
        auth:
          - service:rails.read
        idempotent: false
        service: rails
        stage: 1
  /internal/evidence:
    get:
      description: "Default: executions that settled (`succeeded`) on the day, by `terminal_at`. Since spec 0.2.0 `states` and `kind` select other terminal states and refund legs (reconciliation, rails §8.10)."
      operationId: listEvidence
      parameters:
        - description: account id (`acct_` + 26 base32 chars).
          in: query
          name: account_id
          required: true
          schema:
            description: account id (`acct_` + 26 base32 chars).
            examples:
              - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
        - description: Mode.
          in: query
          name: livemode
          required: true
          schema:
            description: Mode.
            enum:
              - "true"
              - "false"
            type: string
        - description: UTC day `YYYY-MM-DD`.
          in: query
          name: day
          required: true
          schema:
            description: UTC day `YYYY-MM-DD`.
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - description: Cursor.
          in: query
          name: starting_after
          schema:
            description: Cursor.
            examples:
              - ex_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^ex_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
        - description: Page size.
          in: query
          name: limit
          schema:
            default: 500
            description: Page size.
            maximum: 1000
            minimum: 1
            type: integer
        - description: Comma-separated terminal states (default `succeeded`; spec 0.2.0).
          in: query
          name: states
          schema:
            description: Comma-separated terminal states (default `succeeded`; spec 0.2.0).
            pattern: ^(succeeded|refunded|failed)(,(succeeded|refunded|failed))*$
            type: string
        - description: Only payments or only refund legs (default both; spec 0.2.0).
          in: query
          name: kind
          schema:
            description: Only payments or only refund legs (default both; spec 0.2.0).
            type: string
            x-extensible-enum:
              - payment
              - refund
        - description: Only executions of this owner (default all). Payments' reconciliation sends `payments` (spec 0.3.0).
          in: query
          name: owner
          schema:
            description: Only executions of this owner (default all). Payments' reconciliation sends `payments` (spec 0.3.0).
            type: string
            x-extensible-enum:
              - payments
              - agentpay
      responses:
        "200":
          content:
            application/json:
              schema:
