components:
  schemas:
    BitcoinEvidence:
      additionalProperties: {}
      description: Bitcoin-specific settlement detail (outputs and confirmations).
      properties:
        block_hash:
          description: Hash of the confirming block, hex.
          pattern: ^[0-9a-f]{64}$
          type: string
        block_height:
          description: Height of the confirming block (= `Evidence.block_ref`).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        confirmations:
          description: Confirmations when the evidence was accepted (`tip − block_height + 1`).
          maximum: 9007199254740991
          minimum: 1
          type: integer
        outputs:
          description: Outputs of the transaction that pay the destination address.
          items:
            additionalProperties: {}
            description: An output paying the destination.
            properties:
              script_pubkey:
                description: Output scriptPubKey, hex (`0014…` P2WPKH, `5120…` P2TR).
                pattern: ^[0-9a-f]{2,200}$
                type: string
              value:
                description: Output value, satoshis.
                pattern: ^(0|[1-9][0-9]{0,77})$
                type: string
              vout:
                description: Output index.
                maximum: 9007199254740991
                minimum: 0
                type: integer
            required:
              - vout
              - value
              - script_pubkey
            type: object
          minItems: 1
          type: array
        required_confirmations:
          description: Confirmations the chain profile required for this settlement's USD value (`confirmation_tiers`; 1 for every amount by default, ADR-0022 as amended).
          maximum: 9007199254740991
          minimum: 1
          type: integer
        txid:
          description: Transaction id (= `Evidence.tx_hash`).
          pattern: ^[0-9a-f]{64}$
          type: string
      required:
        - txid
        - outputs
        - block_height
        - block_hash
        - confirmations
        - required_confirmations
      type: object
    ChainProfile:
      additionalProperties: {}
      description: Chain profile (public subset).
      properties:
        blockchain:
          description: 1Click `blockchain` code, e.g. `base` or `near`.
          pattern: ^[a-z0-9_-]{2,32}$
          type: string
        chain:
          description: CAIP-2 chain id, e.g. `eip155:8453` or `near:mainnet`.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        confirmation_tiers:
          anyOf:
            - items:
                $ref: "#/components/schemas/ConfirmationTier"
              type: array
            - type: "null"
          description: "Confirmations required by settlement value, ascending, last tier unbounded (Bitcoin family: `[{below_usd_micros: null, confirmations: 1}]` = 1 confirmation for every amount by default, ADR-0022 as amended; a profile may require more above a USD value); null/absent for chains with a finality rule instead (EVM 1 block, NEAR `final`, Solana `confirmed` commitment). Spec 0.4.0."
        default_deadline_s:
          description: Default deposit window.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        explorer_address_url:
          description: Explorer URL template with `{address}`; null/absent when not configured. Spec 0.4.0.
          type:
            - string
            - "null"
        explorer_tx_url:
          description: Explorer URL template with `{tx}`.
          type: string
        family:
          description: Chain family.
          type: string
          x-extensible-enum:
            - evm
            - near
            - solana
            - bitcoin
            - other
        finality:
          description: "Evidence rule as text: one block of the chain's own consensus by default (ADR-0022 as amended) — `final` (NEAR), `1 confirmation` (EVM), `solana: confirmed commitment`, `bitcoin: 1 confirmation`."
          type: string
        memo_mode:
          description: Memo mode.
          enum:
            - none
            - required
          type: string
        min_deadline_s:
          description: Minimum deposit window.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        tier:
          description: Verification tier.
          type: string
          x-extensible-enum:
            - A
            - B
        verification_timeout_s:
          description: Evidence timeout before `held`.
          maximum: 9007199254740991
          minimum: 0
          type: integer
      required:
        - chain
        - blockchain
        - family
        - tier
        - min_deadline_s
        - default_deadline_s
        - finality
        - verification_timeout_s
        - memo_mode
        - explorer_tx_url
      type: object
    ChainProfiles:
      additionalProperties: {}
      description: Profiles.
      properties:
        profiles:
          description: Profiles.
          items:
            $ref: "#/components/schemas/ChainProfile"
          type: array
      required:
        - profiles
      type: object
    ConfirmationTier:
      additionalProperties: {}
      description: Confirmations required below a USD value.
      properties:
        below_usd_micros:
          anyOf:
            - maximum: 9007199254740991
              minimum: 1
              type: integer
            - type: "null"
          description: Applies to settlements worth less than this many USD micros; null = no upper bound (last tier).
        confirmations:
          description: Confirmations required.
          maximum: 100
          minimum: 1
          type: integer
      required:
        - below_usd_micros
        - confirmations
      type: object
    CreateExecution:
      additionalProperties: false
      description: Create an execution for a payment attempt (rails §8.1).
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        deadline_cap:
          anyOf:
            - description: RFC 3339 UTC timestamp, e.g. `2026-11-05T10:00:00.000Z`.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            - type: "null"
          description: Session expiry, or null when late payments are allowed.
        destination:
          additionalProperties: false
          description: Snapshotted destination.
          properties:
            address:
              description: Destination address or Intents account.
              maxLength: 256
              minLength: 1
              type: string
            asset_id:
              description: Settlement asset.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            chain:
              description: Settlement chain.
              examples:
                - eip155:8453
              pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
              type: string
            type:
              description: "Where funds settle: an address on a chain, or a NEAR Intents account."
              enum:
                - chain_address
                - intents_account
              type: string
          required:
            - asset_id
            - type
            - chain
            - address
          type: object
        fee:
          additionalProperties: false
          description: Fee snapshot.
          properties:
            bearer:
              description: Fee bearer.
              enum:
                - payer
                - merchant
              type: string
            schedule:
              $ref: "#/components/schemas/FeeSchedule"
          required:
            - schedule
            - bearer
          type: object
        idempotency_key:
          description: "`attempt:<pa_id>` (payments) — stable across retries."
          maxLength: 255
          minLength: 1
          type: string
        kind:
          const: payment
          description: "Stage 1: payments only (refunds arrive in Stage 2)."
          type: string
        livemode:
          description: Mode; selects the provider (INV-8).
          type: boolean
        method:
          description: "`route_quote`: deposit to a 1Click address from any chain. `intents_transfer`: signed transfer from a NEAR Intents balance."
          enum:
            - route_quote
            - intents_transfer
          type: string
        origin:
          additionalProperties: false
          description: Payer side.
          properties:
            asset_id:
              description: Origin asset.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            chain:
              description: Origin chain.
              examples:
                - eip155:8453
              pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
              type: string
            refund_to:
              description: Refund address (route_quote) or payer Intents account (intents_transfer).
              maxLength: 256
              minLength: 1
              type: string
            refund_type:
              description: Refund address type.
              enum:
                - origin_chain
                - intents
              type: string
          required:
            - asset_id
            - chain
            - refund_to
            - refund_type
          type: object
        owner:
          description: "Default `payments`. `agentpay` for a cross-chain x402 quote: then `reference` is absent, `x402_binding` is required, the destination is an `intents_account` and the fee bearer is `payer` (spec 0.3.0)."
          type: string
          x-extensible-enum:
            - payments
            - agentpay
        pricing:
          anyOf:
            - additionalProperties: false
              description: Fiat pricing.
              properties:
                amount:
                  description: Fiat amount in minor units (e.g. cents), integer.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                currency:
                  description: ISO 4217 currency code, lower-case (e.g. `usd`).
                  pattern: ^[a-z]{3}$
                  type: string
              required:
                - currency
                - amount
              type: object
            - additionalProperties: false
              description: Asset pricing.
              properties:
                amount:
                  description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
                  pattern: ^(0|[1-9][0-9]{0,77})$
                  type: string
                asset_id:
                  description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
                  examples:
                    - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
                  maxLength: 256
                  pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
                  type: string
                currency:
                  const: asset
                  description: Asset pricing.
                  type: string
              required:
                - currency
                - asset_id
                - amount
              type: object
          description: Price of the payment.
        reference:
          additionalProperties: false
          description: Payments object served; echoed as `Execution.reference` (payments sends it from Stage 2).
          properties:
            payment_attempt:
              description: payment_attempt id (`pa_` + 26 base32 chars).
              examples:
                - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            payment_intent:
              description: payment_intent id (`pi_` + 26 base32 chars).
              examples:
                - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
          required:
            - payment_intent
            - payment_attempt
          type: object
        slippage_bps:
          description: Override slippage (default per route class).
          maximum: 10000
          minimum: 0
          type: integer
        x402_binding:
          description: "Owner `agentpay`: the `near-intents` binding (`idempotency_key` = `x402:<binding>`)."
          pattern: ^np1:[1-9A-HJ-NP-Za-km-z]{43,44}$
          type: string
      required:
        - idempotency_key
        - kind
        - method
        - account_id
        - livemode
        - origin
        - destination
        - pricing
        - fee
        - deadline_cap
      type: object
    CreateRefundExecution:
      additionalProperties: false
      description: "Create a refund leg: a route or Intents transfer from the merchant destination to the payer (no app fee)."
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        amount:
          description: Refund amount, base units of the source asset.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        idempotency_key:
          description: "`refund:<re_id>:leg:<n>` — stable across retries of the same leg."
          maxLength: 255
          minLength: 1
          type: string
        livemode:
          description: Mode; selects the provider (INV-8).
          type: boolean
        method:
          description: "`route_quote`: 1Click route back to the payer's origin asset. `intents_transfer`: Verifier transfer to the payer's Intents account (source and recipient asset must be equal; provider `direct_intents`)."
          enum:
            - route_quote
            - intents_transfer
          type: string
        recipient:
          additionalProperties: false
          description: Payer side (INV-7).
          properties:
            address:
              description: Payer refund address (attempt `refund_to`) or Intents account.
              maxLength: 256
              minLength: 1
              type: string
            asset_id:
              description: Asset the payer receives (the attempt's origin asset).
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            chain:
              description: Chain the payer receives on.
              examples:
                - eip155:8453
              pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
              type: string
            type:
              description: Recipient type.
              enum:
                - origin_chain
                - intents
              type: string
          required:
            - asset_id
            - chain
            - address
            - type
          type: object
        reference:
          additionalProperties: false
          description: Payments objects served.
          properties:
            payment_attempt:
              description: Attempt whose settlement is refunded.
              examples:
                - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            payment_intent:
              description: payment_intent id (`pi_` + 26 base32 chars).
              examples:
                - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            refund:
              description: refund id (`re_` + 26 base32 chars).
              examples:
                - re_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^re_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            refund_leg:
              description: Leg number.
              maximum: 9007199254740991
              minimum: 1
              type: integer
          required:
            - payment_intent
            - payment_attempt
            - refund
            - refund_leg
          type: object
        screen:
          description: Screen the recipient even if cached (an owner override of the recipient, INV-7). Default false.
          type: boolean
        source:
          additionalProperties: false
          description: "Merchant side: the intent's destination snapshot."
          properties:
            address:
              description: "Merchant destination address or Intents account: the sender, and the 1Click `refundTo` of route legs."
              maxLength: 256
              minLength: 1
              type: string
            asset_id:
              description: Settlement asset the merchant holds.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            chain:
              description: Settlement chain.
              examples:
                - eip155:8453
              pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
              type: string
            type:
              description: "Where funds settle: an address on a chain, or a NEAR Intents account."
              enum:
                - chain_address
                - intents_account
              type: string
          required:
            - asset_id
            - type
            - chain
            - address
          type: object
        swap_type:
          description: "Route legs: `EXACT_INPUT` quotes `amount` in (payer absorbs route costs); `EXACT_OUTPUT` quotes the equivalent of `amount` out, converted by rails pricing (merchant absorbs). Ignored for `intents_transfer`."
          enum:
            - EXACT_INPUT
            - EXACT_OUTPUT
          type: string
      required:
        - idempotency_key
        - account_id
        - livemode
        - method
        - reference
        - source
        - recipient
        - amount
        - swap_type
      type: object
    DepositLookup:
      additionalProperties: {}
      description: Whether a deposit address was issued by NearPay.
      properties:
        account_id:
          anyOf:
            - description: account id (`acct_` + 26 base32 chars).
              examples:
                - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Account, if it exists.
        execution_id:
          anyOf:
            - description: execution id (`ex_` + 26 base32 chars).
              examples:
                - ex_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^ex_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Execution, if it exists.
        exists:
          description: NearPay issued this deposit address.
          type: boolean
        livemode:
          description: Mode, if it exists.
          type:
            - boolean
            - "null"
      required:
        - exists
        - execution_id
        - account_id
        - livemode
      type: object
    DestinationMinimum:
      additionalProperties: {}
      description: Minimum economic payment for a destination (rails §8.9).
      properties:
        computed_at:
          anyOf:
            - description: RFC 3339 UTC timestamp, e.g. `2026-11-05T10:00:00.000Z`.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            - type: "null"
          description: When computed (null = unavailable).
        min_amount_base:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Minimum in base units of the asset.
        min_usd_micros:
          anyOf:
            - maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Minimum in USD micros.
      required:
        - min_amount_base
        - min_usd_micros
        - computed_at
      type: object
    DestinationMinimums:
      additionalProperties:
        $ref: "#/components/schemas/DestinationMinimum"
      description: Key → minimum.
      propertyNames:
        type: string
      type: object
    Error:
      additionalProperties: {}
      description: Envelope returned with every non-2xx response.
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
      required:
        - error
      type: object
    ErrorBody:
      additionalProperties: {}
      description: Details of a failed request.
      properties:
        code:
          description: Machine-readable error code from the error catalogue.
          type: string
          x-extensible-enum:
            - invalid_request
            - resource_missing
            - authentication_required
            - invalid_api_key
            - permission_denied
            - csrf_token_invalid
            - ip_not_allowed
            - account_suspended
            - step_up_required
            - rate_limited
            - idempotency_key_reused
            - idempotency_in_progress
            - api_error
            - state_conflict
            - livemode_forbidden
            - link_expired
            - link_used
            - webauthn_failed
            - invalid_client
            - turnstile_failed
            - invalid_setting
            - scope_unknown
            - address_invalid
            - asset_unsupported
            - memo_destination_unsupported
            - destination_in_use
            - recovery_lock
            - screening_blocked
            - attestation_invalid
            - challenge_expired
            - destination_not_active
            - account_not_live
            - amount_below_destination_minimum
            - amount_above_unverified_cap
            - currency_unsupported
            - allowed_origins_required
            - attempt_in_flight
            - client_secret_invalid
            - session_not_open
            - too_many_attempts
            - route_too_slow
            - refund_address_invalid
            - geo_blocked
            - intent_invalid
            - insufficient_balance
            - rail_unavailable
            - route_unavailable
            - pricing_unavailable
            - deadline_too_short
            - quote_rejected
            - quote_integrity_failed
            - ticket_invalid
            - attestation_refused
            - attestation_stale
            - attestation_unavailable
            - destination_not_intents_account
            - amount_below_minimum
            - screening_unavailable
            - url_invalid
            - event_type_unknown
            - last_owner
            - member_exists
            - invitation_invalid
            - approver_conflict
            - two_person_required
            - authenticator_not_allowed
            - kyb_profile_incomplete
            - intent_not_succeeded
            - attempt_not_settled
            - amount_exceeds_refundable
            - leg_expired
            - signed_intent_mismatch
            - review_requires_evidence
            - link_inactive
            - customer_deleted
            - reconciliation_day_open
            - fx_rate_unavailable
            - currency_mismatch
            - interval_mismatch
            - price_inactive
            - price_type_invalid
            - tax_rate_inactive
            - tax_rates_mixed
            - invoice_empty
            - customer_email_missing
            - invoice_secret_invalid
            - invoice_not_payable
            - auto_debit_unavailable
            - vault_cap_exceeded
        doc_url:
          description: Documentation page for this error code.
          format: uri
          type: string
        message:
          description: Human-readable message; safe to show to developers, not to payers.
          type: string
        param:
          description: The request parameter the error relates to, when there is one.
          type: string
        request_id:
          description: Request id, also returned in the `X-Request-Id` header.
          examples:
            - req_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^req_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        type:
          description: Error category; decides whether a retry can help.
          type: string
          x-extensible-enum:
            - invalid_request_error
            - authentication_error
            - permission_error
            - payment_error
            - idempotency_error
            - state_conflict
            - rate_limit_error
            - api_error
            - rail_unavailable
      required:
        - type
        - code
        - message
        - doc_url
        - request_id
      type: object
    Evidence:
      additionalProperties: {}
      description: Independent on-chain proof that a settlement reached the merchant (INV-2).
      properties:
        amount:
          description: Amount received by the recipient, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          description: Asset that settled.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        bitcoin:
          anyOf:
            - $ref: "#/components/schemas/BitcoinEvidence"
            - type: "null"
          description: Bitcoin detail (txid, outputs, confirmations) when `chain` is Bitcoin; null/absent otherwise. Spec 0.4.0.
        block_ref:
          description: Block height or hash containing the transaction.
          type:
            - string
            - "null"
        chain:
          description: Chain where the settlement happened.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        explorer_url:
          anyOf:
            - format: uri
              type: string
            - type: "null"
          description: Block-explorer link for the transaction.
        finality:
          description: "Finality reached when the evidence was accepted: `final` (NEAR), `confirmed` (one block of the chain's own consensus: EVM 1 block, Solana `confirmed` commitment, Bitcoin 1 confirmation — the default, ADR-0022 as amended), `finalized` (a chain's finalized tag/commitment, when configured)."
          type: string
          x-extensible-enum:
            - final
            - finalized
            - confirmed
        observed_at:
          description: When NearPay accepted the evidence.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        recipient:
          description: Recipient that received the funds (the merchant destination).
          maxLength: 256
          minLength: 1
          type: string
        sender:
          anyOf:
            - description: Address in the chain's canonical text form.
              maxLength: 256
              minLength: 1
              type: string
            - type: "null"
          description: "Account that sent the settlement transfer, when the detector saw it (NEAR Intents: the transferring Intents account); null if unknown. Spec 0.3.0."
        solana:
          anyOf:
            - $ref: "#/components/schemas/SolanaEvidence"
            - type: "null"
          description: Solana detail (signature, slot, mint, token-balance delta) when `chain` is Solana; null/absent otherwise. Spec 0.4.0.
        source:
          description: Detector that produced the evidence.
          type: string
          x-extensible-enum:
            - watcher
            - indexer
            - verifier
            - provider
            - operator
        tier:
          description: "Verification tier: A = independently verified on chain, B = provider-attested within limits."
          type: string
          x-extensible-enum:
            - A
            - B
        tx_hash:
          description: Settlement transaction (NEAR receipt / tx hash for Intents).
          maxLength: 128
          minLength: 8
          type: string
      required:
        - chain
        - tx_hash
        - block_ref
        - recipient
        - asset_id
        - amount
        - finality
        - tier
        - source
        - observed_at
        - explorer_url
      type: object
    EvidencePage:
      additionalProperties: {}
      description: Settled executions for a day.
      properties:
        data:
          description: Settled executions.
          items:
            $ref: "#/components/schemas/Execution"
          type: array
        has_more:
          description: More pages.
          type: boolean
      required:
        - data
        - has_more
      type: object
    EvidenceSummary:
      additionalProperties: {}
      description: Per-day evidence totals of one account (reconciliation input).
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        complete:
          description: "The day is closed for rails: it has ended, every tracker cursor is past its end and no execution created on or before it is still non-terminal except holds (rails §8.10). Reconcile only complete days."
          type: boolean
        day:
          description: UTC day `YYYY-MM-DD` (executions by `terminal_at`).
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
          type: string
        digest:
          description: SHA-256 (hex) over the day's `(execution id, version)` pairs in id order; unchanged digest ⇒ unchanged evidence.
          pattern: ^[0-9a-f]{64}$
          type: string
        generated_at:
          description: When computed.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        held_open:
          description: Of those, executions currently `held`.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        in_flight:
          description: Executions of the account created on or before the day and still non-terminal.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        livemode:
          description: Mode.
          type: boolean
        tier_b:
          additionalProperties: {}
          description: Tier-B cross-check against the Explorer (ADR-0012; empty when the Explorer feed is disabled).
          properties:
            count:
              description: Tier-B (provider-attested) settlements on the day.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            explorer_confirmed:
              description: Of those, confirmed by an Explorer row with the same status.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            unconfirmed:
              description: Tier-B settlements without a matching Explorer row yet.
              items:
                description: execution id (`ex_` + 26 base32 chars).
                examples:
                  - ex_01jbz9k3m4n5p6q7r8s9t0v1w2
                pattern: ^ex_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                type: string
              type: array
          required:
            - count
            - explorer_confirmed
            - unconfirmed
          type: object
        totals:
          description: Totals of executions that reached a terminal state on the day.
          items:
            additionalProperties: {}
            description: Totals for one kind, state and asset.
            properties:
              asset_id:
                description: Settlement asset (payments) or origin asset returned to the payer (refunds).
                examples:
                  - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
                maxLength: 256
                pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
                type: string
              count:
                description: Executions.
                maximum: 9007199254740991
                minimum: 0
                type: integer
              kind:
                description: What the execution moves value for.
                type: string
                x-extensible-enum:
                  - payment
                  - refund
              refunded_amount:
                description: Sum of `refunded_amount`.
                pattern: ^(0|[1-9][0-9]{0,77})$
                type: string
              settled_amount:
                description: Sum of `settled_amount`.
                pattern: ^(0|[1-9][0-9]{0,77})$
                type: string
              state:
                description: Terminal execution state.
                enum:
                  - succeeded
                  - refunded
                  - failed
                type: string
            required:
              - kind
              - state
              - asset_id
              - count
              - settled_amount
              - refunded_amount
            type: object
          type: array
      required:
        - account_id
        - livemode
        - day
        - complete
        - in_flight
        - held_open
        - totals
        - tier_b
        - digest
        - generated_at
      type: object
    Execution:
      additionalProperties: {}
      description: A provider run moving value for a payment (rails owns).
      properties:
        abandon_reason:
          description: Reason payments gave when abandoning the leg.
          type:
            - string
            - "null"
        abandoned_at:
          anyOf:
            - description: RFC 3339 UTC timestamp, e.g. `2026-11-05T10:00:00.000Z`.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            - type: "null"
          description: When payments abandoned this refund leg (`abandonExecution`); it is then `expired_unpaid` and only tracked for late money (INV-3).
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        applied_fee_bps:
          description: Fee bps applied.
          maximum: 10000
          minimum: 0
          type: integer
        created_at:
          description: Created.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        deadline:
          description: Execution deadline.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        deposit:
          anyOf:
            - $ref: "#/components/schemas/ExecutionDeposit"
            - type: "null"
          description: "`route_quote` deposit instructions."
        deposit_tx_hashes:
          description: Deposit transactions known so far.
          items:
            description: Transaction hash in the chain's text form.
            maxLength: 128
            minLength: 8
            type: string
          type: array
        deposited_amount:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: What the payer actually deposited, base units of `origin.asset_id` (provider `depositedAmount`, or the executed Intents transfer incl. fee); null until a deposit is detected. Lets checkout and the dashboard show “received X of Y” for an incomplete deposit.
        evidence:
          anyOf:
            - $ref: "#/components/schemas/Evidence"
            - type: "null"
          description: Accepted evidence (INV-2).
        failure_code:
          description: Failure code.
          type:
            - string
            - "null"
        held_reason:
          anyOf:
            - description: Why held.
              type: string
              x-extensible-enum:
                - evidence_mismatch
                - evidence_timeout
                - failed_after_deposit
                - unknown_status
            - type: "null"
        id:
          description: execution id (`ex_` + 26 base32 chars).
          examples:
            - ex_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^ex_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        intents_requirement:
          anyOf:
            - $ref: "#/components/schemas/IntentsRequirement"
            - type: "null"
          description: "`intents_transfer` requirement."
        kind:
          description: What the execution moves value for.
          type: string
          x-extensible-enum:
            - payment
            - refund
        livemode:
          description: Mode.
          type: boolean
        method:
          description: "`route_quote`: deposit to a 1Click address from any chain. `intents_transfer`: signed transfer from a NEAR Intents balance."
          enum:
            - route_quote
            - intents_transfer
          type: string
        observed_fee:
          anyOf:
            - $ref: "#/components/schemas/ObservedFee"
            - type: "null"
          description: "NearPay fee observed for this execution (reconciliation fee check): the app fee the provider reports for a route, or the fee transfer of an executed Intents payload; null until known or when the provider reports none (refund legs carry no app fee: null)."
        origin:
          additionalProperties: {}
          description: Payer side.
          properties:
            asset_id:
              description: Origin asset.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            chain:
              description: Origin chain.
              examples:
                - eip155:8453
              pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
              type: string
            decimals:
              description: Decimals of the asset (display of base units; spec 0.2.1, absent from older rails).
              maximum: 255
              minimum: 0
              type: integer
            refund_to:
              description: Refund address.
              maxLength: 256
              minLength: 1
              type: string
            refund_type:
              description: Refund address type.
              enum:
                - origin_chain
                - intents
              type: string
          required:
            - asset_id
            - chain
            - refund_to
            - refund_type
          type: object
        owner:
          description: Service that consumes this execution's events and owns its merchant record (spec 0.3.0; absent = `payments`). Consumers ignore executions they do not own.
          type: string
          x-extensible-enum:
            - payments
            - agentpay
