  /ops/executions/{id}/reverify:
    post:
      description: "Sets `verify_at = now()` and records an `operator` observation; the Verifier then applies its normal rules. It never forces a state: only evidence moves an execution to `succeeded` (INV-2). Other states answer `state_conflict`. Audited with the operator id."
      operationId: reverifyOpsExecution
      parameters:
        - description: execution id (`ex_` + 26 base32 chars).
          in: path
          name: id
          required: true
          schema:
            description: execution id (`ex_` + 26 base32 chars).
            examples:
              - ex_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^ex_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
        - description: Makes the request safe to retry for 24 h (same key + same body = same result).
          in: header
          name: Idempotency-Key
          schema:
            description: Makes the request safe to retry for 24 h (same key + same body = same result).
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                note:
                  description: Why (audited).
                  maxLength: 2000
                  minLength: 1
                  type: string
              required:
                - note
              type: object
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
          description: Ask the Verifier to re-check a `held` or `verifying` execution now.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `state_conflict`."
          x-error-codes:
            - state_conflict
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Ask the Verifier to re-check a `held` or `verifying` execution now.
      tags:
        - rails
      x-nearpay:
        auth:
          - ops:rails.verify
        idempotent: true
        ops_roles:
          - ops
          - ops_admin
        service: rails
        stage: 2
        step_up: true
        visibility: ops
