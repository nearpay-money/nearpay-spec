components:
  schemas:
    ChainProfile:
      additionalProperties: {}
      description: Chain profile (public subset).
      properties:
        blockchain:
          description: 1Click `blockchain` code, e.g. `base` or `near`.
          pattern: ^[a-z0-9_-]{2,32}$
          type: string
        chain:
          description: CAIP-2 chain id, e.g. `eip155:8453` or `near:mainnet`.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        default_deadline_s:
          description: Default deposit window.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        explorer_tx_url:
          description: Explorer URL template with `{tx}`.
          type: string
        family:
          description: Chain family.
          type: string
          x-extensible-enum:
            - evm
            - near
            - solana
            - bitcoin
            - other
        finality:
          description: Finality rule.
          type: string
        memo_mode:
          description: Memo mode.
          enum:
            - none
            - required
          type: string
        min_deadline_s:
          description: Minimum deposit window.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        tier:
          description: Verification tier.
          type: string
          x-extensible-enum:
            - A
            - B
        verification_timeout_s:
          description: Evidence timeout before `held`.
          maximum: 9007199254740991
          minimum: 0
          type: integer
      required:
        - chain
        - blockchain
        - family
        - tier
        - min_deadline_s
        - default_deadline_s
        - finality
        - verification_timeout_s
        - memo_mode
        - explorer_tx_url
      type: object
    ChainProfiles:
      additionalProperties: {}
      description: Profiles.
      properties:
        profiles:
          description: Profiles.
          items:
            $ref: "#/components/schemas/ChainProfile"
          type: array
      required:
        - profiles
      type: object
    CreateExecution:
      additionalProperties: false
      description: Create an execution for a payment attempt (rails §8.1).
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        deadline_cap:
          anyOf:
            - description: RFC 3339 UTC timestamp, e.g. `2026-11-05T10:00:00.000Z`.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            - type: "null"
          description: Session expiry, or null when late payments are allowed.
        destination:
          additionalProperties: false
          description: Snapshotted destination.
          properties:
            address:
              description: Destination address or Intents account.
              maxLength: 256
              minLength: 1
              type: string
            asset_id:
              description: Settlement asset.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            chain:
              description: Settlement chain.
              examples:
                - eip155:8453
              pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
              type: string
            type:
              description: "Where funds settle: an address on a chain, or a NEAR Intents account."
              enum:
                - chain_address
                - intents_account
              type: string
          required:
            - asset_id
            - type
            - chain
            - address
          type: object
        fee:
          additionalProperties: false
          description: Fee snapshot.
          properties:
            bearer:
              description: Fee bearer.
              enum:
                - payer
                - merchant
              type: string
            schedule:
              $ref: "#/components/schemas/FeeSchedule"
          required:
            - schedule
            - bearer
          type: object
        idempotency_key:
          description: "`attempt:<pa_id>` (payments) — stable across retries."
          maxLength: 255
          minLength: 1
          type: string
        kind:
          const: payment
          description: "Stage 1: payments only (refunds arrive in Stage 2)."
          type: string
        livemode:
          description: Mode; selects the provider (INV-8).
          type: boolean
        method:
          description: "`route_quote`: deposit to a 1Click address from any chain. `intents_transfer`: signed transfer from a NEAR Intents balance."
          enum:
            - route_quote
            - intents_transfer
          type: string
        origin:
          additionalProperties: false
          description: Payer side.
          properties:
            asset_id:
              description: Origin asset.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            chain:
              description: Origin chain.
              examples:
                - eip155:8453
              pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
              type: string
            refund_to:
              description: Refund address (route_quote) or payer Intents account (intents_transfer).
              maxLength: 256
              minLength: 1
              type: string
            refund_type:
              description: Refund address type.
              enum:
                - origin_chain
                - intents
              type: string
          required:
            - asset_id
            - chain
            - refund_to
            - refund_type
          type: object
        pricing:
          anyOf:
            - additionalProperties: false
              description: Fiat pricing.
              properties:
                amount:
                  description: Fiat amount in minor units (e.g. cents), integer.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                currency:
                  description: ISO 4217 currency code, lower-case (e.g. `usd`).
                  pattern: ^[a-z]{3}$
                  type: string
              required:
                - currency
                - amount
              type: object
            - additionalProperties: false
              description: Asset pricing.
              properties:
                amount:
                  description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
                  pattern: ^(0|[1-9][0-9]{0,77})$
                  type: string
                asset_id:
                  description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
                  examples:
                    - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
                  maxLength: 256
                  pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
                  type: string
                currency:
                  const: asset
                  description: Asset pricing.
                  type: string
              required:
                - currency
                - asset_id
                - amount
              type: object
          description: Price of the payment.
        slippage_bps:
          description: Override slippage (default per route class).
          maximum: 10000
          minimum: 0
          type: integer
      required:
        - idempotency_key
        - kind
        - method
        - account_id
        - livemode
        - origin
        - destination
        - pricing
        - fee
        - deadline_cap
      type: object
    DepositLookup:
      additionalProperties: {}
      description: Whether a deposit address was issued by NearPay.
      properties:
        account_id:
          anyOf:
            - description: account id (`acct_` + 26 base32 chars).
              examples:
                - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Account, if it exists.
        execution_id:
          anyOf:
            - description: execution id (`ex_` + 26 base32 chars).
              examples:
                - ex_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^ex_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Execution, if it exists.
        exists:
          description: NearPay issued this deposit address.
          type: boolean
        livemode:
          description: Mode, if it exists.
          type:
            - boolean
            - "null"
      required:
        - exists
        - execution_id
        - account_id
        - livemode
      type: object
    DestinationMinimum:
      additionalProperties: {}
      description: Minimum economic payment for a destination (rails §8.9).
      properties:
        computed_at:
          anyOf:
            - description: RFC 3339 UTC timestamp, e.g. `2026-11-05T10:00:00.000Z`.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            - type: "null"
          description: When computed (null = unavailable).
        min_amount_base:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Minimum in base units of the asset.
        min_usd_micros:
          anyOf:
            - maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Minimum in USD micros.
      required:
        - min_amount_base
        - min_usd_micros
        - computed_at
      type: object
    DestinationMinimums:
      additionalProperties:
        $ref: "#/components/schemas/DestinationMinimum"
      description: Key → minimum.
      propertyNames:
        type: string
      type: object
    Error:
      additionalProperties: {}
      description: Envelope returned with every non-2xx response.
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
      required:
        - error
      type: object
    ErrorBody:
      additionalProperties: {}
      description: Details of a failed request.
      properties:
        code:
          description: Machine-readable error code from the error catalogue.
          type: string
          x-extensible-enum:
            - invalid_request
            - resource_missing
            - authentication_required
            - invalid_api_key
            - permission_denied
            - csrf_token_invalid
            - ip_not_allowed
            - account_suspended
            - step_up_required
            - rate_limited
            - idempotency_key_reused
            - idempotency_in_progress
            - api_error
            - state_conflict
            - livemode_forbidden
            - link_expired
            - link_used
            - webauthn_failed
            - invalid_client
            - turnstile_failed
            - invalid_setting
            - scope_unknown
            - address_invalid
            - asset_unsupported
            - memo_destination_unsupported
            - destination_in_use
            - recovery_lock
            - screening_blocked
            - attestation_invalid
            - challenge_expired
            - destination_not_active
            - account_not_live
            - amount_below_destination_minimum
            - amount_above_unverified_cap
            - currency_unsupported
            - allowed_origins_required
            - attempt_in_flight
            - client_secret_invalid
            - session_not_open
            - too_many_attempts
            - route_too_slow
            - refund_address_invalid
            - geo_blocked
            - intent_invalid
            - insufficient_balance
            - rail_unavailable
            - route_unavailable
            - pricing_unavailable
            - deadline_too_short
            - quote_rejected
            - quote_integrity_failed
            - ticket_invalid
            - attestation_refused
            - attestation_stale
            - attestation_unavailable
            - destination_not_intents_account
            - amount_below_minimum
            - screening_unavailable
            - url_invalid
            - event_type_unknown
        doc_url:
          description: Documentation page for this error code.
          format: uri
          type: string
        message:
          description: Human-readable message; safe to show to developers, not to payers.
          type: string
        param:
          description: The request parameter the error relates to, when there is one.
          type: string
        request_id:
          description: Request id, also returned in the `X-Request-Id` header.
          examples:
            - req_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^req_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        type:
          description: Error category; decides whether a retry can help.
          type: string
          x-extensible-enum:
            - invalid_request_error
            - authentication_error
            - permission_error
            - payment_error
            - idempotency_error
            - state_conflict
            - rate_limit_error
            - api_error
            - rail_unavailable
      required:
        - type
        - code
        - message
        - doc_url
        - request_id
      type: object
    Evidence:
      additionalProperties: {}
      description: Independent on-chain proof that a settlement reached the merchant (INV-2).
      properties:
        amount:
          description: Amount received by the recipient, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          description: Asset that settled.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        block_ref:
          description: Block height or hash containing the transaction.
          type:
            - string
            - "null"
        chain:
          description: Chain where the settlement happened.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        explorer_url:
          anyOf:
            - format: uri
              type: string
            - type: "null"
          description: Block-explorer link for the transaction.
        finality:
          description: Finality reached when the evidence was accepted.
          type: string
          x-extensible-enum:
            - final
            - finalized
            - confirmed
        observed_at:
          description: When NearPay accepted the evidence.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        recipient:
          description: Recipient that received the funds (the merchant destination).
          maxLength: 256
          minLength: 1
          type: string
        source:
          description: Detector that produced the evidence.
          type: string
          x-extensible-enum:
            - watcher
            - indexer
            - verifier
            - provider
            - operator
        tier:
          description: "Verification tier: A = independently verified on chain, B = provider-attested within limits."
          type: string
          x-extensible-enum:
            - A
            - B
        tx_hash:
          description: Settlement transaction (NEAR receipt / tx hash for Intents).
          maxLength: 128
          minLength: 8
          type: string
      required:
        - chain
        - tx_hash
        - block_ref
        - recipient
        - asset_id
        - amount
        - finality
        - tier
        - source
        - observed_at
        - explorer_url
      type: object
    EvidencePage:
      additionalProperties: {}
      description: Settled executions for a day.
      properties:
        data:
          description: Settled executions.
          items:
            $ref: "#/components/schemas/Execution"
          type: array
        has_more:
          description: More pages.
          type: boolean
      required:
        - data
        - has_more
      type: object
    Execution:
      additionalProperties: {}
      description: A provider run moving value for a payment (rails owns).
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        applied_fee_bps:
          description: Fee bps applied.
          maximum: 10000
          minimum: 0
          type: integer
        created_at:
          description: Created.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        deadline:
          description: Execution deadline.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        deposit:
          anyOf:
            - $ref: "#/components/schemas/ExecutionDeposit"
            - type: "null"
          description: "`route_quote` deposit instructions."
        deposit_tx_hashes:
          description: Deposit transactions known so far.
          items:
            description: Transaction hash in the chain's text form.
            maxLength: 128
            minLength: 8
            type: string
          type: array
        evidence:
          anyOf:
            - $ref: "#/components/schemas/Evidence"
            - type: "null"
          description: Accepted evidence (INV-2).
        failure_code:
          description: Failure code.
          type:
            - string
            - "null"
        held_reason:
          anyOf:
            - description: Why held.
              type: string
              x-extensible-enum:
                - evidence_mismatch
                - evidence_timeout
                - failed_after_deposit
                - unknown_status
            - type: "null"
        id:
          description: execution id (`ex_` + 26 base32 chars).
          examples:
            - ex_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^ex_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        intents_requirement:
          anyOf:
            - $ref: "#/components/schemas/IntentsRequirement"
            - type: "null"
          description: "`intents_transfer` requirement."
        kind:
          description: What the execution moves value for.
          type: string
          x-extensible-enum:
            - payment
            - refund
        livemode:
          description: Mode.
          type: boolean
        method:
          description: "`route_quote`: deposit to a 1Click address from any chain. `intents_transfer`: signed transfer from a NEAR Intents balance."
          enum:
            - route_quote
            - intents_transfer
          type: string
        origin:
          additionalProperties: {}
          description: Payer side.
          properties:
            asset_id:
              description: Origin asset.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            chain:
              description: Origin chain.
              examples:
                - eip155:8453
              pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
              type: string
            refund_to:
              description: Refund address.
              maxLength: 256
              minLength: 1
              type: string
            refund_type:
              description: Refund address type.
              enum:
                - origin_chain
                - intents
              type: string
          required:
            - asset_id
            - chain
            - refund_to
            - refund_type
          type: object
        price_snapshot:
          anyOf:
            - $ref: "#/components/schemas/PriceSnapshot"
            - type: "null"
        provider:
          description: Route provider.
          type: string
          x-extensible-enum:
            - oneclick
            - sandbox
            - direct_intents
        provider_status:
          description: Last provider status (raw).
          type:
            - string
            - "null"
        refund_reason:
          description: Provider refund reason.
          type:
            - string
            - "null"
        refunded_amount:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Amount refunded to the payer.
        route_class:
          description: Route class (rails §8.1).
          type: string
          x-extensible-enum:
            - same_asset
            - stable_pair
            - volatile
            - intents_transfer
        settled_amount:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Amount that reached the recipient.
        settlement:
          additionalProperties: {}
          description: Merchant side.
          properties:
            amount_base:
              description: Settlement amount before the tag.
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            asset_id:
              description: Settlement asset.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            chain:
              description: Settlement chain.
              examples:
                - eip155:8453
              pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
              type: string
            expected:
              description: Expected output = base + tag.
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            recipient:
              description: Merchant destination.
              maxLength: 256
              minLength: 1
              type: string
            recipient_type:
              description: Recipient type.
              enum:
                - destination_chain
                - intents
              type: string
            tag:
              description: Amount tag (0 = untagged).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          required:
            - asset_id
            - amount_base
            - tag
            - expected
            - recipient
            - recipient_type
            - chain
          type: object
        state:
          description: Attempt status (mirrors the rails execution, domain-model §4.3).
          type: string
          x-extensible-enum:
            - quoting
            - awaiting_deposit
            - deposit_detected
            - incomplete_deposit
            - settling
            - verifying
            - succeeded
            - refunded
            - failed
            - expired_unpaid
            - held
        terminal_at:
          anyOf:
            - description: RFC 3339 UTC timestamp, e.g. `2026-11-05T10:00:00.000Z`.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            - type: "null"
          description: When it reached a terminal state.
        updated_at:
          description: Updated.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        version:
          description: Increments with every applied change (consumers ignore stale versions).
          maximum: 9007199254740991
          minimum: 1
          type: integer
      required:
        - id
        - version
        - account_id
        - livemode
        - kind
        - method
        - provider
        - state
        - provider_status
        - route_class
        - applied_fee_bps
        - origin
        - settlement
        - price_snapshot
        - deposit
        - intents_requirement
        - deposit_tx_hashes
        - settled_amount
        - refunded_amount
        - refund_reason
        - evidence
        - failure_code
        - held_reason
        - deadline
        - terminal_at
        - created_at
        - updated_at
      type: object
    ExecutionDeposit:
      additionalProperties: {}
      description: Deposit instructions of a `route_quote` execution.
      properties:
        address:
          description: Deposit address.
          maxLength: 256
          minLength: 1
          type: string
        amount_in:
          description: Amount to send.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        chain:
          description: Origin chain.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        deadline:
          description: Deposit deadline.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        memo:
          description: Memo.
          type:
            - string
            - "null"
        min_amount_in:
          description: Provider minimum.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
      required:
        - address
        - memo
        - amount_in
        - min_amount_in
        - chain
        - deadline
      type: object
    FeeSchedule:
      additionalProperties: {}
      description: A fee schedule (identity owns, rails applies).
      properties:
        id:
          description: fee_schedule id (`fs_` + 26 base32 chars).
          examples:
            - fs_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^fs_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        name:
          description: Schedule name.
          type: string
        provider_split:
          additionalProperties: {}
          description: How fees are split with route providers.
          properties:
            oneclick:
              additionalProperties: {}
              description: 1Click split.
              properties:
                floor_bps:
                  description: Provider minimum.
                  maximum: 10000
                  minimum: 0
                  type: integer
                share_bps:
                  description: Provider share of appFees (5000 = 50%).
                  maximum: 10000
                  minimum: 0
                  type: integer
                stable_floor_bps:
                  description: Provider minimum on stable/same-asset routes.
                  maximum: 10000
                  minimum: 0
                  type: integer
              required:
                - share_bps
                - floor_bps
                - stable_floor_bps
              type: object
          required:
            - oneclick
          type: object
        rules:
          additionalProperties: {}
          description: Fee per route class (rails §8.1).
          properties:
            intents_transfer:
              additionalProperties: {}
              description: Fee rule for one route class.
              properties:
                min_fee_usd_micros:
                  description: Minimum absolute fee in USD micros.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                total_bps:
                  description: All-in fee for this route class.
                  maximum: 10000
                  minimum: 0
                  type: integer
              required:
                - total_bps
                - min_fee_usd_micros
              type: object
            same_asset:
              additionalProperties: {}
              description: Fee rule for one route class.
              properties:
                min_fee_usd_micros:
                  description: Minimum absolute fee in USD micros.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                total_bps:
                  description: All-in fee for this route class.
                  maximum: 10000
                  minimum: 0
                  type: integer
              required:
                - total_bps
                - min_fee_usd_micros
              type: object
            stable_pair:
              additionalProperties: {}
              description: Fee rule for one route class.
              properties:
                min_fee_usd_micros:
                  description: Minimum absolute fee in USD micros.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                total_bps:
                  description: All-in fee for this route class.
                  maximum: 10000
                  minimum: 0
                  type: integer
              required:
                - total_bps
                - min_fee_usd_micros
              type: object
            volatile:
              additionalProperties: {}
              description: Fee rule for one route class.
              properties:
                min_fee_usd_micros:
                  description: Minimum absolute fee in USD micros.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                total_bps:
                  description: All-in fee for this route class.
                  maximum: 10000
                  minimum: 0
                  type: integer
              required:
                - total_bps
                - min_fee_usd_micros
              type: object
          required:
            - same_asset
            - stable_pair
            - volatile
            - intents_transfer
          type: object
      required:
        - id
        - name
        - rules
        - provider_split
      type: object
    IntentsRequirement:
      additionalProperties: {}
      description: "What a payer must sign: transfer(pay_to, amount) and transfer(fee_to, fee_amount), both with memo = binding."
      properties:
        amount:
          description: Amount the merchant receives, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        binding:
          description: Memo that both transfers must carry.
          pattern: ^np1:[1-9A-HJ-NP-Za-km-z]{43,44}$
          type: string
        deadline:
          description: Latest acceptable payload deadline.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        fee_amount:
          description: NearPay fee, base units, in the same asset.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        fee_to:
          description: NearPay treasury Intents account.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        pay_to:
          description: Merchant Intents account that receives the payment.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        token:
          description: Asset to transfer (equals the settlement asset).
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
      required:
        - pay_to
        - token
        - amount
        - fee_to
        - fee_amount
        - binding
        - deadline
      type: object
    InternalAsset:
      additionalProperties: {}
      description: An asset with pricing state.
      properties:
        as_of:
          anyOf:
            - description: RFC 3339 UTC timestamp, e.g. `2026-11-05T10:00:00.000Z`.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            - type: "null"
          description: Price time.
        asset_id:
          description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        blockchain:
          description: 1Click `blockchain` code, e.g. `base` or `near`.
          pattern: ^[a-z0-9_-]{2,32}$
          type: string
        chain:
          description: Chain.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        decimals:
          description: Decimals.
          maximum: 255
          minimum: 0
          type: integer
        family:
          description: Asset family.
          type: string
        is_usd_stable:
          description: USD stablecoin.
          type: boolean
        price_ok:
          description: Primary and secondary prices agree and are fresh (rails §8.2).
          type: boolean
        price_usd:
          description: USD price (decimal string).
          type:
            - string
            - "null"
        symbol:
          description: Symbol.
          type: string
      required:
        - asset_id
        - chain
        - blockchain
        - symbol
        - decimals
        - family
        - is_usd_stable
        - price_usd
        - price_ok
        - as_of
      type: object
    InternalPaymentOption:
      additionalProperties: {}
      description: Indicative option (rails view).
      properties:
        applied_fee_bps:
          description: Fee bps.
          maximum: 10000
          minimum: 0
          type: integer
        available:
          description: Usable now.
          type: boolean
        chain:
          description: Origin chain.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        decimals:
          description: Decimals.
          maximum: 255
          minimum: 0
          type: integer
        estimated_amount_in:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Indicative amount in.
        method:
          description: "`route_quote`: deposit to a 1Click address from any chain. `intents_transfer`: signed transfer from a NEAR Intents balance."
          enum:
            - route_quote
            - intents_transfer
          type: string
        min_deadline_s:
          description: Minimum deposit window.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        origin_asset_id:
          description: Origin asset.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        reason:
          description: Why unavailable.
          type:
            - string
            - "null"
        route_class:
          description: Route class (rails §8.1).
          type: string
          x-extensible-enum:
            - same_asset
            - stable_pair
            - volatile
            - intents_transfer
        symbol:
          description: Symbol.
          type: string
      required:
        - method
        - origin_asset_id
        - chain
        - symbol
        - decimals
        - estimated_amount_in
        - route_class
        - applied_fee_bps
        - min_deadline_s
        - available
        - reason
      type: object
    InternalPaymentOptions:
      additionalProperties: {}
      description: Indicative options.
      properties:
        options:
          description: Options.
          items:
            $ref: "#/components/schemas/InternalPaymentOption"
          type: array
      required:
        - options
      type: object
    PriceSnapshot:
      additionalProperties: {}
      description: Prices used to compute the settlement amount (INV-6).
      properties:
        as_of:
          description: When prices were read.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        fx:
          description: FX rate pricing currency → USD (decimal string), null for USD.
          type:
            - string
            - "null"
        par:
          description: Settled at par (USD stablecoin, depeg guard passed).
          type: boolean
        primary_usd:
          description: Primary USD price of the settlement asset (decimal string).
          type:
            - string
            - "null"
        secondary_usd:
          description: Secondary USD price (decimal string).
          type:
            - string
            - "null"
      required:
        - primary_usd
        - secondary_usd
        - fx
        - par
        - as_of
      type: object
  securitySchemes:
    internalToken:
      description: "Internal Ed25519 JWT: request token or service token."
      in: header
      name: X-NearPay-Token
      type: apiKey
    serviceClient:
      description: Service client credentials (`client_id` + secret file).
      scheme: basic
      type: http
info:
  description: NearPay internal service API. Generated from `nearpay-spec`; do not edit by hand.
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  title: nearpay-rails internal API
  version: 0.1.2
openapi: 3.1.0
paths:
  /internal/assets/{asset_id}:
    get:
      operationId: getInternalAsset
      parameters:
        - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
          in: path
          name: asset_id
          required: true
          schema:
            description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
            examples:
              - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
            maxLength: 256
            pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalAsset"
          description: Asset decimals and price state.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `asset_unsupported`."
          x-error-codes:
            - asset_unsupported
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Asset decimals and price state.
      tags:
        - rails
      x-nearpay:
        auth:
          - service:rails.read
        idempotent: false
        service: rails
        stage: 1
  /internal/chain-profiles:
    get:
      operationId: listChainProfiles
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainProfiles"
          description: Enabled chain profiles.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Enabled chain profiles.
      tags:
        - rails
      x-nearpay:
        auth:
          - service:rails.read
        idempotent: false
        service: rails
        stage: 1
  /internal/destination-minimums:
    get:
      operationId: getDestinationMinimums
      parameters:
        - description: Comma-separated destination keys.
          in: query
          name: keys
          required: true
          schema:
            description: Comma-separated destination keys.
            maxLength: 8192
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationMinimums"
          description: Minimum payment per destination key (`chain|address_norm|asset_id`).
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Minimum payment per destination key (`chain|address_norm|asset_id`).
      tags:
        - rails
      x-nearpay:
        auth:
          - service:rails.read
        idempotent: false
        service: rails
        stage: 1
  /internal/evidence:
    get:
      operationId: listEvidence
      parameters:
        - description: account id (`acct_` + 26 base32 chars).
          in: query
          name: account_id
          required: true
          schema:
            description: account id (`acct_` + 26 base32 chars).
            examples:
              - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
        - description: Mode.
          in: query
          name: livemode
          required: true
          schema:
            description: Mode.
            enum:
              - "true"
              - "false"
            type: string
        - description: UTC day `YYYY-MM-DD`.
          in: query
          name: day
          required: true
          schema:
            description: UTC day `YYYY-MM-DD`.
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - description: Cursor.
          in: query
          name: starting_after
          schema:
            description: Cursor.
            examples:
              - ex_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^ex_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
        - description: Page size.
          in: query
          name: limit
          schema:
            default: 500
            description: Page size.
            maximum: 1000
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidencePage"
          description: Executions that settled on a UTC day, with evidence.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Executions that settled on a UTC day, with evidence.
      tags:
        - rails
      x-nearpay:
        auth:
          - service:rails.read
        idempotent: false
        service: rails
        stage: 1
  /internal/executions:
    get:
      operationId: lookupExecutionByDeposit
      parameters:
        - description: Deposit address.
          in: query
          name: deposit_address
          required: true
          schema:
            description: Deposit address.
            maxLength: 256
            minLength: 1
            type: string
        - description: Deposit memo.
          in: query
          name: memo
          schema:
            description: Deposit memo.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositLookup"
          description: Did NearPay issue this deposit address? (sentinel kill-switch decision only)
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
