    get:
      description: Same rules as execution pricing (par policy, dual-source prices, FX staleness). Payments compares `usd_micros` with destination minimums and the unverified-destination cap for non-USD prices, and uses `settlement.amount_base` as the options `amount_out`.
      operationId: estimateSettlement
      parameters:
        - description: Fiat minor units, or asset base units when `currency` is `asset`.
          in: query
