              properties:
                min_fee_usd_micros:
                  description: Minimum absolute fee in USD micros.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                total_bps:
                  description: All-in fee for this route class.
                  maximum: 10000
                  minimum: 0
                  type: integer
              required:
                - total_bps
                - min_fee_usd_micros
              type: object
            same_asset:
              additionalProperties: {}
              description: Fee rule for one route class.
              properties:
                min_fee_usd_micros:
                  description: Minimum absolute fee in USD micros.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                total_bps:
                  description: All-in fee for this route class.
                  maximum: 10000
                  minimum: 0
                  type: integer
              required:
                - total_bps
                - min_fee_usd_micros
              type: object
            stable_pair:
              additionalProperties: {}
              description: Fee rule for one route class.
              properties:
                min_fee_usd_micros:
                  description: Minimum absolute fee in USD micros.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                total_bps:
                  description: All-in fee for this route class.
                  maximum: 10000
                  minimum: 0
                  type: integer
              required:
                - total_bps
                - min_fee_usd_micros
              type: object
            volatile:
              additionalProperties: {}
              description: Fee rule for one route class.
              properties:
                min_fee_usd_micros:
                  description: Minimum absolute fee in USD micros.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                total_bps:
                  description: All-in fee for this route class.
                  maximum: 10000
                  minimum: 0
                  type: integer
              required:
                - total_bps
                - min_fee_usd_micros
              type: object
          required:
