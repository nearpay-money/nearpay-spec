            - quoting
            - awaiting_deposit
            - deposit_detected
            - incomplete_deposit
            - settling
            - verifying
            - succeeded
            - refunded
            - failed
            - expired_unpaid
            - held
        terminal_at:
          anyOf:
            - description: RFC 3339 UTC timestamp, e.g. `2026-11-05T10:00:00.000Z`.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            - type: "null"
          description: When it reached a terminal state.
        updated_at:
          description: Updated.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        version:
          description: Increments with every applied change (consumers ignore stale versions).
          maximum: 9007199254740991
          minimum: 1
          type: integer
        x402_binding:
          anyOf:
            - description: Binding memo `np1:` + base58(sha256(…)) tying a signed transfer to one requirement.
              pattern: ^np1:[1-9A-HJ-NP-Za-km-z]{43,44}$
              type: string
            - type: "null"
          description: "Owner `agentpay`: binding of the `near-intents` requirement the quote was minted for; null otherwise."
      required:
        - id
        - version
        - account_id
        - livemode
        - kind
        - method
        - provider
        - state
        - provider_status
        - route_class
        - applied_fee_bps
        - origin
        - settlement
        - price_snapshot
        - deposit
        - intents_requirement
        - deposit_tx_hashes
        - settled_amount
        - refunded_amount
        - refund_reason
        - evidence
        - failure_code
        - held_reason
        - deadline
        - terminal_at
        - created_at
        - updated_at
      type: object
    ExecutionDeposit:
      additionalProperties: {}
      description: Deposit instructions of a `route_quote` execution.
      properties:
        address:
          description: Deposit address.
          maxLength: 256
          minLength: 1
          type: string
        amount_in:
          description: Amount to send.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        chain:
          description: Origin chain.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        deadline:
          description: Deposit deadline.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        fee_amount_in:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
