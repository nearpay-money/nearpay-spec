  /internal/executions/{id}/abandon:
    post:
      description: "Only for `kind: refund` executions with no deposit yet (`quoting`, `awaiting_deposit`, `expired_unpaid`); anything else — a payment execution, or a leg where money moved (`deposit_detected` and later, `held`, terminal) — is `409 state_conflict`, because truth wins (INV-3). Rails sets `abandoned_at`/`abandon_reason`, moves a pre-deposit leg to `expired_unpaid` at once (deadline = now; agentpay then refuses a relay for it) and keeps tracking it for the usual 24 h, so a late deposit still settles and reaches payments as an ordinary execution event (payments counts it as `extra_amount_sent`). Emits `evt.rails.execution.updated`. Repeating the call returns the execution unchanged."
      operationId: abandonExecution
      parameters:
        - description: execution id (`ex_` + 26 base32 chars).
          in: path
          name: id
          required: true
          schema:
            description: execution id (`ex_` + 26 base32 chars).
            examples:
              - ex_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^ex_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
        - description: Makes the request safe to retry for 24 h (same key + same body = same result).
          in: header
          name: Idempotency-Key
          schema:
            description: Makes the request safe to retry for 24 h (same key + same body = same result).
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                note:
                  description: Detail for operators (no personal data).
                  maxLength: 500
                  type: string
                reason:
                  description: "Why payments no longer uses the leg: its preparation failed after rails created the execution, the execution did not match the leg (payments `execution_mismatch`), a newer leg replaced it, or the refund was canceled."
                  type: string
                  x-extensible-enum:
                    - leg_failed
                    - execution_mismatch
                    - superseded
                    - refund_canceled
              required:
                - reason
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
          description: Abandon a refund leg payments no longer uses (orphaned before any deposit).
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `state_conflict`."
          x-error-codes:
            - state_conflict
        default:
