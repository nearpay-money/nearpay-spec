            description: "Mode whose token registry answers (test = sandbox registry). Omitted: live, falling back to test."
            enum:
              - "true"
              - "false"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementEstimate"
