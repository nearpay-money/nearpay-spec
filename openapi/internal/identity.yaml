          type: array
        has_more:
          description: Whether more objects exist after this page.
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          description: Path of this list endpoint.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    OpsRegistration:
      additionalProperties: {}
      description: A verified operator ready to register a hardware passkey.
