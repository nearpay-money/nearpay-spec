          type: string
      required:
        - object
        - registration_token
        - email
        - expires_at
      type: object
    OpsSession:
      additionalProperties: {}
      description: A console session. Sign-in responses set the cookie `__Host-np_ops` (host-only on the console host; a dashboard cookie is never accepted there).
      properties:
        csrf_token:
          description: Send as `X-CSRF-Token` on every unsafe request.
          minLength: 32
          type: string
        expires_at:
          description: Absolute session expiry (12 h).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        idle_expires_at:
          description: Session ends without activity at this time (30 min idle).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        object:
          const: ops_session
          description: Always `ops_session`.
          type: string
        operator:
          additionalProperties: {}
          description: Signed-in operator.
          properties:
            email:
              description: Operator email.
              format: email
              pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              type: string
            id:
              description: user id (`usr_` + 26 base32 chars).
              examples:
                - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
          required:
            - id
            - email
          type: object
        role:
          description: Role of a console operator.
          enum:
            - ops
            - ops_admin
          type: string
        step_up_until:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
