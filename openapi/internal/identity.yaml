      properties:
        data:
          description: Objects on this page.
          items:
            $ref: "#/components/schemas/AuditEvent"
          type: array
        has_more:
          description: Whether more objects exist after this page.
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          description: Path of this list endpoint.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    OpsMerchant:
      additionalProperties: {}
      description: A merchant account as operators see it.
      properties:
        active_live_destinations:
          description: Active live settlement destinations.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        api_version:
          description: API version pinned for this account.
          enum:
            - 2026-11-01
          type: string
        country:
          anyOf:
            - description: ISO 3166-1 alpha-2 country code, upper-case.
              pattern: ^[A-Z]{2}$
              type: string
            - type: "null"
          description: Country of the merchant.
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        display_name:
          description: Name shown to payers until KYB verifies a legal name.
          maxLength: 100
          minLength: 1
          type: string
        fee_bearer:
          description: "Who bears NearPay's fee: the payer pays it on top (default) or it is deducted from the settlement."
          enum:
            - payer
            - merchant
          type: string
        id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        kyb_status:
          description: KYB status.
          type: string
          x-extensible-enum:
            - not_started
            - pending
            - needs_info
            - approved
            - rejected
        live_enabled:
          description: "Live mode is enabled: KYB approved, an active live destination, status active."
          type: boolean
        member_count:
          description: Members of the account.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        object:
          const: account
          description: Always `account`.
          type: string
        owners:
          description: Owners of the account.
          items:
            additionalProperties: {}
            properties:
              email:
                description: Owner email.
                format: email
                pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                type: string
              id:
                description: user id (`usr_` + 26 base32 chars).
                examples:
                  - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
                pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                type: string
            required:
              - id
              - email
            type: object
          type: array
        recovered_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Last account recovery (blocks destination changes for 48 h).
        settings:
          $ref: "#/components/schemas/AccountSettings"
        status:
          description: Account status.
          type: string
          x-extensible-enum:
            - active
            - suspended
            - closed
        verified_legal_name:
          description: Legal name approved by NearPay's KYB review (self-declared business details reviewed by ops), shown on checkout once set.
          type:
            - string
            - "null"
        website:
          anyOf:
            - description: Absolute URL.
              format: uri
              maxLength: 2048
              type: string
            - type: "null"
          description: Merchant website (account setting, shown in the dashboard and receipts); absent from older servers.
      required:
        - id
        - object
        - created
        - display_name
        - verified_legal_name
        - country
        - status
        - kyb_status
        - live_enabled
        - fee_bearer
        - api_version
        - settings
        - owners
        - member_count
        - active_live_destinations
        - recovered_at
      type: object
    OpsMerchantList:
      additionalProperties: {}
