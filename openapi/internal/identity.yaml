    SettlementContext:
      additionalProperties: {}
      description: Everything payments needs to create a payment (identity §8.3).
      properties:
        account:
          $ref: "#/components/schemas/Account"
        context_version:
          description: max(updated_at) of everything in the context (cache freshness).
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        defaults:
          additionalProperties:
            description: settlement_destination id (`sd_` + 26 base32 chars).
            examples:
              - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
          description: Default destination per asset; `*` = account default.
          propertyNames:
            anyOf:
              - const: "*"
                type: string
              - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
                examples:
                  - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
                maxLength: 256
                pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
                type: string
          type: object
        destinations:
          description: Active destinations of this mode.
          items:
            $ref: "#/components/schemas/InternalSettlementDestination"
          type: array
        fee_schedule:
          $ref: "#/components/schemas/FeeSchedule"
      required:
        - account
        - fee_schedule
        - destinations
        - defaults
        - context_version
      type: object
    UsdAmount:
      additionalProperties: {}
      description: An amount in US dollars (minor units).
      properties:
        amount:
          description: Fiat amount in minor units (e.g. cents), integer.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        currency:
          const: usd
          description: Always `usd`.
          type: string
      required:
        - amount
        - currency
      type: object
    WebAuthnAuthenticationResponse:
      additionalProperties: {}
      description: AuthenticationResponseJSON from `navigator.credentials.get()`.
      properties:
        authenticatorAttachment:
          description: Attachment.
          type:
            - string
            - "null"
        clientExtensionResults:
          additionalProperties: {}
          description: Extension results.
          propertyNames:
            type: string
          type: object
        id:
          description: Credential id.
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        rawId:
          description: Raw credential id.
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        response:
          additionalProperties: {}
          description: Assertion response.
          properties:
            authenticatorData:
              description: Authenticator data, base64url.
              pattern: ^[A-Za-z0-9_-]+$
              type: string
            clientDataJSON:
              description: Client data, base64url.
              pattern: ^[A-Za-z0-9_-]+$
              type: string
            signature:
              description: Assertion signature, base64url.
              pattern: ^[A-Za-z0-9_-]+$
              type: string
            userHandle:
              anyOf:
                - description: base64url without padding.
                  pattern: ^[A-Za-z0-9_-]+$
                  type: string
                - type: "null"
              description: User handle.
          required:
            - clientDataJSON
            - authenticatorData
            - signature
          type: object
        type:
          const: public-key
          description: Credential type.
          type: string
      required:
        - id
        - rawId
        - type
        - response
        - clientExtensionResults
      type: object
    WebAuthnCreationOptions:
      additionalProperties: {}
      description: PublicKeyCredentialCreationOptionsJSON.
      properties:
        attestation:
          description: Attestation conveyance preference.
          type: string
        authenticatorSelection:
          additionalProperties: {}
          description: Authenticator selection criteria.
          properties:
            authenticatorAttachment:
              description: Platform or cross-platform.
              type: string
            residentKey:
              description: Resident key requirement.
              type: string
            userVerification:
              description: User verification requirement.
              type: string
          type: object
        challenge:
          description: Server challenge, base64url.
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        excludeCredentials:
          description: Credentials already registered.
          items:
            additionalProperties: {}
            description: Credential descriptor.
            properties:
              id:
                description: Credential id, base64url.
                pattern: ^[A-Za-z0-9_-]+$
                type: string
              transports:
                description: Authenticator transports hint.
                items:
                  type: string
                type: array
              type:
                const: public-key
                description: Credential type.
                type: string
            required:
              - id
              - type
            type: object
          type: array
        pubKeyCredParams:
          description: Accepted algorithms (-8 Ed25519, -7 ES256, -257 RS256).
          items:
            additionalProperties: {}
            properties:
              alg:
                description: COSE algorithm id.
                maximum: 9007199254740991
                minimum: -9007199254740991
                type: integer
              type:
                const: public-key
                description: Type.
                type: string
            required:
              - type
              - alg
            type: object
          type: array
        rp:
          additionalProperties: {}
          description: Relying party.
          properties:
            id:
              description: Relying party id (`nearpay.money` / `nearpay.localhost`).
              type: string
            name:
              description: Relying party name.
              type: string
          required:
            - id
            - name
          type: object
        timeout:
          description: Timeout in milliseconds.
          maximum: 9007199254740991
          minimum: -9007199254740991
          type: integer
        user:
          additionalProperties: {}
          description: User entity.
          properties:
            displayName:
              description: Display name.
              type: string
            id:
              description: User handle, base64url.
              pattern: ^[A-Za-z0-9_-]+$
              type: string
            name:
              description: User name (email).
              type: string
          required:
            - id
            - name
            - displayName
          type: object
      required:
        - challenge
        - rp
        - user
        - pubKeyCredParams
      type: object
    WebAuthnRegistrationResponse:
      additionalProperties: {}
      description: RegistrationResponseJSON from `navigator.credentials.create()`.
      properties:
        authenticatorAttachment:
          description: Attachment.
          type:
            - string
            - "null"
        clientExtensionResults:
          additionalProperties: {}
          description: Extension results.
          propertyNames:
            type: string
          type: object
        id:
          description: Credential id.
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        rawId:
          description: Raw credential id.
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        response:
          additionalProperties: {}
          description: Attestation response.
          properties:
            attestationObject:
              description: Attestation object, base64url.
              pattern: ^[A-Za-z0-9_-]+$
              type: string
            clientDataJSON:
              description: Client data, base64url.
              pattern: ^[A-Za-z0-9_-]+$
              type: string
            transports:
              description: Transports.
              items:
                type: string
              type: array
          required:
            - clientDataJSON
            - attestationObject
          type: object
        type:
          const: public-key
          description: Credential type.
          type: string
      required:
        - id
        - rawId
        - type
        - response
        - clientExtensionResults
      type: object
    WebAuthnRequestOptions:
      additionalProperties: {}
      description: PublicKeyCredentialRequestOptionsJSON.
      properties:
        allowCredentials:
          description: Allowed credentials (empty = discoverable).
          items:
            additionalProperties: {}
            description: Credential descriptor.
            properties:
              id:
                description: Credential id, base64url.
                pattern: ^[A-Za-z0-9_-]+$
                type: string
              transports:
                description: Authenticator transports hint.
                items:
                  type: string
                type: array
              type:
                const: public-key
                description: Credential type.
                type: string
            required:
              - id
              - type
            type: object
          type: array
        challenge:
          description: Server challenge, base64url.
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        rpId:
          description: Relying party id.
          type: string
        timeout:
          description: Timeout in milliseconds.
          maximum: 9007199254740991
          minimum: -9007199254740991
          type: integer
        userVerification:
          description: User verification requirement.
          type: string
      required:
        - challenge
      type: object
  securitySchemes:
    internalToken:
      description: "Internal Ed25519 JWT: request token or service token."
      in: header
      name: X-NearPay-Token
      type: apiKey
    serviceClient:
      description: Service client credentials (`client_id` + secret file).
      scheme: basic
      type: http
info:
  description: NearPay internal service API. Generated from `nearpay-spec`; do not edit by hand.
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  title: nearpay-identity internal API
  version: 0.2.1
openapi: 3.1.0
paths:
  /internal/accounts/{id}/notification-recipients:
    get:
      description: "security: owners+admins · developer: owners+admins+developers · billing: owners+finance."
      operationId: getNotificationRecipients
      parameters:
        - description: account id (`acct_` + 26 base32 chars).
          in: path
          name: id
          required: true
          schema:
            description: account id (`acct_` + 26 base32 chars).
            examples:
              - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
        - description: Which users to notify.
          in: query
          name: kind
          required: true
          schema:
            description: Which users to notify.
            enum:
              - security
              - billing
              - developer
            type: string
        - description: Only this user, if they are currently a member of the account in any role (`kind` is then not applied); an empty list otherwise. For mails to the affected user (member added or role changed, account recovery). Spec 0.2.1.
          in: query
          name: user
          schema:
            description: Only this user, if they are currently a member of the account in any role (`kind` is then not applied); an empty list otherwise. For mails to the affected user (member added or role changed, account recovery). Spec 0.2.1.
            examples:
              - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRecipients"
          description: Email recipients for an account notification (PII; never put in events).
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Email recipients for an account notification (PII; never put in events).
      tags:
        - identity
      x-nearpay:
        auth:
          - service:identity.recipients.read
        idempotent: false
        service: identity
        stage: 1
  /internal/accounts/{id}/settlement-context:
    get:
      operationId: getSettlementContext
      parameters:
        - description: account id (`acct_` + 26 base32 chars).
          in: path
          name: id
          required: true
          schema:
            description: account id (`acct_` + 26 base32 chars).
            examples:
              - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
        - description: Mode.
          in: query
          name: livemode
          required: true
          schema:
            description: Mode.
            enum:
              - "true"
              - "false"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementContext"
          description: Account, fee schedule and active destinations for one mode.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Account, fee schedule and active destinations for one mode.
      tags:
        - identity
      x-nearpay:
        auth:
          - service:identity.context.read
        idempotent: false
        service: identity
        stage: 1
  /internal/authz:
    get:
      description: Reads Authorization, X-NearPay-Client-Secret, Cookie, X-CSRF-Token, NearPay-Mode and X-Forwarded-Method/Uri/For. 200 sets X-NearPay-Token and X-Request-Id; 401/403/429 bodies are the public error envelope.
      operationId: authorize
      responses:
        "200":
          description: "Traefik ForwardAuth: authenticate, rate-limit, mint the request token."
          headers:
            x-nearpay-token:
              description: Internal JWT (60 s).
              required: true
              schema:
                description: Internal JWT (60 s).
                type: string
            x-request-id:
              description: Request id.
              required: true
              schema:
                description: Request id.
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - {}
      summary: "Traefik ForwardAuth: authenticate, rate-limit, mint the request token."
      tags:
        - identity
      x-nearpay:
        auth:
          - gateway
        idempotent: false
        service: identity
        stage: 1
  /internal/jwks:
    get:
      operationId: getJwks
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jwks"
          description: Public keys of internal JWTs (cache 5 min; refetch on unknown kid).
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Public keys of internal JWTs (cache 5 min; refetch on unknown kid).
      tags:
        - identity
      x-nearpay:
        auth:
          - internal
        idempotent: false
        service: identity
        stage: 1
  /internal/ops_operators/{id}:
    get:
