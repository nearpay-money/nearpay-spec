components:
  schemas:
    Error:
      additionalProperties: {}
      description: Envelope returned with every non-2xx response.
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
      required:
        - error
      type: object
    ErrorBody:
      additionalProperties: {}
      description: Details of a failed request.
      properties:
        code:
          description: Machine-readable error code from the error catalogue.
          type: string
          x-extensible-enum:
            - invalid_request
            - resource_missing
            - authentication_required
            - invalid_api_key
            - permission_denied
            - csrf_token_invalid
            - ip_not_allowed
            - account_suspended
            - step_up_required
            - rate_limited
            - idempotency_key_reused
            - idempotency_in_progress
            - api_error
            - state_conflict
            - livemode_forbidden
            - link_expired
            - link_used
            - webauthn_failed
            - invalid_client
            - turnstile_failed
            - invalid_setting
            - scope_unknown
            - address_invalid
            - asset_unsupported
            - memo_destination_unsupported
            - destination_in_use
            - recovery_lock
            - screening_blocked
            - attestation_invalid
            - challenge_expired
            - destination_not_active
            - account_not_live
            - amount_below_destination_minimum
            - amount_above_unverified_cap
            - currency_unsupported
            - allowed_origins_required
            - attempt_in_flight
            - client_secret_invalid
            - session_not_open
            - too_many_attempts
            - route_too_slow
            - refund_address_invalid
            - geo_blocked
            - intent_invalid
            - insufficient_balance
            - rail_unavailable
            - route_unavailable
            - pricing_unavailable
            - deadline_too_short
            - quote_rejected
            - quote_integrity_failed
            - ticket_invalid
            - attestation_refused
            - attestation_stale
            - attestation_unavailable
            - destination_not_intents_account
            - amount_below_minimum
            - screening_unavailable
            - url_invalid
            - event_type_unknown
            - last_owner
            - member_exists
            - invitation_invalid
            - approver_conflict
            - two_person_required
            - authenticator_not_allowed
            - kyb_profile_incomplete
            - intent_not_succeeded
            - attempt_not_settled
            - amount_exceeds_refundable
            - leg_expired
            - signed_intent_mismatch
            - review_requires_evidence
            - link_inactive
            - customer_deleted
            - reconciliation_day_open
            - fx_rate_unavailable
            - currency_mismatch
            - interval_mismatch
            - price_inactive
            - price_type_invalid
            - tax_rate_inactive
            - tax_rates_mixed
            - invoice_empty
            - customer_email_missing
            - invoice_secret_invalid
            - invoice_not_payable
            - auto_debit_unavailable
            - vault_cap_exceeded
        doc_url:
          description: Documentation page for this error code.
          format: uri
          type: string
        message:
          description: Human-readable message; safe to show to developers, not to payers.
          type: string
        param:
          description: The request parameter the error relates to, when there is one.
          type: string
        request_id:
          description: Request id, also returned in the `X-Request-Id` header.
          examples:
            - req_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^req_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        type:
          description: Error category; decides whether a retry can help.
          type: string
          x-extensible-enum:
            - invalid_request_error
            - authentication_error
            - permission_error
            - payment_error
            - idempotency_error
            - state_conflict
            - rate_limit_error
            - api_error
            - rail_unavailable
      required:
        - type
        - code
        - message
        - doc_url
        - request_id
      type: object
    InvoiceNotificationContext:
      additionalProperties: {}
      description: Data for the billing invoice emails (PII; never in events).
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        amount_due:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Amount due.
        amount_remaining:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Amount still to pay.
        asset_id:
          anyOf:
            - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            - type: "null"
          description: Pricing asset when `currency` is `asset`.
        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: ISO 4217 code for fiat pricing, or `asset` when priced in an asset (then `asset_id` is set).
        customer:
          description: customer id (`cus_` + 26 base32 chars).
          examples:
            - cus_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cus_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        customer_email:
          anyOf:
            - format: email
              pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              type: string
            - type: "null"
          description: "Recipient: the customer's email from payments; null = no mail."
        customer_name:
          description: Customer name, if known.
          type:
            - string
            - "null"
        destination_fingerprint:
          description: Fingerprint of the settlement destination the invoice pays to, for the mail's verification line; null when none (spec 0.3.1).
          type:
            - string
            - "null"
        due_date:
          anyOf:
            - description: RFC 3339 UTC timestamp, e.g. `2026-11-05T10:00:00.000Z`.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            - type: "null"
          description: Due date.
        hosted_invoice_url:
          anyOf:
            - description: Absolute URL.
              format: uri
              maxLength: 2048
              type: string
            - type: "null"
          description: "Hosted invoice page including the invoice secret in the fragment (PII-grade: never logged, never in events); null when void."
        invoice:
          description: invoice id (`in_` + 26 base32 chars).
          examples:
            - in_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^in_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        line_count:
          description: Number of invoice lines (`lines` holds at most the first 20; spec 0.3.1).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        lines:
          description: Lines for the mail body (at most 20).
          items:
            additionalProperties: {}
            description: A line (the first 20).
            properties:
              amount:
                anyOf:
                  - description: Fiat amount in minor units (e.g. cents), integer.
                    maximum: 9007199254740991
                    minimum: 0
                    type: integer
                  - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
                    pattern: ^(0|[1-9][0-9]{0,77})$
                    type: string
                description: Line amount.
              description:
                description: Line text.
                type: string
              quantity:
                description: Quantity.
                maximum: 9007199254740991
                minimum: 1
                type: integer
            required:
              - description
              - quantity
              - amount
            type: object
          maxItems: 20
          type: array
        livemode:
          description: Mode (test-mode mails say so).
          type: boolean
        merchant_display_name:
          description: Merchant name (account display name, or the ops-approved legal name).
          type: string
        number:
          description: Invoice number.
          type: string
        payment_intent:
          anyOf:
            - description: payment_intent id (`pi_` + 26 base32 chars).
              examples:
                - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: "Intent that paid the invoice (`invoice.paid`: notify reads its receipt context for evidence links)."
        period_end:
          anyOf:
            - description: RFC 3339 UTC timestamp, e.g. `2026-11-05T10:00:00.000Z`.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            - type: "null"
          description: Billed subscription period end (exclusive).
        period_start:
          anyOf:
            - description: RFC 3339 UTC timestamp, e.g. `2026-11-05T10:00:00.000Z`.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            - type: "null"
          description: Billed subscription period start.
        pricing_asset:
          anyOf:
            - $ref: "#/components/schemas/PricingAssetDisplay"
            - type: "null"
          description: Display data of the pricing asset; null for fiat.
        reminder:
          anyOf:
            - additionalProperties: {}
              properties:
                last:
                  description: The last reminder of the schedule.
                  type: boolean
                number:
                  description: 1-based reminder number.
                  maximum: 9007199254740991
                  minimum: 1
                  type: integer
                offset_days:
                  description: Days relative to the due date (negative = before).
                  maximum: 9007199254740991
                  minimum: -9007199254740991
                  type: integer
              required:
                - number
                - offset_days
                - last
              type: object
            - type: "null"
          description: Set when the context is read for an `evt.billing.invoice.reminder` (`?reminder=<n>`).
        status:
          description: "Invoice status (domain-model §4.5): `uncollectible` invoices can still be paid (INV-3)."
          type: string
          x-extensible-enum:
            - draft
            - open
            - paid
            - void
            - uncollectible
        subscription:
          anyOf:
            - description: subscription id (`sub_` + 26 base32 chars).
              examples:
                - sub_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^sub_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Subscription of the invoice.
        subtotal:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Sum of the lines before tax (spec 0.3.1).
        tax:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Tax total (spec 0.3.1).
        total:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Invoice total.
      required:
        - account_id
        - livemode
        - merchant_display_name
        - customer
        - customer_email
        - customer_name
        - invoice
        - number
        - status
        - currency
        - asset_id
        - pricing_asset
        - total
        - amount_due
        - amount_remaining
        - due_date
        - period_start
        - period_end
        - subscription
        - lines
        - hosted_invoice_url
        - payment_intent
        - reminder
      type: object
    MandateNotificationContext:
      additionalProperties: {}
      description: Data for the payer's mandate emails (PII; never in events).
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        amount_per_period:
          description: Tokens per period.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        balance:
          description: Remaining balance.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        cancel_transaction:
          anyOf:
            - $ref: "#/components/schemas/NearTransactionRequest"
            - type: "null"
          description: The payer's `cancel` transaction (contract, method, args, 100 Tgas, 1 yoctoNEAR) while on-chain active; null otherwise.
        customer:
          description: customer id (`cus_` + 26 base32 chars).
          examples:
            - cus_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cus_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        customer_email:
          anyOf:
            - format: email
              pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              type: string
            - type: "null"
          description: "Recipient: the customer's email from payments; null = no mail."
        customer_name:
          description: Customer name, if known.
          type:
            - string
            - "null"
        invoice:
          anyOf:
            - description: invoice id (`in_` + 26 base32 chars).
              examples:
                - in_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^in_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: "`mandate.insufficient_funds`: the invoice that fell back to `send_invoice` (it is emailed separately)."
        link_status:
          description: "`linked`: billing collects this mandate for its subscription. `unlinked`: the on-chain terms do not match what billing prepared; billing never collects it and the payer is asked to cancel it."
          type: string
          x-extensible-enum:
            - linked
            - unlinked
        livemode:
          description: Mode (test-mode mails say so).
          type: boolean
        manage_url:
          anyOf:
            - description: Absolute URL.
              format: uri
              maxLength: 2048
              type: string
            - type: "null"
          description: "Hosted invoice page of the subscription's latest invoice (with its secret) where the payer can top up, cancel or withdraw; null when none. PII-grade: never logged, never in events."
        mandate:
          description: mandate id (`md_` + 26 base32 chars).
          examples:
            - md_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^md_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        merchant_display_name:
          description: Merchant name (account display name, or the ops-approved legal name).
          type: string
        next_collect_at:
          anyOf:
            - description: RFC 3339 UTC timestamp, e.g. `2026-11-05T10:00:00.000Z`.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            - type: "null"
          description: Next due time; null when none.
        onchain_id:
          description: Vault mandate id (shown so the payer can cancel from any wallet).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        payer:
          description: Payer's NEAR account (the mail shows it shortened).
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        recurring:
          anyOf:
            - $ref: "#/components/schemas/PriceRecurring"
            - type: "null"
          description: Billing period of the subscription; null if it no longer exists.
        refunded:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: "`mandate.canceled`: amount returned to the payer by the cancel."
        status:
          description: "Mandate status (domain-model §4.5): `active` = on-chain active with at least one period funded; `insufficient` = on-chain active but the balance is below one period (top up, or the due invoice falls back to `send_invoice`); `exhausted` = `max_periods` collected; `canceled` = canceled by the payer or the merchant receiver."
          type: string
          x-extensible-enum:
            - active
            - insufficient
            - exhausted
            - canceled
        subscription:
          description: subscription id (`sub_` + 26 base32 chars).
          examples:
            - sub_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sub_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        token_asset:
          $ref: "#/components/schemas/PricingAssetDisplay"
          description: Display data of the mandate's token (symbol, decimals).
        unlinked_reason:
          anyOf:
            - description: "Why a mandate is `unlinked` (billing §6 linkage rule): the subscription is not `auto_debit` or has ended, another mandate is already linked, or a term differs from the prepared one (receiver kind, receiver = an active Intents-account destination of the account, token, amount per period, period, fee, `start_at` after the current period end, `max_periods` below the remaining periods), or a test-vault mandate names a live subscription (or the reverse)."
              type: string
              x-extensible-enum:
                - subscription_not_auto_debit
                - subscription_ended
                - already_linked
                - receiver_kind_mismatch
                - receiver_not_destination
                - token_mismatch
                - amount_mismatch
                - period_mismatch
                - fee_mismatch
                - start_too_late
                - max_periods_too_low
                - mode_mismatch
            - type: "null"
          description: Why it is unlinked (the mail asks the payer to cancel).
        vault_contract:
          description: Vault account.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        withdraw_transaction:
          anyOf:
            - $ref: "#/components/schemas/NearTransactionRequest"
            - type: "null"
          description: The payer's `withdraw` transaction when a balance remains after cancel/exhaustion; null otherwise.
      required:
        - account_id
        - livemode
        - merchant_display_name
        - customer
        - customer_email
        - customer_name
        - mandate
        - subscription
        - status
        - link_status
        - unlinked_reason
        - payer
        - vault_contract
        - onchain_id
        - token_asset
        - amount_per_period
        - recurring
        - balance
        - next_collect_at
        - refunded
        - cancel_transaction
        - withdraw_transaction
        - invoice
        - manage_url
      type: object
    NearFunctionCallAction:
      additionalProperties: {}
      description: A NEAR function-call action to sign as is.
      properties:
        args:
          additionalProperties: {}
          description: JSON arguments, exactly as they must be sent.
          propertyNames:
            type: string
          type: object
        deposit:
          description: Attached deposit in yoctoNEAR as a decimal string.
          pattern: ^(0|[1-9][0-9]{0,38})$
          type: string
        gas:
          description: Gas in gas units as a decimal string (1 Tgas = 10^12).
          pattern: ^[1-9][0-9]{0,17}$
          type: string
        method_name:
          description: Contract method.
          maxLength: 256
          minLength: 1
          type: string
        type:
          const: FunctionCall
          description: Always `FunctionCall`.
          type: string
      required:
        - type
        - method_name
        - args
        - gas
        - deposit
      type: object
    NearTransactionRequest:
      additionalProperties: {}
      description: A NEAR transaction for a wallet to sign (snake_case; NEAR Connect / wallet-selector take the same fields in camelCase). Clients show a summary and never edit receiver, method, args, gas or deposit.
      properties:
        actions:
          description: Actions, in order.
          items:
            $ref: "#/components/schemas/NearFunctionCallAction"
          maxItems: 4
          minItems: 1
          type: array
        receiver_id:
          description: Contract the transaction calls.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        signer_id:
          anyOf:
            - description: NEAR account id (named, implicit or eth-implicit), 2–64 chars.
              pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
              type: string
            - type: "null"
          description: Account that must sign; null = the connected wallet's account (it becomes the payer).
      required:
        - signer_id
        - receiver_id
        - actions
      type: object
    PriceRecurring:
      additionalProperties: {}
      description: How often a recurring price bills.
      properties:
        interval:
          description: Unit of a billing period.
          type: string
          x-extensible-enum:
            - day
            - week
            - month
            - year
        interval_count:
          description: Number of `interval` units per period, 1–12.
          maximum: 12
          minimum: 1
          type: integer
      required:
        - interval
        - interval_count
      type: object
    PricingAssetDisplay:
      additionalProperties: {}
      description: Display data of a pricing asset (rails registry).
      properties:
        asset_id:
          description: Pricing asset.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        decimals:
          description: Token decimals (format `amount` with them).
          maximum: 255
          minimum: 0
          type: integer
        symbol:
          description: Token symbol.
          maxLength: 32
          minLength: 1
          type: string
      required:
        - asset_id
        - symbol
        - decimals
      type: object
    SubscriptionNotificationContext:
      additionalProperties: {}
      description: Data for the renewal-upcoming email (PII; never in events).
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        asset_id:
          anyOf:
            - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            - type: "null"
          description: Pricing asset when `currency` is `asset`.
        cancel_at_period_end:
          description: The subscription ends instead of renewing (no mail is sent then).
          type: boolean
        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: ISO 4217 code for fiat pricing, or `asset` when priced in an asset (then `asset_id` is set).
        customer:
          description: customer id (`cus_` + 26 base32 chars).
          examples:
            - cus_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cus_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        customer_email:
          anyOf:
            - format: email
              pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              type: string
            - type: "null"
          description: "Recipient: the customer's email from payments; null = no mail."
        customer_name:
          description: Customer name, if known.
          type:
            - string
            - "null"
        items:
          description: Items of the next renewal.
          items:
            additionalProperties: {}
            description: An item.
            properties:
              description:
                description: Product name.
                type: string
              quantity:
                description: Quantity.
                maximum: 9007199254740991
                minimum: 1
                type: integer
            required:
              - description
              - quantity
            type: object
          type: array
        livemode:
          description: Mode (test-mode mails say so).
          type: boolean
        merchant_display_name:
          description: Merchant name (account display name, or the ops-approved legal name).
          type: string
        next_amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Total of the next renewal invoice with current items and tax rates.
        pricing_asset:
          anyOf:
            - $ref: "#/components/schemas/PricingAssetDisplay"
            - type: "null"
          description: Display data of the pricing asset; null for fiat.
        recurring:
          $ref: "#/components/schemas/PriceRecurring"
          description: Billing period.
        renews_at:
          description: When the next renewal invoice is created (`current_period_end`).
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        status:
          description: Subscription status.
          type: string
        subscription:
          description: subscription id (`sub_` + 26 base32 chars).
          examples:
            - sub_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sub_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
      required:
        - account_id
        - livemode
        - merchant_display_name
        - customer
        - customer_email
        - customer_name
        - subscription
        - status
        - renews_at
        - recurring
        - currency
        - asset_id
        - pricing_asset
        - next_amount
        - items
        - cancel_at_period_end
      type: object
  securitySchemes:
    internalToken:
      description: "Internal Ed25519 JWT: request token or service token."
      in: header
      name: X-NearPay-Token
      type: apiKey
    serviceClient:
      description: Service client credentials (`client_id` + secret file).
      scheme: basic
      type: http
info:
  description: NearPay internal service API. Generated from `nearpay-spec`; do not edit by hand.
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  title: nearpay-billing internal API
  version: 0.3.1
openapi: 3.1.0
paths:
  /internal/invoices/{id}/notification-context:
    get:
      description: "notify calls it for `evt.billing.invoice.sent` (`invoice.issued`), `.reminder` (`invoice.reminder`, with `?reminder=`), `.paid` (`invoice.paid`) and `.voided` (`invoice.voided`). `customer_email: null` → no mail. notify sends nothing when the context's `livemode` differs from the event's, or when the status no longer fits the mail (e.g. a reminder for an invoice that is paid by now)."
      operationId: getInvoiceNotificationContext
      parameters:
        - description: invoice id (`in_` + 26 base32 chars).
          in: path
          name: id
          required: true
          schema:
            description: invoice id (`in_` + 26 base32 chars).
            examples:
              - in_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^in_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
        - description: Reminder number of the event being mailed.
          in: query
          name: reminder
          schema:
            description: Reminder number of the event being mailed.
            maximum: 10
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceNotificationContext"
          description: Data for the invoice emails (PII and the hosted link; never in events).
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Data for the invoice emails (PII and the hosted link; never in events).
      tags:
        - billing
      x-nearpay:
        auth:
          - service:billing.read
        idempotent: false
        service: billing
        stage: 3
  /internal/mandates/{id}/notification-context:
    get:
      description: "notify calls it for `evt.billing.mandate.activated` (`mandate.activated`), `.insufficient_funds` (`mandate.insufficient_funds`), `.canceled` (`mandate.canceled`), `.unlinked` (`mandate.unlinked`) and `.released` (`mandate.released`). `customer_email: null` → no mail; nothing is sent when the context's `livemode` differs from the event's."
      operationId: getMandateNotificationContext
      parameters:
        - description: mandate id (`md_` + 26 base32 chars).
          in: path
          name: id
          required: true
          schema:
            description: mandate id (`md_` + 26 base32 chars).
            examples:
              - md_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^md_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MandateNotificationContext"
          description: Data for the mandate emails to the payer (PII and the hosted link; never in events).
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Data for the mandate emails to the payer (PII and the hosted link; never in events).
      tags:
        - billing
      x-nearpay:
        auth:
          - service:billing.read
        idempotent: false
        service: billing
        stage: 4
  /internal/subscriptions/{id}/notification-context:
    get:
      description: notify calls it for `evt.billing.subscription.renewal_upcoming` (`subscription.renewal_upcoming`).
      operationId: getSubscriptionNotificationContext
      parameters:
        - description: subscription id (`sub_` + 26 base32 chars).
          in: path
          name: id
          required: true
          schema:
            description: subscription id (`sub_` + 26 base32 chars).
            examples:
              - sub_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^sub_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionNotificationContext"
          description: Data for the renewal-upcoming email (PII; never in events).
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Data for the renewal-upcoming email (PII; never in events).
      tags:
        - billing
      x-nearpay:
        auth:
          - service:billing.read
        idempotent: false
        service: billing
        stage: 3
