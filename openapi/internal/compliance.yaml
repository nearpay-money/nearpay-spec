components:
  schemas:
    BlocklistEntry:
      additionalProperties: {}
      description: A NearPay blocklist entry (screened like a sanctions hit).
      properties:
        chain:
          anyOf:
            - description: CAIP-2 chain id, e.g. `eip155:8453` or `near:mainnet`.
              examples:
                - eip155:8453
              pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
              type: string
            - type: "null"
          description: Chain of an address; null = every chain family the address form fits.
        created:
          description: Added.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        created_by:
          description: Operator (`usr_…`) or CLI actor.
          type: string
        id:
          description: blocklist_entry id (`bl_` + 26 base32 chars).
          examples:
            - bl_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^bl_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        object:
          const: blocklist_entry
          description: Always `blocklist_entry`.
          type: string
        reason:
          description: Why (internal).
          type: string
        subject:
          description: Normalised address or NEAR account.
          type: string
        subject_type:
          description: What is blocked.
          type: string
          x-extensible-enum:
            - address
            - near_account
      required:
        - id
        - object
        - subject_type
        - chain
        - subject
        - reason
        - created_by
        - created
      type: object
    BlocklistEntryList:
      additionalProperties: {}
      description: A page of blocklist entries.
      properties:
        data:
          description: Objects on this page.
          items:
            $ref: "#/components/schemas/BlocklistEntry"
          type: array
        has_more:
          description: Whether more objects exist after this page.
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          description: Path of this list endpoint.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    BusinessAddress:
      additionalProperties: {}
      description: Registered business address.
      properties:
        city:
          description: City.
          maxLength: 100
          minLength: 1
          type: string
        country:
          description: Country of the address.
          pattern: ^[A-Z]{2}$
          type: string
        line1:
          description: Street and number.
          maxLength: 200
          minLength: 1
          type: string
        line2:
          anyOf:
            - maxLength: 200
              type: string
            - type: "null"
          description: Additional address line.
        postal_code:
          anyOf:
            - maxLength: 20
              type: string
            - type: "null"
          description: Postal code (if the country uses one).
        region:
          anyOf:
            - maxLength: 100
              type: string
            - type: "null"
          description: State, province or region.
      required:
        - line1
        - line2
        - city
        - postal_code
        - region
        - country
      type: object
    ComplianceCase:
      additionalProperties: {}
      description: A compliance case (screening hit, held execution, audit finding, …).
      properties:
        account_display_name:
          description: Display name of `account_id` (kept current from `evt.identity.account.*`); null for platform cases or when unknown (spec 0.2.1).
          type:
            - string
            - "null"
        account_id:
          anyOf:
            - description: account id (`acct_` + 26 base32 chars).
              examples:
                - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Account concerned, if any.
        assignee:
          anyOf:
            - description: user id (`usr_` + 26 base32 chars).
              examples:
                - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Operator working on the case.
        closed_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Closed.
        created:
          description: Opened.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        events:
          description: Timeline, oldest first; present on retrieve and on write responses, absent in lists.
          items:
            additionalProperties: {}
            properties:
              action:
                description: What happened.
                type: string
                x-extensible-enum:
                  - opened
                  - assigned
                  - unassigned
                  - commented
                  - closed
              actor:
                description: "`usr_…` (operator), `cli:<actor>` or `system`."
                type: string
              at:
                description: When.
                maximum: 9007199254740991
                minimum: 0
                type: integer
              note:
                description: Comment or resolution note.
                type:
                  - string
                  - "null"
            required:
              - actor
              - action
              - note
              - at
            type: object
          type: array
        id:
          description: compliance_case id (`case_` + 26 base32 chars).
          examples:
            - case_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^case_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        kind:
          description: Why the case was opened.
          type: string
          x-extensible-enum:
            - screening_hit
            - post_screen_hit
            - held_execution
            - audit_mismatch
            - merchant_report
            - reconciliation_diff
        livemode:
          description: Mode.
          type: boolean
        object:
          const: compliance_case
          description: Always `compliance_case`.
          type: string
        resolution:
          anyOf:
            - description: How the case was resolved.
              type: string
              x-extensible-enum:
                - no_action
                - false_positive
                - merchant_contacted
                - destination_blocked
                - account_suspended
                - other
            - type: "null"
        review:
          description: Whether the merchant sees it as a review (`review.opened` was emitted).
          type: boolean
        severity:
          description: Severity.
          type: string
          x-extensible-enum:
            - low
            - medium
            - high
            - critical
        status:
          description: Case status.
          type: string
          x-extensible-enum:
            - open
            - investigating
            - closed
        subject:
          additionalProperties: {}
          description: What the case is about.
          properties:
            id:
              description: Object id or address.
              type: string
            type:
              description: Object type, e.g. `execution`, `settlement_destination`, `address`.
              type: string
          required:
            - type
            - id
          type: object
      required:
        - id
        - object
        - account_id
        - livemode
        - kind
        - subject
        - severity
        - status
        - assignee
        - resolution
        - review
        - created
        - closed_at
      type: object
    ComplianceCaseList:
      additionalProperties: {}
      description: A page of compliance cases.
      properties:
        data:
          description: Objects on this page.
          items:
            $ref: "#/components/schemas/ComplianceCase"
          type: array
        has_more:
          description: Whether more objects exist after this page.
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          description: Path of this list endpoint.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    Error:
      additionalProperties: {}
      description: Envelope returned with every non-2xx response.
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
      required:
        - error
      type: object
    ErrorBody:
      additionalProperties: {}
      description: Details of a failed request.
      properties:
        code:
          description: Machine-readable error code from the error catalogue.
          type: string
          x-extensible-enum:
            - invalid_request
            - resource_missing
            - authentication_required
            - invalid_api_key
            - permission_denied
            - csrf_token_invalid
            - ip_not_allowed
            - account_suspended
            - step_up_required
            - rate_limited
            - idempotency_key_reused
            - idempotency_in_progress
            - api_error
            - state_conflict
            - livemode_forbidden
            - link_expired
            - link_used
            - webauthn_failed
            - invalid_client
            - turnstile_failed
            - invalid_setting
            - scope_unknown
            - address_invalid
            - asset_unsupported
            - memo_destination_unsupported
            - destination_in_use
            - recovery_lock
            - screening_blocked
            - attestation_invalid
            - challenge_expired
            - destination_not_active
            - account_not_live
            - amount_below_destination_minimum
            - amount_above_unverified_cap
            - currency_unsupported
            - allowed_origins_required
            - attempt_in_flight
            - client_secret_invalid
            - session_not_open
            - too_many_attempts
            - route_too_slow
            - refund_address_invalid
            - geo_blocked
            - intent_invalid
            - insufficient_balance
            - rail_unavailable
            - route_unavailable
            - pricing_unavailable
            - deadline_too_short
            - quote_rejected
            - quote_integrity_failed
            - ticket_invalid
            - attestation_refused
            - attestation_stale
            - attestation_unavailable
            - destination_not_intents_account
            - amount_below_minimum
            - screening_unavailable
            - url_invalid
            - event_type_unknown
            - last_owner
            - member_exists
            - invitation_invalid
            - approver_conflict
            - two_person_required
            - authenticator_not_allowed
            - kyb_profile_incomplete
            - intent_not_succeeded
            - attempt_not_settled
            - amount_exceeds_refundable
            - leg_expired
            - signed_intent_mismatch
            - review_requires_evidence
            - link_inactive
            - customer_deleted
            - reconciliation_day_open
            - fx_rate_unavailable
            - currency_mismatch
            - interval_mismatch
            - price_inactive
            - price_type_invalid
            - tax_rate_inactive
            - tax_rates_mixed
            - invoice_empty
            - customer_email_missing
            - invoice_secret_invalid
            - invoice_not_payable
            - auto_debit_unavailable
            - vault_cap_exceeded
            - google_signin_disabled
            - google_already_linked
            - passkey_required
            - reauthentication_required
        doc_url:
          description: Documentation page for this error code.
          format: uri
          type: string
        message:
          description: Human-readable message; safe to show to developers, not to payers.
          type: string
        param:
          description: The request parameter the error relates to, when there is one.
          type: string
        request_id:
          description: Request id, also returned in the `X-Request-Id` header.
          examples:
            - req_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^req_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        type:
          description: Error category; decides whether a retry can help.
          type: string
          x-extensible-enum:
            - invalid_request_error
            - authentication_error
            - permission_error
            - payment_error
            - idempotency_error
            - state_conflict
            - rate_limit_error
            - api_error
            - rail_unavailable
      required:
        - type
        - code
        - message
        - doc_url
        - request_id
      type: object
    GeoPolicy:
      additionalProperties: {}
      description: Payer geo policy.
      properties:
        blocked_countries:
          description: Blocked countries.
          items:
            description: ISO 3166-1 alpha-2 country code, upper-case.
            pattern: ^[A-Z]{2}$
            type: string
          type: array
        blocked_regions:
          description: Blocked ISO 3166-2 regions.
          items:
            type: string
          type: array
        version:
          description: Policy version.
          type: string
      required:
        - blocked_countries
        - blocked_regions
        - version
      type: object
    InternalKybCase:
      additionalProperties: {}
      description: A KYB case with its declared details (identity reads it).
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        decided_at:
          anyOf:
            - description: RFC 3339 UTC timestamp, e.g. `2026-11-05T10:00:00.000Z`.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            - type: "null"
          description: Last decision.
        profile:
          $ref: "#/components/schemas/KybProfile"
        status:
          description: KYB case status.
          type: string
          x-extensible-enum:
            - not_started
            - pending
            - needs_info
            - approved
            - rejected
      required:
        - account_id
        - status
        - profile
        - decided_at
      type: object
    KybDecision:
      additionalProperties: {}
      description: Recorded KYB decision.
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        decided_at:
          description: Decision time.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        status:
          description: KYB case status.
          type: string
          x-extensible-enum:
            - not_started
            - pending
            - needs_info
            - approved
            - rejected
      required:
        - account_id
        - status
        - decided_at
      type: object
    KybProfile:
      additionalProperties: {}
      description: Self-declared minimum business details (KYB).
      properties:
        business_address:
          anyOf:
            - $ref: "#/components/schemas/BusinessAddress"
            - type: "null"
          description: Registered address.
        business_type:
          anyOf:
            - description: Legal form of the business.
              type: string
              x-extensible-enum:
                - sole_proprietorship
                - partnership
                - company
                - non_profit
                - other
            - type: "null"
        country_of_incorporation:
          anyOf:
            - description: ISO 3166-1 alpha-2 country code, upper-case.
              pattern: ^[A-Z]{2}$
              type: string
            - type: "null"
          description: Country where the business is registered.
        expected_monthly_volume:
          anyOf:
            - description: Expected monthly payment volume in USD.
              type: string
              x-extensible-enum:
                - under_10k
                - 10k_to_100k
                - 100k_to_1m
                - over_1m
            - type: "null"
        legal_name:
          description: Registered legal name (or the owner's full name for a sole proprietor).
          type:
            - string
            - "null"
        registration_number:
          description: "Company or trade register number, or a tax id. Optional: may stay null at submission (ADR-0024)."
          type:
            - string
            - "null"
        representative:
          anyOf:
            - additionalProperties: {}
              properties:
                name:
                  description: Full name of the person declaring the details.
                  type: string
                title:
                  description: Their role, e.g. `Director`, `Founder`.
                  type: string
              required:
                - name
                - title
              type: object
            - type: "null"
          description: Who declares the details on behalf of the business.
        website:
          anyOf:
            - description: Absolute URL.
              format: uri
              maxLength: 2048
              type: string
            - type: "null"
          description: Public website or store front, if any.
      required:
        - legal_name
        - country_of_incorporation
        - registration_number
        - business_type
        - website
        - business_address
        - representative
        - expected_monthly_volume
      type: object
    MerchantSuspension:
      additionalProperties: {}
      description: Suspension state of a merchant account.
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        actor:
          description: Who made the last change (`usr_…` pair `a+b`, or a CLI actor).
          type:
            - string
            - "null"
        object:
          const: merchant_suspension
          description: Always `merchant_suspension`.
          type: string
        pending_request:
          anyOf:
            - $ref: "#/components/schemas/OpsApproval"
            - type: "null"
          description: Suspend/reinstate request waiting for a second operator.
        reason:
          description: Reason of the last change (internal).
          type:
            - string
            - "null"
        suspended:
          description: "Whether the account is suspended (identity sets `status: suspended`)."
          type: boolean
        updated_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Last change.
      required:
        - object
        - account_id
        - suspended
        - reason
        - actor
        - updated_at
        - pending_request
      type: object
    OpsApproval:
      additionalProperties: {}
      description: A console action waiting for (or decided by) a second operator.
      properties:
        action:
          description: Action that needs a second approver.
          type: string
          x-extensible-enum:
            - account.suspend
            - account.reinstate
            - kill_switch.release
        decided_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When it was decided.
        decided_by:
          anyOf:
            - additionalProperties: {}
              properties:
                id:
                  description: user id (`usr_` + 26 base32 chars).
                  examples:
                    - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
                  pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                  type: string
                role:
                  description: Role of a console operator.
                  enum:
                    - ops
                    - ops_admin
                  type: string
              required:
                - id
                - role
              type: object
            - type: "null"
          description: Approving or rejecting operator.
        decision_note:
          description: Note of the deciding operator.
          type:
            - string
            - "null"
        expires_at:
          description: A pending request expires at this time.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        id:
          description: ops_approval id (`opa_` + 26 base32 chars).
          examples:
            - opa_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^opa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        object:
          const: ops_approval
          description: Always `ops_approval`.
          type: string
        reason:
          description: Requester's reason (audited; never shown to merchants).
          type: string
        requested_at:
          description: When it was requested.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        requested_by:
          additionalProperties: {}
          description: Requesting operator.
          properties:
            id:
              description: user id (`usr_` + 26 base32 chars).
              examples:
                - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            role:
              description: Role of a console operator.
              enum:
                - ops
                - ops_admin
              type: string
          required:
            - id
            - role
          type: object
        status:
          description: "`approved` means the action was executed in the same transaction."
          type: string
          x-extensible-enum:
            - pending
            - approved
            - rejected
            - expired
        target:
          additionalProperties: {}
          description: What the action applies to.
          properties:
            id:
              description: "`acct_…` or `ks_…`."
              type: string
            type:
              description: Target type.
              type: string
              x-extensible-enum:
                - account
                - kill_switch
          required:
            - type
            - id
          type: object
      required:
        - id
        - object
        - action
        - target
        - reason
        - status
        - requested_by
        - requested_at
        - decided_by
        - decided_at
        - decision_note
        - expires_at
      type: object
    OpsKybCase:
      additionalProperties: {}
      description: A KYB case with its self-declared details and decision history.
      properties:
        account_display_name:
          description: Account display name (from identity, cached).
          type: string
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        created:
          description: Case created.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        decided_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Last decision.
        decided_by:
          description: Operator (`usr_…`) or CLI actor of the last decision.
          type:
            - string
            - "null"
        decision_reason:
          description: Internal reason of the last decision (never shown to merchants).
          type:
            - string
            - "null"
        declared_by:
          anyOf:
            - description: user id (`usr_` + 26 base32 chars).
              examples:
                - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Owner who submitted the declaration.
        history:
          description: Transitions, oldest first.
          items:
            additionalProperties: {}
            properties:
              actor:
                description: "`usr_…` (owner or operator), `cli:<actor>` or `system`."
                type: string
              at:
                description: When.
                maximum: 9007199254740991
                minimum: 0
                type: integer
              reason:
                description: Reason or note.
                type:
                  - string
                  - "null"
              status:
                description: KYB case status.
                type: string
                x-extensible-enum:
                  - not_started
                  - pending
                  - needs_info
                  - approved
                  - rejected
            required:
              - status
              - actor
              - reason
              - at
            type: object
          type: array
        object:
          const: ops_kyb_case
          description: Always `ops_kyb_case`.
          type: string
        profile:
          $ref: "#/components/schemas/KybProfile"
        requested_info:
          description: What was asked of the merchant (`needs_info`).
          type:
            - string
            - "null"
        status:
          description: KYB case status.
          type: string
          x-extensible-enum:
            - not_started
            - pending
            - needs_info
            - approved
            - rejected
        submitted_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Last submission.
      required:
        - object
        - account_id
        - account_display_name
        - status
        - profile
        - declared_by
        - requested_info
        - decision_reason
        - decided_by
        - created
        - submitted_at
        - decided_at
        - history
      type: object
    OpsKybCaseList:
      additionalProperties: {}
      description: A page of KYB cases.
      properties:
        data:
          description: Objects on this page.
          items:
            $ref: "#/components/schemas/OpsKybCase"
          type: array
        has_more:
          description: Whether more objects exist after this page.
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          description: Path of this list endpoint.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    RescreenQueued:
      additionalProperties: {}
      description: A queued re-screening job.
      properties:
        destinations:
          description: Destinations queued.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        job_id:
          description: job id (`job_` + 26 base32 chars).
          examples:
            - job_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^job_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
      required:
        - job_id
        - destinations
      type: object
    Screening:
      additionalProperties: {}
      description: A screening decision.
      properties:
        cached:
          description: Served from cache.
          type: boolean
        decision:
          description: Screening decision.
          type: string
          x-extensible-enum:
            - allow
            - block
            - review
        post_screen_required:
          description: Screen again after settlement (vendor was unavailable).
          type: boolean
        provider:
          description: "Which provider decided: `local` (OFAC digital-currency list + NearPay blocklist; the only live provider in v1) or `sandbox` (test-mode magic rule). Absent from Stage 1 servers."
