            - sandbox
        reasons:
          description: Reasons (`sanctions`, `blocklist`, `vendor_unavailable`, …).
          items:
            type: string
          type: array
        risk:
          description: Provider risk level; null for the v1 `local` provider (list hits only).
          type:
            - string
            - "null"
        screening_id:
          description: screening id (`scr_` + 26 base32 chars).
          examples:
            - scr_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^scr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
      required:
        - screening_id
        - decision
        - risk
        - reasons
        - cached
        - post_screen_required
      type: object
