          - ops:compliance.accounts.write
        idempotent: true
        ops_roles:
          - ops_admin
        service: compliance
        stage: 2
        visibility: ops
  /ops/rescreens:
    post:
      description: Same job as the daily `destinations.rescreen`; hits disable the destination (`evt.compliance.destination.blocked`) and open a case.
      operationId: createOpsRescreen
      parameters:
        - description: Makes the request safe to retry for 24 h (same key + same body = same result).
          in: header
          name: Idempotency-Key
          schema:
            description: Makes the request safe to retry for 24 h (same key + same body = same result).
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                account:
                  description: "Only this account's destinations (default: all)."
                  examples:
                    - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
                  pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                  type: string
              type: object
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescreenQueued"
          description: Queue a re-screen of active destinations (one account, or all).
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Queue a re-screen of active destinations (one account, or all).
      tags:
        - compliance
      x-nearpay:
        auth:
          - ops:compliance.screen
        idempotent: true
        ops_roles:
          - ops
          - ops_admin
        service: compliance
        stage: 2
        visibility: ops
  /ops/screenings:
    post:
      description: "Runs the vendor-neutral screening interface (v1: local OFAC digital-currency list + blocklist, provider `local`); the result is stored like any screening but never served from or written to the cache."
      operationId: createOpsScreening
      parameters:
        - description: Makes the request safe to retry for 24 h (same key + same body = same result).
          in: header
          name: Idempotency-Key
          schema:
            description: Makes the request safe to retry for 24 h (same key + same body = same result).
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                chain:
                  description: Chain of an address.
                  examples:
                    - eip155:8453
                  pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
                  type: string
                livemode:
                  description: Mode (test mode uses the sandbox magic rule).
                  type: boolean
                subject:
                  description: Address or account.
                  maxLength: 256
                  minLength: 1
                  type: string
                subject_type:
                  description: What is screened.
                  enum:
                    - address
                    - near_account
                  type: string
              required:
                - subject_type
                - subject
                - livemode
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Screening"
          description: Screen a subject now, bypassing the cache (console lookup).
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `screening_unavailable`."
          x-error-codes:
            - screening_unavailable
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Screen a subject now, bypassing the cache (console lookup).
      tags:
        - compliance
      x-nearpay:
        auth:
          - ops:compliance.screen
        idempotent: true
        ops_roles:
          - ops
          - ops_admin
        service: compliance
        stage: 2
        visibility: ops
