        stage: 2
  /sim/near-rpc:
    post:
      description: "Serves `NearRpcRequest` for the stand-in vault account (and NEP-141 `ft_balance_of` / `storage_balance_of` views of the test tokens) with mainnet shapes: `send_tx` / `broadcast_tx_commit` decode the borsh `SignedTransaction`, verify its ed25519 signature over sha256(transaction), require a nonce above the key's last one (keys register on first use, like the simulated Verifier) and execute `collect`, `cancel`, `withdraw`, `storage_deposit`, `storage_withdraw` or `storage_unregister` synchronously by the vault rules (contracts-vault §3.1–§3.8: check orders, `MIN_COLLECT_GAS`/`MIN_EXIT_GAS` from the action's gas, 1 yoctoNEAR, caps, periods, refunds). A vault error is `status.Failure` with `Smart contract panicked: ERR_…`; a success carries the exact `EVENT_JSON` lines (`formatVaultEventLog`) in the vault receipts' logs and `status.SuccessValue` = base64 of the return value. Every receipt with logs is also appended to `GET /sim/intents/events` (with `receipt_id`, `log_index`, `executor_id`). Always HTTP 200 with a JSON-RPC result or error, as NEAR RPC does."
      operationId: sandboxNearRpc
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NearRpcRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearRpcResponse"
          description: "Vault stand-in: NEAR JSON-RPC subset (test-mode `NP_NEAR_RPC_URLS` of billing's keeper)."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: "Vault stand-in: NEAR JSON-RPC subset (test-mode `NP_NEAR_RPC_URLS` of billing's keeper)."
      tags:
        - sandbox
      x-nearpay:
        auth:
          - service:sandbox.use
        idempotent: false
        service: sandbox
        stage: 4
  /sim/vault/advance:
    post:
      description: Each stand-in mandate has its own forward-only clock offset (like billing's per-subscription test clock), used for its due checks and `next_collect_at`; other mandates and block timestamps are unaffected. `secs` omitted = exactly up to the mandate's `next_collect_at` (no-op when already due). The 86 400 s minimum period is never lowered. billing's `advanceSubscriptionClock` calls it with the same delta for a subscription's linked mandate. Unknown or closed mandate → `404`.
      operationId: sandboxVaultAdvance
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                mandate_id:
                  description: Vault mandate id.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                secs:
                  description: Seconds to move forward.
                  maximum: 379468800
                  minimum: 1
                  type: integer
              required:
                - mandate_id
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimVaultClock"
          description: "Vault stand-in: move one mandate's clock forward (make the next period due)."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: "Vault stand-in: move one mandate's clock forward (make the next period due)."
      tags:
        - sandbox
      x-nearpay:
        auth:
          - service:sandbox.use
        idempotent: false
        service: sandbox
        stage: 4
  /sim/vault/call:
    post:
      description: Same execution as a signed `send_tx` for the stand-in vault, without the signature (test helper for simulated payers and merchants). Gas and deposit are taken as given, so `ERR_GAS` and the 1-yocto guard are testable.
      operationId: sandboxVaultCall
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                args:
                  additionalProperties: {}
                  description: 'JSON arguments (e.g. `{"mandate_id": 7}`).'
                  propertyNames:
                    type: string
                  type: object
                deposit:
                  description: Attached yoctoNEAR (default `1` for cancel/withdraw/storage_withdraw/storage_unregister, else `0`).
                  pattern: ^(0|[1-9][0-9]{0,38})$
                  type: string
                gas:
                  description: Attached gas (default 100 Tgas; `collect` default 250 Tgas).
                  pattern: ^[1-9][0-9]{0,17}$
                  type: string
                method:
                  description: Vault method.
                  enum:
                    - collect
                    - cancel
                    - withdraw
                    - storage_deposit
                    - storage_withdraw
                    - storage_unregister
                  type: string
                signer:
                  description: Account the call is made as (predecessor and signer).
                  pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
                  type: string
              required:
                - signer
                - method
                - args
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearFinalExecutionOutcome"
          description: "Vault stand-in: an unsigned change call as a named account (payer cancel/withdraw, storage)."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: "Vault stand-in: an unsigned change call as a named account (payer cancel/withdraw, storage)."
      tags:
        - sandbox
      x-nearpay:
        auth:
          - service:sandbox.use
        idempotent: false
        service: sandbox
        stage: 4
  /sim/vault/ft_transfer_call:
    post:
      description: "Stands in for the payer's wallet (no signature): mints the payer's shortfall of the test token first (like `/sim/intents/transfers`), then runs the token's `ft_transfer_call(receiver_id = vault, amount, msg)` with `payer` as signer and sender: the token receipt (NEP-141 `ft_transfer` log), the vault's `ft_on_transfer` (contracts-vault §3.1 check order; a rejection logs `ERR_…[: detail]` and returns the full amount) and the token's resolve (refund log). `payer` = `intents.near` or the vault is refused with `ERR_UNSUPPORTED_SENDER`, as on chain. Test mode only by construction."
      operationId: sandboxVaultFtTransferCall
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                amount:
                  description: Amount (base units).
                  pattern: ^(0|[1-9][0-9]{0,77})$
                  type: string
                msg:
                  description: The `msg` exactly as the payer would send it.
                  maxLength: 4096
                  type: string
                payer:
                  description: Payer (signer and NEP-141 sender); default for NearPay helpers `sandbox-payer.near`.
                  pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
                  type: string
                token:
                  description: Test token contract (one of the stand-in's allowed tokens, or any other to test `ERR_TOKEN_NOT_ALLOWED`).
                  pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
                  type: string
              required:
                - payer
                - token
                - amount
                - msg
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearFinalExecutionOutcome"
          description: "Vault stand-in: the payer's `ft_transfer_call` to the vault (create or top up a mandate)."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: "Vault stand-in: the payer's `ft_transfer_call` to the vault (create or top up a mandate)."
      tags:
        - sandbox
      x-nearpay:
        auth:
          - service:sandbox.use
        idempotent: false
        service: sandbox
        stage: 4
