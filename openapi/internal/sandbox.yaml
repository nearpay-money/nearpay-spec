                pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
                type: string
              token_account:
                description: "Solana SPL: recipient token account (the ATA of `to` for the mint); null/absent for SOL and other chains. Spec 0.4.0."
                type:
                  - string
                  - "null"
              vout:
                anyOf:
                  - maximum: 9007199254740991
                    minimum: 0
                    type: integer
                  - type: "null"
                description: "Bitcoin: output index of this transfer; null/absent on other chains. Spec 0.4.0."
            required:
              - token
              - to
              - amount
            type: object
          type: array
      required:
        - finalized
        - transfers
      type: object
    SimVaultClock:
      additionalProperties: {}
      description: A stand-in mandate clock after an advance.
      properties:
        clock_offset_secs:
          description: Total seconds this mandate's clock is ahead of real time.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        mandate_id:
          description: Vault mandate id.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        next_collect_at:
          description: "`next_collect_at` view after the advance (ns)."
          type:
            - string
            - "null"
        now_ns:
          description: The mandate's clock now (ns).
          type: string
      required:
        - mandate_id
        - clock_offset_secs
        - now_ns
        - next_collect_at
      type: object
    SimulateIntentsOutput:
      additionalProperties: {}
      description: Result of simulate_intents.
      properties:
        intents_executed:
          description: Intents that would execute.
          items:
            additionalProperties: {}
            description: An executed intent.
            properties:
              account_id:
                description: Signer.
                pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
                type: string
              intent_hash:
                description: Intent hash (base58).
                type: string
              nonce:
                description: Nonce (base64).
                type: string
            required:
              - intent_hash
              - account_id
              - nonce
            type: object
          type: array
        logs:
          description: Contract logs (`EVENT_JSON:…`).
          items:
            type: string
          type: array
        min_deadline:
          description: Earliest payload deadline.
          type: string
        state:
          additionalProperties: {}
          description: Verifier state.
          properties:
            current_salt:
              description: Current salt (hex).
              type: string
            fee:
              description: Verifier fee.
              type: number
          required:
            - fee
            - current_salt
          type: object
      required:
        - intents_executed
        - logs
        - min_deadline
        - state
      type: object
  securitySchemes:
    internalToken:
      description: "Internal Ed25519 JWT: request token or service token."
      in: header
      name: X-NearPay-Token
      type: apiKey
    serviceClient:
      description: Service client credentials (`client_id` + secret file).
      scheme: basic
      type: http
info:
  description: NearPay internal service API. Generated from `nearpay-spec`; do not edit by hand.
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  title: nearpay-sandbox internal API
  version: 0.4.2
openapi: 3.1.0
paths:
  /api/v0/transactions:
    get:
      description: Same query and row schema as `GET explorer.near-intents.org/api/v0/transactions`; no rate limit. Rows are the sandbox's quotes with their current scenario status; `amountIn`/`amountOut` read `0` until the scenario settles, like the live Explorer.
      operationId: sandboxExplorerTransactions
      parameters:
        - description: Rows (1–1000, default 50).
          in: query
          name: numberOfTransactions
          schema:
            description: Rows (1–1000, default 50).
            maximum: 1000
            minimum: 1
            type: integer
        - description: "Page cursor: `depositAddress` of the last row."
          in: query
          name: lastDepositAddress
          schema:
            description: "Page cursor: `depositAddress` of the last row."
            type: string
        - description: "Page cursor: `depositMemo` of the last row."
          in: query
          name: lastDepositMemo
          schema:
            description: "Page cursor: `depositMemo` of the last row."
            type: string
        - description: "`next` = older rows (default), `prev` = newer rows."
          in: query
          name: direction
          schema:
            description: "`next` = older rows (default), `prev` = newer rows."
            enum:
              - next
              - prev
            type: string
        - description: Referral filter (`nearpay`).
          in: query
          name: referral
          schema:
            description: Referral filter (`nearpay`).
            type: string
        - description: Comma-separated statuses (PENDING_DEPOSIT, INCOMPLETE_DEPOSIT, PROCESSING, SUCCESS, REFUNDED, FAILED); default omits the `*_DEPOSIT` ones.
          in: query
          name: statuses
          schema:
            description: Comma-separated statuses (PENDING_DEPOSIT, INCOMPLETE_DEPOSIT, PROCESSING, SUCCESS, REFUNDED, FAILED); default omits the `*_DEPOSIT` ones.
            pattern: ^[A-Z_]+(,[A-Z_]+)*$
            type: string
        - description: Exclusive start bound (ISO 8601).
          in: query
          name: startTimestamp
          schema:
            description: Exclusive start bound (ISO 8601).
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
            type: string
        - description: Exclusive end bound (ISO 8601).
          in: query
          name: endTimestamp
          schema:
            description: Exclusive end bound (ISO 8601).
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
            type: string
        - description: Deposit memo filter.
          in: query
          name: depositMemo
          schema:
            description: Deposit memo filter.
            type: string
        - description: Deposit address, recipient, sender or tx hash.
          in: query
          name: search
          schema:
            description: Deposit address, recipient, sender or tx hash.
            type: string
        - description: Include test-account transactions.
          in: query
          name: showTestTxs
          schema:
            description: Include test-account transactions.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplorerTransactionList"
          description: "Explorer mirror: sandbox quotes as Explorer rows, newest first (rails Explorer feed in test mode)."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: "Explorer mirror: sandbox quotes as Explorer rows, newest first (rails Explorer feed in test mode)."
      tags:
        - sandbox
      x-nearpay:
        auth:
          - service:sandbox.use
        idempotent: false
        service: sandbox
        stage: 2
  /sim/advance:
