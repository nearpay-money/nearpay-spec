components:
  schemas:
    Erc191MultiPayload:
      additionalProperties: {}
      description: Payload signed with ERC-191.
      properties:
        payload:
          description: JSON string of `IntentMessage`.
          minLength: 2
          type: string
        signature:
          description: secp256k1 signature r‖s‖v (v ∈ {0,1}), base58.
          pattern: ^(ed25519|secp256k1):[1-9A-HJ-NP-Za-km-z]{64,100}$
          type: string
        standard:
          const: erc191
          description: ERC-191 `personal_sign` (EVM wallets).
          type: string
      required:
        - standard
        - payload
        - signature
      type: object
    Error:
      additionalProperties: {}
      description: Envelope returned with every non-2xx response.
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
      required:
        - error
      type: object
    ErrorBody:
      additionalProperties: {}
      description: Details of a failed request.
      properties:
        code:
          description: Machine-readable error code from the error catalogue.
          type: string
          x-extensible-enum:
            - invalid_request
            - resource_missing
            - authentication_required
            - invalid_api_key
            - permission_denied
            - csrf_token_invalid
            - ip_not_allowed
            - account_suspended
            - step_up_required
            - rate_limited
            - idempotency_key_reused
            - idempotency_in_progress
            - api_error
            - state_conflict
            - livemode_forbidden
            - link_expired
            - link_used
            - webauthn_failed
            - invalid_client
            - turnstile_failed
            - invalid_setting
            - scope_unknown
            - address_invalid
            - asset_unsupported
            - memo_destination_unsupported
            - destination_in_use
            - recovery_lock
            - screening_blocked
            - attestation_invalid
            - challenge_expired
            - destination_not_active
            - account_not_live
            - amount_below_destination_minimum
            - amount_above_unverified_cap
            - currency_unsupported
            - allowed_origins_required
            - attempt_in_flight
            - client_secret_invalid
            - session_not_open
            - too_many_attempts
            - route_too_slow
            - refund_address_invalid
            - geo_blocked
            - intent_invalid
            - insufficient_balance
            - rail_unavailable
            - route_unavailable
            - pricing_unavailable
            - deadline_too_short
            - quote_rejected
            - quote_integrity_failed
            - ticket_invalid
            - attestation_refused
            - attestation_stale
            - attestation_unavailable
            - destination_not_intents_account
            - amount_below_minimum
            - screening_unavailable
            - url_invalid
            - event_type_unknown
            - last_owner
            - member_exists
            - invitation_invalid
            - approver_conflict
            - two_person_required
            - authenticator_not_allowed
            - kyb_profile_incomplete
            - intent_not_succeeded
            - attempt_not_settled
            - amount_exceeds_refundable
            - leg_expired
            - signed_intent_mismatch
            - review_requires_evidence
            - link_inactive
            - customer_deleted
            - reconciliation_day_open
            - fx_rate_unavailable
            - currency_mismatch
            - interval_mismatch
            - price_inactive
            - price_type_invalid
            - tax_rate_inactive
            - tax_rates_mixed
            - invoice_empty
            - customer_email_missing
            - invoice_secret_invalid
            - invoice_not_payable
            - auto_debit_unavailable
            - vault_cap_exceeded
        doc_url:
          description: Documentation page for this error code.
          format: uri
          type: string
        message:
          description: Human-readable message; safe to show to developers, not to payers.
          type: string
        param:
          description: The request parameter the error relates to, when there is one.
          type: string
        request_id:
          description: Request id, also returned in the `X-Request-Id` header.
          examples:
            - req_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^req_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        type:
          description: Error category; decides whether a retry can help.
          type: string
          x-extensible-enum:
            - invalid_request_error
            - authentication_error
            - permission_error
            - payment_error
            - idempotency_error
            - state_conflict
            - rate_limit_error
            - api_error
            - rail_unavailable
      required:
        - type
        - code
        - message
        - doc_url
        - request_id
      type: object
    ExplorerTransaction:
      additionalProperties: {}
      description: "One Explorer transaction row (no `updatedAt`: change detection compares `status`)."
      properties:
        amountIn:
          description: Amount in, origin base units (`0` while in flight).
          pattern: ^\d+$
          type: string
        amountInFormatted:
          description: Readable amount in.
          type: string
        amountInUsd:
          description: USD value of amount in.
          type: string
        amountOut:
          description: Amount out, destination base units (`0` while in flight).
          pattern: ^\d+$
          type: string
        amountOutFormatted:
          description: Readable amount out.
          type: string
        amountOutUsd:
          description: USD value of amount out.
          type: string
        appFees:
          anyOf:
            - items:
                additionalProperties: {}
                description: An app fee.
                properties:
                  fee:
                    description: Fee, bps.
                    type: number
                  recipient:
                    description: Fee recipient.
                    type: string
                required:
                  - recipient
                  - fee
                type: object
              type: array
            - type: "null"
          description: App fees.
        createdAt:
          description: Creation time (ISO).
          type: string
        createdAtTimestamp:
          description: Creation time (unix seconds).
          type: number
        depositAddress:
          description: Deposit address (matches `executions.deposit_address`).
          type: string
        depositAddressAndMemo:
          description: Deprecated combined key.
          type:
            - string
            - "null"
        depositMemo:
          description: Deposit memo.
          type:
            - string
            - "null"
        depositType:
          anyOf:
            - description: "`ORIGIN_CHAIN`, `INTENTS`, `CONFIDENTIAL_INTENTS` or a newer value."
              type: string
            - type: "null"
        destinationAsset:
          description: Destination asset id.
          type: string
        destinationChainTxHashes:
          anyOf:
            - items:
                type: string
              type: array
            - type: "null"
          description: Destination-chain transactions.
        intentHashes:
          description: Intent hashes (comma-separated).
          type:
            - string
            - "null"
        nearTxHashes:
          anyOf:
            - items:
                type: string
              type: array
            - type: "null"
          description: NEAR transactions.
        originAsset:
          description: Origin asset id.
          type: string
        originChainTxHashes:
          anyOf:
            - items:
                type: string
              type: array
            - type: "null"
          description: Origin-chain transactions.
        recipient:
          description: Recipient.
          type: string
        recipientType:
          anyOf:
            - description: "`ORIGIN_CHAIN`, `INTENTS`, `CONFIDENTIAL_INTENTS` or a newer value."
              type: string
            - type: "null"
        referral:
          description: Referral id.
          type:
            - string
            - "null"
        refundFee:
          description: Refund fee, origin base units.
          type:
            - string
            - "null"
        refundFeeFormatted:
          description: Readable refund fee.
          type:
            - string
            - "null"
        refundReason:
          description: Refund reason (e.g. `PARTIAL_DEPOSIT`, `NO_LIQUIDITY`).
          type:
            - string
            - "null"
        refundTo:
          description: Refund address.
          type:
            - string
            - "null"
        refundType:
          anyOf:
            - description: "`ORIGIN_CHAIN`, `INTENTS`, `CONFIDENTIAL_INTENTS` or a newer value."
              type: string
            - type: "null"
        senders:
          anyOf:
            - items:
                type: string
              type: array
            - type: "null"
          description: Senders.
        status:
          description: Status (PENDING_DEPOSIT, INCOMPLETE_DEPOSIT, PROCESSING, SUCCESS, REFUNDED, FAILED or unknown).
          type: string
      required:
        - originAsset
        - destinationAsset
        - depositAddress
        - recipient
        - status
        - createdAt
        - createdAtTimestamp
        - amountIn
        - amountInFormatted
        - amountInUsd
        - amountOut
        - amountOutFormatted
        - amountOutUsd
      type: object
    ExplorerTransactionList:
      description: Explorer transactions, newest first (bare array).
      items:
        $ref: "#/components/schemas/ExplorerTransaction"
      type: array
    MultiPayload:
      description: A signed Verifier payload (`MultiPayload`).
      discriminator:
        mapping:
          erc191: "#/components/schemas/Erc191MultiPayload"
          nep413: "#/components/schemas/Nep413MultiPayload"
          raw_ed25519: "#/components/schemas/RawEd25519MultiPayload"
        propertyName: standard
      oneOf:
        - $ref: "#/components/schemas/Nep413MultiPayload"
        - $ref: "#/components/schemas/Erc191MultiPayload"
        - $ref: "#/components/schemas/RawEd25519MultiPayload"
      type: object
    NearAccessKeyResult:
      additionalProperties: {}
      description: "`query` view_access_key result."
      properties:
        block_hash:
          description: Block hash (signers use it as the transaction's recent block hash).
          type: string
        block_height:
          description: Block.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        nonce:
          description: Last used nonce.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        permission:
          anyOf:
            - const: FullAccess
              description: Full access.
              type: string
            - additionalProperties: {}
              properties:
                FunctionCall:
                  additionalProperties: {}
                  description: Function-call permission.
                  properties:
                    allowance:
                      description: Remaining allowance (yoctoNEAR); null = unlimited.
                      type:
                        - string
                        - "null"
                    method_names:
                      description: Only these methods (empty = any).
                      items:
                        type: string
                      type: array
                    receiver_id:
                      description: Only this contract.
                      pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
                      type: string
                  required:
                    - allowance
                    - receiver_id
                    - method_names
                  type: object
              required:
                - FunctionCall
              type: object
          description: Key permission.
      required:
        - nonce
        - permission
        - block_height
        - block_hash
      type: object
    NearBlockResult:
      additionalProperties: {}
      description: "`block` result (loose)."
      properties:
        header:
          additionalProperties: {}
          description: Block header (loose).
          properties:
            hash:
              description: Block hash.
              type: string
            height:
              description: Height.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            timestamp_nanosec:
              description: Block time (ns, decimal string).
              type: string
          required:
            - height
            - hash
            - timestamp_nanosec
          type: object
      required:
        - header
      type: object
    NearCallFunctionResult:
      additionalProperties: {}
      description: "`query` call_function result."
      properties:
        block_hash:
          description: Block hash.
          type: string
        block_height:
          description: Block.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        logs:
          description: Logs (views log nothing).
          items:
            type: string
          type: array
        result:
          description: UTF-8 bytes of the JSON return value.
          items:
            maximum: 255
            minimum: 0
            type: integer
          type: array
      required:
        - result
        - logs
        - block_height
        - block_hash
      type: object
    NearExecutionOutcomeWithId:
      additionalProperties: {}
      description: A transaction or receipt outcome.
      properties:
        block_hash:
          description: Block that included the outcome.
          type: string
        id:
          description: Receipt (or transaction) id.
          type: string
        outcome:
          additionalProperties: {}
          description: Outcome.
          properties:
            executor_id:
              description: Account that executed it (rails checks = the vault).
              pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
              type: string
            gas_burnt:
              description: Gas burnt.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            logs:
              description: Log lines (`EVENT_JSON:…`, rejection codes).
              items:
                type: string
              type: array
            receipt_ids:
              description: Receipts it created.
              items:
                type: string
              type: array
            status:
              anyOf:
                - additionalProperties: {}
                  properties:
                    SuccessValue:
                      description: "Base64 of the return value (vault `collect`: `true`/`false`)."
                      type: string
                  required:
                    - SuccessValue
                  type: object
                - additionalProperties: {}
                  properties:
                    SuccessReceiptId:
                      description: Receipt the outcome continues in.
                      type: string
                  required:
                    - SuccessReceiptId
                  type: object
                - additionalProperties: {}
                  properties:
                    Failure:
                      $ref: "#/components/schemas/NearTxExecutionError"
                  required:
                    - Failure
                  type: object
                - const: Unknown
                  description: Not executed yet.
                  type: string
              description: Execution status of a transaction or receipt.
            tokens_burnt:
              description: yoctoNEAR burnt.
              type: string
          required:
            - logs
            - receipt_ids
            - gas_burnt
            - tokens_burnt
            - executor_id
            - status
          type: object
      required:
        - id
        - block_hash
        - outcome
      type: object
    NearFinalExecutionOutcome:
      additionalProperties: {}
      description: "`send_tx` / `broadcast_tx_commit` / `tx` result (loose)."
      properties:
        final_execution_status:
          description: "`send_tx` wait level; the keeper waits for `FINAL` (the stand-in executes synchronously and answers every level with the final outcome)."
          enum:
            - NONE
            - INCLUDED
            - EXECUTED_OPTIMISTIC
            - INCLUDED_FINAL
            - EXECUTED
            - FINAL
          type: string
        receipts_outcome:
          description: Every receipt outcome, in execution order.
          items:
            $ref: "#/components/schemas/NearExecutionOutcomeWithId"
          type: array
        status:
          anyOf:
            - additionalProperties: {}
              properties:
                SuccessValue:
                  description: "Base64 of the return value (vault `collect`: `true`/`false`)."
                  type: string
              required:
                - SuccessValue
              type: object
            - additionalProperties: {}
              properties:
                SuccessReceiptId:
                  description: Receipt the outcome continues in.
                  type: string
              required:
                - SuccessReceiptId
              type: object
            - additionalProperties: {}
              properties:
                Failure:
                  $ref: "#/components/schemas/NearTxExecutionError"
              required:
                - Failure
              type: object
            - const: Unknown
              description: Not executed yet.
              type: string
          description: "Overall status: `Failure` when any receipt of the call chain panicked first."
        transaction:
          additionalProperties: {}
          description: The transaction (actions omitted from the contract; the stand-in echoes them).
          properties:
            hash:
              description: Transaction hash.
              type: string
            nonce:
              description: Nonce.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            public_key:
              description: Signer key.
              type: string
            receiver_id:
              description: Receiver.
              pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
              type: string
            signer_id:
              description: Signer.
              pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
              type: string
          required:
            - signer_id
            - public_key
            - nonce
            - receiver_id
            - hash
          type: object
        transaction_outcome:
          $ref: "#/components/schemas/NearExecutionOutcomeWithId"
      required:
        - status
        - transaction
        - transaction_outcome
        - receipts_outcome
      type: object
    NearRpcError:
      additionalProperties: {}
      description: NEAR JSON-RPC structured error.
      properties:
        cause:
          additionalProperties: {}
          description: Cause.
          properties:
            info:
              additionalProperties: {}
              description: Details.
              propertyNames:
                type: string
              type: object
            name:
              description: E.g. `INVALID_TRANSACTION`, `UNKNOWN_ACCESS_KEY`, `UNKNOWN_ACCOUNT`, `NO_CONTRACT_CODE`, `CONTRACT_EXECUTION_ERROR`, `METHOD_NOT_FOUND`, `TIMEOUT_ERROR`.
              type: string
          required:
            - name
          type: object
        code:
          description: JSON-RPC code (-32000 handler errors, -32601 unknown method, -32700 parse error).
          maximum: 9007199254740991
          minimum: -9007199254740991
          type: integer
        data:
          description: Legacy detail.
        message:
          description: Message.
          type: string
        name:
          description: "`HANDLER_ERROR`, `REQUEST_VALIDATION_ERROR` or `INTERNAL_ERROR`."
          type: string
      required:
        - name
        - cause
        - code
        - message
      type: object
    NearRpcRequest:
      description: The NEAR JSON-RPC subset the keeper uses (`block`, `query` call_function / view_access_key, `send_tx`, `broadcast_tx_commit`, `tx`). The sandbox stand-in serves exactly this subset; other methods answer `METHOD_NOT_FOUND`.
      oneOf:
        - additionalProperties: false
          properties:
            id:
              anyOf:
                - maxLength: 128
                  type: string
                - maximum: 9007199254740991
                  minimum: -9007199254740991
                  type: integer
              description: JSON-RPC request id (echoed).
            jsonrpc:
              const: "2.0"
              description: JSON-RPC version.
              type: string
            method:
              const: block
              description: Latest block (hash for signing).
              type: string
            params:
              additionalProperties: false
              description: "`block` params (latest block)."
              properties:
                finality:
                  description: Block finality.
                  enum:
                    - final
                    - optimistic
                  type: string
              required:
                - finality
              type: object
          required:
            - jsonrpc
            - id
            - method
            - params
          type: object
        - additionalProperties: false
          properties:
            id:
              anyOf:
                - maxLength: 128
                  type: string
                - maximum: 9007199254740991
                  minimum: -9007199254740991
                  type: integer
              description: JSON-RPC request id (echoed).
            jsonrpc:
              const: "2.0"
              description: JSON-RPC version.
              type: string
            method:
              const: query
              description: View call or access key.
              type: string
            params:
              anyOf:
                - additionalProperties: false
                  description: "`query` call_function params."
                  properties:
                    account_id:
                      description: Contract (the vault, or a token for `ft_balance_of`).
                      pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
                      type: string
                    args_base64:
                      description: Base64 of the JSON arguments.
                      maxLength: 8192
                      type: string
                    finality:
                      description: Block finality.
                      enum:
                        - final
                        - optimistic
                      type: string
                    method_name:
                      description: View method.
                      maxLength: 256
                      minLength: 1
                      type: string
                    request_type:
                      const: call_function
                      description: View call.
                      type: string
                  required:
                    - request_type
                    - finality
                    - account_id
                    - method_name
                    - args_base64
                  type: object
                - additionalProperties: false
                  description: "`query` view_access_key params."
                  properties:
                    account_id:
                      description: Signer account.
                      pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
                      type: string
                    finality:
                      description: Block finality.
                      enum:
                        - final
                        - optimistic
                      type: string
                    public_key:
                      description: "`ed25519:<base58>` key."
                      pattern: ^ed25519:[1-9A-HJ-NP-Za-km-z]{32,44}$
                      type: string
                    request_type:
                      const: view_access_key
                      description: Access key lookup (nonce before signing).
                      type: string
                  required:
                    - request_type
                    - finality
                    - account_id
                    - public_key
                  type: object
              description: Query params.
          required:
            - jsonrpc
            - id
            - method
            - params
          type: object
        - additionalProperties: false
          properties:
            id:
              anyOf:
                - maxLength: 128
                  type: string
                - maximum: 9007199254740991
                  minimum: -9007199254740991
                  type: integer
              description: JSON-RPC request id (echoed).
            jsonrpc:
              const: "2.0"
              description: JSON-RPC version.
              type: string
            method:
              const: send_tx
              description: Submit a signed transaction.
              type: string
            params:
              additionalProperties: false
              description: "`send_tx` params."
              properties:
                signed_tx_base64:
                  description: Base64 of the borsh `SignedTransaction`.
                  maxLength: 65536
                  minLength: 1
                  type: string
                wait_until:
                  description: "`send_tx` wait level; the keeper waits for `FINAL` (the stand-in executes synchronously and answers every level with the final outcome)."
                  enum:
                    - NONE
                    - INCLUDED
                    - EXECUTED_OPTIMISTIC
                    - INCLUDED_FINAL
                    - EXECUTED
                    - FINAL
                  type: string
              required:
                - signed_tx_base64
              type: object
          required:
            - jsonrpc
            - id
            - method
            - params
          type: object
        - additionalProperties: false
          properties:
            id:
              anyOf:
                - maxLength: 128
                  type: string
                - maximum: 9007199254740991
                  minimum: -9007199254740991
                  type: integer
              description: JSON-RPC request id (echoed).
            jsonrpc:
              const: "2.0"
              description: JSON-RPC version.
              type: string
            method:
              const: broadcast_tx_commit
              description: Submit and wait (legacy form of `send_tx`).
              type: string
            params:
              description: "`[signed_tx_base64]`."
              items: false
              maxItems: 1
              minItems: 1
              prefixItems:
                - maxLength: 65536
                  minLength: 1
                  type: string
              type: array
          required:
            - jsonrpc
            - id
            - method
            - params
          type: object
        - additionalProperties: false
          properties:
            id:
              anyOf:
                - maxLength: 128
                  type: string
                - maximum: 9007199254740991
                  minimum: -9007199254740991
                  type: integer
              description: JSON-RPC request id (echoed).
            jsonrpc:
              const: "2.0"
              description: JSON-RPC version.
              type: string
            method:
              const: tx
              description: Transaction status.
              type: string
            params:
              additionalProperties: false
              description: "`tx` params (status of a sent transaction, e.g. after a transport error)."
              properties:
                sender_account_id:
                  description: Signer.
                  pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
                  type: string
                tx_hash:
                  description: Transaction hash.
                  maxLength: 64
                  minLength: 32
                  type: string
                wait_until:
                  description: "`send_tx` wait level; the keeper waits for `FINAL` (the stand-in executes synchronously and answers every level with the final outcome)."
                  enum:
                    - NONE
                    - INCLUDED
                    - EXECUTED_OPTIMISTIC
                    - INCLUDED_FINAL
                    - EXECUTED
                    - FINAL
                  type: string
              required:
                - tx_hash
                - sender_account_id
              type: object
          required:
            - jsonrpc
            - id
            - method
            - params
          type: object
      type: object
    NearRpcResponse:
      anyOf:
        - additionalProperties: {}
          properties:
            id:
              anyOf:
                - maxLength: 128
                  type: string
                - maximum: 9007199254740991
                  minimum: -9007199254740991
                  type: integer
              description: JSON-RPC request id (echoed).
            jsonrpc:
              const: "2.0"
              description: JSON-RPC version.
              type: string
            result:
              anyOf:
                - $ref: "#/components/schemas/NearFinalExecutionOutcome"
                - $ref: "#/components/schemas/NearCallFunctionResult"
                - $ref: "#/components/schemas/NearAccessKeyResult"
                - $ref: "#/components/schemas/NearBlockResult"
              description: Method result.
          required:
            - jsonrpc
            - id
            - result
          type: object
        - additionalProperties: {}
          properties:
            error:
              $ref: "#/components/schemas/NearRpcError"
