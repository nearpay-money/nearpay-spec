            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Amount that reached the recipient.
        settlement:
          additionalProperties: {}
          description: Merchant side.
          properties:
            amount_base:
              description: Settlement amount before the tag.
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            asset_id:
              description: Settlement asset.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            chain:
              description: Settlement chain.
              examples:
                - eip155:8453
              pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
              type: string
            decimals:
              description: Decimals of the asset (display of base units; spec 0.2.1, absent from older rails).
              maximum: 255
              minimum: 0
              type: integer
            expected:
              description: Expected output = base + tag.
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            recipient:
              description: Merchant destination.
              maxLength: 256
              minLength: 1
              type: string
            recipient_type:
              description: Recipient type.
              enum:
                - destination_chain
                - intents
              type: string
            tag:
              description: Amount tag (0 = untagged).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          required:
            - asset_id
            - amount_base
            - tag
            - expected
            - recipient
            - recipient_type
            - chain
          type: object
        state:
          description: Attempt status (mirrors the rails execution, domain-model §4.3).
          type: string
          x-extensible-enum:
            - quoting
            - awaiting_deposit
            - deposit_detected
            - incomplete_deposit
            - settling
            - verifying
            - succeeded
            - refunded
            - failed
            - expired_unpaid
            - held
        terminal_at:
          anyOf:
            - description: RFC 3339 UTC timestamp, e.g. `2026-11-05T10:00:00.000Z`.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            - type: "null"
          description: When it reached a terminal state.
        updated_at:
          description: Updated.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        version:
          description: Increments with every applied change (consumers ignore stale versions).
          maximum: 9007199254740991
          minimum: 1
          type: integer
        x402_binding:
          anyOf:
            - description: Binding memo `np1:` + base58(sha256(…)) tying a signed transfer to one requirement.
              pattern: ^np1:[1-9A-HJ-NP-Za-km-z]{43,44}$
              type: string
            - type: "null"
          description: "Owner `agentpay`: binding of the `near-intents` requirement the quote was minted for; null otherwise."
      required:
        - id
        - version
        - account_id
        - livemode
        - kind
        - method
        - provider
        - state
        - provider_status
        - route_class
        - applied_fee_bps
        - origin
        - settlement
        - price_snapshot
        - deposit
        - intents_requirement
        - deposit_tx_hashes
        - settled_amount
        - refunded_amount
        - refund_reason
        - evidence
        - failure_code
        - held_reason
        - deadline
        - terminal_at
        - created_at
        - updated_at
      type: object
    ExecutionDeposit:
      additionalProperties: {}
      description: Deposit instructions of a `route_quote` execution.
      properties:
        address:
          description: Deposit address.
          maxLength: 256
          minLength: 1
          type: string
        amount_in:
          description: Amount to send.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        chain:
          description: Origin chain.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        deadline:
          description: Deposit deadline.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        fee_amount_in:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: "Part of `amount_in` that pays NearPay's fee, base units of the origin asset (display only): `0` when the merchant bears the fee, null when rails cannot apportion it. Absent from rails before 0.2.1."
        memo:
          description: Memo.
          type:
            - string
            - "null"
        min_amount_in:
          description: Provider minimum.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
      required:
        - address
        - memo
        - amount_in
        - min_amount_in
        - chain
        - deadline
      type: object
    ExecutionReference:
      additionalProperties: {}
      description: The payments object an execution belongs to.
      properties:
        payment_attempt:
          anyOf:
            - description: payment_attempt id (`pa_` + 26 base32 chars).
              examples:
                - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: "Payment attempt (`kind: payment`)."
        payment_intent:
          description: payment_intent id (`pi_` + 26 base32 chars).
          examples:
            - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        refund:
          anyOf:
            - description: refund id (`re_` + 26 base32 chars).
              examples:
                - re_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^re_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: "Refund (`kind: refund`)."
        refund_leg:
          anyOf:
            - maximum: 9007199254740991
              minimum: 1
              type: integer
            - type: "null"
          description: "Refund leg number (`kind: refund`)."
      required:
        - payment_intent
        - payment_attempt
        - refund
        - refund_leg
      type: object
    ExecutionRefund:
      additionalProperties: {}
      description: "Refund-leg details of an execution (`kind: refund`)."
      properties:
        amount:
          description: What the merchant sends, base units of the source (settlement) asset.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        amount_out_expected:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: What the payer should receive, base units of the recipient asset (quote `amountOut`).
        min_amount_out:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Quote `minAmountOut` (route legs).
        swap_type:
          anyOf:
            - description: Route quote type.
              enum:
                - EXACT_INPUT
                - EXACT_OUTPUT
              type: string
            - type: "null"
          description: Route legs only; null for `intents_transfer`.
        token:
          anyOf:
            - $ref: "#/components/schemas/TokenContract"
            - type: "null"
          description: How to transfer the source asset on its chain (`sign_and_send` legs); null for Intents sources.
        transfer:
          anyOf:
            - $ref: "#/components/schemas/RefundTransfer"
            - type: "null"
          description: "Set when the source is an Intents account: the transfer to sign (to the payer, or to the 1Click deposit address)."
      required:
        - swap_type
        - amount
        - amount_out_expected
        - min_amount_out
        - token
        - transfer
      type: object
    FeeSummary:
      additionalProperties: {}
      description: Fee snapshot of a payment (INV-6).
      properties:
        bearer:
          description: Who bears the fee.
          enum:
            - payer
            - merchant
          type: string
        total_bps:
          description: NearPay fee applied to this payment's route, in basis points.
          maximum: 10000
          minimum: 0
          type: integer
      required:
        - bearer
        - total_bps
      type: object
    IntentMessage:
      additionalProperties: {}
      description: Verifier message (`DefusePayload`).
      properties:
        deadline:
          description: Latest time the Verifier accepts the payload.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        intents:
          description: Intents executed atomically.
          items:
            anyOf:
              - $ref: "#/components/schemas/TransferIntent"
              - additionalProperties: {}
                properties:
                  intent:
                    description: Intent kind.
                    type: string
                required:
                  - intent
                type: object
            description: A Verifier intent.
          minItems: 1
          type: array
        nonce:
          description: 32-byte nonce (4-byte Verifier salt ‖ 28 random bytes), standard base64.
          pattern: ^[A-Za-z0-9+/]{43}=$
          type: string
        signer_id:
          description: Intents account that signs (the payer).
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        verifying_contract:
          const: intents.near
          description: Verifier contract id.
          type: string
      required:
        - signer_id
        - verifying_contract
        - deadline
        - nonce
        - intents
      type: object
    IntentsRequirement:
      additionalProperties: {}
      description: "What a payer must sign: transfer(pay_to, amount) and transfer(fee_to, fee_amount), both with memo = binding."
      properties:
        amount:
          description: Amount the merchant receives, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        binding:
          description: Memo that both transfers must carry.
          pattern: ^np1:[1-9A-HJ-NP-Za-km-z]{43,44}$
          type: string
        deadline:
          description: Latest acceptable payload deadline.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        fee_amount:
          description: NearPay fee, base units, in the same asset.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        fee_to:
          description: NearPay treasury Intents account.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        pay_to:
          description: Merchant Intents account that receives the payment.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        token:
          description: Asset to transfer (equals the settlement asset).
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
      required:
        - pay_to
        - token
        - amount
        - fee_to
        - fee_amount
        - binding
        - deadline
      type: object
    InternalSettlementDestination:
      additionalProperties: {}
      description: Settlement destination with internal fields.
      properties:
        account:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        active_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the destination became (or becomes) active.
        address:
          description: Receiving address or Intents account.
          maxLength: 256
          minLength: 1
          type: string
        address_norm:
          description: Normalised address (lower-case for EVM).
          maxLength: 256
          minLength: 1
          type: string
        approval:
          anyOf:
            - additionalProperties: {}
              properties:
                approved_by:
                  description: Users who approved, in order (the creator counts when 1 is required).
                  items:
                    description: user id (`usr_` + 26 base32 chars).
                    examples:
                      - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
                    pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                    type: string
                  type: array
                rejected_by:
                  anyOf:
                    - description: user id (`usr_` + 26 base32 chars).
                      examples:
                        - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
                      pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                      type: string
                    - type: "null"
                  description: User who rejected the destination, if any (it is then disabled).
                required:
                  description: "Approvals needed: 2 when the account has ≥ 2 owner/admin members, else 1."
                  maximum: 2
                  minimum: 1
                  type: integer
              required:
                - required
                - approved_by
                - rejected_by
              type: object
            - type: "null"
          description: Approval state; null for test-mode destinations. Absent from Stage 1 servers.
        asset_id:
          description: Asset the merchant receives.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        attestation_challenge:
          allOf:
            - $ref: "#/components/schemas/AttestationChallenge"
          description: Present on creation and on `POST /v1/settlement_destinations/{id}/challenge` while the destination awaits its ownership signature.
        attestation_hash:
          anyOf:
            - pattern: ^[0-9a-f]{64}$
              type: string
            - type: "null"
          description: sha256 of the stored attestation (hex); null for unverified/test.
        chain:
          description: Chain of the address; `near:mainnet` for Intents accounts.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        created_by:
          anyOf:
            - description: user id (`usr_` + 26 base32 chars).
              examples:
                - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Dashboard user who created the destination; null when unknown (created before Stage 2). Spec 0.2.1.
        disabled_reason:
          anyOf:
            - description: "Why it was disabled (`expired`: a pending destination not approved within 7 days; spec 0.2.1)."
              type: string
              x-extensible-enum:
                - merchant
                - compliance
                - replaced
                - expired
            - type: "null"
        fingerprint:
          description: Short fingerprint shown on checkout next to the merchant name, e.g. `7KQ2-M9XA-31`.
          pattern: ^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{2}$
          type: string
        id:
          description: settlement_destination id (`sd_` + 26 base32 chars).
          examples:
            - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        is_default:
          description: Default destination for its asset or for the account.
          type: boolean
        label:
          description: Merchant label.
          type: string
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        min_payment_amount:
          anyOf:
            - $ref: "#/components/schemas/UsdAmount"
            - type: "null"
          description: Smallest payment that is economic for this destination (FR-SET-04).
        object:
          const: settlement_destination
          description: Always `settlement_destination`.
          type: string
        per_payment_cap:
          anyOf:
            - $ref: "#/components/schemas/UsdAmount"
            - type: "null"
          description: Cap per payment for unverified destinations.
        per_payment_cap_usd_micros:
          anyOf:
            - maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Cap for unverified destinations, USD micros.
        status:
          description: Lifecycle status; only `active` destinations receive new payments.
          type: string
          x-extensible-enum:
            - pending_verification
            - pending_approval
            - cooling_off
            - active
            - disabled
        type:
          description: "Where funds settle: an address on a chain, or a NEAR Intents account."
          enum:
            - chain_address
            - intents_account
          type: string
        verification:
          description: How ownership was established.
          type: string
          x-extensible-enum:
            - signature
            - unverified
            - test
      required:
        - id
        - object
        - created
        - livemode
        - asset_id
        - type
        - chain
        - address
        - label
        - status
        - verification
        - fingerprint
        - is_default
        - active_at
        - min_payment_amount
        - per_payment_cap
        - disabled_reason
        - account
        - address_norm
        - attestation_hash
        - per_payment_cap_usd_micros
      type: object
    InvoiceEvent:
      additionalProperties: {}
      description: Invoice snapshot (no secrets, no personal data).
      properties:
        amount_due:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Amount the customer owes in total (= `total`; no credits in v1).
        amount_paid:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Amount paid (`total` once paid, else 0).
        amount_remaining:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "`amount_due − amount_paid`."
        asset_id:
          anyOf:
            - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            - type: "null"
          description: Pricing asset when `currency` is `asset`.
        billing_reason:
          description: "Why the invoice exists: created by the merchant, the first invoice of a subscription, or a renewal."
          type: string
          x-extensible-enum:
            - manual
            - subscription_create
            - subscription_cycle
        checkout_session:
          anyOf:
            - description: checkout_session id (`cs_` + 26 base32 chars).
              examples:
                - cs_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^cs_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Open payments checkout session paying the invoice (created on demand by the hosted page).
        collection_method:
          description: "How the invoice is collected: `send_invoice` = the customer pays the hosted invoice; `auto_debit` (Stage 4) = billing's keeper collects it from the subscription's vault mandate, falling back to `send_invoice` (emailed) when the mandate cannot pay it (lld/billing.md §7.1, §14)."
          type: string
          x-extensible-enum:
            - send_invoice
            - auto_debit
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: ISO 4217 code for fiat pricing, or `asset` when priced in an asset (then `asset_id` is set).
        customer:
          description: Customer billed (owned by payments).
          examples:
            - cus_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cus_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        days_until_due:
          anyOf:
            - maximum: 365
              minimum: 0
              type: integer
            - type: "null"
          description: Days after finalize until due (when no fixed `due_date` was given).
        default_tax_rates:
          description: Tax rates applied to lines created without `tax_rates`.
          items:
            description: tax_rate id (`txr_` + 26 base32 chars).
            examples:
              - txr_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^txr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
          type: array
        description:
          description: Memo shown on the invoice.
          type:
            - string
            - "null"
        due_date:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When payment is due; set at finalize at the latest.
        footer:
          description: Footer shown on the invoice.
          type:
            - string
            - "null"
        hosted_invoice_url:
          description: Always null on the bus.
          type: "null"
        id:
          description: invoice id (`in_` + 26 base32 chars).
          examples:
            - in_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^in_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        invoice_pdf:
          anyOf:
            - description: Absolute URL.
              format: uri
              maxLength: 2048
              type: string
            - type: "null"
          description: API URL of the PDF (`GET /v1/invoices/{id}/pdf`, needs your credentials); null for drafts.
        lines:
          description: All lines (at most 100).
          items:
            $ref: "#/components/schemas/InvoiceLineItem"
          type: array
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        mandate:
          anyOf:
            - description: mandate id (`md_` + 26 base32 chars).
              examples:
                - md_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^md_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Mandate the keeper collects (or collected) this invoice from; null/absent when none (Stage 4).
        mandate_collection:
          anyOf:
            - additionalProperties: {}
              properties:
                fee:
                  description: NearPay fee taken by the vault.
                  pattern: ^(0|[1-9][0-9]{0,77})$
                  type: string
                mandate:
                  description: mandate id (`md_` + 26 base32 chars).
                  examples:
                    - md_01jbz9k3m4n5p6q7r8s9t0v1w2
                  pattern: ^md_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                  type: string
                merchant_share:
                  description: Tokens delivered to the merchant's Intents account.
                  pattern: ^(0|[1-9][0-9]{0,77})$
                  type: string
                period:
                  description: Vault period that paid the invoice.
                  maximum: 9007199254740991
                  minimum: 1
                  type: integer
                receipt_id:
                  description: Vault receipt that logged `collected` (the evidence, INV-2).
                  maxLength: 64
                  minLength: 1
                  type: string
                token:
                  description: Token received, as a NEAR Intents asset id.
                  examples:
                    - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
                  maxLength: 256
                  pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
                  type: string
                tx_hash:
                  description: NEAR transaction of the `collect`.
                  maxLength: 128
                  minLength: 8
                  type: string
              required:
                - mandate
                - period
                - token
                - merchant_share
                - fee
                - tx_hash
                - receipt_id
              type: object
            - type: "null"
          description: Set when the invoice was paid by a vault collection instead of a payment intent (Stage 4).
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Up to 50 key/value pairs (key ≤ 40 chars, value ≤ 500 chars) for your own use.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        next_reminder_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the next reminder goes out; null when none is due.
        number:
          anyOf:
            - maxLength: 32
              type: string
            - type: "null"
          description: Invoice number `<prefix>-<5+ digits>`, unique per account and mode, assigned at finalize; null for drafts.
        object:
          const: invoice
          description: Always `invoice`.
          type: string
        payment_intent:
          anyOf:
            - description: payment_intent id (`pi_` + 26 base32 chars).
              examples:
                - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Payment intent that paid the invoice.
        payment_intents:
          description: Every payment intent opened for the invoice, newest first. A settlement that arrives after the invoice is already paid or void (INV-3) stays listed here; refund it like an overpayment.
          items:
            description: payment_intent id (`pi_` + 26 base32 chars).
            examples:
              - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
          type: array
        period_end:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: End of the billed subscription period (exclusive).
        period_start:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Start of the billed subscription period.
        reminder_days:
          description: When reminders go out, in days relative to the due date (negative = before), strictly increasing, at most 10; `[]` sends none.
          items:
            description: Days relative to the due date (negative = before).
            maximum: 60
            minimum: -30
            type: integer
          maxItems: 10
          type: array
        reminders_sent:
          description: Reminders sent so far.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        sequence:
          description: Increases with every change; discard webhook objects with a lower sequence.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        settlement_destination:
          anyOf:
            - description: settlement_destination id (`sd_` + 26 base32 chars).
              examples:
                - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Destination the payment settles to; null = the account default when the payment session opens.
        status:
          description: "Invoice status (domain-model §4.5): `uncollectible` invoices can still be paid (INV-3)."
          type: string
          x-extensible-enum:
            - draft
            - open
            - paid
            - void
            - uncollectible
        status_transitions:
          additionalProperties: {}
          description: When status changes happened.
          properties:
            finalized_at:
              anyOf:
                - description: Unix time in seconds.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                - type: "null"
              description: Finalized (draft → open).
            marked_uncollectible_at:
              anyOf:
                - description: Unix time in seconds.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                - type: "null"
              description: Marked uncollectible.
            paid_at:
              anyOf:
                - description: Unix time in seconds.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                - type: "null"
              description: Paid.
            sent_at:
              anyOf:
                - description: Unix time in seconds.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                - type: "null"
              description: Last emailed to the customer.
            voided_at:
              anyOf:
                - description: Unix time in seconds.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                - type: "null"
              description: Voided.
          required:
            - finalized_at
            - sent_at
            - paid_at
            - voided_at
            - marked_uncollectible_at
          type: object
        subscription:
          anyOf:
            - description: subscription id (`sub_` + 26 base32 chars).
              examples:
                - sub_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^sub_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Subscription that produced the invoice.
        subtotal:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Σ line amounts as priced.
        tax:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Σ every tax amount (inclusive and exclusive).
        total:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "`subtotal` + exclusive taxes: what the customer pays."
        total_excluding_tax:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "`total − tax`."
        total_tax_amounts:
          description: Tax per rate across all lines (Σ of the per-line, already rounded amounts).
          items:
            $ref: "#/components/schemas/InvoiceTaxAmount"
          type: array
        uncollectible_reason:
          anyOf:
            - description: Why the invoice became uncollectible.
              type: string
              x-extensible-enum:
                - merchant
                - dunning_exhausted
            - type: "null"
          description: Set when `status` is or was `uncollectible`.
      required:
        - id
        - object
        - created
        - livemode
        - status
        - number
        - customer
        - subscription
        - billing_reason
        - collection_method
        - currency
        - asset_id
        - description
        - footer
        - lines
        - default_tax_rates
        - subtotal
        - tax
        - total
        - total_excluding_tax
        - total_tax_amounts
        - amount_due
        - amount_paid
        - amount_remaining
        - days_until_due
        - due_date
        - period_start
        - period_end
        - settlement_destination
        - reminder_days
        - reminders_sent
        - next_reminder_at
        - hosted_invoice_url
        - invoice_pdf
        - checkout_session
        - payment_intent
        - payment_intents
        - status_transitions
        - uncollectible_reason
        - metadata
        - sequence
      type: object
    InvoiceLineItem:
      additionalProperties: {}
      description: One line of an invoice.
      properties:
        amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "`unit_amount × quantity` (inclusive taxes stay inside)."
        amount_excluding_tax:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "`amount` less this line's inclusive taxes."
        description:
          description: Text on the invoice (product name or the given description).
          type: string
        id:
          description: invoice_line_item id (`il_` + 26 base32 chars).
          examples:
            - il_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^il_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        object:
          const: line_item
          description: Always `line_item`.
          type: string
        period:
          anyOf:
            - additionalProperties: {}
              properties:
                end:
                  description: Period end (exclusive).
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                start:
                  description: Period start.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
              required:
                - start
                - end
              type: object
            - type: "null"
          description: Service period of a `subscription` line; null for one-off lines.
        price:
          anyOf:
            - description: price id (`price_` + 26 base32 chars).
              examples:
                - price_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^price_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Price the line was created from; null for a custom amount.
        product:
          anyOf:
            - description: product id (`prod_` + 26 base32 chars).
              examples:
                - prod_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^prod_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Product of `price`.
        quantity:
          description: Quantity.
          maximum: 9007199254740991
          minimum: 1
          type: integer
        subscription_item:
          anyOf:
            - description: subscription_item id (`si_` + 26 base32 chars).
              examples:
                - si_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^si_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Subscription item of a `subscription` line.
        tax_amounts:
          description: Tax per rate for this line.
          items:
            $ref: "#/components/schemas/InvoiceTaxAmount"
          type: array
        tax_rates:
          description: Tax rates applied to the line (all inclusive or all exclusive).
          items:
            description: tax_rate id (`txr_` + 26 base32 chars).
            examples:
              - txr_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^txr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
          type: array
        type:
          description: A one-off line or a subscription item's line.
          type: string
          x-extensible-enum:
            - invoiceitem
            - subscription
        unit_amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Price per unit in the invoice currency.
      required:
        - id
        - object
        - type
        - price
        - product
        - subscription_item
        - description
        - quantity
        - unit_amount
        - amount
        - amount_excluding_tax
        - tax_rates
        - tax_amounts
        - period
      type: object
    InvoiceReminderEvent:
      additionalProperties: {}
      description: A scheduled reminder of an unpaid invoice fell due (ids only; notify mails `invoice.reminder`).
      properties:
        customer:
          description: customer id (`cus_` + 26 base32 chars).
          examples:
            - cus_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cus_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        due_date:
          description: Due date of the invoice.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        invoice:
          description: invoice id (`in_` + 26 base32 chars).
          examples:
            - in_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^in_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        last:
          description: The last reminder of the schedule (dunning exhausts after it if still unpaid).
          type: boolean
        number:
          description: 1-based reminder number (notify passes it as `?reminder=`).
          maximum: 9007199254740991
          minimum: 1
          type: integer
        offset_days:
          description: Days relative to the due date (negative = before).
          maximum: 9007199254740991
          minimum: -9007199254740991
          type: integer
        subscription:
          anyOf:
            - description: subscription id (`sub_` + 26 base32 chars).
              examples:
                - sub_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^sub_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Subscription of the invoice.
      required:
        - invoice
        - customer
        - subscription
        - number
        - offset_days
        - due_date
        - last
      type: object
    InvoiceTaxAmount:
      additionalProperties: {}
      description: One tax rate applied to an amount (snapshot; immutable once open).
      properties:
        amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Tax of this line for this rate, rounded half-up per line.
        display_name:
          description: Tax-rate name at finalize (snapshot).
          type: string
        inclusive:
          description: The line amount contains this tax.
          type: boolean
        percentage:
          description: Exact percentage as a decimal string, 0–100 with at most 4 decimals (the rate is the rational `ppm / 1 000 000`, ppm = percentage × 10 000). No floats.
          examples:
            - "19"
            - "8.875"
          pattern: ^(100(\.0{1,4})?|[1-9]?[0-9](\.[0-9]{1,4})?)$
          type: string
        tax_rate:
          description: tax_rate id (`txr_` + 26 base32 chars).
          examples:
            - txr_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^txr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        taxable_amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "Amount the rate applies to: the line amount (exclusive) or the line amount less its inclusive taxes."
      required:
        - tax_rate
        - display_name
        - percentage
        - inclusive
        - amount
        - taxable_amount
      type: object
    KillSwitchEvent:
      additionalProperties: {}
