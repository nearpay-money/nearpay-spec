          type: string
        late:
          description: Settled after its checkout session expired (INV-3).
          type: boolean
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Up to 50 key/value pairs (key ≤ 40 chars, value ≤ 500 chars) for your own use.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        object:
          const: payment_intent
          description: Always `payment_intent`.
          type: string
        overpayments:
          description: Settlements beyond the one that paid the intent (refund recommended).
          items:
            additionalProperties: {}
            description: An extra settlement.
            properties:
              amount:
                description: Extra amount that settled, base units.
                pattern: ^(0|[1-9][0-9]{0,77})$
                type: string
              attempt:
                description: payment_attempt id (`pa_` + 26 base32 chars).
                examples:
                  - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
                pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                type: string
              reason:
                description: Why it counts as an overpayment.
                type: string
                x-extensible-enum:
                  - duplicate
                  - after_cancel
                  - after_expiry
            required:
              - attempt
              - amount
              - reason
            type: object
          type: array
        review_reason:
          anyOf:
            - description: Why the intent needs review.
              type: string
              x-extensible-enum:
                - short_settlement
                - verification_held
            - type: "null"
        sequence:
          description: Increases with every change; discard webhook objects with a lower sequence.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        settlement_asset_id:
          description: Asset the merchant receives.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        source:
          description: What created the intent.
          type: string
          x-extensible-enum:
            - checkout
            - invoice
            - payment_link
            - api
        status:
          description: Payment intent status (domain-model §4.2).
          type: string
          x-extensible-enum:
            - requires_payment
            - processing
            - requires_review
            - succeeded
            - canceled
            - expired
        succeeded_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the intent succeeded.
      required:
        - id
        - object
        - created
        - livemode
        - status
        - amount
        - currency
        - asset_id
        - description
        - source
        - checkout_session
        - destination
        - fee
        - settlement_asset_id
        - amount_settled
        - amount_refunded
        - succeeded_at
        - late
        - canceled_at
        - cancellation_reason
        - review_reason
        - attempts
        - overpayments
        - sequence
        - metadata
      type: object
    PolicyUpdatedEvent:
      additionalProperties: {}
      description: Geo policy changed.
      properties:
        blocked_countries:
          description: Blocked countries.
          items:
            description: ISO 3166-1 alpha-2 country code, upper-case.
            pattern: ^[A-Z]{2}$
            type: string
          type: array
        blocked_regions:
          description: Blocked regions.
          items:
            type: string
          type: array
        version:
          description: Policy version.
          type: string
      required:
        - version
        - blocked_countries
        - blocked_regions
      type: object
    PriceSnapshot:
      additionalProperties: {}
      description: Prices used to compute the settlement amount (INV-6).
      properties:
        as_of:
          description: When prices were read.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        fx:
          description: FX rate pricing currency → USD (decimal string), null for USD.
          type:
            - string
            - "null"
        par:
          description: Settled at par (USD stablecoin, depeg guard passed).
          type: boolean
        primary_usd:
          description: Primary USD price of the settlement asset (decimal string).
          type:
            - string
            - "null"
        secondary_usd:
          description: Secondary USD price (decimal string).
          type:
            - string
            - "null"
      required:
        - primary_usd
        - secondary_usd
        - fx
        - par
        - as_of
      type: object
    Review:
      additionalProperties: {}
      description: A compliance review of a payment (payment stands; INV-1).
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        closed_at:
          anyOf:
            - description: RFC 3339 UTC timestamp, e.g. `2026-11-05T10:00:00.000Z`.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            - type: "null"
          description: Closed.
        id:
          description: compliance_case id (`case_` + 26 base32 chars).
          examples:
            - case_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^case_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        object:
          const: review
          description: Always `review`.
          type: string
        opened_at:
          description: Opened.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        reason:
          description: Why.
          type: string
          x-extensible-enum:
            - post_screen_hit
            - held_execution
            - audit_mismatch
            - screening_hit
        status:
          description: Review status.
          type: string
          x-extensible-enum:
            - open
            - closed
        subject:
          additionalProperties: {}
          description: What is under review.
          properties:
            id:
              description: Reviewed object id.
              type: string
            type:
              description: "Reviewed object type (`execution`: a rails execution; payments maps it to its payment intent)."
              type: string
              x-extensible-enum:
                - payment_intent
                - agent_payment
                - settlement_destination
                - execution
          required:
            - type
            - id
          type: object
      required:
        - id
        - object
        - account_id
        - subject
        - reason
        - status
        - opened_at
        - closed_at
      type: object
    UsdAmount:
      additionalProperties: {}
      description: An amount in US dollars (minor units).
      properties:
        amount:
          description: Fiat amount in minor units (e.g. cents), integer.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        currency:
          const: usd
          description: Always `usd`.
          type: string
      required:
        - amount
        - currency
      type: object
defaultContentType: application/json
