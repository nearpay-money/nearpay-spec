  schemas:
    Account:
      additionalProperties: {}
      description: A merchant account.
      properties:
        api_version:
          description: API version pinned for this account.
          enum:
            - 2026-11-01
          type: string
        country:
          anyOf:
            - description: ISO 3166-1 alpha-2 country code, upper-case.
              pattern: ^[A-Z]{2}$
              type: string
            - type: "null"
          description: Country of the merchant.
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        display_name:
          description: Name shown to payers until KYB verifies a legal name.
          maxLength: 100
          minLength: 1
          type: string
        fee_bearer:
          description: "Who bears NearPay's fee: the payer pays it on top (default) or it is deducted from the settlement."
          enum:
            - payer
            - merchant
          type: string
        id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        kyb_status:
          description: KYB status.
          type: string
          x-extensible-enum:
            - not_started
            - pending
            - needs_info
            - approved
            - rejected
        live_enabled:
          description: "Live mode is enabled: KYB approved, an active live destination, status active."
          type: boolean
        object:
          const: account
          description: Always `account`.
          type: string
        settings:
          $ref: "#/components/schemas/AccountSettings"
        status:
          description: Account status.
          type: string
          x-extensible-enum:
            - active
            - suspended
            - closed
        verified_legal_name:
          description: Legal name approved by NearPay's KYB review (self-declared business details reviewed by ops), shown on checkout once set.
          type:
            - string
            - "null"
      required:
        - id
        - object
        - created
        - display_name
        - verified_legal_name
        - country
        - status
        - kyb_status
        - live_enabled
        - fee_bearer
        - api_version
        - settings
      type: object
    AccountSettings:
      additionalProperties: {}
      description: Merchant settings that change checkout behaviour.
      properties:
        branding:
          additionalProperties: {}
          description: Checkout branding.
          properties:
            accent_color:
              anyOf:
                - pattern: ^#[0-9a-fA-F]{6}$
                  type: string
                - type: "null"
              description: Accent colour `#RRGGBB`.
            logo_url:
              anyOf:
                - description: Absolute URL.
                  format: uri
                  maxLength: 2048
                  type: string
                - type: "null"
              description: HTTPS URL of a square logo.
          required:
            - accent_color
            - logo_url
          type: object
        email_receipts:
          description: Email a receipt to the customer when a payment succeeds.
          type: boolean
        late_payments:
          description: Accept settlements that arrive after a session expired (INV-3); default false.
          type: boolean
        session_ttl_default:
          description: Default checkout-session lifetime in seconds.
          maximum: 86400
          minimum: 300
          type: integer
        underpay_tolerance_bps:
          description: Accept short settlements within this tolerance (0–100 bps); default 0.
          maximum: 10000
          minimum: 0
          type: integer
      required:
        - late_payments
        - underpay_tolerance_bps
        - session_ttl_default
        - email_receipts
        - branding
      type: object
    AccountStatusEvent:
      additionalProperties: {}
      description: Compliance suspended or reinstated an account.
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        reason:
          description: Reason.
          type: string
      required:
        - account_id
        - reason
      type: object
    AgentPayment:
      additionalProperties: {}
      description: A payer-signed NEAR Intents payment relayed by NearPay.
      properties:
        amount:
          description: Amount to the merchant, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          description: Asset.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        binding:
          description: Binding memo `np1:` + base58(sha256(…)) tying a signed transfer to one requirement.
          pattern: ^np1:[1-9A-HJ-NP-Za-km-z]{43,44}$
          type: string
        block_height:
          anyOf:
            - maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Block of the transaction.
        checkout_session:
          anyOf:
            - description: checkout_session id (`cs_` + 26 base32 chars).
              examples:
                - cs_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^cs_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Checkout session paid (checkout kind).
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        error_reason:
          description: Why it failed.
          type:
            - string
            - "null"
        fee_amount:
          description: NearPay fee, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        id:
          description: agent_payment id (`ap_` + 26 base32 chars).
          examples:
            - ap_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^ap_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        kind:
          description: What the signed payload paid for.
          type: string
          x-extensible-enum:
            - x402
            - checkout
            - refund
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        object:
          const: agent_payment
          description: Always `agent_payment`.
          type: string
        pay_to:
          description: Merchant Intents account.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        payer:
          description: Payer Intents account (signer).
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        resource_url:
          anyOf:
            - format: uri
              type: string
            - type: "null"
          description: Paid resource (x402).
        sequence:
          description: Increases with every change; discard webhook objects with a lower sequence. Servers MUST send it (optional in the 0.1.x schema only so readers built on 0.1.4 stay compatible).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        settled_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When it settled (final).
        status:
          description: Relay status.
          type: string
          x-extensible-enum:
            - verified
            - queued
            - submitted
            - settled
            - failed
        tx_hash:
          anyOf:
            - description: Transaction hash in the chain's text form.
              maxLength: 128
              minLength: 8
              type: string
            - type: "null"
          description: NEAR transaction that executed the payload.
      required:
        - id
        - object
        - created
        - livemode
        - kind
        - status
        - payer
        - pay_to
        - asset_id
        - amount
        - fee_amount
        - binding
        - resource_url
        - checkout_session
        - tx_hash
        - block_height
        - error_reason
        - settled_at
      type: object
    ApiKeyEvent:
      additionalProperties: {}
      description: API key record (never the secret).
      properties:
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        display_prefix:
          description: Key prefix, e.g. `sk_live_`.
          type: string
        expires_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Expiry, if set.
        id:
          description: api_key id (`key_` + 26 base32 chars).
          examples:
            - key_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^key_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        ip_allowlist:
          description: CIDR ranges allowed to use the key; empty = any.
          items:
            type: string
          type: array
        last4:
          description: Last four characters of the key.
          maxLength: 4
          minLength: 4
          type: string
        last_used_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Last use (updated at most every minute).
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        name:
          description: Name given when the key was created.
          type: string
        object:
          const: api_key
          description: Always `api_key`.
          type: string
        scopes:
          description: Scopes of a restricted key; empty for secret and publishable keys.
          items:
            type: string
          type: array
        type:
          description: Key type.
          type: string
          x-extensible-enum:
            - secret
            - publishable
            - restricted
      required:
        - id
        - object
        - created
        - livemode
        - type
        - name
        - display_prefix
        - last4
        - scopes
        - ip_allowlist
        - expires_at
        - last_used_at
      type: object
    AttestationChallenge:
      additionalProperties: {}
      description: Message proving control of a settlement destination (FR-SET-02).
      properties:
        expires_at:
          description: Challenge expiry (10 minutes).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        id:
          description: attestation_challenge id (`chl_` + 26 base32 chars).
          examples:
            - chl_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^chl_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        message:
          description: Exact UTF-8 message the destination key must sign.
          type: string
        nonce:
          anyOf:
            - pattern: ^[A-Za-z0-9+/]{43}=$
              type: string
            - type: "null"
          description: NEP-413 nonce (32 bytes, base64); null for other standards.
        recipient:
          description: NEP-413 recipient (`nearpay.money`); null for other standards.
          type:
            - string
            - "null"
        signing_standard:
          description: How to sign the message.
          type: string
          x-extensible-enum:
            - nep413
            - eip191
            - solana
            - bip322
      required:
        - id
        - message
        - signing_standard
        - nonce
        - recipient
        - expires_at
      type: object
    AuditFinding:
      additionalProperties: {}
      description: Sentinel independent re-verification finding.
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        check_kind:
          description: Which independent check ran.
          type: string
        details:
          additionalProperties: {}
          description: Details.
          propertyNames:
            type: string
          type: object
        execution_id:
          description: execution id (`ex_` + 26 base32 chars).
          examples:
            - ex_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^ex_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        id:
          description: audit_finding id (`fnd_` + 26 base32 chars).
          examples:
            - fnd_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^fnd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        livemode:
          description: Mode.
          type: boolean
        result:
          description: Result.
          type: string
          x-extensible-enum:
            - pass
            - mismatch
            - unverifiable
      required:
        - id
        - execution_id
        - account_id
        - livemode
        - check_kind
        - result
        - details
      type: object
    CheckoutSessionEvent:
      additionalProperties: {}
      description: Checkout session snapshot (no secrets).
      properties:
        allowed_origins:
          description: Origins that may embed the session (embedded mode).
          items:
            type: string
          type: array
        amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "Fiat: integer minor units. Asset: base units as a decimal string."
        asset_id:
          anyOf:
            - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            - type: "null"
          description: Pricing asset when `currency` is `asset`.
        cancel_url:
          anyOf:
            - description: Absolute URL.
              format: uri
              maxLength: 2048
              type: string
            - type: "null"
          description: Where the payer goes on cancel.
        client_secret:
          description: Always null on the bus.
          type: "null"
        completed_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the session completed.
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: ISO 4217 code for fiat pricing, or `asset` when priced in an asset (then `asset_id` is set).
        customer:
          anyOf:
            - description: customer id (`cus_` + 26 base32 chars).
              examples:
                - cus_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^cus_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Customer attached to the session (Stage 2).
        description:
          description: Description shown to the payer.
          type:
            - string
            - "null"
        expires_at:
          description: When the session stops accepting new payments.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        id:
          description: checkout_session id (`cs_` + 26 base32 chars).
          examples:
            - cs_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cs_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        late:
          description: Completed by a settlement after expiry.
          type: boolean
        late_payments:
          description: Accept settlements after expiry.
          type: boolean
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        locale:
          description: Checkout locale.
          type:
            - string
            - "null"
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Up to 50 key/value pairs (key ≤ 40 chars, value ≤ 500 chars) for your own use.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        object:
          const: checkout_session
          description: Always `checkout_session`.
          type: string
        payment_intent:
          anyOf:
            - description: payment_intent id (`pi_` + 26 base32 chars).
              examples:
                - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - $ref: "#/components/schemas/PaymentIntent"
          description: Payment intent id, or the object with `expand[]=payment_intent`.
        payment_link:
          anyOf:
            - description: payment_link id (`plink_` + 26 base32 chars).
              examples:
                - plink_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^plink_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Payment link that opened the session (Stage 2).
        sequence:
          description: Increases with every change; discard webhook objects with a lower sequence. Servers MUST send it (optional in the 0.1.x schema only so readers built on 0.1.4 stay compatible).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        settlement_destination:
          description: settlement_destination id (`sd_` + 26 base32 chars).
          examples:
            - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        status:
          description: Session status; `expiring` means past `expires_at` with money possibly in flight (INV-3).
          type: string
          x-extensible-enum:
            - open
            - expiring
            - complete
            - expired
        success_url:
          description: Where the payer goes after paying (`?session_id=` is appended).
          format: uri
          maxLength: 2048
          type: string
        ui_mode:
          description: Hosted page or embedded iframe.
          enum:
            - hosted
            - embedded
          type: string
        url:
          description: Always null on the bus.
          type: "null"
      required:
        - id
        - object
        - created
        - livemode
        - status
        - url
        - client_secret
        - expires_at
        - payment_intent
        - amount
        - currency
        - asset_id
        - settlement_destination
        - ui_mode
        - success_url
        - cancel_url
        - description
        - allowed_origins
        - late_payments
        - locale
        - completed_at
        - late
        - metadata
      type: object
    DestinationBlockedEvent:
      additionalProperties: {}
      description: Compliance blocked a destination.
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        destination_id:
          description: settlement_destination id (`sd_` + 26 base32 chars).
          examples:
            - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        reason:
          description: Why it was blocked.
          type: string
      required:
        - destination_id
        - account_id
        - reason
      type: object
    DestinationSnapshot:
      additionalProperties: {}
      description: Settlement destination as snapshotted at creation (INV-6).
      properties:
        address:
          description: Settlement address or Intents account.
          maxLength: 256
          minLength: 1
          type: string
        asset_id:
          description: Settlement asset.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        chain:
          description: Settlement chain.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        fingerprint:
          anyOf:
            - pattern: ^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{2}$
              type: string
            - type: "null"
          description: Fingerprint of the destination as shown at checkout (CR-15-04, spec 0.2.0); optional so older servers stay valid.
        settlement_destination:
          description: settlement_destination id (`sd_` + 26 base32 chars).
          examples:
            - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        type:
          description: "Where funds settle: an address on a chain, or a NEAR Intents account."
          enum:
            - chain_address
            - intents_account
          type: string
      required:
        - settlement_destination
        - asset_id
        - type
        - chain
        - address
      type: object
    EndpointDisabledEvent:
      additionalProperties: {}
      description: A webhook endpoint was disabled after 72 h of failures.
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        endpoint_id:
          description: webhook_endpoint id (`we_` + 26 base32 chars).
          examples:
            - we_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^we_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        failing_since:
          description: First failure of the streak.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        reason:
          description: Why.
          type: string
          x-extensible-enum:
            - failing
        url:
          description: Endpoint URL.
          format: uri
          type: string
      required:
        - endpoint_id
        - account_id
        - url
        - reason
        - failing_since
      type: object
    Evidence:
      additionalProperties: {}
      description: Independent on-chain proof that a settlement reached the merchant (INV-2).
      properties:
        amount:
          description: Amount received by the recipient, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          description: Asset that settled.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        block_ref:
          description: Block height or hash containing the transaction.
          type:
            - string
            - "null"
        chain:
          description: Chain where the settlement happened.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        explorer_url:
          anyOf:
            - format: uri
              type: string
            - type: "null"
          description: Block-explorer link for the transaction.
        finality:
          description: Finality reached when the evidence was accepted.
          type: string
          x-extensible-enum:
            - final
            - finalized
            - confirmed
        observed_at:
          description: When NearPay accepted the evidence.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        recipient:
          description: Recipient that received the funds (the merchant destination).
          maxLength: 256
          minLength: 1
          type: string
        source:
          description: Detector that produced the evidence.
          type: string
          x-extensible-enum:
            - watcher
            - indexer
            - verifier
            - provider
            - operator
        tier:
          description: "Verification tier: A = independently verified on chain, B = provider-attested within limits."
          type: string
          x-extensible-enum:
            - A
            - B
        tx_hash:
          description: Settlement transaction (NEAR receipt / tx hash for Intents).
          maxLength: 128
          minLength: 8
          type: string
      required:
        - chain
        - tx_hash
        - block_ref
        - recipient
        - asset_id
        - amount
        - finality
        - tier
        - source
        - observed_at
        - explorer_url
      type: object
    Execution:
      additionalProperties: {}
      description: A provider run moving value for a payment (rails owns).
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        applied_fee_bps:
          description: Fee bps applied.
          maximum: 10000
          minimum: 0
          type: integer
        created_at:
          description: Created.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        deadline:
          description: Execution deadline.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        deposit:
          anyOf:
            - $ref: "#/components/schemas/ExecutionDeposit"
            - type: "null"
