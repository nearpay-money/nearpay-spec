        - object
        - created
        - livemode
        - kind
        - status
        - payer
        - pay_to
        - asset_id
        - amount
        - fee_amount
        - binding
        - resource_url
        - checkout_session
        - tx_hash
        - block_height
        - error_reason
        - settled_at
      type: object
    ApiKeyEvent:
      additionalProperties: {}
