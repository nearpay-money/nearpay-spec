            - incomplete_deposit
            - settling
            - verifying
            - succeeded
            - refunded
            - failed
            - expired_unpaid
            - held
      required:
        - id
        - object
        - created
        - status
        - method
        - origin_asset_id
        - origin_chain
        - settlement_amount
        - settled_amount
        - deadline
        - is_overpayment
        - failure_code
        - evidence
