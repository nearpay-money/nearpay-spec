    Refund:
      additionalProperties: {}
      description: Money returned to a payer, signed by the merchant (non-custodial).
      properties:
        amount:
          description: Refunded amount, base units of `asset_id`.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        amount_received:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: What the payer received, base units of `recipient.asset_id` (from evidence).
        asset_id:
          description: Settlement asset the amount is in.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        canceled_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the merchant canceled.
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        decimals:
          description: Decimals of `asset_id`.
          maximum: 255
          minimum: 0
          type: integer
        evidence:
          anyOf:
            - $ref: "#/components/schemas/Evidence"
            - type: "null"
          description: Payer-side evidence of the leg that refunded the payer (INV-2).
        extra_amount_sent:
          description: Settlement-asset amount sent by duplicate legs (signed and sent after another leg had refunded the payer); `0` normally.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        failure_code:
          description: Why the refund failed (the last leg's code).
          type:
            - string
            - "null"
        fee_mode:
          description: "`payer_absorbs` (default, `EXACT_INPUT`): the merchant sends `amount`, the payer receives it minus route costs. `merchant_absorbs` (`EXACT_OUTPUT`): the payer receives the equivalent of `amount`; the merchant sends slightly more."
          enum:
            - payer_absorbs
            - merchant_absorbs
          type: string
        id:
          description: refund id (`re_` + 26 base32 chars).
          examples:
            - re_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^re_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        legs:
          description: Legs, newest first.
          items:
            $ref: "#/components/schemas/RefundLeg"
          type: array
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Up to 50 key/value pairs (key ≤ 40 chars, value ≤ 500 chars) for your own use.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        method:
          description: "`route_quote`: a 1Click route back to the payer's origin chain and asset. `intents_transfer`: a merchant-signed Verifier transfer to the payer's Intents account (refund of an `intents_transfer` payment; no route provider)."
          type: string
          x-extensible-enum:
            - route_quote
            - intents_transfer
        next_action:
          anyOf:
            - $ref: "#/components/schemas/RefundNextAction"
            - type: "null"
          description: Present in `requires_action` once the current leg is prepared; null while it is being prepared and in every other status.
        object:
          const: refund
          description: Always `refund`.
          type: string
        payment_attempt:
          description: Attempt whose settlement is refunded (the paying attempt, or an overpayment).
          examples:
            - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        payment_intent:
          description: payment_intent id (`pi_` + 26 base32 chars).
          examples:
            - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        reason:
          anyOf:
            - description: Why the merchant refunds.
              type: string
              x-extensible-enum:
                - requested_by_customer
                - duplicate
                - fraudulent
                - overpayment
                - other
            - type: "null"
        recipient:
          $ref: "#/components/schemas/RefundRecipient"
        sequence:
          description: Increases with every change; discard webhook objects with a lower sequence.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        source:
          description: What created the refund.
          type: string
          x-extensible-enum:
            - api
            - dashboard
            - review_rejection
        status:
          description: "Refund status (domain-model §4.4): `requires_action` = waiting for the merchant's signature; `pending` = the merchant's funds were detected and are on their way; `failed` = the provider returned them to the merchant (prepare again to retry)."
          type: string
          x-extensible-enum:
            - requires_action
            - pending
            - succeeded
            - failed
            - canceled
        succeeded_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the payer-side evidence was verified.
      required:
        - id
        - object
        - created
        - livemode
        - status
        - payment_intent
        - payment_attempt
        - amount
        - asset_id
        - decimals
        - fee_mode
        - reason
        - method
        - recipient
        - next_action
        - legs
        - amount_received
        - evidence
        - extra_amount_sent
        - source
        - failure_code
        - succeeded_at
        - canceled_at
        - sequence
        - metadata
      type: object
    RefundLeg:
      additionalProperties: {}
      description: One prepared route or transfer for a refund.
      properties:
        amount:
          description: What the merchant sends, base units of the settlement asset.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        amount_out_expected:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: What the payer is expected to receive, base units of the recipient asset (route estimate).
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        deadline:
          description: Sign and send before this time.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        duplicate:
          description: Settled after another leg had already refunded the payer (recorded in `extra_amount_sent`).
          type: boolean
        evidence:
          anyOf:
            - $ref: "#/components/schemas/Evidence"
            - type: "null"
          description: Payer-side evidence once verified (INV-2).
        failure_code:
          description: Why the leg failed, returned or was held.
          type:
            - string
            - "null"
        method:
          description: "`route_quote`: a 1Click route back to the payer's origin chain and asset. `intents_transfer`: a merchant-signed Verifier transfer to the payer's Intents account (refund of an `intents_transfer` payment; no route provider)."
          type: string
          x-extensible-enum:
            - route_quote
            - intents_transfer
        number:
          description: Leg number, 1-based; a re-prepared refund gets a new leg.
          maximum: 9007199254740991
          minimum: 1
          type: integer
        status:
          description: "Leg status: `returned` = the provider sent the funds back to the merchant destination; `expired` = the deadline passed without a deposit."
          type: string
          x-extensible-enum:
            - awaiting_signature
            - submitted
            - processing
            - succeeded
            - returned
            - failed
            - expired
            - held
        submitted_tx:
          anyOf:
            - description: Transaction hash in the chain's text form.
              maxLength: 128
              minLength: 8
              type: string
            - type: "null"
          description: Transaction the merchant reported, or the relayed Intents transaction.
        swap_type:
          anyOf:
            - description: How the route leg was quoted.
              enum:
                - EXACT_INPUT
                - EXACT_OUTPUT
              type: string
            - type: "null"
          description: "Route legs: how the quote was made; null for Intents transfers."
      required:
        - number
        - status
        - method
        - swap_type
        - amount
        - amount_out_expected
        - deadline
        - submitted_tx
        - duplicate
        - evidence
        - failure_code
        - created
      type: object
    RefundNextAction:
      description: What the merchant signs for the current leg. Wallets build exactly this (never another recipient or amount; dashboard §1).
      oneOf:
        - $ref: "#/components/schemas/RefundSignAndSend"
        - $ref: "#/components/schemas/RefundSignIntent"
    RefundRecipient:
      additionalProperties: {}
      description: "Where the refund goes (INV-7: the payer's recorded refund address)."
      properties:
        address:
          description: Payer's refund address (or Intents account).
          maxLength: 256
          minLength: 1
          type: string
        asset_id:
          description: Asset the payer receives (the asset they paid with).
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        chain:
          description: Chain the payer receives on.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        overridden:
          description: An owner replaced the recorded refund address (INV-7).
          type: boolean
        type:
          description: Address on the origin chain, or a NEAR Intents account.
          enum:
            - origin_chain
            - intents
          type: string
      required:
        - address
        - asset_id
        - chain
        - type
        - overridden
      type: object
    RefundSignAndSend:
      additionalProperties: {}
      description: "Next action: transfer exactly `amount` of `asset_id` from `from` to `to` on `chain`."
      properties:
        amount:
          description: Exact amount to send, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          description: Asset to send (the settlement asset).
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        chain:
          description: Chain to send on (the settlement destination's chain).
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        deadline:
          description: Send before this time; later deposits return to `from`.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        decimals:
          description: Token decimals.
          maximum: 255
          minimum: 0
          type: integer
        display:
          description: Human-readable summary, e.g. `Send 2.000000 USDC on Base to 0xab…`.
          type: string
        from:
          description: The settlement destination address; sign with this wallet (refunds of the route go back to it).
          maxLength: 256
          minLength: 1
          type: string
        memo:
          description: Memo the transfer must carry, if any.
          type:
            - string
            - "null"
        symbol:
          description: Token symbol.
          type: string
        to:
          description: 1Click deposit address of this leg.
          maxLength: 256
          minLength: 1
          type: string
        token:
          $ref: "#/components/schemas/TokenRef"
        type:
          const: sign_and_send
          description: Sign and broadcast a transfer on `chain`.
          type: string
      required:
        - type
        - chain
        - from
        - to
        - asset_id
        - token
        - symbol
        - decimals
        - amount
        - memo
        - deadline
        - display
      type: object
    RefundSignIntent:
      additionalProperties: {}
      description: "Next action: sign this Verifier transfer with the merchant's Intents account."
      properties:
        deadline:
          description: The payload's deadline; after it, prepare a new leg.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        display:
          description: Human-readable summary, e.g. `Transfer 2.000000 USDC to payer.near`.
          type: string
        message:
          allOf:
            - $ref: "#/components/schemas/IntentMessage"
          description: Parsed payload, for display and checks; sign `nep413.message` or `payload`.
        nep413:
          additionalProperties: {}
          description: Arguments for a NEP-413 `signMessage` call, used verbatim.
          properties:
            message:
              description: Exact NEP-413 `message` (JSON string of `Nep413IntentMessage`).
              minLength: 2
              type: string
            nonce:
              description: 32-byte nonce (4-byte Verifier salt ‖ 28 random bytes), standard base64.
              pattern: ^[A-Za-z0-9+/]{43}=$
              type: string
            recipient:
              const: intents.near
              description: NEP-413 recipient.
              type: string
          required:
            - recipient
            - nonce
            - message
          type: object
        payload:
          description: Exact string to sign for `erc191` / `raw_ed25519` (JSON of `IntentMessage`, same nonce).
          minLength: 2
          type: string
        signer_id:
          description: The merchant's Intents account (the settlement destination).
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        standards:
          description: Signing standards accepted for `signer_id` (`nep413` for NEAR wallets, `erc191` for 0x accounts).
          items:
            description: Signing standard supported by NearPay.
            enum:
              - nep413
              - erc191
              - raw_ed25519
            type: string
          minItems: 1
          type: array
        transfer:
          additionalProperties: {}
          description: The single transfer the payload contains (for the human-readable summary).
          properties:
            amount:
              description: Amount, base units.
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            memo:
              description: Binding memo of this leg.
              pattern: ^np1:[1-9A-HJ-NP-Za-km-z]{43,44}$
              type: string
            receiver_id:
              description: Payer's Intents account (`intents_transfer`) or the 1Click Intents deposit address (`route_quote`).
              pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
              type: string
            token:
              description: Asset transferred.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
          required:
            - receiver_id
            - token
            - amount
            - memo
          type: object
        type:
          const: sign_intent
          description: Sign a NEAR Intents payload; submit it with `submit_tx`.
          type: string
      required:
        - type
        - signer_id
        - transfer
        - standards
        - nep413
        - payload
        - message
        - deadline
        - display
      type: object
    RefundTransfer:
      additionalProperties: {}
      description: "What a merchant signs for a refund leg from an Intents account: exactly one transfer, memo = binding."
      properties:
        amount:
          description: Amount, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        deadline:
          description: Latest acceptable payload deadline.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        memo:
          description: Binding memo the transfer must carry (agentpay matches it; the indexer attributes by it).
          pattern: ^np1:[1-9A-HJ-NP-Za-km-z]{43,44}$
          type: string
        nonce:
          anyOf:
            - description: 32-byte nonce (4-byte Verifier salt ‖ 28 random bytes), standard base64.
              pattern: ^[A-Za-z0-9+/]{43}=$
              type: string
            - type: "null"
          description: Nonce to sign with (current Verifier salt ‖ 28 random bytes), issued by rails when it prepares the leg; payments copies it into `next_action` unchanged. Absent from rails before 0.2.1 (payments then derives it from the salt itself).
        receiver_id:
          description: Payer Intents account (`intents_transfer` leg) or the 1Click INTENTS deposit address (`route_quote` leg).
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        signer_id:
          description: Merchant Intents account (the settlement destination) that signs.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        token:
          description: Asset transferred (the settlement asset).
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
      required:
        - signer_id
        - receiver_id
        - token
        - amount
        - memo
        - deadline
      type: object
    Review:
      additionalProperties: {}
      description: A compliance review of a payment (payment stands; INV-1).
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        closed_at:
          anyOf:
            - description: RFC 3339 UTC timestamp, e.g. `2026-11-05T10:00:00.000Z`.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            - type: "null"
          description: Closed.
        id:
          description: compliance_case id (`case_` + 26 base32 chars).
          examples:
            - case_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^case_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        object:
          const: review
          description: Always `review`.
          type: string
        opened_at:
          description: Opened.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        payment_intent:
          anyOf:
            - description: payment_intent id (`pi_` + 26 base32 chars).
              examples:
                - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Payment intent of an `execution` subject (from `Execution.reference`); webhooks shows such a review as one of this intent.
        reason:
          description: Why.
          type: string
          x-extensible-enum:
            - post_screen_hit
            - held_execution
            - audit_mismatch
            - screening_hit
        status:
          description: Review status.
          type: string
          x-extensible-enum:
            - open
            - closed
        subject:
          additionalProperties: {}
          description: What is under review.
          properties:
            id:
              description: Reviewed object id.
              type: string
            type:
              description: "Reviewed object type (`execution`: a rails execution; payments maps it to its payment intent)."
              type: string
              x-extensible-enum:
                - payment_intent
                - agent_payment
                - settlement_destination
                - execution
          required:
            - type
            - id
          type: object
      required:
        - id
        - object
        - account_id
        - subject
        - reason
        - status
        - opened_at
        - closed_at
      type: object
    SolanaEvidence:
      additionalProperties: {}
      description: Solana-specific settlement detail (token-balance delta).
      properties:
        block_time:
          anyOf:
            - maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Block time, unix seconds; null when the node has none.
        mint:
          anyOf:
            - description: "Solana address: base58 of 32 bytes (ed25519 public key or program-derived address)."
              examples:
                - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
              pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
              type: string
            - type: "null"
          description: SPL mint that settled; null for native SOL (lamports).
        owner:
          description: Wallet whose balance rose (= `Evidence.recipient`, the merchant destination).
          examples:
            - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
          type: string
        post_amount:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Owner's balance of the mint after the transaction; null when the detector did not read balances (test mode).
        pre_amount:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Owner's balance of the mint before the transaction (`meta.preTokenBalances` / `preBalances`); null when the detector did not read balances (test mode).
        signature:
          description: Transaction signature (= `Evidence.tx_hash`).
          pattern: ^[1-9A-HJ-NP-Za-km-z]{64,88}$
          type: string
        slot:
          description: Slot of the block that contains the transaction (= `Evidence.block_ref`).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        token_accounts:
          description: Token accounts of `owner` for `mint` whose balance changed (usually its ATA); empty for SOL.
          items:
            description: "Solana address: base58 of 32 bytes (ed25519 public key or program-derived address)."
            examples:
              - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
            pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
            type: string
          type: array
        token_program:
          anyOf:
            - description: "Solana address: base58 of 32 bytes (ed25519 public key or program-derived address)."
              examples:
                - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
              pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
              type: string
            - type: "null"
          description: Owner program of the mint (`TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA` in v1); null for SOL.
      required:
        - signature
        - slot
        - block_time
        - mint
        - token_program
        - owner
        - token_accounts
        - pre_amount
        - post_amount
      type: object
    Subscription:
      additionalProperties: {}
      description: A customer billed every period by emailed invoice (FR-BIL-02).
      properties:
        asset_id:
          anyOf:
            - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            - type: "null"
          description: Pricing asset when `currency` is `asset`.
        billing_cycle_anchor:
          description: Period boundaries are computed from this instant (`periodBoundary`).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        cancel_at_period_end:
          description: Cancels at `current_period_end` instead of renewing.
          type: boolean
        canceled_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When cancellation was requested or happened.
        cancellation_reason:
          anyOf:
            - description: "Why it was canceled: by the merchant, unpaid after the reminders, or the first invoice was never paid."
              type: string
              x-extensible-enum:
                - requested
                - dunning_exhausted
                - incomplete_expired
            - type: "null"
          description: Set once canceled or scheduled to cancel.
        collection_method:
          description: "How the invoice is collected: `send_invoice` = the customer pays the hosted invoice; `auto_debit` (Stage 4) = billing's keeper collects it from the subscription's vault mandate, falling back to `send_invoice` (emailed) when the mandate cannot pay it (lld/billing.md §7.1, §14)."
          type: string
          x-extensible-enum:
            - send_invoice
            - auto_debit
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: ISO 4217 code for fiat pricing, or `asset` when priced in an asset (then `asset_id` is set).
        current_period_end:
          description: "End of the current period: the next renewal invoice is created then."
          maximum: 9007199254740991
          minimum: 0
          type: integer
        current_period_start:
          description: Start of the current period.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        customer:
          description: Customer billed (owned by payments).
          examples:
            - cus_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cus_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        days_until_due:
          description: Each invoice is due this many days after it is finalized.
          maximum: 90
          minimum: 0
          type: integer
        default_tax_rates:
          description: Tax rates for items without their own.
          items:
            description: tax_rate id (`txr_` + 26 base32 chars).
            examples:
              - txr_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^txr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
          type: array
        description:
          description: Shown on every invoice of the subscription.
          type:
            - string
            - "null"
        dunning:
          $ref: "#/components/schemas/DunningSettings"
        ended_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: "When the subscription ended (`status: canceled`)."
        id:
          description: subscription id (`sub_` + 26 base32 chars).
          examples:
            - sub_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sub_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        items:
          description: Items billed from the next renewal invoice on.
          items:
            $ref: "#/components/schemas/SubscriptionItem"
          type: array
        latest_invoice:
          anyOf:
            - description: invoice id (`in_` + 26 base32 chars).
              examples:
                - in_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^in_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Most recent invoice of the subscription.
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        mandate:
          anyOf:
            - description: mandate id (`md_` + 26 base32 chars).
              examples:
                - md_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^md_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: "The linked vault mandate renewals are collected from (`collection_method: auto_debit`); null/absent when none (Stage 4)."
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Copied onto every invoice of the subscription.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        object:
          const: subscription
          description: Always `subscription`.
          type: string
        recurring:
          allOf:
            - $ref: "#/components/schemas/PriceRecurring"
          description: Billing period shared by every item.
        sequence:
          description: Increases with every change; discard webhook objects with a lower sequence.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        settlement_destination:
          anyOf:
            - description: settlement_destination id (`sd_` + 26 base32 chars).
              examples:
                - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Destination for its invoices; null = the account default when each payment session opens.
        status:
          description: Subscription status (domain-model §4.5).
          type: string
          x-extensible-enum:
            - incomplete
            - trialing
            - active
            - past_due
            - canceled
            - unpaid
        trial_end:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: "Trial end: the first invoice is created then."
        trial_start:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Trial start.
      required:
        - id
        - object
        - created
        - livemode
        - customer
        - status
        - collection_method
        - items
        - currency
        - asset_id
        - recurring
        - billing_cycle_anchor
        - current_period_start
        - current_period_end
        - days_until_due
        - default_tax_rates
        - dunning
        - trial_start
        - trial_end
        - cancel_at_period_end
        - canceled_at
        - ended_at
        - cancellation_reason
        - latest_invoice
        - settlement_destination
        - description
        - metadata
        - sequence
      type: object
    SubscriptionItem:
      additionalProperties: {}
      description: One price billed every period.
      properties:
        id:
          description: subscription_item id (`si_` + 26 base32 chars).
          examples:
            - si_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^si_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        object:
          const: subscription_item
          description: Always `subscription_item`.
          type: string
        price:
          allOf:
            - $ref: "#/components/schemas/Price"
          description: The recurring price (snapshot of the price object).
        quantity:
          description: Quantity.
          maximum: 9007199254740991
          minimum: 1
          type: integer
        tax_rates:
          anyOf:
            - items:
                description: tax_rate id (`txr_` + 26 base32 chars).
                examples:
                  - txr_01jbz9k3m4n5p6q7r8s9t0v1w2
                pattern: ^txr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                type: string
              type: array
            - type: "null"
          description: Tax rates of this item; null = the subscription's `default_tax_rates`.
      required:
        - id
        - object
        - price
        - quantity
        - tax_rates
      type: object
    TokenContract:
      additionalProperties: {}
      description: How to transfer an asset on its chain (wallet path).
      properties:
        address:
          anyOf:
            - maxLength: 256
              minLength: 1
              type: string
            - type: "null"
          description: Contract address (EVM `0x…`), token account (NEAR) or SPL mint (Solana, base58; spec 0.4.0 wallet path); null for `native`.
        standard:
          description: "`erc20`: ERC-20 contract on an EVM chain; `native`: the chain's native coin (no contract); `nep141`: NEP-141 token on NEAR; `spl`: SPL mint on Solana; `other`: no wallet transfer recipe (manual path)."
          type: string
          x-extensible-enum:
            - erc20
            - native
            - nep141
            - spl
            - other
      required:
        - standard
        - address
      type: object
    TokenRef:
      additionalProperties: {}
      description: How to transfer an asset on its chain.
      properties:
        address:
          description: Token contract / mint / NEP-141 account; null for native assets.
          type:
            - string
            - "null"
        standard:
          description: Token standard on the chain.
          type: string
          x-extensible-enum:
            - native
            - erc20
            - nep141
            - spl
            - other
      required:
        - standard
        - address
      type: object
    TransferIntent:
      additionalProperties: {}
      description: NEAR Intents `transfer` intent.
      properties:
        intent:
          const: transfer
          description: Intent kind.
          type: string
        memo:
          description: Memo; NearPay puts the binding here.
          maxLength: 512
          type: string
        receiver_id:
          description: Receiving Intents account.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        tokens:
          additionalProperties:
            description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
            pattern: ^(0|[1-9][0-9]{0,77})$
            type: string
          description: Asset id → amount in base units.
          propertyNames:
            description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
            examples:
              - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
            maxLength: 256
            pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
            type: string
          type: object
      required:
        - intent
        - receiver_id
        - tokens
      type: object
    UsdAmount:
      additionalProperties: {}
      description: An amount in US dollars (minor units).
      properties:
        amount:
          description: Fiat amount in minor units (e.g. cents), integer.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        currency:
          const: usd
          description: Always `usd`.
          type: string
      required:
        - amount
        - currency
      type: object
    UserRecoveredEvent:
      additionalProperties: {}
      description: A user regained access by email recovery and registered a new passkey (platform event; ids only, notify resolves emails through identity).
      properties:
        account_ids:
          description: "Accounts where the user is owner or admin: each gets the 48 h recovery lock and its owners are told."
          items:
            description: account id (`acct_` + 26 base32 chars).
            examples:
              - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
          type: array
        lock_until:
          description: End of the recovery lock on destination and team changes (48 h).
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        recovered_at:
          description: When the new passkey was registered.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        user_id:
          description: user id (`usr_` + 26 base32 chars).
          examples:
            - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
      required:
        - user_id
        - account_ids
        - recovered_at
        - lock_until
      type: object
    VaultEvent:
      description: A subscription-vault NEP-297 event (contracts-vault §4.1). Valid only in a successful receipt executed by the vault account itself (rails §8.6).
      oneOf:
        - additionalProperties: {}
          description: "`mandate_created` event."
          properties:
            data:
              additionalItems: false
              description: One-element array (NEP-141/171 convention).
              items:
                - additionalProperties: {}
                  description: "`mandate_created` data."
                  properties:
                    amount_per_period:
                      description: Tokens collected per period (base units).
                      pattern: ^(0|[1-9][0-9]{0,38})$
                      type: string
                    balance:
                      description: Initial funding (base units).
                      pattern: ^(0|[1-9][0-9]{0,38})$
                      type: string
                    ext_ref:
                      description: Free reference (≤ 64 bytes printable ASCII); NearPay puts the subscription id (`sub_…`).
                      maxLength: 64
                      pattern: ^[\x20-\x7e]*$
                      type: string
                    fee_bps:
                      description: NearPay fee in basis points, fixed at creation.
                      maximum: 10000
                      minimum: 0
                      type: integer
                    mandate_id:
                      description: On-chain mandate id (u64, sequential from 0; exact in JSON numbers far beyond any real count).
                      maximum: 9007199254740991
                      minimum: 0
                      type: integer
                    max_periods:
                      anyOf:
                        - maximum: 2147483647
                          minimum: 1
                          type: integer
                        - type: "null"
                      description: Number of periods the mandate may collect; null = unlimited.
                    merchant_receiver:
                      description: Receiver of the merchant share (an Intents account for NearPay).
                      pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
                      type: string
                    payer:
                      description: Payer = the NEP-141 `sender_id`, which is always the transaction signer (v1.5).
                      pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
                      type: string
                    period_secs:
                      description: Period length in seconds (86 400 … 379 468 800).
                      maximum: 379468800
                      minimum: 86400
                      type: integer
                    receiver_kind:
                      description: "How the merchant share is delivered: `intents_account` = `ft_transfer_call(intents.near, msg = merchant_receiver)` (credits the merchant's NEAR Intents balance); `near_account` = plain `ft_transfer`."
                      enum:
                        - intents_account
                        - near_account
                      type: string
                    start_at:
                      description: When period 1 becomes due (ns); a past or omitted `start_at` became the block time.
                      pattern: ^(0|[1-9][0-9]{0,19})$
                      type: string
                    token:
                      description: NEP-141 token contract (the calling token).
                      pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
                      type: string
                  required:
                    - mandate_id
                    - payer
                    - merchant_receiver
                    - token
                    - amount_per_period
                    - period_secs
                    - start_at
                    - max_periods
                    - fee_bps
                    - ext_ref
                    - receiver_kind
                    - balance
                  type: object
              maxItems: 1
              minItems: 1
              type: array
            event:
              const: mandate_created
              description: Event name.
              type: string
            standard:
              const: nearpay_vault
              description: Always `nearpay_vault`.
              type: string
            version:
              const: 1.0.0
              description: Always `1.0.0`.
              type: string
          required:
            - standard
            - version
            - event
            - data
          type: object
        - additionalProperties: {}
          description: "`topped_up` event."
          properties:
            data:
              additionalItems: false
              description: One-element array (NEP-141/171 convention).
              items:
                - additionalProperties: {}
                  description: "`topped_up` data."
                  properties:
                    amount:
                      description: Deposited amount.
                      pattern: ^(0|[1-9][0-9]{0,38})$
                      type: string
                    balance:
                      description: Balance after the deposit.
                      pattern: ^(0|[1-9][0-9]{0,38})$
                      type: string
                    mandate_id:
                      description: On-chain mandate id (u64, sequential from 0; exact in JSON numbers far beyond any real count).
                      maximum: 9007199254740991
                      minimum: 0
                      type: integer
                  required:
                    - mandate_id
                    - amount
                    - balance
                  type: object
              maxItems: 1
              minItems: 1
              type: array
            event:
              const: topped_up
              description: Event name.
              type: string
            standard:
              const: nearpay_vault
              description: Always `nearpay_vault`.
              type: string
            version:
              const: 1.0.0
              description: Always `1.0.0`.
              type: string
          required:
            - standard
            - version
            - event
            - data
          type: object
        - additionalProperties: {}
          description: "`collected` event."
          properties:
            data:
              additionalItems: false
              description: One-element array (NEP-141/171 convention).
              items:
                - additionalProperties: {}
                  description: "`collected` data."
                  properties:
                    amount:
                      description: "`merchant_share + fee` actually paid."
                      pattern: ^(0|[1-9][0-9]{0,38})$
                      type: string
                    balance:
                      description: Balance after the period.
                      pattern: ^(0|[1-9][0-9]{0,38})$
                      type: string
                    fee:
                      description: Fee sent to the treasury; `"0"` when the fee leg failed or after a partial delivery.
                      pattern: ^(0|[1-9][0-9]{0,38})$
                      type: string
                    mandate_id:
                      description: On-chain mandate id (u64, sequential from 0; exact in JSON numbers far beyond any real count).
                      maximum: 9007199254740991
                      minimum: 0
                      type: integer
                    merchant_share:
                      description: Share delivered to the merchant receiver; below `floor(amount_per_period × (10000 − fee_bps) / 10000)` only on partial delivery (the period still counts).
                      pattern: ^(0|[1-9][0-9]{0,38})$
                      type: string
                    period:
                      description: 1-based period that was counted.
                      maximum: 9007199254740991
                      minimum: 1
                      type: integer
                  required:
                    - mandate_id
                    - period
                    - amount
                    - merchant_share
                    - fee
                    - balance
                  type: object
              maxItems: 1
              minItems: 1
              type: array
            event:
              const: collected
              description: Event name.
              type: string
            standard:
              const: nearpay_vault
              description: Always `nearpay_vault`.
              type: string
            version:
              const: 1.0.0
              description: Always `1.0.0`.
              type: string
          required:
            - standard
            - version
            - event
            - data
          type: object
        - additionalProperties: {}
          description: "`collect_failed` event."
          properties:
            data:
              additionalItems: false
              description: One-element array (NEP-141/171 convention).
              items:
                - additionalProperties: {}
                  description: "`collect_failed` data."
                  properties:
                    mandate_id:
                      description: On-chain mandate id (u64, sequential from 0; exact in JSON numbers far beyond any real count).
                      maximum: 9007199254740991
                      minimum: 0
                      type: integer
                    period:
                      description: Period that was attempted (not counted).
                      maximum: 9007199254740991
                      minimum: 1
                      type: integer
                    reason:
                      description: "Why: `merchant_transfer_failed` (the merchant leg delivered nothing; the only reason in v1)."
                      type: string
                      x-extensible-enum:
                        - merchant_transfer_failed
                  required:
                    - mandate_id
                    - period
                    - reason
                  type: object
              maxItems: 1
              minItems: 1
              type: array
            event:
              const: collect_failed
              description: Event name.
              type: string
            standard:
              const: nearpay_vault
              description: Always `nearpay_vault`.
              type: string
            version:
              const: 1.0.0
              description: Always `1.0.0`.
              type: string
          required:
            - standard
            - version
            - event
            - data
          type: object
        - additionalProperties: {}
          description: "`canceled` event."
          properties:
            data:
              additionalItems: false
              description: One-element array (NEP-141/171 convention).
              items:
                - additionalProperties: {}
                  description: "`canceled` data."
                  properties:
                    by:
                      description: "Who canceled: the payer or the merchant receiver."
                      pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
                      type: string
                    mandate_id:
                      description: On-chain mandate id (u64, sequential from 0; exact in JSON numbers far beyond any real count).
                      maximum: 9007199254740991
                      minimum: 0
                      type: integer
                    refunded:
                      description: Amount actually returned to the payer; `"0"` when the refund failed (then withdrawable).
                      pattern: ^(0|[1-9][0-9]{0,38})$
                      type: string
                  required:
                    - mandate_id
                    - by
                    - refunded
                  type: object
              maxItems: 1
              minItems: 1
              type: array
            event:
              const: canceled
              description: Event name.
              type: string
            standard:
              const: nearpay_vault
              description: Always `nearpay_vault`.
              type: string
            version:
              const: 1.0.0
              description: Always `1.0.0`.
              type: string
          required:
            - standard
            - version
            - event
            - data
          type: object
        - additionalProperties: {}
          description: "`withdrawn` event."
          properties:
            data:
              additionalItems: false
              description: One-element array (NEP-141/171 convention).
              items:
                - additionalProperties: {}
                  description: "`withdrawn` data."
                  properties:
                    amount:
                      description: Amount returned to the payer.
                      pattern: ^(0|[1-9][0-9]{0,38})$
                      type: string
                    mandate_id:
                      description: On-chain mandate id (u64, sequential from 0; exact in JSON numbers far beyond any real count).
                      maximum: 9007199254740991
                      minimum: 0
                      type: integer
                  required:
                    - mandate_id
                    - amount
                  type: object
              maxItems: 1
              minItems: 1
              type: array
            event:
              const: withdrawn
              description: Event name.
              type: string
            standard:
              const: nearpay_vault
              description: Always `nearpay_vault`.
              type: string
            version:
              const: 1.0.0
              description: Always `1.0.0`.
              type: string
          required:
            - standard
            - version
            - event
            - data
          type: object
        - additionalProperties: {}
          description: "`exhausted` event."
          properties:
            data:
              additionalItems: false
              description: One-element array (NEP-141/171 convention).
              items:
                - additionalProperties: {}
                  description: "`exhausted` data."
                  properties:
                    mandate_id:
                      description: On-chain mandate id (u64, sequential from 0; exact in JSON numbers far beyond any real count).
                      maximum: 9007199254740991
                      minimum: 0
                      type: integer
                  required:
                    - mandate_id
                  type: object
              maxItems: 1
              minItems: 1
              type: array
            event:
              const: exhausted
              description: Event name.
              type: string
            standard:
              const: nearpay_vault
              description: Always `nearpay_vault`.
              type: string
            version:
              const: 1.0.0
              description: Always `1.0.0`.
              type: string
          required:
            - standard
            - version
            - event
            - data
          type: object
    VaultEventRecord:
      additionalProperties: {}
      description: "A valid vault event (contracts-vault §4.1): executor = the vault, outcome `SuccessValue`/`SuccessReceiptId`, block final, schema-valid. Dedupe key `receipt_id:log_index` (at-least-once, INV-4). Envelope: `account_id` null, `livemode` true for the mainnet vault and false for the stand-in, aggregate `vault_mandate` `<vault_contract>#<mandate_id>`."
      properties:
        block_hash:
          description: Hash of that block.
          maxLength: 64
          minLength: 1
          type: string
        block_height:
          description: Final block that includes the receipt outcome.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        block_timestamp:
          description: Block time in nanoseconds (decimal string); billing's `created`/`collected_at`.
          pattern: ^(0|[1-9][0-9]{0,19})$
          type: string
        event:
          $ref: "#/components/schemas/VaultEvent"
        log_index:
          description: 0-based index of the log line in the receipt's outcome logs.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        receipt_id:
          description: Receipt that logged the event (base58).
          maxLength: 64
          minLength: 1
          type: string
        tx_hash:
          description: Transaction the receipt belongs to (explorer link).
          maxLength: 128
          minLength: 8
          type: string
        vault_contract:
          description: "Executor of the receipt: the configured vault (`NP_VAULT_CONTRACT`; the sandbox stand-in in test mode)."
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
      required:
        - vault_contract
        - tx_hash
        - receipt_id
        - log_index
        - block_height
        - block_hash
        - block_timestamp
        - event
      type: object
defaultContentType: application/json
info:
  description: NATS JetStream subjects `evt.<domain>.<aggregate>.<event>`. Generated from `nearpay-spec`; do not edit by hand.
  license:
    name: Apache-2.0
  title: NearPay domain events
  version: 0.4.2
operations:
  evt_agentpay_agent_payment_failed_send:
    action: send
    channel:
      $ref: "#/channels/evt_agentpay_agent_payment_failed"
    summary: agentpay publishes evt.agentpay.agent_payment.failed
    x-consumers:
      - webhooks
    x-producer: agentpay
    x-stage: 1
  evt_agentpay_agent_payment_settled_send:
    action: send
    channel:
      $ref: "#/channels/evt_agentpay_agent_payment_settled"
    summary: agentpay publishes evt.agentpay.agent_payment.settled
    x-consumers:
      - webhooks
      - compliance
    x-producer: agentpay
    x-stage: 1
  evt_billing_invoice_created_send:
    action: send
    channel:
      $ref: "#/channels/evt_billing_invoice_created"
    summary: billing publishes evt.billing.invoice.created
    x-consumers:
