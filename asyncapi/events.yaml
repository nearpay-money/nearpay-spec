      properties:
        amount:
          description: Fee amount, base units of `asset_id`.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          description: Asset the fee was taken in.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
      required:
        - amount
        - asset_id
      type: object
    OpsActionEvent:
      additionalProperties: {}
      description: "A console operator action recorded by the owning service; identity copies it into `audit_events` so the console audit log is one trail. Ids only: no emails, notes or addresses."
      properties:
        account_id:
          anyOf:
            - description: account id (`acct_` + 26 base32 chars).
              examples:
                - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Merchant account concerned, if any (the `audit_events.account`).
        action:
          description: Action, `<object>.<verb>`, e.g. `case.closed`, `blocklist_entry.added`, `kill_switch.engaged`, `kill_switch.release_approved`, `finding.acknowledged`.
          maxLength: 100
          minLength: 1
          type: string
        actor:
          additionalProperties: {}
          description: Operator who acted (ids only; identity resolves the email for display).
          properties:
            ops_role:
              description: Role of a console operator.
              enum:
                - ops
                - ops_admin
              type: string
            sub:
              description: Operator user id (`sub` of the ops principal). Ops CLI actions are not published as ops-action events (they stay in the owning service's own log); a CLI actor would be a breaking change to this event (spec 0.2.1 decision).
              examples:
                - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
          required:
            - sub
            - ops_role
          type: object
        approval:
          anyOf:
            - description: ops_approval id (`opa_` + 26 base32 chars).
              examples:
                - opa_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^opa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Two-person approval the action completed, if any.
        id:
          description: Action id (UUIDv7, bare); identity dedupes `audit_events` on it and uses it as the audit event id. The envelope `aggregate.id` is the same uuid as a prefixed id, `aud_<TypeID suffix>` (the outbox keys aggregates by prefixed id; spec 0.2.1 clarification).
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          type: string
        occurred_at:
          description: When the action committed.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        target:
          additionalProperties: {}
          description: Object acted on.
          properties:
            id:
              description: Object id (prefixed id, or a fixed name such as `global`).
              maxLength: 128
              minLength: 1
              type: string
            type:
              description: Object type, e.g. `compliance_case`, `blocklist_entry`, `kill_switch`.
              maxLength: 64
              minLength: 1
              type: string
          required:
            - type
            - id
          type: object
      required:
        - id
        - actor
        - action
        - target
        - account_id
        - approval
        - occurred_at
      type: object
    OpsApproval:
      additionalProperties: {}
      description: A console action waiting for (or decided by) a second operator.
      properties:
        action:
          description: Action that needs a second approver.
          type: string
          x-extensible-enum:
            - account.suspend
            - account.reinstate
            - kill_switch.release
        decided_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When it was decided.
        decided_by:
          anyOf:
            - additionalProperties: {}
              properties:
                id:
                  description: user id (`usr_` + 26 base32 chars).
                  examples:
                    - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
                  pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                  type: string
                role:
                  description: Role of a console operator.
                  enum:
                    - ops
                    - ops_admin
                  type: string
              required:
                - id
                - role
              type: object
            - type: "null"
          description: Approving or rejecting operator.
        decision_note:
          description: Note of the deciding operator.
          type:
            - string
            - "null"
        expires_at:
          description: A pending request expires at this time.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        id:
          description: ops_approval id (`opa_` + 26 base32 chars).
          examples:
            - opa_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^opa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        object:
          const: ops_approval
          description: Always `ops_approval`.
          type: string
        reason:
          description: Requester's reason (audited; never shown to merchants).
          type: string
        requested_at:
          description: When it was requested.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        requested_by:
          additionalProperties: {}
          description: Requesting operator.
          properties:
            id:
              description: user id (`usr_` + 26 base32 chars).
              examples:
                - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            role:
              description: Role of a console operator.
              enum:
                - ops
                - ops_admin
              type: string
          required:
            - id
            - role
          type: object
        status:
          description: "`approved` means the action was executed in the same transaction."
          type: string
          x-extensible-enum:
            - pending
            - approved
            - rejected
            - expired
        target:
          additionalProperties: {}
          description: What the action applies to.
          properties:
            id:
              description: "`acct_…` or `ks_…`."
              type: string
            type:
              description: Target type.
              type: string
              x-extensible-enum:
                - account
                - kill_switch
          required:
            - type
            - id
          type: object
      required:
        - id
        - object
        - action
        - target
        - reason
        - status
        - requested_by
        - requested_at
        - decided_by
        - decided_at
        - decision_note
        - expires_at
      type: object
    PaymentAttemptSummary:
