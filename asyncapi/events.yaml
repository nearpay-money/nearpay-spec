            maxLength: 128
            minLength: 8
            type: string
          type: array
        evidence:
          anyOf:
            - $ref: "#/components/schemas/Evidence"
            - type: "null"
          description: Accepted evidence (INV-2).
        failure_code:
          description: Failure code.
          type:
            - string
            - "null"
        held_reason:
          anyOf:
            - description: Why held.
              type: string
              x-extensible-enum:
                - evidence_mismatch
                - evidence_timeout
                - failed_after_deposit
