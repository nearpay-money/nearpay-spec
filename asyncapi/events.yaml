        - blocked_regions
      type: object
    PriceRate:
      additionalProperties: {}
      description: "A price or FX rate with its source and timestamps (INV-5: exact rational)."
      properties:
        as_of:
          description: "When the source says the value applies (ECB: publication time of the reference day; feeds: their update time)."
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        base:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
          description: "What is priced: a currency code or an asset id."
        decimal:
          description: The rate as a decimal string rounded half-even to ≤ 18 places; display only, never for arithmetic.
          pattern: ^(0|[1-9][0-9]{0,59})(\.[0-9]{1,18})?$
          type: string
        fetched_at:
          description: When rails read it.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        kind:
          description: "`fx`: fiat exchange rate; `price`: token price."
          type: string
          x-extensible-enum:
            - fx
            - price
        quote:
          description: Currency the value is expressed in (`usd`).
          pattern: ^[a-z]{3}$
          type: string
        role:
          description: "`primary`/`secondary`: the two token prices the dual-source check compares (rails §8.2); `reference`: a fiat FX reference rate."
          type: string
          x-extensible-enum:
            - primary
            - secondary
            - reference
        source:
          description: "Where a rate comes from: `oneclick` (1Click `/v0/tokens`, primary token price), `coingecko` (keyless public feed, secondary token price), `ecb` (ECB euro reference rates, fiat FX), `sandbox` (test-mode token prices), `fixed` (test-mode FX table, and `usd`→`usd`)."
          type: string
          x-extensible-enum:
            - oneclick
            - coingecko
            - ecb
            - sandbox
            - fixed
        valid_until:
          anyOf:
            - description: RFC 3339 UTC timestamp, e.g. `2026-11-05T10:00:00.000Z`.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            - type: "null"
          description: After this instant rails no longer uses the rate (staleness bound, rails §8.2); null = no bound (`fixed`).
        value:
          allOf:
            - $ref: "#/components/schemas/Ratio"
          description: Quote major units per one major unit of `base`.
      required:
        - base
        - quote
        - kind
        - role
        - source
        - value
        - decimal
        - as_of
        - fetched_at
        - valid_until
      type: object
    PriceSnapshot:
      additionalProperties: {}
      description: Prices used to compute the settlement amount (INV-6).
      properties:
        as_of:
          description: When prices were read.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: "Pricing currency of the payment (spec 0.2.0; rails 0.2.0+ always sends it): an ISO code, or `asset`."
        fx:
          description: FX rate pricing currency → USD (decimal string), null for USD.
          type:
            - string
            - "null"
        par:
          description: Settled at par (USD stablecoin, depeg guard passed).
          type: boolean
        par_currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - type: "null"
          description: Currency the settlement asset was taken at par with (`usd` for USD stablecoins), or null (spec 0.2.0).
        primary_usd:
          description: Primary USD price of the settlement asset (decimal string).
          type:
            - string
            - "null"
        rates:
          description: "Every rate used, exact, with source, `as_of` and `valid_until` (spec 0.2.0; rails 0.2.0+ always sends it): the FX rate of a non-USD currency and the primary + secondary prices of a non-par asset."
          items:
            $ref: "#/components/schemas/PriceRate"
          type: array
        secondary_usd:
          description: Secondary USD price (decimal string).
          type:
            - string
            - "null"
      required:
        - primary_usd
        - secondary_usd
        - fx
        - par
        - as_of
      type: object
    Ratio:
      additionalProperties: {}
      description: An exact rational number `num / den` (integer strings, never a float).
      properties:
        den:
          description: Denominator (positive integer string).
          pattern: ^[1-9][0-9]{0,77}$
          type: string
        num:
          description: Numerator (integer string).
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
      required:
        - num
        - den
      type: object
    Refund:
      additionalProperties: {}
      description: Money returned to a payer, signed by the merchant (non-custodial).
      properties:
        amount:
          description: Refunded amount, base units of `asset_id`.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        amount_received:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: What the payer received, base units of `recipient.asset_id` (from evidence).
        asset_id:
          description: Settlement asset the amount is in.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        canceled_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the merchant canceled.
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        decimals:
          description: Decimals of `asset_id`.
          maximum: 255
          minimum: 0
          type: integer
        evidence:
          anyOf:
            - $ref: "#/components/schemas/Evidence"
            - type: "null"
          description: Payer-side evidence of the leg that refunded the payer (INV-2).
        extra_amount_sent:
          description: Settlement-asset amount sent by duplicate legs (signed and sent after another leg had refunded the payer); `0` normally.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        failure_code:
          description: Why the refund failed (the last leg's code).
          type:
            - string
            - "null"
        fee_mode:
          description: "`payer_absorbs` (default, `EXACT_INPUT`): the merchant sends `amount`, the payer receives it minus route costs. `merchant_absorbs` (`EXACT_OUTPUT`): the payer receives the equivalent of `amount`; the merchant sends slightly more."
          enum:
            - payer_absorbs
            - merchant_absorbs
          type: string
        id:
          description: refund id (`re_` + 26 base32 chars).
          examples:
            - re_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^re_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        legs:
          description: Legs, newest first.
          items:
            $ref: "#/components/schemas/RefundLeg"
          type: array
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Up to 50 key/value pairs (key ≤ 40 chars, value ≤ 500 chars) for your own use.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        method:
          description: "`route_quote`: a 1Click route back to the payer's origin chain and asset. `intents_transfer`: a merchant-signed Verifier transfer to the payer's Intents account (refund of an `intents_transfer` payment; no route provider)."
          type: string
          x-extensible-enum:
            - route_quote
            - intents_transfer
        next_action:
          anyOf:
            - $ref: "#/components/schemas/RefundNextAction"
            - type: "null"
          description: Present in `requires_action` once the current leg is prepared; null while it is being prepared and in every other status.
        object:
          const: refund
          description: Always `refund`.
          type: string
        payment_attempt:
          description: Attempt whose settlement is refunded (the paying attempt, or an overpayment).
          examples:
            - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        payment_intent:
          description: payment_intent id (`pi_` + 26 base32 chars).
          examples:
            - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        reason:
          anyOf:
            - description: Why the merchant refunds.
              type: string
              x-extensible-enum:
                - requested_by_customer
                - duplicate
                - fraudulent
                - overpayment
                - other
            - type: "null"
        recipient:
          $ref: "#/components/schemas/RefundRecipient"
        sequence:
          description: Increases with every change; discard webhook objects with a lower sequence.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        source:
          description: What created the refund.
          type: string
          x-extensible-enum:
            - api
            - dashboard
            - review_rejection
        status:
          description: "Refund status (domain-model §4.4): `requires_action` = waiting for the merchant's signature; `pending` = the merchant's funds were detected and are on their way; `failed` = the provider returned them to the merchant (prepare again to retry)."
          type: string
          x-extensible-enum:
            - requires_action
            - pending
            - succeeded
            - failed
            - canceled
        succeeded_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the payer-side evidence was verified.
      required:
        - id
        - object
        - created
        - livemode
        - status
        - payment_intent
        - payment_attempt
        - amount
        - asset_id
        - decimals
        - fee_mode
        - reason
        - method
        - recipient
        - next_action
        - legs
        - amount_received
        - evidence
        - extra_amount_sent
        - source
        - failure_code
        - succeeded_at
        - canceled_at
        - sequence
        - metadata
      type: object
    RefundLeg:
      additionalProperties: {}
      description: One prepared route or transfer for a refund.
      properties:
        amount:
          description: What the merchant sends, base units of the settlement asset.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        amount_out_expected:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: What the payer is expected to receive, base units of the recipient asset (route estimate).
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        deadline:
          description: Sign and send before this time.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        duplicate:
          description: Settled after another leg had already refunded the payer (recorded in `extra_amount_sent`).
          type: boolean
        evidence:
          anyOf:
            - $ref: "#/components/schemas/Evidence"
            - type: "null"
          description: Payer-side evidence once verified (INV-2).
        failure_code:
          description: Why the leg failed, returned or was held.
          type:
            - string
            - "null"
        method:
          description: "`route_quote`: a 1Click route back to the payer's origin chain and asset. `intents_transfer`: a merchant-signed Verifier transfer to the payer's Intents account (refund of an `intents_transfer` payment; no route provider)."
          type: string
          x-extensible-enum:
            - route_quote
            - intents_transfer
        number:
          description: Leg number, 1-based; a re-prepared refund gets a new leg.
          maximum: 9007199254740991
          minimum: 1
          type: integer
        status:
          description: "Leg status: `returned` = the provider sent the funds back to the merchant destination; `expired` = the deadline passed without a deposit."
          type: string
          x-extensible-enum:
            - awaiting_signature
            - submitted
            - processing
            - succeeded
            - returned
            - failed
            - expired
            - held
        submitted_tx:
          anyOf:
            - description: Transaction hash in the chain's text form.
              maxLength: 128
              minLength: 8
              type: string
            - type: "null"
          description: Transaction the merchant reported, or the relayed Intents transaction.
        swap_type:
          anyOf:
            - description: How the route leg was quoted.
              enum:
                - EXACT_INPUT
                - EXACT_OUTPUT
              type: string
            - type: "null"
          description: "Route legs: how the quote was made; null for Intents transfers."
      required:
        - number
        - status
        - method
        - swap_type
        - amount
        - amount_out_expected
        - deadline
        - submitted_tx
        - duplicate
        - evidence
        - failure_code
        - created
      type: object
    RefundNextAction:
      description: What the merchant signs for the current leg. Wallets build exactly this (never another recipient or amount; dashboard §1).
      oneOf:
        - $ref: "#/components/schemas/RefundSignAndSend"
        - $ref: "#/components/schemas/RefundSignIntent"
    RefundRecipient:
      additionalProperties: {}
      description: "Where the refund goes (INV-7: the payer's recorded refund address)."
      properties:
        address:
          description: Payer's refund address (or Intents account).
          maxLength: 256
          minLength: 1
          type: string
        asset_id:
          description: Asset the payer receives (the asset they paid with).
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        chain:
          description: Chain the payer receives on.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        overridden:
          description: An owner replaced the recorded refund address (INV-7).
          type: boolean
        type:
          description: Address on the origin chain, or a NEAR Intents account.
          enum:
            - origin_chain
            - intents
          type: string
      required:
        - address
        - asset_id
        - chain
        - type
        - overridden
      type: object
    RefundSignAndSend:
      additionalProperties: {}
      description: "Next action: transfer exactly `amount` of `asset_id` from `from` to `to` on `chain`."
      properties:
        amount:
          description: Exact amount to send, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          description: Asset to send (the settlement asset).
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        chain:
          description: Chain to send on (the settlement destination's chain).
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        deadline:
          description: Send before this time; later deposits return to `from`.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        decimals:
          description: Token decimals.
          maximum: 255
          minimum: 0
          type: integer
        display:
          description: Human-readable summary, e.g. `Send 2.000000 USDC on Base to 0xab…`.
          type: string
        from:
          description: The settlement destination address; sign with this wallet (refunds of the route go back to it).
          maxLength: 256
          minLength: 1
          type: string
        memo:
          description: Memo the transfer must carry, if any.
          type:
            - string
            - "null"
        symbol:
          description: Token symbol.
          type: string
        to:
          description: 1Click deposit address of this leg.
          maxLength: 256
          minLength: 1
          type: string
        token:
          $ref: "#/components/schemas/TokenRef"
        type:
          const: sign_and_send
          description: Sign and broadcast a transfer on `chain`.
          type: string
      required:
        - type
        - chain
        - from
        - to
        - asset_id
        - token
        - symbol
        - decimals
        - amount
        - memo
        - deadline
        - display
      type: object
    RefundSignIntent:
      additionalProperties: {}
      description: "Next action: sign this Verifier transfer with the merchant's Intents account."
      properties:
        deadline:
          description: The payload's deadline; after it, prepare a new leg.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        display:
          description: Human-readable summary, e.g. `Transfer 2.000000 USDC to payer.near`.
          type: string
        message:
          allOf:
            - $ref: "#/components/schemas/IntentMessage"
          description: Parsed payload, for display and checks; sign `nep413.message` or `payload`.
        nep413:
          additionalProperties: {}
          description: Arguments for a NEP-413 `signMessage` call, used verbatim.
          properties:
            message:
              description: Exact NEP-413 `message` (JSON string of `Nep413IntentMessage`).
              minLength: 2
              type: string
            nonce:
              description: 32-byte nonce (4-byte Verifier salt ‖ 28 random bytes), standard base64.
              pattern: ^[A-Za-z0-9+/]{43}=$
              type: string
            recipient:
              const: intents.near
              description: NEP-413 recipient.
              type: string
          required:
            - recipient
            - nonce
            - message
          type: object
        payload:
          description: Exact string to sign for `erc191` / `raw_ed25519` (JSON of `IntentMessage`, same nonce).
          minLength: 2
          type: string
        signer_id:
          description: The merchant's Intents account (the settlement destination).
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        standards:
          description: Signing standards accepted for `signer_id` (`nep413` for NEAR wallets, `erc191` for 0x accounts).
          items:
            description: Signing standard supported by NearPay.
            enum:
              - nep413
              - erc191
              - raw_ed25519
            type: string
          minItems: 1
          type: array
        transfer:
          additionalProperties: {}
          description: The single transfer the payload contains (for the human-readable summary).
          properties:
            amount:
              description: Amount, base units.
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            memo:
              description: Binding memo of this leg.
              pattern: ^np1:[1-9A-HJ-NP-Za-km-z]{43,44}$
              type: string
            receiver_id:
              description: Payer's Intents account (`intents_transfer`) or the 1Click Intents deposit address (`route_quote`).
              pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
              type: string
            token:
              description: Asset transferred.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
          required:
            - receiver_id
            - token
            - amount
            - memo
          type: object
        type:
          const: sign_intent
          description: Sign a NEAR Intents payload; submit it with `submit_tx`.
          type: string
      required:
        - type
        - signer_id
        - transfer
        - standards
        - nep413
        - payload
        - message
        - deadline
        - display
      type: object
    RefundTransfer:
      additionalProperties: {}
      description: "What a merchant signs for a refund leg from an Intents account: exactly one transfer, memo = binding."
      properties:
        amount:
          description: Amount, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        deadline:
          description: Latest acceptable payload deadline.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        memo:
          description: Binding memo the transfer must carry (agentpay matches it; the indexer attributes by it).
          pattern: ^np1:[1-9A-HJ-NP-Za-km-z]{43,44}$
          type: string
        receiver_id:
          description: Payer Intents account (`intents_transfer` leg) or the 1Click INTENTS deposit address (`route_quote` leg).
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        signer_id:
          description: Merchant Intents account (the settlement destination) that signs.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        token:
          description: Asset transferred (the settlement asset).
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
      required:
        - signer_id
        - receiver_id
        - token
        - amount
        - memo
        - deadline
      type: object
    Review:
      additionalProperties: {}
      description: A compliance review of a payment (payment stands; INV-1).
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        closed_at:
          anyOf:
            - description: RFC 3339 UTC timestamp, e.g. `2026-11-05T10:00:00.000Z`.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            - type: "null"
          description: Closed.
        id:
          description: compliance_case id (`case_` + 26 base32 chars).
          examples:
            - case_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^case_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        object:
          const: review
          description: Always `review`.
          type: string
        opened_at:
          description: Opened.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        payment_intent:
          anyOf:
            - description: payment_intent id (`pi_` + 26 base32 chars).
              examples:
                - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Payment intent of an `execution` subject (from `Execution.reference`); webhooks shows such a review as one of this intent.
        reason:
          description: Why.
          type: string
          x-extensible-enum:
            - post_screen_hit
            - held_execution
            - audit_mismatch
            - screening_hit
        status:
          description: Review status.
          type: string
          x-extensible-enum:
            - open
            - closed
        subject:
          additionalProperties: {}
          description: What is under review.
          properties:
            id:
              description: Reviewed object id.
              type: string
            type:
              description: "Reviewed object type (`execution`: a rails execution; payments maps it to its payment intent)."
              type: string
              x-extensible-enum:
                - payment_intent
                - agent_payment
                - settlement_destination
                - execution
          required:
            - type
            - id
          type: object
      required:
        - id
        - object
        - account_id
        - subject
        - reason
        - status
        - opened_at
        - closed_at
      type: object
    TokenContract:
      additionalProperties: {}
      description: How to transfer an asset on its chain (wallet path).
      properties:
        address:
          anyOf:
            - maxLength: 256
              minLength: 1
              type: string
            - type: "null"
          description: Contract address (EVM `0x…`) or token account (NEAR); null for `native`.
        standard:
          description: "`erc20`: ERC-20 contract on an EVM chain; `native`: the chain's native coin (no contract); `nep141`: NEP-141 token on NEAR; `spl`: SPL mint on Solana; `other`: no wallet transfer recipe (manual path)."
          type: string
          x-extensible-enum:
            - erc20
            - native
            - nep141
            - spl
            - other
      required:
        - standard
        - address
      type: object
    TokenRef:
      additionalProperties: {}
      description: How to transfer an asset on its chain.
      properties:
        address:
          description: Token contract / mint / NEP-141 account; null for native assets.
          type:
            - string
            - "null"
        standard:
          description: Token standard on the chain.
          type: string
          x-extensible-enum:
            - native
            - erc20
            - nep141
            - spl
            - other
      required:
        - standard
        - address
      type: object
    TransferIntent:
      additionalProperties: {}
      description: NEAR Intents `transfer` intent.
      properties:
        intent:
          const: transfer
          description: Intent kind.
          type: string
        memo:
          description: Memo; NearPay puts the binding here.
          maxLength: 512
          type: string
        receiver_id:
          description: Receiving Intents account.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        tokens:
          additionalProperties:
            description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
            pattern: ^(0|[1-9][0-9]{0,77})$
            type: string
          description: Asset id → amount in base units.
          propertyNames:
            description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
            examples:
              - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
            maxLength: 256
            pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
            type: string
          type: object
      required:
        - intent
        - receiver_id
        - tokens
      type: object
    UsdAmount:
      additionalProperties: {}
      description: An amount in US dollars (minor units).
      properties:
        amount:
          description: Fiat amount in minor units (e.g. cents), integer.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        currency:
          const: usd
          description: Always `usd`.
          type: string
      required:
        - amount
        - currency
      type: object
defaultContentType: application/json
info:
  description: NATS JetStream subjects `evt.<domain>.<aggregate>.<event>`. Generated from `nearpay-spec`; do not edit by hand.
  license:
    name: Apache-2.0
  title: NearPay domain events
  version: 0.2.0
operations:
  evt_agentpay_agent_payment_failed_send:
    action: send
    channel:
      $ref: "#/channels/evt_agentpay_agent_payment_failed"
    summary: agentpay publishes evt.agentpay.agent_payment.failed
    x-consumers:
      - webhooks
    x-producer: agentpay
    x-stage: 1
  evt_agentpay_agent_payment_settled_send:
    action: send
    channel:
      $ref: "#/channels/evt_agentpay_agent_payment_settled"
    summary: agentpay publishes evt.agentpay.agent_payment.settled
    x-consumers:
