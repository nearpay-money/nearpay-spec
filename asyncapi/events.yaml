            - amount_base
            - tag
            - expected
            - recipient
            - recipient_type
            - chain
          type: object
        state:
          description: Attempt status (mirrors the rails execution, domain-model §4.3).
          type: string
          x-extensible-enum:
            - quoting
            - awaiting_deposit
            - deposit_detected
            - incomplete_deposit
            - settling
            - verifying
            - succeeded
            - refunded
            - failed
            - expired_unpaid
            - held
        terminal_at:
          anyOf:
            - description: RFC 3339 UTC timestamp, e.g. `2026-11-05T10:00:00.000Z`.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            - type: "null"
          description: When it reached a terminal state.
        updated_at:
          description: Updated.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        version:
          description: Increments with every applied change (consumers ignore stale versions).
          maximum: 9007199254740991
          minimum: 1
          type: integer
      required:
        - id
        - version
        - account_id
        - livemode
        - kind
        - method
        - provider
        - state
        - provider_status
        - route_class
        - applied_fee_bps
        - origin
        - settlement
        - price_snapshot
        - deposit
        - intents_requirement
        - deposit_tx_hashes
        - settled_amount
        - refunded_amount
        - refund_reason
        - evidence
        - failure_code
        - held_reason
        - deadline
        - terminal_at
        - created_at
        - updated_at
      type: object
    ExecutionDeposit:
      additionalProperties: {}
      description: Deposit instructions of a `route_quote` execution.
      properties:
        address:
          description: Deposit address.
          maxLength: 256
          minLength: 1
          type: string
        amount_in:
          description: Amount to send.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        chain:
          description: Origin chain.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        deadline:
          description: Deposit deadline.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        memo:
          description: Memo.
          type:
            - string
            - "null"
        min_amount_in:
          description: Provider minimum.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
      required:
        - address
        - memo
        - amount_in
        - min_amount_in
        - chain
        - deadline
      type: object
    ExecutionReference:
      additionalProperties: {}
      description: The payments object an execution belongs to.
      properties:
        payment_attempt:
          anyOf:
            - description: payment_attempt id (`pa_` + 26 base32 chars).
              examples:
                - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: "Payment attempt (`kind: payment`)."
        payment_intent:
          description: payment_intent id (`pi_` + 26 base32 chars).
          examples:
            - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        refund:
          anyOf:
            - description: refund id (`re_` + 26 base32 chars).
              examples:
                - re_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^re_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: "Refund (`kind: refund`)."
        refund_leg:
          anyOf:
            - maximum: 9007199254740991
              minimum: 1
              type: integer
            - type: "null"
          description: "Refund leg number (`kind: refund`)."
      required:
        - payment_intent
        - payment_attempt
        - refund
        - refund_leg
      type: object
    ExecutionRefund:
      additionalProperties: {}
      description: "Refund-leg details of an execution (`kind: refund`)."
      properties:
        amount:
          description: What the merchant sends, base units of the source (settlement) asset.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        amount_out_expected:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: What the payer should receive, base units of the recipient asset (quote `amountOut`).
        min_amount_out:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Quote `minAmountOut` (route legs).
        swap_type:
          anyOf:
            - description: Route quote type.
              enum:
                - EXACT_INPUT
                - EXACT_OUTPUT
              type: string
            - type: "null"
          description: Route legs only; null for `intents_transfer`.
        token:
          anyOf:
            - $ref: "#/components/schemas/TokenContract"
            - type: "null"
          description: How to transfer the source asset on its chain (`sign_and_send` legs); null for Intents sources.
        transfer:
          anyOf:
            - $ref: "#/components/schemas/RefundTransfer"
            - type: "null"
          description: "Set when the source is an Intents account: the transfer to sign (to the payer, or to the 1Click deposit address)."
      required:
        - swap_type
        - amount
        - amount_out_expected
        - min_amount_out
        - token
        - transfer
      type: object
    FeeSummary:
      additionalProperties: {}
      description: Fee snapshot of a payment (INV-6).
      properties:
        bearer:
          description: Who bears the fee.
          enum:
            - payer
            - merchant
          type: string
        total_bps:
          description: NearPay fee applied to this payment's route, in basis points.
          maximum: 10000
          minimum: 0
          type: integer
      required:
        - bearer
        - total_bps
      type: object
    IntentMessage:
      additionalProperties: {}
      description: Verifier message (`DefusePayload`).
      properties:
        deadline:
          description: Latest time the Verifier accepts the payload.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        intents:
          description: Intents executed atomically.
          items:
            anyOf:
              - $ref: "#/components/schemas/TransferIntent"
              - additionalProperties: {}
                properties:
                  intent:
                    description: Intent kind.
                    type: string
                required:
                  - intent
                type: object
            description: A Verifier intent.
          minItems: 1
          type: array
        nonce:
          description: 32-byte nonce (4-byte Verifier salt ‖ 28 random bytes), standard base64.
          pattern: ^[A-Za-z0-9+/]{43}=$
          type: string
        signer_id:
          description: Intents account that signs (the payer).
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        verifying_contract:
          const: intents.near
          description: Verifier contract id.
          type: string
      required:
        - signer_id
        - verifying_contract
        - deadline
        - nonce
        - intents
      type: object
    IntentsRequirement:
      additionalProperties: {}
      description: "What a payer must sign: transfer(pay_to, amount) and transfer(fee_to, fee_amount), both with memo = binding."
      properties:
        amount:
          description: Amount the merchant receives, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        binding:
          description: Memo that both transfers must carry.
          pattern: ^np1:[1-9A-HJ-NP-Za-km-z]{43,44}$
          type: string
        deadline:
          description: Latest acceptable payload deadline.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        fee_amount:
          description: NearPay fee, base units, in the same asset.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        fee_to:
          description: NearPay treasury Intents account.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        pay_to:
          description: Merchant Intents account that receives the payment.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        token:
          description: Asset to transfer (equals the settlement asset).
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
      required:
        - pay_to
        - token
        - amount
        - fee_to
        - fee_amount
        - binding
        - deadline
      type: object
    InternalSettlementDestination:
      additionalProperties: {}
      description: Settlement destination with internal fields.
      properties:
        account:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        active_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the destination became (or becomes) active.
        address:
          description: Receiving address or Intents account.
          maxLength: 256
          minLength: 1
          type: string
        address_norm:
          description: Normalised address (lower-case for EVM).
          maxLength: 256
          minLength: 1
          type: string
        approval:
          anyOf:
            - additionalProperties: {}
              properties:
                approved_by:
                  description: Users who approved, in order (the creator counts when 1 is required).
                  items:
                    description: user id (`usr_` + 26 base32 chars).
                    examples:
                      - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
                    pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                    type: string
                  type: array
                rejected_by:
                  anyOf:
                    - description: user id (`usr_` + 26 base32 chars).
                      examples:
                        - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
                      pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                      type: string
                    - type: "null"
                  description: User who rejected the destination, if any (it is then disabled).
                required:
                  description: "Approvals needed: 2 when the account has ≥ 2 owner/admin members, else 1."
                  maximum: 2
                  minimum: 1
                  type: integer
              required:
                - required
                - approved_by
                - rejected_by
              type: object
            - type: "null"
          description: Approval state; null for test-mode destinations. Absent from Stage 1 servers.
        asset_id:
          description: Asset the merchant receives.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        attestation_challenge:
          allOf:
            - $ref: "#/components/schemas/AttestationChallenge"
          description: Present on creation and on `POST /v1/settlement_destinations/{id}/challenge` while the destination awaits its ownership signature.
        attestation_hash:
          anyOf:
            - pattern: ^[0-9a-f]{64}$
              type: string
            - type: "null"
          description: sha256 of the stored attestation (hex); null for unverified/test.
        chain:
          description: Chain of the address; `near:mainnet` for Intents accounts.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        disabled_reason:
          anyOf:
            - description: Why it was disabled.
              type: string
              x-extensible-enum:
                - merchant
                - compliance
                - replaced
            - type: "null"
        fingerprint:
          description: Short fingerprint shown on checkout next to the merchant name, e.g. `7KQ2-M9XA-31`.
          pattern: ^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{2}$
          type: string
        id:
          description: settlement_destination id (`sd_` + 26 base32 chars).
          examples:
            - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        is_default:
          description: Default destination for its asset or for the account.
          type: boolean
        label:
          description: Merchant label.
          type: string
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        min_payment_amount:
          anyOf:
            - $ref: "#/components/schemas/UsdAmount"
            - type: "null"
          description: Smallest payment that is economic for this destination (FR-SET-04).
        object:
          const: settlement_destination
          description: Always `settlement_destination`.
          type: string
        per_payment_cap:
          anyOf:
            - $ref: "#/components/schemas/UsdAmount"
            - type: "null"
          description: Cap per payment for unverified destinations.
        per_payment_cap_usd_micros:
          anyOf:
            - maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Cap for unverified destinations, USD micros.
        status:
          description: Lifecycle status; only `active` destinations receive new payments.
          type: string
          x-extensible-enum:
            - pending_verification
            - pending_approval
            - cooling_off
            - active
            - disabled
        type:
          description: "Where funds settle: an address on a chain, or a NEAR Intents account."
          enum:
            - chain_address
            - intents_account
          type: string
        verification:
          description: How ownership was established.
          type: string
          x-extensible-enum:
            - signature
            - unverified
            - test
      required:
        - id
        - object
        - created
        - livemode
        - asset_id
        - type
        - chain
        - address
        - label
        - status
        - verification
        - fingerprint
        - is_default
        - active_at
        - min_payment_amount
        - per_payment_cap
        - disabled_reason
        - account
        - address_norm
        - attestation_hash
        - per_payment_cap_usd_micros
      type: object
    KillSwitchEvent:
      additionalProperties: {}
      description: Kill switch changed.
      properties:
        actor:
          description: Who.
          type: string
        engaged:
          description: Engaged or released.
          type: boolean
        reason:
          description: Reason.
          type: string
      required:
        - engaged
        - reason
        - actor
      type: object
    KybDecisionEvent:
      additionalProperties: {}
      description: A KYB decision.
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        reason:
          description: "Decision reason (internal: never shown to merchants)."
          type:
            - string
            - "null"
        requested_info:
          description: What ops asked the merchant for (`needs_info`; shown in the `kyb.decision` mail). Absent before Stage 2.
          type:
            - string
            - "null"
        status:
          description: KYB case status.
          type: string
          x-extensible-enum:
            - not_started
            - pending
            - needs_info
            - approved
            - rejected
      required:
        - account_id
        - status
        - reason
      type: object
    KybSubmittedEvent:
      additionalProperties: {}
      description: The owner submitted self-declared business details for review.
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        status:
          description: KYB case status.
          type: string
          x-extensible-enum:
            - not_started
            - pending
            - needs_info
            - approved
            - rejected
        submitted_at:
          description: Submission time.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
      required:
        - account_id
        - status
        - submitted_at
      type: object
    MemberEvent:
      additionalProperties: {}
      description: A team change (ids only; notify resolves emails through identity).
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        actor_user_id:
          anyOf:
            - description: user id (`usr_` + 26 base32 chars).
              examples:
                - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Owner/admin who made the change; null when the user accepted an invitation.
        previous_role:
          anyOf:
            - description: Role of a user in a merchant account.
              enum:
                - owner
                - admin
                - developer
                - finance
                - support
                - viewer
              type: string
            - type: "null"
          description: Role before a change (`role_changed`); null otherwise.
        role:
          description: Role of a user in a merchant account.
          enum:
            - owner
            - admin
            - developer
            - finance
            - support
            - viewer
          type: string
        user_id:
          description: user id (`usr_` + 26 base32 chars).
          examples:
            - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
      required:
        - account_id
        - user_id
        - role
        - previous_role
        - actor_user_id
      type: object
    OpsActionEvent:
      additionalProperties: {}
      description: "A console operator action recorded by the owning service; identity copies it into `audit_events` so the console audit log is one trail. Ids only: no emails, notes or addresses."
      properties:
        account_id:
          anyOf:
            - description: account id (`acct_` + 26 base32 chars).
              examples:
                - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Merchant account concerned, if any (the `audit_events.account`).
        action:
          description: Action, `<object>.<verb>`, e.g. `case.closed`, `blocklist_entry.added`, `kill_switch.engaged`, `kill_switch.release_approved`, `finding.acknowledged`.
          maxLength: 100
          minLength: 1
          type: string
        actor:
          additionalProperties: {}
          description: Operator who acted (ids only; identity resolves the email for display).
          properties:
            ops_role:
              description: Role of a console operator.
              enum:
                - ops
                - ops_admin
              type: string
            sub:
              description: Operator user id (`sub` of the ops principal).
              examples:
                - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
          required:
            - sub
            - ops_role
          type: object
        approval:
          anyOf:
            - description: ops_approval id (`opa_` + 26 base32 chars).
              examples:
                - opa_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^opa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Two-person approval the action completed, if any.
        id:
          description: Action id (UUIDv7); identity dedupes `audit_events` on it. Also the envelope `aggregate.id`.
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          type: string
        occurred_at:
          description: When the action committed.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        target:
          additionalProperties: {}
          description: Object acted on.
          properties:
            id:
              description: Object id (prefixed id, or a fixed name such as `global`).
              maxLength: 128
              minLength: 1
              type: string
            type:
              description: Object type, e.g. `compliance_case`, `blocklist_entry`, `kill_switch`.
              maxLength: 64
              minLength: 1
              type: string
          required:
            - type
            - id
          type: object
      required:
        - id
        - actor
        - action
        - target
        - account_id
        - approval
        - occurred_at
      type: object
    OpsApproval:
      additionalProperties: {}
      description: A console action waiting for (or decided by) a second operator.
      properties:
        action:
          description: Action that needs a second approver.
          type: string
          x-extensible-enum:
            - account.suspend
            - account.reinstate
            - kill_switch.release
