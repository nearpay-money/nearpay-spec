        - blocked_regions
      type: object
    Price:
      additionalProperties: {}
      description: How much and how often a product costs (immutable pricing, INV-6).
      properties:
        active:
          description: Inactive prices cannot be used on new invoices or subscriptions.
          type: boolean
        asset_id:
          anyOf:
            - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            - type: "null"
          description: Pricing asset when `currency` is `asset`.
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: ISO 4217 code for fiat pricing, or `asset` when priced in an asset (then `asset_id` is set).
        id:
          description: price id (`price_` + 26 base32 chars).
          examples:
            - price_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^price_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Up to 50 key/value pairs (key ≤ 40 chars, value ≤ 500 chars) for your own use.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        nickname:
          description: Internal label (never shown to customers).
          type:
            - string
            - "null"
        object:
          const: price
          description: Always `price`.
          type: string
        product:
          description: product id (`prod_` + 26 base32 chars).
          examples:
            - prod_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^prod_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        recurring:
          anyOf:
            - $ref: "#/components/schemas/PriceRecurring"
            - type: "null"
          description: Billing period of a `recurring` price; null for `one_time`.
        type:
          description: One-time charge or a recurring (subscription) price.
          type: string
          x-extensible-enum:
            - one_time
            - recurring
        unit_amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "Price per unit. Fiat: integer minor units. Asset: base units as a string."
      required:
        - id
        - object
        - created
        - livemode
        - product
        - active
        - type
        - unit_amount
        - currency
        - asset_id
        - recurring
        - nickname
        - metadata
      type: object
    PriceRate:
      additionalProperties: {}
      description: "A price or FX rate with its source and timestamps (INV-5: exact rational)."
      properties:
        as_of:
          description: "When the source says the value applies (ECB: publication time of the reference day; feeds: their update time)."
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        base:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
          description: "What is priced: a currency code or an asset id."
        decimal:
          description: The rate as a decimal string rounded half-even to ≤ 18 places; display only, never for arithmetic.
          pattern: ^(0|[1-9][0-9]{0,59})(\.[0-9]{1,18})?$
          type: string
        fetched_at:
          description: When rails read it.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        kind:
          description: "`fx`: fiat exchange rate; `price`: token price."
          type: string
          x-extensible-enum:
            - fx
            - price
        quote:
          description: Currency the value is expressed in (`usd`).
          pattern: ^[a-z]{3}$
          type: string
        role:
          description: "`primary`/`secondary`: the two token prices the dual-source check compares (rails §8.2); `reference`: a fiat FX reference rate."
          type: string
          x-extensible-enum:
            - primary
            - secondary
            - reference
        source:
          description: "Where a rate comes from: `oneclick` (1Click `/v0/tokens`, primary token price), `coingecko` (keyless public feed, secondary token price), `ecb` (ECB euro reference rates, fiat FX), `sandbox` (test-mode token prices), `fixed` (test-mode FX table, and `usd`→`usd`)."
          type: string
          x-extensible-enum:
            - oneclick
            - coingecko
            - ecb
            - sandbox
            - fixed
        valid_until:
          anyOf:
            - description: RFC 3339 UTC timestamp, e.g. `2026-11-05T10:00:00.000Z`.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            - type: "null"
          description: After this instant rails no longer uses the rate (staleness bound, rails §8.2); null = no bound (`fixed`).
        value:
          allOf:
            - $ref: "#/components/schemas/Ratio"
          description: Quote major units per one major unit of `base`.
      required:
        - base
        - quote
        - kind
        - role
        - source
        - value
        - decimal
        - as_of
        - fetched_at
        - valid_until
      type: object
    PriceRecurring:
      additionalProperties: {}
