components:
  schemas:
    AgentAttempt:
      additionalProperties: {}
      description: An agent's attempt and what to sign.
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        attempt_id:
          description: payment_attempt id (`pa_` + 26 base32 chars).
          examples:
            - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        attestation_ticket:
          description: "`base64url(JCS payload).base64url(Ed25519 signature)` issued by payments; pass it to sentinel unchanged."
          pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
          type: string
        execution_id:
          description: execution id (`ex_` + 26 base32 chars).
          examples:
            - ex_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^ex_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        intents_requirement:
          $ref: "#/components/schemas/IntentsRequirement"
        livemode:
          description: Mode.
          type: boolean
      required:
        - attempt_id
        - execution_id
        - account_id
        - livemode
        - intents_requirement
        - attestation_ticket
      type: object
    BitcoinEvidence:
      additionalProperties: {}
      description: Bitcoin-specific settlement detail (outputs and confirmations).
      properties:
        block_hash:
          description: Hash of the confirming block, hex.
          pattern: ^[0-9a-f]{64}$
          type: string
        block_height:
          description: Height of the confirming block (= `Evidence.block_ref`).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        confirmations:
          description: Confirmations when the evidence was accepted (`tip − block_height + 1`).
          maximum: 9007199254740991
          minimum: 1
          type: integer
        outputs:
          description: Outputs of the transaction that pay the destination address.
          items:
            additionalProperties: {}
            description: An output paying the destination.
            properties:
              script_pubkey:
                description: Output scriptPubKey, hex (`0014…` P2WPKH, `5120…` P2TR).
                pattern: ^[0-9a-f]{2,200}$
                type: string
              value:
                description: Output value, satoshis.
                pattern: ^(0|[1-9][0-9]{0,77})$
                type: string
              vout:
                description: Output index.
                maximum: 9007199254740991
                minimum: 0
                type: integer
            required:
              - vout
              - value
              - script_pubkey
            type: object
          minItems: 1
          type: array
        required_confirmations:
          description: Confirmations the chain profile required for this settlement's USD value (`confirmation_tiers`).
          maximum: 9007199254740991
          minimum: 1
          type: integer
        txid:
          description: Transaction id (= `Evidence.tx_hash`).
          pattern: ^[0-9a-f]{64}$
          type: string
      required:
        - txid
        - outputs
        - block_height
        - block_hash
        - confirmations
        - required_confirmations
      type: object
    CheckoutSession:
      additionalProperties: {}
      description: A checkout page or embed for one payment intent.
      properties:
        allowed_origins:
          description: Origins that may embed the session (embedded mode).
          items:
            type: string
          type: array
        amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "Fiat: integer minor units. Asset: base units as a decimal string."
        asset_id:
          anyOf:
            - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            - type: "null"
          description: Pricing asset when `currency` is `asset`.
        cancel_url:
          anyOf:
            - description: Absolute URL.
              format: uri
              maxLength: 2048
              type: string
            - type: "null"
          description: Where the payer goes on cancel.
        client_secret:
          anyOf:
            - pattern: ^cs_[0-9a-z]{26}_secret_[0-9A-Za-z]{32}$
              type: string
            - type: "null"
          description: Secret for the payer-facing API; returned only when the session is created.
        completed_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the session completed.
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: ISO 4217 code for fiat pricing, or `asset` when priced in an asset (then `asset_id` is set).
        customer:
          anyOf:
            - description: customer id (`cus_` + 26 base32 chars).
              examples:
                - cus_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^cus_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Customer attached to the session (Stage 2).
        description:
          description: Description shown to the payer.
          type:
            - string
            - "null"
        expires_at:
          description: When the session stops accepting new payments.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        id:
          description: checkout_session id (`cs_` + 26 base32 chars).
          examples:
            - cs_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cs_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        invoice:
          anyOf:
            - description: invoice id (`in_` + 26 base32 chars).
              examples:
                - in_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^in_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Invoice the session pays (opened by the hosted invoice page, Stage 3); null otherwise.
        late:
          description: Completed by a settlement after expiry.
          type: boolean
        late_payments:
          description: Accept settlements after expiry.
          type: boolean
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        locale:
          description: Checkout locale.
          type:
            - string
            - "null"
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Up to 50 key/value pairs (key ≤ 40 chars, value ≤ 500 chars) for your own use.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        object:
          const: checkout_session
          description: Always `checkout_session`.
          type: string
        payment_intent:
          anyOf:
            - description: payment_intent id (`pi_` + 26 base32 chars).
              examples:
                - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - $ref: "#/components/schemas/PaymentIntent"
          description: Payment intent id, or the object with `expand[]=payment_intent`.
        payment_link:
          anyOf:
            - description: payment_link id (`plink_` + 26 base32 chars).
              examples:
                - plink_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^plink_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Payment link that opened the session (Stage 2).
        sequence:
          description: Increases with every change; discard webhook objects with a lower sequence. Servers MUST send it (optional in the 0.1.x schema only so readers built on 0.1.4 stay compatible).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        settlement_destination:
          description: settlement_destination id (`sd_` + 26 base32 chars).
          examples:
            - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        status:
          description: Session status; `expiring` means past `expires_at` with money possibly in flight (INV-3).
          type: string
          x-extensible-enum:
            - open
            - expiring
            - complete
            - expired
        success_url:
          description: Where the payer goes after paying (`?session_id=` is appended).
          format: uri
          maxLength: 2048
          type: string
        ui_mode:
          description: Hosted page or embedded iframe.
          enum:
            - hosted
            - embedded
          type: string
        url:
          anyOf:
            - description: Absolute URL.
              format: uri
              maxLength: 2048
              type: string
            - type: "null"
          description: Checkout URL including the client secret; returned only when the session is created.
      required:
        - id
        - object
        - created
        - livemode
        - status
        - url
        - client_secret
        - expires_at
        - payment_intent
        - amount
        - currency
        - asset_id
        - settlement_destination
        - ui_mode
        - success_url
        - cancel_url
        - description
        - allowed_origins
        - late_payments
        - locale
        - completed_at
        - late
        - metadata
      type: object
    CustomerWallet:
      additionalProperties: {}
      description: A wallet the customer pays from.
      properties:
        address:
          description: Wallet address or NEAR account.
          maxLength: 256
          minLength: 1
          type: string
        chain:
          description: Chain of the wallet (`near:mainnet` for NEAR and Intents accounts).
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
      required:
        - chain
        - address
      type: object
    DepositInstructions:
      additionalProperties: {}
      description: Where and how much the payer sends (render only after sentinel attestation).
      properties:
        address:
          description: 1Click deposit address.
          maxLength: 256
          minLength: 1
          type: string
        amount_in:
          description: Amount to send, base units of the origin asset.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        chain:
          description: Chain to send on.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        deadline:
          description: Send before this time; later deposits are refunded.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        fee_amount:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: "Part of `amount_in` that pays NearPay's fee, base units of the origin asset — display only (not attested): `0` when the merchant bears the fee, null when unknown. Absent from older servers."
        memo:
          description: Memo the deposit must carry, if any.
          type:
            - string
            - "null"
        min_amount_in:
          description: Minimum the provider accepts; below it the deposit is refunded.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        origin_asset_id:
          description: Asset to send.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
      required:
        - address
        - memo
        - amount_in
        - min_amount_in
        - deadline
        - chain
        - origin_asset_id
      type: object
    DestinationSnapshot:
      additionalProperties: {}
      description: Settlement destination as snapshotted at creation (INV-6).
      properties:
        address:
          description: Settlement address or Intents account.
          maxLength: 256
          minLength: 1
          type: string
        asset_id:
          description: Settlement asset.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        chain:
          description: Settlement chain.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        fingerprint:
          anyOf:
            - pattern: ^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{2}$
              type: string
            - type: "null"
          description: Fingerprint of the destination as shown at checkout (CR-15-04, spec 0.2.0); optional so older servers stay valid.
        settlement_destination:
          description: settlement_destination id (`sd_` + 26 base32 chars).
          examples:
            - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        type:
          description: "Where funds settle: an address on a chain, or a NEAR Intents account."
          enum:
            - chain_address
            - intents_account
          type: string
      required:
        - settlement_destination
        - asset_id
        - type
        - chain
        - address
      type: object
    Error:
      additionalProperties: {}
      description: Envelope returned with every non-2xx response.
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
      required:
        - error
      type: object
    ErrorBody:
      additionalProperties: {}
      description: Details of a failed request.
      properties:
        code:
          description: Machine-readable error code from the error catalogue.
          type: string
          x-extensible-enum:
            - invalid_request
            - resource_missing
            - authentication_required
            - invalid_api_key
            - permission_denied
            - csrf_token_invalid
            - ip_not_allowed
            - account_suspended
            - step_up_required
            - rate_limited
            - idempotency_key_reused
            - idempotency_in_progress
            - api_error
            - state_conflict
            - livemode_forbidden
            - link_expired
            - link_used
            - webauthn_failed
            - invalid_client
            - turnstile_failed
            - invalid_setting
            - scope_unknown
            - address_invalid
            - asset_unsupported
            - memo_destination_unsupported
            - destination_in_use
            - recovery_lock
            - screening_blocked
            - attestation_invalid
            - challenge_expired
            - destination_not_active
            - account_not_live
            - amount_below_destination_minimum
            - amount_above_unverified_cap
            - currency_unsupported
            - allowed_origins_required
            - attempt_in_flight
            - client_secret_invalid
            - session_not_open
            - too_many_attempts
            - route_too_slow
            - refund_address_invalid
            - geo_blocked
            - intent_invalid
            - insufficient_balance
            - rail_unavailable
            - route_unavailable
            - pricing_unavailable
            - deadline_too_short
            - quote_rejected
            - quote_integrity_failed
            - ticket_invalid
            - attestation_refused
            - attestation_stale
            - attestation_unavailable
            - destination_not_intents_account
            - amount_below_minimum
            - screening_unavailable
            - url_invalid
            - event_type_unknown
            - last_owner
            - member_exists
            - invitation_invalid
            - approver_conflict
            - two_person_required
            - authenticator_not_allowed
            - kyb_profile_incomplete
            - intent_not_succeeded
            - attempt_not_settled
            - amount_exceeds_refundable
            - leg_expired
            - signed_intent_mismatch
            - review_requires_evidence
            - link_inactive
            - customer_deleted
            - reconciliation_day_open
            - fx_rate_unavailable
            - currency_mismatch
            - interval_mismatch
            - price_inactive
            - price_type_invalid
            - tax_rate_inactive
            - tax_rates_mixed
            - invoice_empty
            - customer_email_missing
            - invoice_secret_invalid
            - invoice_not_payable
            - auto_debit_unavailable
            - vault_cap_exceeded
        doc_url:
          description: Documentation page for this error code.
          format: uri
          type: string
        message:
          description: Human-readable message; safe to show to developers, not to payers.
          type: string
        param:
          description: The request parameter the error relates to, when there is one.
          type: string
        request_id:
          description: Request id, also returned in the `X-Request-Id` header.
          examples:
            - req_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^req_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        type:
          description: Error category; decides whether a retry can help.
          type: string
          x-extensible-enum:
            - invalid_request_error
            - authentication_error
            - permission_error
            - payment_error
            - idempotency_error
            - state_conflict
            - rate_limit_error
            - api_error
            - rail_unavailable
      required:
        - type
        - code
        - message
        - doc_url
        - request_id
      type: object
    Evidence:
      additionalProperties: {}
      description: Independent on-chain proof that a settlement reached the merchant (INV-2).
      properties:
        amount:
          description: Amount received by the recipient, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          description: Asset that settled.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        bitcoin:
          anyOf:
            - $ref: "#/components/schemas/BitcoinEvidence"
            - type: "null"
          description: Bitcoin detail (txid, outputs, confirmations) when `chain` is Bitcoin; null/absent otherwise. Spec 0.4.0.
        block_ref:
          description: Block height or hash containing the transaction.
          type:
            - string
            - "null"
        chain:
          description: Chain where the settlement happened.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        explorer_url:
          anyOf:
            - format: uri
              type: string
            - type: "null"
          description: Block-explorer link for the transaction.
        finality:
          description: Finality reached when the evidence was accepted.
          type: string
          x-extensible-enum:
            - final
            - finalized
            - confirmed
        observed_at:
          description: When NearPay accepted the evidence.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        recipient:
          description: Recipient that received the funds (the merchant destination).
          maxLength: 256
          minLength: 1
          type: string
        sender:
          anyOf:
            - description: Address in the chain's canonical text form.
              maxLength: 256
              minLength: 1
              type: string
            - type: "null"
          description: "Account that sent the settlement transfer, when the detector saw it (NEAR Intents: the transferring Intents account); null if unknown. Spec 0.3.0."
        solana:
          anyOf:
            - $ref: "#/components/schemas/SolanaEvidence"
            - type: "null"
          description: Solana detail (signature, slot, mint, token-balance delta) when `chain` is Solana; null/absent otherwise. Spec 0.4.0.
        source:
          description: Detector that produced the evidence.
          type: string
          x-extensible-enum:
            - watcher
            - indexer
            - verifier
            - provider
            - operator
        tier:
          description: "Verification tier: A = independently verified on chain, B = provider-attested within limits."
          type: string
          x-extensible-enum:
            - A
            - B
        tx_hash:
          description: Settlement transaction (NEAR receipt / tx hash for Intents).
          maxLength: 128
          minLength: 8
          type: string
      required:
        - chain
        - tx_hash
        - block_ref
        - recipient
        - asset_id
        - amount
        - finality
        - tier
        - source
        - observed_at
        - explorer_url
      type: object
    FeeSummary:
      additionalProperties: {}
      description: Fee snapshot of a payment (INV-6).
      properties:
        bearer:
          description: Who bears the fee.
          enum:
            - payer
            - merchant
          type: string
        total_bps:
          description: NearPay fee applied to this payment's route, in basis points.
          maximum: 10000
          minimum: 0
          type: integer
      required:
        - bearer
        - total_bps
      type: object
    IntentMessage:
      additionalProperties: {}
      description: Verifier message (`DefusePayload`).
      properties:
        deadline:
          description: Latest time the Verifier accepts the payload.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        intents:
          description: Intents executed atomically.
          items:
            anyOf:
              - $ref: "#/components/schemas/TransferIntent"
              - additionalProperties: {}
                properties:
                  intent:
                    description: Intent kind.
                    type: string
                required:
                  - intent
                type: object
            description: A Verifier intent.
          minItems: 1
          type: array
        nonce:
          description: 32-byte nonce (4-byte Verifier salt ‖ 28 random bytes), standard base64.
          pattern: ^[A-Za-z0-9+/]{43}=$
          type: string
        signer_id:
          description: Intents account that signs (the payer).
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        verifying_contract:
          const: intents.near
          description: Verifier contract id.
          type: string
      required:
        - signer_id
        - verifying_contract
        - deadline
        - nonce
        - intents
      type: object
    IntentsRequirement:
      additionalProperties: {}
      description: "What a payer must sign: transfer(pay_to, amount) and transfer(fee_to, fee_amount), both with memo = binding."
      properties:
        amount:
          description: Amount the merchant receives, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        binding:
          description: Memo that both transfers must carry.
          pattern: ^np1:[1-9A-HJ-NP-Za-km-z]{43,44}$
          type: string
        deadline:
          description: Latest acceptable payload deadline.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        fee_amount:
          description: NearPay fee, base units, in the same asset.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        fee_to:
          description: NearPay treasury Intents account.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        pay_to:
          description: Merchant Intents account that receives the payment.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        token:
          description: Asset to transfer (equals the settlement asset).
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
      required:
        - pay_to
        - token
        - amount
        - fee_to
        - fee_amount
        - binding
        - deadline
      type: object
    InternalCustomer:
      additionalProperties: {}
      description: A customer with its account, incl. decrypted email (PII; never in events).
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        deleted:
          description: "The customer was deleted (personal data erased: `email` and `name` are null)."
          type: boolean
        description:
          description: Internal description.
          type:
            - string
            - "null"
        email:
          anyOf:
            - format: email
              pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              type: string
            - type: "null"
          description: Receipt email.
        id:
          description: customer id (`cus_` + 26 base32 chars).
          examples:
            - cus_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cus_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        last_payment_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the customer's latest payment intent succeeded; null when none. Spec 0.2.1.
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Up to 50 key/value pairs (key ≤ 40 chars, value ≤ 500 chars) for your own use.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        name:
          description: Name.
          type:
            - string
            - "null"
        object:
          const: customer
          description: Always `customer`.
          type: string
        total_paid:
          description: Totals of succeeded payments per pricing currency (amounts in different currencies are never added); refunds are not subtracted. Spec 0.2.1.
          items:
            additionalProperties: {}
            description: Total for one pricing currency (or pricing asset).
            properties:
              amount:
                anyOf:
                  - description: Fiat amount in minor units (e.g. cents), integer.
                    maximum: 9007199254740991
                    minimum: 0
                    type: integer
                  - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
                    pattern: ^(0|[1-9][0-9]{0,77})$
                    type: string
                description: Sum of the priced amounts of the customer's succeeded payment intents.
              asset_id:
                anyOf:
                  - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
                    examples:
                      - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
                    maxLength: 256
                    pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
                    type: string
                  - type: "null"
                description: Pricing asset when `currency` is `asset`.
              count:
                description: Succeeded payment intents counted.
                maximum: 9007199254740991
                minimum: 0
                type: integer
              currency:
                anyOf:
                  - description: ISO 4217 currency code, lower-case (e.g. `usd`).
                    pattern: ^[a-z]{3}$
                    type: string
                  - const: asset
                    type: string
                description: ISO 4217 code for fiat pricing, or `asset` when priced in an asset (then `asset_id` is set).
            required:
              - currency
              - asset_id
              - amount
              - count
            type: object
          type: array
        wallets:
          description: Known wallets (informational; refunds always use the payment's refund address).
          items:
            $ref: "#/components/schemas/CustomerWallet"
          type: array
      required:
        - id
        - object
        - created
        - livemode
        - email
        - name
        - description
        - wallets
        - metadata
        - account_id
        - deleted
      type: object
    InvoiceCheckoutSessionCreate:
      additionalProperties: false
      description: Parameters of an invoice checkout session.
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: The invoice's `amount_remaining`.
        asset_id:
          description: Pricing asset; required when `currency` is `asset`.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: ISO 4217 code for fiat pricing, or `asset` when priced in an asset (then `asset_id` is set).
        customer:
          description: The invoice's customer (receipt address and the intent's `customer`).
          examples:
            - cus_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cus_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        description:
          description: Shown to the payer, e.g. `Invoice ACME01T-00042`.
          maxLength: 500
          minLength: 1
          type: string
        expires_at:
          description: "When the session stops accepting new payments: at least 5 minutes and at most 30 days ahead (billing uses the earlier of now + 30 d and the invoice's last reminder)."
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        invoice:
          description: "Invoice the session pays; the intent gets `source: invoice` and this `invoice`."
          examples:
            - in_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^in_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        livemode:
          description: Mode of the invoice.
          type: boolean
        locale:
          description: Checkout locale (BCP 47).
          maxLength: 16
          type: string
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Copied onto the intent (billing sends the invoice metadata plus `invoice_number`).
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        settlement_destination:
          description: "The invoice's destination; default: asset or account default."
          examples:
            - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        success_url:
          description: Where the payer goes after paying (the hosted invoice page, without its secret).
          format: uri
          maxLength: 2048
          type: string
      required:
        - account_id
        - livemode
        - invoice
        - amount
        - currency
        - customer
        - description
        - success_url
        - expires_at
      type: object
    PayerAttempt:
      additionalProperties: {}
      description: A payment attempt as the payer sees it.
      properties:
        amount_received:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: What the payer's deposit actually delivered, base units of the origin asset; null until a deposit is detected. Shows “received X of Y” for an `incomplete_deposit`. Absent from older servers.
        attestation_ticket:
          anyOf:
            - description: "`base64url(JCS payload).base64url(Ed25519 signature)` issued by payments; pass it to sentinel unchanged."
              pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
              type: string
            - type: "null"
          description: Ticket for sentinel; present while instructions are live.
        deposit:
          anyOf:
            - $ref: "#/components/schemas/DepositInstructions"
            - type: "null"
          description: Deposit instructions (`route_quote`).
        failure_code:
          description: Reason the attempt failed or was refunded.
          type:
            - string
            - "null"
        id:
          description: payment_attempt id (`pa_` + 26 base32 chars).
          examples:
            - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        intents_requirement:
          anyOf:
            - $ref: "#/components/schemas/IntentsRequirement"
            - type: "null"
          description: What to sign (`intents_transfer`).
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        method:
          description: "`route_quote`: deposit to a 1Click address from any chain. `intents_transfer`: signed transfer from a NEAR Intents balance."
          enum:
            - route_quote
            - intents_transfer
          type: string
        object:
          const: payment_attempt
          description: Always `payment_attempt`.
          type: string
        origin_asset_id:
          description: Asset the payer pays with.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        refunded_amount:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Amount the provider refunded to the payer, if any.
        status:
          description: Attempt status (mirrors the rails execution, domain-model §4.3).
          type: string
          x-extensible-enum:
            - quoting
            - awaiting_deposit
            - deposit_detected
            - incomplete_deposit
            - settling
            - verifying
            - succeeded
            - refunded
            - failed
            - expired_unpaid
            - held
        visible:
          description: False once a newer attempt replaced it ("don't send again").
          type: boolean
      required:
        - id
        - object
        - livemode
        - status
        - method
        - visible
        - origin_asset_id
        - deposit
        - intents_requirement
        - attestation_ticket
        - failure_code
        - refunded_amount
      type: object
    PayerSessionContext:
