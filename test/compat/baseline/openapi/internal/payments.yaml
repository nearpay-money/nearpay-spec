  /ops/reconciliation_runs:
    get:
      operationId: listOpsReconciliationRuns
      parameters:
        - description: Number of objects to return, 1–100 (default 10).
          in: query
          name: limit
          schema:
            default: 10
            description: Number of objects to return, 1–100 (default 10).
            maximum: 100
            minimum: 1
            type: integer
        - description: "Cursor: id of the last object of the previous page."
          in: query
          name: starting_after
          schema:
            description: "Cursor: id of the last object of the previous page."
            maxLength: 64
            type: string
        - description: "Cursor: id of the first object of the next page."
          in: query
          name: ending_before
          schema:
            description: "Cursor: id of the first object of the next page."
            maxLength: 64
            type: string
        - description: Only runs of this account.
          in: query
          name: account
          schema:
            description: Only runs of this account.
            examples:
              - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
        - description: Only live or test runs.
          in: query
          name: livemode
          schema:
            description: Only live or test runs.
            enum:
              - "true"
              - "false"
            type: string
        - description: Only runs in this status.
          in: query
          name: status
          schema:
            description: Only runs in this status.
            type: string
            x-extensible-enum:
              - running
              - ok
              - diff
              - error
        - description: Only runs of this day.
          in: query
          name: day
          schema:
            description: Only runs of this day.
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            type: string
        - description: Only runs of this day or later.
          in: query
          name: day[gte]
          schema:
