            type: string
          description: Up to 50 key/value pairs (key ≤ 40 chars, value ≤ 500 chars) for your own use.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        object:
          const: payment_intent
          description: Always `payment_intent`.
          type: string
        overpayments:
          description: Settlements beyond the one that paid the intent (refund recommended).
          items:
            additionalProperties: {}
            description: An extra settlement.
            properties:
              amount:
                description: Extra amount that settled, base units.
                pattern: ^(0|[1-9][0-9]{0,77})$
                type: string
              attempt:
                description: payment_attempt id (`pa_` + 26 base32 chars).
                examples:
                  - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
                pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                type: string
              reason:
                description: Why it counts as an overpayment.
                type: string
                x-extensible-enum:
                  - duplicate
                  - after_cancel
                  - after_expiry
            required:
              - attempt
              - amount
              - reason
            type: object
          type: array
        payment_link:
          anyOf:
            - description: payment_link id (`plink_` + 26 base32 chars).
              examples:
                - plink_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^plink_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: "Payment link that created the intent (`source: payment_link`)."
        refunds:
          description: Refunds of this intent, newest first (Stage 2).
          items:
            description: refund id (`re_` + 26 base32 chars).
            examples:
              - re_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^re_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
          type: array
        review_decision:
          anyOf:
            - additionalProperties: {}
              properties:
                decided_at:
                  description: When the decision was recorded.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                decision:
                  description: Merchant decision.
                  enum:
                    - accept
                    - reject
                  type: string
                refund:
                  anyOf:
                    - description: refund id (`re_` + 26 base32 chars).
                      examples:
                        - re_01jbz9k3m4n5p6q7r8s9t0v1w2
                      pattern: ^re_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                      type: string
                    - type: "null"
                  description: Refund created by a `reject` of a settled amount (draft, merchant signs).
              required:
                - decision
                - decided_at
                - refund
              type: object
            - type: "null"
          description: Merchant decision on a `requires_review` intent (Stage 2).
        review_reason:
          anyOf:
            - description: Why the intent needs review.
              type: string
              x-extensible-enum:
                - short_settlement
                - verification_held
            - type: "null"
        sequence:
          description: Increases with every change; discard webhook objects with a lower sequence.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        settlement_asset_id:
          description: Asset the merchant receives.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        source:
          description: What created the intent.
          type: string
          x-extensible-enum:
            - checkout
            - invoice
            - payment_link
            - api
        status:
          description: Payment intent status (domain-model §4.2).
          type: string
          x-extensible-enum:
            - requires_payment
            - processing
            - requires_review
            - succeeded
            - canceled
            - expired
        succeeded_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the intent succeeded.
      required:
        - id
        - object
        - created
        - livemode
        - status
        - amount
        - currency
        - asset_id
        - description
        - source
        - checkout_session
        - destination
        - fee
        - settlement_asset_id
        - amount_settled
        - amount_refunded
        - succeeded_at
        - late
        - canceled_at
        - cancellation_reason
        - review_reason
        - attempts
        - overpayments
        - sequence
        - metadata
      type: object
    PricingAssetDisplay:
      additionalProperties: {}
      description: Display data of a pricing asset (rails registry).
      properties:
        asset_id:
          description: Pricing asset.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        decimals:
          description: Token decimals (format `amount` with them).
          maximum: 255
          minimum: 0
          type: integer
        symbol:
          description: Token symbol.
          maxLength: 32
          minLength: 1
          type: string
      required:
        - asset_id
        - symbol
        - decimals
      type: object
    PublicCheckoutSession:
      additionalProperties: {}
      description: A checkout session as the payer sees it.
      properties:
        allowed_origins:
          description: Origins allowed to embed this session.
          items:
            type: string
          type: array
        amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "Fiat: integer minor units. Asset: base units as a decimal string."
        asset_id:
          anyOf:
            - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            - type: "null"
          description: Pricing asset when `currency` is `asset`.
        attempt:
          anyOf:
            - $ref: "#/components/schemas/PayerAttempt"
            - type: "null"
          description: The current visible attempt, if any.
        cancel_url:
          anyOf:
            - description: Absolute URL.
              format: uri
              maxLength: 2048
              type: string
            - type: "null"
          description: Redirect target on cancel.
        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: ISO 4217 code for fiat pricing, or `asset` when priced in an asset (then `asset_id` is set).
        display:
          additionalProperties: {}
          description: What the payer is paying for.
          properties:
            description:
              description: Payment description.
              type:
                - string
                - "null"
            merchant_name_unverified:
              description: Merchant display name (not authenticated; the attested name comes from sentinel).
              type: string
          required:
            - merchant_name_unverified
            - description
          type: object
        expires_at:
          description: When the session stops accepting new payments.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        id:
          description: checkout_session id (`cs_` + 26 base32 chars).
          examples:
            - cs_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cs_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        intent_status:
          description: Payment intent status (domain-model §4.2).
          type: string
          x-extensible-enum:
            - requires_payment
            - processing
            - requires_review
            - succeeded
            - canceled
            - expired
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        object:
          const: checkout_session
          description: Always `checkout_session`.
          type: string
        payment_intent:
          description: Payment intent of this session (embedded checkout reports it in `np:complete`).
          examples:
            - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        pricing_asset:
          anyOf:
            - $ref: "#/components/schemas/PricingAssetDisplay"
            - type: "null"
          description: Display data of the pricing asset when `currency` is `asset`; null for fiat pricing. Spec 0.2.1.
        settlement:
          additionalProperties: {}
          description: How the merchant is paid (never the raw address).
          properties:
            asset_id:
              description: Asset the merchant receives.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            chain:
              description: Chain the merchant receives on.
              examples:
                - eip155:8453
              pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
              type: string
            type:
              description: "Where funds settle: an address on a chain, or a NEAR Intents account."
              enum:
                - chain_address
                - intents_account
              type: string
          required:
            - asset_id
            - chain
            - type
          type: object
        status:
          description: Session status; `expiring` means past `expires_at` with money possibly in flight (INV-3).
          type: string
          x-extensible-enum:
            - open
            - expiring
            - complete
            - expired
        success_url:
          description: Redirect target after success (`?session_id=` appended).
          format: uri
          maxLength: 2048
          type: string
        ui_mode:
          description: Hosted page or embedded iframe.
          enum:
            - hosted
            - embedded
          type: string
      required:
        - id
        - object
        - livemode
        - status
        - payment_intent
        - intent_status
        - amount
        - currency
        - asset_id
        - display
        - expires_at
        - settlement
        - ui_mode
        - allowed_origins
        - success_url
        - cancel_url
        - attempt
      type: object
    ReceiptContext:
      additionalProperties: {}
