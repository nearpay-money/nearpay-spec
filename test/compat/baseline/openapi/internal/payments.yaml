          type: string
      required:
        - classification
        - note
        - actor
        - resolved_at
      type: object
    ReconciliationRun:
      additionalProperties: {}
      description: "Daily reconciliation of one account, mode and UTC day: Σ statement = Σ verified evidence per asset."
      properties:
        account_display_name:
          description: Account display name at read time (console lists); null when unknown (spec 0.2.1).
          type:
            - string
            - "null"
        account_id:
