          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        completed_at:
          anyOf:
            - description: RFC 3339 UTC timestamp, e.g. `2026-11-05T10:00:00.000Z`.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            - type: "null"
          description: Finished (null while running).
        day:
          description: UTC day `YYYY-MM-DD`.
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
          type: string
        diff_count:
          description: Number of diffs.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        diffs:
          description: Differences (empty when `ok`).
          items:
            $ref: "#/components/schemas/ReconciliationDiff"
          type: array
        error:
          description: Why the run errored.
          type:
            - string
            - "null"
        id:
          description: reconciliation_run id (`rcn_` + 26 base32 chars).
          examples:
            - rcn_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^rcn_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        livemode:
          description: Mode.
          type: boolean
        object:
          const: reconciliation_run
          description: Always `reconciliation_run`.
          type: string
        rerun_of:
          anyOf:
            - description: reconciliation_run id (`rcn_` + 26 base32 chars).
              examples:
                - rcn_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^rcn_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Earlier run of the same day this one repeats.
        resolution:
          anyOf:
            - $ref: "#/components/schemas/ReconciliationResolution"
            - type: "null"
          description: Operator resolution of a `diff`/`error` run.
        started_at:
          description: Started.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        status:
          description: "`ok` = zero diffs; `diff` = at least one diff (RB-05); `error` = the run could not complete (e.g. rails unreachable)."
          type: string
