            - type: "null"
          description: Amount on the evidence side.
        execution_id:
          anyOf:
            - description: execution id (`ex_` + 26 base32 chars).
              examples:
                - ex_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^ex_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Rails execution concerned.
        kind:
          description: What differs.
          type: string
          x-extensible-enum:
            - missing_statement_line
            - missing_evidence
            - amount_mismatch
            - asset_mismatch
            - fee_mismatch
            - duplicate_line
        payment_intent:
          anyOf:
            - description: payment_intent id (`pi_` + 26 base32 chars).
              examples:
                - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Payment intent concerned.
        refund:
          anyOf:
            - description: refund id (`re_` + 26 base32 chars).
              examples:
                - re_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^re_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Refund concerned.
        statement_amount:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Amount on the statement side.
      required:
        - kind
        - asset_id
        - execution_id
        - balance_transaction
        - payment_intent
        - refund
        - statement_amount
        - evidence_amount
        - detail
