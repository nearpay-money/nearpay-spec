            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        decimals:
          description: Decimals of `asset_id` for display (from rails `getInternalAsset`; spec 0.2.1).
          maximum: 255
          minimum: 0
          type: integer
        fees:
          additionalProperties: {}
          description: Fee reconciliation.
          properties:
            expected:
              description: Σ estimated fees of the statement lines.
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            observed:
              anyOf:
                - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
                  pattern: ^(0|[1-9][0-9]{0,77})$
                  type: string
                - type: "null"
              description: Σ fees observed by rails (Explorer `appFees`); null when unavailable.
          required:
            - expected
            - observed
          type: object
        inflow:
          $ref: "#/components/schemas/ReconciliationFlow"
          description: "`payment` + `overpayment` lines vs settled payment executions."
        outflow:
          $ref: "#/components/schemas/ReconciliationFlow"
          description: "`refund` lines vs settled refund executions (amount sent by the merchant)."
      required:
        - asset_id
        - inflow
        - outflow
        - fees
      type: object
    Refund:
      additionalProperties: {}
      description: Money returned to a payer, signed by the merchant (non-custodial).
      properties:
        amount:
          description: Refunded amount, base units of `asset_id`.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        amount_received:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: What the payer received, base units of `recipient.asset_id` (from evidence).
        asset_id:
          description: Settlement asset the amount is in.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        canceled_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the merchant canceled.
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        decimals:
          description: Decimals of `asset_id`.
          maximum: 255
          minimum: 0
          type: integer
        evidence:
          anyOf:
            - $ref: "#/components/schemas/Evidence"
            - type: "null"
          description: Payer-side evidence of the leg that refunded the payer (INV-2).
        extra_amount_sent:
          description: Settlement-asset amount sent by duplicate legs (signed and sent after another leg had refunded the payer); `0` normally.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        failure_code:
          description: Why the refund failed (the last leg's code).
          type:
            - string
            - "null"
        fee_mode:
          description: "`payer_absorbs` (default, `EXACT_INPUT`): the merchant sends `amount`, the payer receives it minus route costs. `merchant_absorbs` (`EXACT_OUTPUT`): the payer receives the equivalent of `amount`; the merchant sends slightly more."
          enum:
            - payer_absorbs
            - merchant_absorbs
          type: string
        id:
          description: refund id (`re_` + 26 base32 chars).
          examples:
            - re_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^re_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        legs:
          description: Legs, newest first.
          items:
            $ref: "#/components/schemas/RefundLeg"
          type: array
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Up to 50 key/value pairs (key ≤ 40 chars, value ≤ 500 chars) for your own use.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        method:
          description: "`route_quote`: a 1Click route back to the payer's origin chain and asset. `intents_transfer`: a merchant-signed Verifier transfer to the payer's Intents account (refund of an `intents_transfer` payment; no route provider)."
          type: string
          x-extensible-enum:
            - route_quote
            - intents_transfer
        next_action:
          anyOf:
            - $ref: "#/components/schemas/RefundNextAction"
            - type: "null"
          description: Present in `requires_action` once the current leg is prepared; null while it is being prepared and in every other status.
        object:
          const: refund
          description: Always `refund`.
          type: string
        payment_attempt:
          description: Attempt whose settlement is refunded (the paying attempt, or an overpayment).
          examples:
            - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        payment_intent:
          description: payment_intent id (`pi_` + 26 base32 chars).
          examples:
            - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        reason:
          anyOf:
            - description: Why the merchant refunds.
              type: string
              x-extensible-enum:
                - requested_by_customer
                - duplicate
                - fraudulent
                - overpayment
                - other
            - type: "null"
        recipient:
          $ref: "#/components/schemas/RefundRecipient"
        sequence:
          description: Increases with every change; discard webhook objects with a lower sequence.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        source:
          description: What created the refund.
          type: string
          x-extensible-enum:
            - api
            - dashboard
            - review_rejection
        status:
          description: "Refund status (domain-model §4.4): `requires_action` = waiting for the merchant's signature; `pending` = the merchant's funds were detected and are on their way; `failed` = the provider returned them to the merchant (prepare again to retry)."
          type: string
          x-extensible-enum:
            - requires_action
            - pending
            - succeeded
            - failed
            - canceled
        succeeded_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the payer-side evidence was verified.
      required:
        - id
        - object
        - created
        - livemode
        - status
        - payment_intent
        - payment_attempt
        - amount
        - asset_id
        - decimals
        - fee_mode
        - reason
        - method
        - recipient
        - next_action
        - legs
        - amount_received
        - evidence
        - extra_amount_sent
        - source
        - failure_code
        - succeeded_at
        - canceled_at
        - sequence
        - metadata
      type: object
    RefundLeg:
      additionalProperties: {}
      description: One prepared route or transfer for a refund.
      properties:
        amount:
          description: What the merchant sends, base units of the settlement asset.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        amount_out_expected:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: What the payer is expected to receive, base units of the recipient asset (route estimate).
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        deadline:
          description: Sign and send before this time.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        duplicate:
          description: Settled after another leg had already refunded the payer (recorded in `extra_amount_sent`).
          type: boolean
        evidence:
          anyOf:
            - $ref: "#/components/schemas/Evidence"
            - type: "null"
          description: Payer-side evidence once verified (INV-2).
        failure_code:
          description: Why the leg failed, returned or was held.
          type:
            - string
            - "null"
        method:
          description: "`route_quote`: a 1Click route back to the payer's origin chain and asset. `intents_transfer`: a merchant-signed Verifier transfer to the payer's Intents account (refund of an `intents_transfer` payment; no route provider)."
          type: string
          x-extensible-enum:
            - route_quote
            - intents_transfer
        number:
          description: Leg number, 1-based; a re-prepared refund gets a new leg.
          maximum: 9007199254740991
          minimum: 1
          type: integer
        status:
          description: "Leg status: `returned` = the provider sent the funds back to the merchant destination; `expired` = the deadline passed without a deposit."
          type: string
          x-extensible-enum:
            - awaiting_signature
            - submitted
            - processing
            - succeeded
            - returned
            - failed
            - expired
            - held
        submitted_tx:
          anyOf:
            - description: Transaction hash in the chain's text form.
              maxLength: 128
              minLength: 8
              type: string
            - type: "null"
          description: Transaction the merchant reported, or the relayed Intents transaction.
        swap_type:
          anyOf:
            - description: How the route leg was quoted.
              enum:
                - EXACT_INPUT
                - EXACT_OUTPUT
              type: string
            - type: "null"
          description: "Route legs: how the quote was made; null for Intents transfers."
      required:
        - number
        - status
        - method
        - swap_type
        - amount
        - amount_out_expected
        - deadline
        - submitted_tx
        - duplicate
        - evidence
        - failure_code
        - created
      type: object
    RefundNextAction:
      description: What the merchant signs for the current leg. Wallets build exactly this (never another recipient or amount; dashboard §1).
      discriminator:
        mapping:
          sign_and_send: "#/components/schemas/RefundSignAndSend"
          sign_intent: "#/components/schemas/RefundSignIntent"
        propertyName: type
      oneOf:
        - $ref: "#/components/schemas/RefundSignAndSend"
        - $ref: "#/components/schemas/RefundSignIntent"
      type: object
    RefundReceiptContext:
      additionalProperties: {}
      description: Refund receipt data (PII; never in events).
      properties:
        customer_email:
          anyOf:
            - format: email
              pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              type: string
            - type: "null"
          description: Receipt recipient (the intent's customer or session email), if any.
        email_receipts:
          description: "Account setting: send receipts."
          type: boolean
        evidence_links:
          description: Explorer links of the payer-side settlement.
          items:
            format: uri
            type: string
          type: array
        livemode:
          description: Mode (test-mode mails say so).
          type: boolean
        merchant_display_name:
          description: Merchant name.
          type: string
        original_amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Priced amount of the refunded payment.
        original_currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: ISO 4217 code for fiat pricing, or `asset` when priced in an asset (then `asset_id` is set).
        payment_intent:
          description: payment_intent id (`pi_` + 26 base32 chars).
          examples:
            - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        received:
          anyOf:
            - $ref: "#/components/schemas/SettlementValue"
            - type: "null"
          description: What reached the payer (recipient asset), from evidence.
        recipient_display:
          description: Shortened refund address and chain, e.g. `0xab…cd on Base`.
          type: string
        refund:
          description: refund id (`re_` + 26 base32 chars).
          examples:
            - re_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^re_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        refunded:
          $ref: "#/components/schemas/SettlementValue"
          description: What the merchant sent (settlement asset).
      required:
        - customer_email
        - merchant_display_name
        - livemode
        - refund
        - payment_intent
        - original_amount
        - original_currency
        - refunded
        - received
        - recipient_display
        - evidence_links
        - email_receipts
      type: object
    RefundRecipient:
      additionalProperties: {}
      description: "Where the refund goes (INV-7: the payer's recorded refund address)."
      properties:
        address:
          description: Payer's refund address (or Intents account).
          maxLength: 256
          minLength: 1
          type: string
        asset_id:
          description: Asset the payer receives (the asset they paid with).
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        chain:
          description: Chain the payer receives on.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        overridden:
          description: An owner replaced the recorded refund address (INV-7).
          type: boolean
        type:
          description: Address on the origin chain, or a NEAR Intents account.
          enum:
            - origin_chain
            - intents
          type: string
      required:
        - address
        - asset_id
        - chain
        - type
        - overridden
      type: object
    RefundSignAndSend:
      additionalProperties: {}
      description: "Next action: transfer exactly `amount` of `asset_id` from `from` to `to` on `chain`."
      properties:
        amount:
          description: Exact amount to send, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          description: Asset to send (the settlement asset).
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        chain:
          description: Chain to send on (the settlement destination's chain).
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        deadline:
          description: Send before this time; later deposits return to `from`.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        decimals:
          description: Token decimals.
          maximum: 255
          minimum: 0
          type: integer
        display:
          description: Human-readable summary, e.g. `Send 2.000000 USDC on Base to 0xab…`.
          type: string
        from:
          description: The settlement destination address; sign with this wallet (refunds of the route go back to it).
          maxLength: 256
          minLength: 1
          type: string
        memo:
          description: Memo the transfer must carry, if any.
          type:
            - string
            - "null"
        symbol:
          description: Token symbol.
          type: string
        to:
          description: 1Click deposit address of this leg.
          maxLength: 256
          minLength: 1
          type: string
        token:
          $ref: "#/components/schemas/TokenRef"
        type:
          const: sign_and_send
          description: Sign and broadcast a transfer on `chain`.
          type: string
      required:
        - type
        - chain
        - from
        - to
        - asset_id
        - token
        - symbol
        - decimals
        - amount
        - memo
        - deadline
        - display
      type: object
    RefundSignIntent:
      additionalProperties: {}
      description: "Next action: sign this Verifier transfer with the merchant's Intents account."
      properties:
        deadline:
          description: The payload's deadline; after it, prepare a new leg.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        display:
          description: Human-readable summary, e.g. `Transfer 2.000000 USDC to payer.near`.
          type: string
        message:
          $ref: "#/components/schemas/IntentMessage"
          description: Parsed payload, for display and checks; sign `nep413.message` or `payload`.
        nep413:
          additionalProperties: {}
          description: Arguments for a NEP-413 `signMessage` call, used verbatim.
          properties:
            message:
              description: Exact NEP-413 `message` (JSON string of `Nep413IntentMessage`).
              minLength: 2
              type: string
            nonce:
              description: 32-byte nonce (4-byte Verifier salt ‖ 28 random bytes), standard base64.
              pattern: ^[A-Za-z0-9+/]{43}=$
              type: string
            recipient:
              const: intents.near
              description: NEP-413 recipient.
              type: string
          required:
            - recipient
            - nonce
            - message
          type: object
        payload:
          description: Exact string to sign for `erc191` / `raw_ed25519` (JSON of `IntentMessage`, same nonce).
          minLength: 2
          type: string
        signer_id:
          description: The merchant's Intents account (the settlement destination).
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        standards:
          description: Signing standards accepted for `signer_id` (`nep413` for NEAR wallets, `erc191` for 0x accounts).
          items:
            description: Signing standard supported by NearPay.
            enum:
              - nep413
              - erc191
              - raw_ed25519
            type: string
          minItems: 1
          type: array
        transfer:
          additionalProperties: {}
          description: The single transfer the payload contains (for the human-readable summary).
          properties:
            amount:
              description: Amount, base units.
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            memo:
              description: Binding memo of this leg.
              pattern: ^np1:[1-9A-HJ-NP-Za-km-z]{43,44}$
              type: string
            receiver_id:
              description: Payer's Intents account (`intents_transfer`) or the 1Click Intents deposit address (`route_quote`).
              pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
              type: string
            token:
              description: Asset transferred.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
          required:
            - receiver_id
            - token
            - amount
            - memo
          type: object
        type:
          const: sign_intent
          description: Sign a NEAR Intents payload; submit it with `submit_tx`.
          type: string
      required:
        - type
        - signer_id
        - transfer
        - standards
        - nep413
        - payload
        - message
        - deadline
        - display
      type: object
    SettlementValue:
      additionalProperties: {}
      description: An amount of an asset with display information.
      properties:
        amount:
          description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        decimals:
          description: Decimals of the asset.
          maximum: 255
          minimum: 0
          type: integer
        display:
          description: Human-readable amount, e.g. `25.00 USDC (Base)`.
          type: string
      required:
        - amount
        - asset_id
        - decimals
        - display
      type: object
    SolanaEvidence:
      additionalProperties: {}
      description: Solana-specific settlement detail (token-balance delta).
      properties:
        block_time:
          anyOf:
            - maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Block time, unix seconds; null when the node has none.
        mint:
          anyOf:
            - description: "Solana address: base58 of 32 bytes (ed25519 public key or program-derived address)."
              examples:
                - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
              pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
              type: string
            - type: "null"
          description: SPL mint that settled; null for native SOL (lamports).
        owner:
          description: Wallet whose balance rose (= `Evidence.recipient`, the merchant destination).
          examples:
            - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
          type: string
        post_amount:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Owner's balance of the mint after the transaction; null when the detector did not read balances (test mode).
        pre_amount:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Owner's balance of the mint before the transaction (`meta.preTokenBalances` / `preBalances`); null when the detector did not read balances (test mode).
        signature:
          description: Transaction signature (= `Evidence.tx_hash`).
          pattern: ^[1-9A-HJ-NP-Za-km-z]{64,88}$
          type: string
        slot:
          description: Slot of the block that contains the transaction (= `Evidence.block_ref`).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        token_accounts:
          description: Token accounts of `owner` for `mint` whose balance changed (usually its ATA); empty for SOL.
          items:
            description: "Solana address: base58 of 32 bytes (ed25519 public key or program-derived address)."
            examples:
              - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
            pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
            type: string
          type: array
        token_program:
          anyOf:
            - description: "Solana address: base58 of 32 bytes (ed25519 public key or program-derived address)."
              examples:
                - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
              pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
              type: string
            - type: "null"
          description: Owner program of the mint (`TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA` in v1); null for SOL.
      required:
        - signature
        - slot
        - block_time
        - mint
        - token_program
        - owner
        - token_accounts
        - pre_amount
        - post_amount
      type: object
    TokenRef:
      additionalProperties: {}
      description: How to transfer an asset on its chain.
      properties:
        address:
          description: Token contract / mint / NEP-141 account; null for native assets.
          type:
            - string
            - "null"
        standard:
          description: Token standard on the chain.
          type: string
          x-extensible-enum:
            - native
            - erc20
            - nep141
            - spl
            - other
      required:
        - standard
        - address
      type: object
    TransferIntent:
      additionalProperties: {}
      description: NEAR Intents `transfer` intent.
      properties:
        intent:
          const: transfer
          description: Intent kind.
          type: string
        memo:
          description: Memo; NearPay puts the binding here.
          maxLength: 512
          type: string
        receiver_id:
          description: Receiving Intents account.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        tokens:
          additionalProperties:
            description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
            pattern: ^(0|[1-9][0-9]{0,77})$
            type: string
          description: Asset id → amount in base units.
          propertyNames:
            description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
            examples:
              - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
            maxLength: 256
            pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
            type: string
          type: object
      required:
        - intent
        - receiver_id
        - tokens
      type: object
  securitySchemes:
    internalToken:
      description: "Internal Ed25519 JWT: request token or service token."
      in: header
      name: X-NearPay-Token
      type: apiKey
    serviceClient:
      description: Service client credentials (`client_id` + secret file).
      scheme: basic
      type: http
info:
  description: NearPay internal service API. Generated from `nearpay-spec`; do not edit by hand.
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  title: nearpay-payments internal API
  version: 0.4.1
openapi: 3.1.0
paths:
  /internal/checkout_sessions:
    post:
      description: "Creates an intent (`source: invoice`, `invoice`, `customer`) and a hosted session with the usual guards (account live in live mode, destination active, minimum, unverified cap, currency) and returns it **with** `client_secret` and `url` (once; billing stores the secret encrypted to let the hosted invoice page continue the session). At most one `open` session per invoice: another one answers `409 state_conflict`. `Idempotency-Key` (billing: `in:<invoice>:s<n>`) makes retries safe. Late payments follow the account setting (INV-3); sessions created this way emit the normal checkout and intent events."
      operationId: createInvoiceCheckoutSession
      parameters:
        - description: Makes the request safe to retry for 24 h (same key + same body = same result).
          in: header
          name: Idempotency-Key
          schema:
            description: Makes the request safe to retry for 24 h (same key + same body = same result).
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceCheckoutSessionCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
          description: Open the hosted checkout session that pays an invoice (billing).
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `currency_unsupported`."
          x-error-codes:
            - currency_unsupported
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `account_not_live`."
          x-error-codes:
            - account_not_live
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `state_conflict`, `destination_not_active`, `customer_deleted`."
          x-error-codes:
            - state_conflict
            - destination_not_active
            - customer_deleted
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `amount_below_destination_minimum`, `amount_above_unverified_cap`."
          x-error-codes:
            - amount_below_destination_minimum
            - amount_above_unverified_cap
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `fx_rate_unavailable`."
          x-error-codes:
            - fx_rate_unavailable
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Open the hosted checkout session that pays an invoice (billing).
      tags:
        - payments
      x-nearpay:
        auth:
          - service:payments.sessions.create
        idempotent: true
        service: payments
        stage: 3
  /internal/checkout_sessions/{id}:
    get:
      description: Billing checks that an invoice's stored session is still `open` before returning it to the hosted page.
      operationId: getInternalCheckoutSession
      parameters:
        - description: checkout_session id (`cs_` + 26 base32 chars).
          in: path
          name: id
          required: true
          schema:
            description: checkout_session id (`cs_` + 26 base32 chars).
            examples:
              - cs_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^cs_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
          description: A checkout session in any status (never its secret or URL).
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: A checkout session in any status (never its secret or URL).
      tags:
        - payments
      x-nearpay:
        auth:
          - service:payments.read
        idempotent: false
        service: payments
        stage: 3
  /internal/checkout_sessions/{id}/agent_attempts:
    post:
      description: Same guards as payer attempts (§8.2); limits apply per session.
      operationId: createAgentAttempt
      parameters:
        - description: checkout_session id (`cs_` + 26 base32 chars).
          in: path
          name: id
          required: true
          schema:
            description: checkout_session id (`cs_` + 26 base32 chars).
            examples:
              - cs_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^cs_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                payer_wallet:
                  description: Agent's Intents account.
                  pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
                  type: string
              required:
                - payer_wallet
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAttempt"
          description: Create (or reuse) an `intents_transfer` attempt for an agent payer.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `session_not_open`, `attempt_in_flight`, `destination_not_intents_account`."
          x-error-codes:
            - session_not_open
            - attempt_in_flight
            - destination_not_intents_account
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `too_many_attempts`."
          x-error-codes:
            - too_many_attempts
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `rail_unavailable`."
          x-error-codes:
            - rail_unavailable
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Create (or reuse) an `intents_transfer` attempt for an agent payer.
      tags:
        - payments
      x-nearpay:
        auth:
          - service:payments.attempts.create
        idempotent: false
        service: payments
        stage: 1
  /internal/checkout_sessions/{id}/expire:
    post:
      description: "Only sessions with `invoice` set. Like the public expire: an attempt in flight answers `attempt_in_flight` and nothing changes; an already `expired` session is returned as is. Emits `evt.payments.checkout_session.expired`."
      operationId: expireInvoiceCheckoutSession
      parameters:
        - description: checkout_session id (`cs_` + 26 base32 chars).
          in: path
          name: id
          required: true
          schema:
            description: checkout_session id (`cs_` + 26 base32 chars).
            examples:
              - cs_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^cs_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
        - description: Makes the request safe to retry for 24 h (same key + same body = same result).
          in: header
          name: Idempotency-Key
          schema:
            description: Makes the request safe to retry for 24 h (same key + same body = same result).
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                reason:
                  description: Why billing expires the session.
                  type: string
                  x-extensible-enum:
                    - invoice_voided
                    - invoice_paid
                    - superseded
              required:
                - reason
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
          description: Expire an invoice's checkout session (billing voids the invoice).
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `state_conflict`, `attempt_in_flight`."
          x-error-codes:
            - state_conflict
            - attempt_in_flight
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Expire an invoice's checkout session (billing voids the invoice).
      tags:
        - payments
      x-nearpay:
        auth:
          - service:payments.sessions.create
        idempotent: true
        service: payments
        stage: 3
  /internal/checkout_sessions/{id}/payer:
    get:
      description: "Replaces agentpay's call to the public `GET /v1/checkout/sessions/{id}/public` (CR-15-15): agentpay forwards the caller's `X-NearPay-Client-Secret` and authenticates with its service token. A wrong secret answers `client_secret_invalid`, exactly like the public route."
      operationId: getPayerCheckoutSession
      parameters:
        - description: checkout_session id (`cs_` + 26 base32 chars).
          in: path
          name: id
          required: true
          schema:
            description: checkout_session id (`cs_` + 26 base32 chars).
            examples:
              - cs_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^cs_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
        - description: Client secret of the checkout session (from the URL fragment).
          in: header
          name: x-nearpay-client-secret
          required: true
          schema:
            description: Client secret of the checkout session (from the URL fragment).
            pattern: ^cs_[0-9a-z]{26}_secret_[0-9A-Za-z]{32}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayerSessionContext"
          description: Verify a payer's client secret and read the session as the payer sees it (agentpay `agent_pay`).
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `client_secret_invalid`."
          x-error-codes:
            - client_secret_invalid
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Verify a payer's client secret and read the session as the payer sees it (agentpay `agent_pay`).
      tags:
        - payments
      x-nearpay:
        auth:
          - service:payments.read
        idempotent: false
        service: payments
        stage: 2
  /internal/customers/{id}:
    get:
      description: "Deleted customers are returned with `deleted: true` (billing refuses new invoices for them with `customer_deleted`)."
      operationId: getInternalCustomer
