components:
  schemas:
    Error:
      additionalProperties: {}
      description: Envelope returned with every non-2xx response.
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
      required:
        - error
      type: object
    ErrorBody:
      additionalProperties: {}
      description: Details of a failed request.
      properties:
        code:
          description: Machine-readable error code from the error catalogue.
          type: string
          x-extensible-enum:
            - invalid_request
            - resource_missing
            - authentication_required
            - invalid_api_key
            - permission_denied
            - csrf_token_invalid
            - ip_not_allowed
            - account_suspended
            - step_up_required
            - rate_limited
            - idempotency_key_reused
            - idempotency_in_progress
            - api_error
            - state_conflict
            - livemode_forbidden
            - link_expired
            - link_used
            - webauthn_failed
            - invalid_client
            - turnstile_failed
            - invalid_setting
            - scope_unknown
            - address_invalid
            - asset_unsupported
            - memo_destination_unsupported
            - destination_in_use
            - recovery_lock
            - screening_blocked
            - attestation_invalid
            - challenge_expired
            - destination_not_active
            - account_not_live
            - amount_below_destination_minimum
            - amount_above_unverified_cap
            - currency_unsupported
            - allowed_origins_required
            - attempt_in_flight
            - client_secret_invalid
            - session_not_open
            - too_many_attempts
            - route_too_slow
            - refund_address_invalid
            - geo_blocked
            - intent_invalid
            - insufficient_balance
            - rail_unavailable
            - route_unavailable
            - pricing_unavailable
            - deadline_too_short
            - quote_rejected
            - quote_integrity_failed
            - ticket_invalid
            - attestation_refused
            - attestation_stale
            - attestation_unavailable
            - destination_not_intents_account
            - amount_below_minimum
            - screening_unavailable
            - url_invalid
            - event_type_unknown
        doc_url:
          description: Documentation page for this error code.
          format: uri
          type: string
        message:
          description: Human-readable message; safe to show to developers, not to payers.
          type: string
        param:
          description: The request parameter the error relates to, when there is one.
          type: string
        request_id:
          description: Request id, also returned in the `X-Request-Id` header.
          examples:
            - req_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^req_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        type:
          description: Error category; decides whether a retry can help.
          type: string
          x-extensible-enum:
            - invalid_request_error
            - authentication_error
            - permission_error
            - payment_error
            - idempotency_error
            - state_conflict
            - rate_limit_error
            - api_error
            - rail_unavailable
      required:
        - type
        - code
        - message
        - doc_url
        - request_id
      type: object
    GeoPolicy:
      additionalProperties: {}
      description: Payer geo policy.
      properties:
        blocked_countries:
          description: Blocked countries.
          items:
            description: ISO 3166-1 alpha-2 country code, upper-case.
            pattern: ^[A-Z]{2}$
            type: string
          type: array
        blocked_regions:
          description: Blocked ISO 3166-2 regions.
          items:
            type: string
          type: array
        version:
          description: Policy version.
          type: string
      required:
        - blocked_countries
        - blocked_regions
        - version
      type: object
    KybDecision:
      additionalProperties: {}
      description: Recorded KYB decision.
      properties:
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        decided_at:
          description: Decision time.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        status:
          description: KYB case status.
          type: string
          x-extensible-enum:
            - not_started
            - pending
            - needs_info
            - approved
            - rejected
      required:
        - account_id
        - status
        - decided_at
      type: object
    Screening:
      additionalProperties: {}
      description: A screening decision.
      properties:
        cached:
          description: Served from cache.
          type: boolean
        decision:
          description: Screening decision.
          type: string
          x-extensible-enum:
            - allow
            - block
            - review
        post_screen_required:
          description: Screen again after settlement (vendor was unavailable).
          type: boolean
        reasons:
          description: Reasons (`sanctions`, `blocklist`, `vendor_unavailable`, …).
          items:
            type: string
          type: array
        risk:
          description: Vendor risk level.
          type:
            - string
            - "null"
        screening_id:
          description: screening id (`scr_` + 26 base32 chars).
          examples:
            - scr_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^scr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
      required:
        - screening_id
        - decision
        - risk
        - reasons
        - cached
        - post_screen_required
      type: object
  securitySchemes:
    internalToken:
      description: "Internal Ed25519 JWT: request token or service token."
      in: header
      name: X-NearPay-Token
      type: apiKey
    serviceClient:
      description: Service client credentials (`client_id` + secret file).
      scheme: basic
      type: http
info:
  description: NearPay internal service API. Generated from `nearpay-spec`; do not edit by hand.
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  title: nearpay-compliance internal API
  version: 0.1.4
openapi: 3.1.0
paths:
  /internal/geo-policy:
    get:
      operationId: getGeoPolicy
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoPolicy"
          description: Current geo policy (cache; refresh on `evt.compliance.policy.updated`).
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Current geo policy (cache; refresh on `evt.compliance.policy.updated`).
      tags:
        - compliance
      x-nearpay:
        auth:
          - service:compliance.read
        idempotent: false
        service: compliance
        stage: 1
  /internal/kyb_cases/{id}/decision:
    post:
      operationId: decideKyb
      parameters:
        - description: account id (`acct_` + 26 base32 chars).
          in: path
          name: id
          required: true
          schema:
            description: account id (`acct_` + 26 base32 chars).
            examples:
              - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
        - description: Makes the request safe to retry for 24 h (same key + same body = same result).
          in: header
          name: Idempotency-Key
          schema:
            description: Makes the request safe to retry for 24 h (same key + same body = same result).
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                decision:
                  description: Decision.
                  enum:
                    - approved
                    - rejected
                    - needs_info
                  type: string
                reason:
                  description: Reason (audited).
                  maxLength: 500
                  minLength: 1
                  type: string
              required:
                - decision
                - reason
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KybDecision"
          description: Manual KYB decision (ops CLI in Stage 1, console in Stage 2).
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `state_conflict`."
          x-error-codes:
            - state_conflict
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Manual KYB decision (ops CLI in Stage 1, console in Stage 2).
      tags:
        - compliance
      x-nearpay:
        auth:
          - ops:compliance.kyb.decide
        idempotent: true
        service: compliance
        stage: 1
  /internal/screenings:
    post:
      operationId: createScreening
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                account_id:
                  description: Merchant account.
                  examples:
                    - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
                  pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                  type: string
                amount_usd_micros:
                  description: Payment size for the fail-closed threshold.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                chain:
                  description: Chain of an address.
                  examples:
                    - eip155:8453
                  pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
                  type: string
                context:
                  description: Why it is screened.
                  type: string
                  x-extensible-enum:
                    - payment
                    - refund
                    - destination
                    - x402
                    - agent
                livemode:
                  description: Mode (test mode uses magic addresses).
                  type: boolean
                subject:
                  description: Address or account.
                  maxLength: 256
                  minLength: 1
                  type: string
                subject_type:
                  description: What is screened.
                  enum:
                    - address
                    - near_account
                    - destination
                  type: string
              required:
                - subject_type
                - subject
                - context
                - livemode
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Screening"
          description: Screen an address, NEAR account or destination (compliance §4).
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `screening_unavailable`."
          x-error-codes:
            - screening_unavailable
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Screen an address, NEAR account or destination (compliance §4).
      tags:
        - compliance
      x-nearpay:
        auth:
          - service:compliance.screen
        idempotent: false
        service: compliance
        stage: 1
servers:
  - url: http://compliance-api:8080
