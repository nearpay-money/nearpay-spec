components:
  schemas:
    Error:
      additionalProperties: {}
      description: Envelope returned with every non-2xx response.
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
      required:
        - error
      type: object
    ErrorBody:
      additionalProperties: {}
      description: Details of a failed request.
      properties:
        code:
          description: Machine-readable error code from the error catalogue.
          type: string
          x-extensible-enum:
            - invalid_request
            - resource_missing
            - authentication_required
            - invalid_api_key
            - permission_denied
            - csrf_token_invalid
            - ip_not_allowed
            - account_suspended
            - step_up_required
            - rate_limited
            - idempotency_key_reused
            - idempotency_in_progress
            - api_error
            - state_conflict
            - livemode_forbidden
            - link_expired
            - link_used
            - webauthn_failed
            - invalid_client
            - turnstile_failed
            - invalid_setting
            - scope_unknown
            - address_invalid
            - asset_unsupported
            - memo_destination_unsupported
            - destination_in_use
            - recovery_lock
            - screening_blocked
            - attestation_invalid
            - challenge_expired
            - destination_not_active
            - account_not_live
            - amount_below_destination_minimum
            - amount_above_unverified_cap
            - currency_unsupported
            - allowed_origins_required
            - attempt_in_flight
            - client_secret_invalid
            - session_not_open
            - too_many_attempts
            - route_too_slow
            - refund_address_invalid
            - geo_blocked
            - intent_invalid
            - insufficient_balance
            - rail_unavailable
            - route_unavailable
            - pricing_unavailable
            - deadline_too_short
            - quote_rejected
            - quote_integrity_failed
            - ticket_invalid
            - attestation_refused
            - attestation_stale
            - attestation_unavailable
            - destination_not_intents_account
            - amount_below_minimum
            - screening_unavailable
            - url_invalid
            - event_type_unknown
            - last_owner
            - member_exists
            - invitation_invalid
            - approver_conflict
            - two_person_required
            - authenticator_not_allowed
            - kyb_profile_incomplete
            - intent_not_succeeded
            - attempt_not_settled
            - amount_exceeds_refundable
            - leg_expired
            - signed_intent_mismatch
            - review_requires_evidence
            - link_inactive
            - customer_deleted
            - reconciliation_day_open
            - fx_rate_unavailable
        doc_url:
          description: Documentation page for this error code.
          format: uri
          type: string
        message:
          description: Human-readable message; safe to show to developers, not to payers.
          type: string
        param:
          description: The request parameter the error relates to, when there is one.
          type: string
        request_id:
          description: Request id, also returned in the `X-Request-Id` header.
          examples:
            - req_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^req_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        type:
          description: Error category; decides whether a retry can help.
          type: string
          x-extensible-enum:
            - invalid_request_error
            - authentication_error
            - permission_error
            - payment_error
            - idempotency_error
            - state_conflict
            - rate_limit_error
            - api_error
            - rail_unavailable
      required:
        - type
        - code
        - message
        - doc_url
        - request_id
      type: object
    KillSwitchLog:
      additionalProperties: {}
      description: A page of kill-switch history.
      properties:
        data:
          description: Entries on this page.
          items:
            $ref: "#/components/schemas/KillSwitchLogEntry"
          type: array
        has_more:
          description: Whether older entries exist.
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          description: Path of this list endpoint.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    KillSwitchLogEntry:
      additionalProperties: {}
      description: One change of the kill switch (append-only log).
      properties:
        actor:
          description: "`sentinel`, an operator id, `<requester>+<approver>` for releases, or a CLI actor."
          type: string
        created_at:
          description: When.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        engaged:
          description: Engaged or released.
          type: boolean
        reason:
          description: Reason.
          type: string
        version:
          description: Switch version after the change.
          maximum: 9007199254740991
          minimum: 0
          type: integer
      required:
        - engaged
        - reason
        - actor
        - version
        - created_at
      type: object
    KillSwitchState:
      additionalProperties: {}
      description: Global quoting kill switch.
      properties:
        actor:
          description: Who changed it (`sentinel` or an ops principal).
          type: string
        engaged:
          description: Live quoting is stopped.
          type: boolean
        reason:
          description: Reason.
          type: string
        updated_at:
          description: When.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        version:
          description: "Version of the switch row: equals the envelope `aggregate.version` of the latest `evt.sentinel.kill_switch.*`, so a reader applies later events only (spec 0.2.1; sentinel 0.2.1+ sends it)."
          maximum: 9007199254740991
          minimum: 0
          type: integer
      required:
        - engaged
        - reason
        - actor
        - updated_at
      type: object
    OpsApproval:
      additionalProperties: {}
      description: A console action waiting for (or decided by) a second operator.
      properties:
        action:
          description: Action that needs a second approver.
          type: string
          x-extensible-enum:
            - account.suspend
            - account.reinstate
            - kill_switch.release
        decided_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When it was decided.
        decided_by:
          anyOf:
            - additionalProperties: {}
              properties:
                id:
                  description: user id (`usr_` + 26 base32 chars).
                  examples:
                    - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
                  pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                  type: string
                role:
                  description: Role of a console operator.
                  enum:
                    - ops
                    - ops_admin
                  type: string
              required:
                - id
                - role
              type: object
            - type: "null"
          description: Approving or rejecting operator.
        decision_note:
          description: Note of the deciding operator.
          type:
            - string
            - "null"
        expires_at:
          description: A pending request expires at this time.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        id:
          description: ops_approval id (`opa_` + 26 base32 chars).
          examples:
            - opa_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^opa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        object:
          const: ops_approval
          description: Always `ops_approval`.
          type: string
        reason:
          description: Requester's reason (audited; never shown to merchants).
          type: string
        requested_at:
          description: When it was requested.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        requested_by:
          additionalProperties: {}
          description: Requesting operator.
          properties:
            id:
              description: user id (`usr_` + 26 base32 chars).
              examples:
                - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            role:
              description: Role of a console operator.
              enum:
                - ops
                - ops_admin
              type: string
          required:
            - id
            - role
          type: object
        status:
          description: "`approved` means the action was executed in the same transaction."
          type: string
          x-extensible-enum:
            - pending
            - approved
            - rejected
            - expired
        target:
          additionalProperties: {}
          description: What the action applies to.
          properties:
            id:
              description: "`acct_…` or `ks_…`."
              type: string
            type:
              description: Target type.
              type: string
              x-extensible-enum:
                - account
                - kill_switch
          required:
            - type
            - id
          type: object
      required:
        - id
        - object
        - action
        - target
        - reason
        - status
        - requested_by
        - requested_at
        - decided_by
        - decided_at
        - decision_note
        - expires_at
      type: object
    OpsAuditFinding:
      additionalProperties: {}
      description: A sentinel audit finding as operators see it.
      properties:
        account_display_name:
          description: Display name of `account_id` (sentinel keeps it from `evt.identity.account.*`); null when unknown (spec 0.2.1).
          type:
            - string
            - "null"
        account_id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        acknowledged_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When an operator acknowledged it.
        acknowledged_by:
          description: Operator (`usr_…`) or CLI actor.
          type:
            - string
            - "null"
        acknowledgement_note:
          description: Acknowledgement note.
          type:
            - string
            - "null"
        check_kind:
          description: Which independent check ran.
          type: string
        created:
          description: Recorded.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        details:
          additionalProperties: {}
          description: Details.
          propertyNames:
            type: string
          type: object
        execution_id:
          description: execution id (`ex_` + 26 base32 chars).
          examples:
            - ex_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^ex_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        id:
          description: audit_finding id (`fnd_` + 26 base32 chars).
          examples:
            - fnd_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^fnd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        livemode:
          description: Mode.
          type: boolean
        object:
          const: audit_finding
          description: Always `audit_finding`.
          type: string
        result:
          description: Result.
          type: string
          x-extensible-enum:
            - pass
            - mismatch
            - unverifiable
        tx_chain:
          anyOf:
            - description: CAIP-2 chain id, e.g. `eip155:8453` or `near:mainnet`.
              examples:
                - eip155:8453
              pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
              type: string
            - type: "null"
          description: Chain of the settlement transaction checked.
        tx_hash:
          description: Settlement transaction checked.
          type:
            - string
            - "null"
      required:
        - id
        - execution_id
        - account_id
        - livemode
        - check_kind
        - result
        - details
        - object
        - created
        - tx_chain
        - tx_hash
        - acknowledged_at
        - acknowledged_by
        - acknowledgement_note
      type: object
    OpsAuditFindingList:
      additionalProperties: {}
      description: A page of audit findings.
      properties:
        data:
          description: Objects on this page.
          items:
            $ref: "#/components/schemas/OpsAuditFinding"
          type: array
        has_more:
          description: Whether more objects exist after this page.
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          description: Path of this list endpoint.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    OpsKillSwitch:
      additionalProperties: {}
      description: Kill-switch state with any pending release request.
      properties:
        actor:
          description: Who changed it (`sentinel` or an ops principal).
          type: string
        engaged:
          description: Live quoting is stopped.
          type: boolean
        pending_release:
          anyOf:
            - $ref: "#/components/schemas/OpsApproval"
            - type: "null"
          description: Release request waiting for a second operator.
        reason:
          description: Reason.
          type: string
        updated_at:
          description: When.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        version:
          description: Version of the switch row (orders events).
          maximum: 9007199254740991
          minimum: 0
          type: integer
      required:
        - engaged
        - reason
        - actor
        - updated_at
        - version
        - pending_release
      type: object
  securitySchemes:
    internalToken:
      description: "Internal Ed25519 JWT: request token or service token."
      in: header
      name: X-NearPay-Token
      type: apiKey
    serviceClient:
      description: Service client credentials (`client_id` + secret file).
      scheme: basic
      type: http
info:
  description: NearPay internal service API. Generated from `nearpay-spec`; do not edit by hand.
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  title: nearpay-sentinel internal API
  version: 0.2.1
openapi: 3.1.0
paths:
  /internal/kill-switch:
    get:
      description: "For consumers of `evt.sentinel.kill_switch.*` whose local state is unknown (fresh database, or the last event aged out of the stream before their durable consumer existed): payments, rails and agentpay read it at boot and store it with `version`, then apply only events with a higher `aggregate.version`. Until either the read or an event succeeds the state stays unknown and live refunds/relays fail closed. Never cached by sentinel; ops use `getOpsKillSwitch`."
      operationId: getKillSwitch
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KillSwitchState"
          description: Current kill-switch state (services read it at boot and when their stored state is unknown).
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Current kill-switch state (services read it at boot and when their stored state is unknown).
      tags:
        - sentinel
      x-nearpay:
        auth:
          - service:sentinel.read
        idempotent: false
        service: sentinel
        stage: 2
    post:
      description: "In-container ops CLI path. From Stage 2 a release (`engaged: false`) here is single-person, so it is refused with `409 two_person_required` when `NP_ENV=server`; the console's two-person release (`requestOpsKillSwitchRelease` + `approveOpsKillSwitchRelease`) is the only release there. Local and test stacks keep the one-operator release (testbed T7)."
      operationId: setKillSwitch
      parameters:
        - description: Makes the request safe to retry for 24 h (same key + same body = same result).
          in: header
          name: Idempotency-Key
          schema:
            description: Makes the request safe to retry for 24 h (same key + same body = same result).
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                engaged:
                  description: Engage or release.
                  type: boolean
                reason:
                  description: Reason.
                  maxLength: 500
                  minLength: 1
                  type: string
              required:
                - engaged
                - reason
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KillSwitchState"
          description: Engage or release the global quoting kill switch.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `two_person_required`."
          x-error-codes:
            - two_person_required
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Engage or release the global quoting kill switch.
      tags:
        - sentinel
      x-nearpay:
        auth:
          - ops:sentinel.killswitch
        idempotent: true
        ops_roles:
          - ops
          - ops_admin
        service: sentinel
        stage: 1
  /ops/findings:
    get:
      operationId: listOpsFindings
      parameters:
        - description: Number of objects to return, 1–100 (default 10).
          in: query
          name: limit
          schema:
            default: 10
            description: Number of objects to return, 1–100 (default 10).
            maximum: 100
            minimum: 1
            type: integer
        - description: "Cursor: id of the last object of the previous page."
          in: query
          name: starting_after
          schema:
            description: "Cursor: id of the last object of the previous page."
            maxLength: 64
            type: string
        - description: "Cursor: id of the first object of the next page."
          in: query
          name: ending_before
          schema:
            description: "Cursor: id of the first object of the next page."
            maxLength: 64
            type: string
        - description: Only objects created at or after this time.
          in: query
          name: created[gte]
          schema:
            description: Only objects created at or after this time.
            type: number
        - description: Only objects created at or before this time.
          in: query
          name: created[lte]
          schema:
            description: Only objects created at or before this time.
            type: number
        - in: query
          name: result
          schema:
            description: Only this result.
            type: string
            x-extensible-enum:
              - pass
              - mismatch
              - unverifiable
        - description: Only acknowledged (or open) findings.
          in: query
          name: acknowledged
          schema:
            description: Only acknowledged (or open) findings.
            enum:
              - "true"
              - "false"
            type: string
        - description: Only this account.
          in: query
          name: account
          schema:
            description: Only this account.
            examples:
              - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
        - description: Only this execution.
          in: query
          name: execution
          schema:
            description: Only this execution.
            examples:
              - ex_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^ex_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
        - description: Only live or test findings.
          in: query
          name: livemode
          schema:
            description: Only live or test findings.
            enum:
              - "true"
              - "false"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsAuditFindingList"
          description: "Audit findings (default: not `pass` and not acknowledged)."
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: "Audit findings (default: not `pass` and not acknowledged)."
      tags:
        - sentinel
      x-nearpay:
        auth:
          - ops:sentinel.read
        idempotent: false
        ops_roles:
          - ops
          - ops_admin
        service: sentinel
        stage: 2
        visibility: ops
  /ops/findings/{id}:
    get:
      operationId: getOpsFinding
      parameters:
        - description: audit_finding id (`fnd_` + 26 base32 chars).
          in: path
          name: id
          required: true
          schema:
            description: audit_finding id (`fnd_` + 26 base32 chars).
            examples:
              - fnd_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^fnd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsAuditFinding"
          description: Retrieve an audit finding.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - internalToken: []
      summary: Retrieve an audit finding.
      tags:
        - sentinel
      x-nearpay:
        auth:
          - ops:sentinel.read
        idempotent: false
        ops_roles:
          - ops
          - ops_admin
        service: sentinel
        stage: 2
        visibility: ops
  /ops/findings/{id}/acknowledge:
    post:
      description: Already acknowledged is `409 state_conflict`; `pass` findings need no acknowledgement (`409`).
      operationId: acknowledgeOpsFinding
      parameters:
        - description: audit_finding id (`fnd_` + 26 base32 chars).
          in: path
          name: id
          required: true
          schema:
            description: audit_finding id (`fnd_` + 26 base32 chars).
            examples:
              - fnd_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^fnd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
        - description: Makes the request safe to retry for 24 h (same key + same body = same result).
          in: header
          name: Idempotency-Key
          schema:
            description: Makes the request safe to retry for 24 h (same key + same body = same result).
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                note:
                  description: Note (audited).
                  maxLength: 2000
                  minLength: 1
                  type: string
              required:
                - note
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsAuditFinding"
          description: Acknowledge a finding (the compliance case is worked separately).
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `state_conflict`."
          x-error-codes:
            - state_conflict
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
