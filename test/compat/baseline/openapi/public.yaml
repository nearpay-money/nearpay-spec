    RefundSignIntent:
      additionalProperties: {}
      description: "Next action: sign this Verifier transfer with the merchant's Intents account."
      properties:
        deadline:
          description: The payload's deadline; after it, prepare a new leg.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        display:
          description: Human-readable summary, e.g. `Transfer 2.000000 USDC to payer.near`.
          type: string
        message:
          $ref: "#/components/schemas/IntentMessage"
          description: Parsed payload, for display and checks; sign `nep413.message` or `payload`.
        nep413:
          additionalProperties: {}
          description: Arguments for a NEP-413 `signMessage` call, used verbatim.
          properties:
            message:
              description: Exact NEP-413 `message` (JSON string of `Nep413IntentMessage`).
              minLength: 2
              type: string
            nonce:
              description: 32-byte nonce (4-byte Verifier salt ‖ 28 random bytes), standard base64.
              pattern: ^[A-Za-z0-9+/]{43}=$
              type: string
            recipient:
              const: intents.near
              description: NEP-413 recipient.
              type: string
          required:
            - recipient
            - nonce
            - message
          type: object
        payload:
          description: Exact string to sign for `erc191` / `raw_ed25519` (JSON of `IntentMessage`, same nonce).
          minLength: 2
          type: string
        signer_id:
          description: The merchant's Intents account (the settlement destination).
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        standards:
          description: Signing standards accepted for `signer_id` (`nep413` for NEAR wallets, `erc191` for 0x accounts).
          items:
            description: Signing standard supported by NearPay.
            enum:
              - nep413
              - erc191
              - raw_ed25519
            type: string
          minItems: 1
          type: array
        transfer:
          additionalProperties: {}
          description: The single transfer the payload contains (for the human-readable summary).
          properties:
            amount:
              description: Amount, base units.
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            memo:
              description: Binding memo of this leg.
              pattern: ^np1:[1-9A-HJ-NP-Za-km-z]{43,44}$
              type: string
            receiver_id:
              description: Payer's Intents account (`intents_transfer`) or the 1Click Intents deposit address (`route_quote`).
              pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
              type: string
            token:
              description: Asset transferred.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
          required:
            - receiver_id
            - token
            - amount
            - memo
          type: object
        type:
          const: sign_intent
          description: Sign a NEAR Intents payload; submit it with `submit_tx`.
          type: string
      required:
        - type
        - signer_id
        - transfer
        - standards
        - nep413
        - payload
        - message
        - deadline
        - display
      type: object
    RefundSubmission:
      anyOf:
        - additionalProperties: false
          description: A broadcast transfer (`sign_and_send`).
          properties:
            sender:
              description: Sending account, when the chain needs it (NEAR).
              maxLength: 256
              minLength: 1
              type: string
            tx_hash:
              description: Transaction that sent `next_action.amount` to `next_action.to` (`sign_and_send`).
              maxLength: 128
              minLength: 8
              type: string
          required:
            - tx_hash
          type: object
        - additionalProperties: false
          description: A signed Verifier payload (`sign_intent`); NearPay relays it as signed.
          properties:
            signed_intent:
              $ref: "#/components/schemas/MultiPayload"
              description: The `next_action` payload signed by `signer_id` (`sign_intent`).
          required:
            - signed_intent
          type: object
      description: What the merchant signed for the current leg.
    Registration:
      additionalProperties: {}
      description: A verified email ready for passkey registration.
      properties:
        email:
          description: Verified email.
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
          type: string
        expires_at:
          description: Registration token expiry.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        invitation:
          additionalProperties: {}
          description: "Present for `invite`: what passkey registration will join."
          properties:
            account_display_name:
              description: Account the invitation joins.
              type: string
            role:
              description: Role of a user in a merchant account.
              enum:
                - owner
                - admin
                - developer
                - finance
                - support
                - viewer
              type: string
          required:
            - account_display_name
            - role
          type: object
        object:
          const: registration
          description: Always `registration`.
          type: string
        purpose:
          description: "Why the magic link was sent: `signup` creates an account, `recovery` adds a passkey to the existing user (locks destination changes 48 h), `invite` joins the inviting account. Absent from Stage 1 servers (= `signup`)."
          type: string
          x-extensible-enum:
            - signup
            - recovery
            - invite
        registration_token:
          description: Single-use token for passkey registration (5 minutes).
          minLength: 32
          type: string
      required:
        - object
        - registration_token
        - email
        - expires_at
      type: object
    ReviewDecision:
      additionalProperties: false
      description: A merchant decision on a payment intent in `requires_review`.
      properties:
        create_refund:
          description: "`reject` only: create a draft refund of the settled amount to the payer (default `true` when something settled)."
          type: boolean
        decision:
          description: "`accept`: the settled amount counts as paid (`short_settlement` only). `reject`: not paid."
          enum:
            - accept
            - reject
          type: string
        reason:
          description: Free-text reason (audited).
          maxLength: 500
          type: string
      required:
        - decision
      type: object
    SentinelKey:
      additionalProperties: {}
      description: A sentinel signing key.
      properties:
        kid:
          description: Key id.
          type: string
        not_after:
          description: Key retirement time.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        public_key:
          description: Raw 32-byte Ed25519 public key, base64url.
          pattern: ^[A-Za-z0-9_-]+$
          type: string
      required:
        - kid
        - public_key
        - not_after
      type: object
    SentinelKeys:
      additionalProperties: {}
      description: Sentinel public keys.
      properties:
        keys:
          description: Current and next keys.
          items:
            $ref: "#/components/schemas/SentinelKey"
          type: array
        object:
          const: list
          description: Always `list`.
          type: string
      required:
        - object
        - keys
      type: object
    SettlementDestination:
      additionalProperties: {}
      description: Where a merchant receives settlements (FR-SET-01).
      properties:
        active_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the destination became (or becomes) active.
        address:
          description: Receiving address or Intents account.
          maxLength: 256
          minLength: 1
          type: string
        approval:
          anyOf:
            - additionalProperties: {}
              properties:
                approved_by:
                  description: Users who approved, in order (the creator counts when 1 is required).
                  items:
                    description: user id (`usr_` + 26 base32 chars).
                    examples:
                      - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
                    pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                    type: string
                  type: array
                rejected_by:
                  anyOf:
                    - description: user id (`usr_` + 26 base32 chars).
                      examples:
                        - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
                      pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                      type: string
                    - type: "null"
                  description: User who rejected the destination, if any (it is then disabled).
                required:
                  description: "Approvals needed: 2 when the account has ≥ 2 owner/admin members, else 1."
                  maximum: 2
                  minimum: 1
                  type: integer
              required:
                - required
                - approved_by
                - rejected_by
              type: object
            - type: "null"
          description: Approval state; null for test-mode destinations. Absent from Stage 1 servers.
        asset_id:
          description: Asset the merchant receives.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        attestation_challenge:
          $ref: "#/components/schemas/AttestationChallenge"
          description: Present on creation and on `POST /v1/settlement_destinations/{id}/challenge` while the destination awaits its ownership signature.
        chain:
          description: Chain of the address; `near:mainnet` for Intents accounts.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        created_by:
          anyOf:
            - description: user id (`usr_` + 26 base32 chars).
              examples:
                - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Dashboard user who created the destination; null when unknown (created before Stage 2). Spec 0.2.1.
        disabled_reason:
          anyOf:
            - description: "Why it was disabled (`expired`: a pending destination not approved within 7 days; spec 0.2.1)."
              type: string
              x-extensible-enum:
                - merchant
                - compliance
                - replaced
                - expired
            - type: "null"
        fingerprint:
          description: Short fingerprint shown on checkout next to the merchant name, e.g. `7KQ2-M9XA-31`.
          pattern: ^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{2}$
          type: string
        id:
          description: settlement_destination id (`sd_` + 26 base32 chars).
          examples:
            - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        is_default:
          description: Default destination for its asset or for the account.
          type: boolean
        label:
          description: Merchant label.
          type: string
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        min_payment_amount:
          anyOf:
            - $ref: "#/components/schemas/UsdAmount"
            - type: "null"
          description: Smallest payment that is economic for this destination (FR-SET-04).
        object:
          const: settlement_destination
          description: Always `settlement_destination`.
          type: string
        per_payment_cap:
          anyOf:
            - $ref: "#/components/schemas/UsdAmount"
            - type: "null"
          description: Cap per payment for unverified destinations.
        status:
          description: Lifecycle status; only `active` destinations receive new payments.
          type: string
          x-extensible-enum:
            - pending_verification
            - pending_approval
            - cooling_off
            - active
            - disabled
        type:
          description: "Where funds settle: an address on a chain, or a NEAR Intents account."
          enum:
            - chain_address
            - intents_account
          type: string
        verification:
          description: How ownership was established.
          type: string
          x-extensible-enum:
            - signature
            - unverified
            - test
      required:
        - id
        - object
        - created
        - livemode
        - asset_id
        - type
        - chain
        - address
        - label
        - status
        - verification
        - fingerprint
        - is_default
        - active_at
        - min_payment_amount
        - per_payment_cap
        - disabled_reason
      type: object
    SettlementDestinationList:
      additionalProperties: {}
      description: A page of settlement destinations.
      properties:
        data:
          description: Objects on this page.
          items:
            $ref: "#/components/schemas/SettlementDestination"
          type: array
        has_more:
          description: Whether more objects exist after this page.
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          description: Path of this list endpoint.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    SettlementValue:
      additionalProperties: {}
      description: An amount of an asset with display information.
      properties:
        amount:
          description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        decimals:
          description: Decimals of the asset.
          maximum: 255
          minimum: 0
          type: integer
        display:
          description: Human-readable amount, e.g. `25.00 USDC (Base)`.
          type: string
      required:
        - amount
        - asset_id
        - decimals
        - display
      type: object
    SignedAttestation:
      additionalProperties: {}
      description: A sentinel co-signature (FR-PAY-10).
      properties:
        attestation:
          $ref: "#/components/schemas/Attestation"
        kid:
          description: Signing key id (pinned in checkout and agent-signer).
          pattern: ^[a-z0-9-]{1,64}$
          type: string
        signature:
          description: Ed25519 signature over RFC 8785 canonical JSON of `attestation`, base64url.
          pattern: ^[A-Za-z0-9_-]+$
          type: string
      required:
        - attestation
        - kid
        - signature
      type: object
    SolanaEvidence:
      additionalProperties: {}
      description: Solana-specific settlement detail (token-balance delta).
      properties:
        block_time:
          anyOf:
            - maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Block time, unix seconds; null when the node has none.
        mint:
          anyOf:
            - description: "Solana address: base58 of 32 bytes (ed25519 public key or program-derived address)."
              examples:
                - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
              pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
              type: string
            - type: "null"
          description: SPL mint that settled; null for native SOL (lamports).
        owner:
          description: Wallet whose balance rose (= `Evidence.recipient`, the merchant destination).
          examples:
            - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
          type: string
        post_amount:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Owner's balance of the mint after the transaction; null when the detector did not read balances (test mode).
        pre_amount:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Owner's balance of the mint before the transaction (`meta.preTokenBalances` / `preBalances`); null when the detector did not read balances (test mode).
        signature:
          description: Transaction signature (= `Evidence.tx_hash`).
          pattern: ^[1-9A-HJ-NP-Za-km-z]{64,88}$
          type: string
        slot:
          description: Slot of the block that contains the transaction (= `Evidence.block_ref`).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        token_accounts:
          description: Token accounts of `owner` for `mint` whose balance changed (usually its ATA); empty for SOL.
          items:
            description: "Solana address: base58 of 32 bytes (ed25519 public key or program-derived address)."
            examples:
              - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
            pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
            type: string
          type: array
        token_program:
          anyOf:
            - description: "Solana address: base58 of 32 bytes (ed25519 public key or program-derived address)."
              examples:
                - EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
              pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
              type: string
            - type: "null"
          description: Owner program of the mint (`TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA` in v1); null for SOL.
      required:
        - signature
        - slot
        - block_time
        - mint
        - token_program
        - owner
        - token_accounts
        - pre_amount
        - post_amount
      type: object
    StepUp:
      additionalProperties: {}
      description: A fresh step-up confirmation.
      properties:
        object:
          const: step_up
          description: Always `step_up`.
          type: string
        step_up_until:
          description: Step-up stays fresh until this time.
          maximum: 9007199254740991
          minimum: 0
          type: integer
      required:
        - object
        - step_up_until
      type: object
    Subscription:
      additionalProperties: {}
      description: A customer billed every period by emailed invoice (FR-BIL-02).
      properties:
        asset_id:
          anyOf:
            - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            - type: "null"
          description: Pricing asset when `currency` is `asset`.
        billing_cycle_anchor:
          description: Period boundaries are computed from this instant (`periodBoundary`).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        cancel_at_period_end:
          description: Cancels at `current_period_end` instead of renewing.
          type: boolean
        canceled_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When cancellation was requested or happened.
        cancellation_reason:
          anyOf:
            - description: "Why it was canceled: by the merchant, unpaid after the reminders, or the first invoice was never paid."
              type: string
              x-extensible-enum:
                - requested
                - dunning_exhausted
                - incomplete_expired
            - type: "null"
          description: Set once canceled or scheduled to cancel.
        collection_method:
          description: "How the invoice is collected: `send_invoice` = the customer pays the hosted invoice; `auto_debit` (Stage 4) = billing's keeper collects it from the subscription's vault mandate, falling back to `send_invoice` (emailed) when the mandate cannot pay it (lld/billing.md §7.1, §14)."
          type: string
          x-extensible-enum:
            - send_invoice
            - auto_debit
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: ISO 4217 code for fiat pricing, or `asset` when priced in an asset (then `asset_id` is set).
        current_period_end:
          description: "End of the current period: the next renewal invoice is created then."
          maximum: 9007199254740991
          minimum: 0
          type: integer
        current_period_start:
          description: Start of the current period.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        customer:
          description: Customer billed (owned by payments).
          examples:
            - cus_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cus_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        days_until_due:
          description: Each invoice is due this many days after it is finalized.
          maximum: 90
          minimum: 0
          type: integer
        default_tax_rates:
          description: Tax rates for items without their own.
          items:
            description: tax_rate id (`txr_` + 26 base32 chars).
            examples:
              - txr_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^txr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
          type: array
        description:
          description: Shown on every invoice of the subscription.
          type:
            - string
            - "null"
        dunning:
          $ref: "#/components/schemas/DunningSettings"
        ended_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: "When the subscription ended (`status: canceled`)."
        id:
          description: subscription id (`sub_` + 26 base32 chars).
          examples:
            - sub_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sub_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        items:
          description: Items billed from the next renewal invoice on.
          items:
            $ref: "#/components/schemas/SubscriptionItem"
          type: array
        latest_invoice:
          anyOf:
            - description: invoice id (`in_` + 26 base32 chars).
              examples:
                - in_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^in_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Most recent invoice of the subscription.
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        mandate:
          anyOf:
            - description: mandate id (`md_` + 26 base32 chars).
              examples:
                - md_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^md_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: "The linked vault mandate renewals are collected from (`collection_method: auto_debit`); null/absent when none (Stage 4)."
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Copied onto every invoice of the subscription.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        object:
          const: subscription
