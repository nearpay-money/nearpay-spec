        - user_code
        - verification_url
        - verification_url_complete
        - expires_at
        - interval
      type: object
    CliLoginPoll:
      additionalProperties: {}
      description: Result of one CLI poll.
      properties:
        account:
          additionalProperties: {}
          description: "`approved`: the account the key belongs to."
          properties:
            display_name:
              description: Account display name.
              type: string
            id:
              description: account id (`acct_` + 26 base32 chars).
              examples:
                - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
          required:
            - id
            - display_name
          type: object
        interval:
          description: Poll at most this often, seconds.
          maximum: 9007199254740991
          minimum: 1
          type: integer
        key:
          $ref: "#/components/schemas/ApiKey"
          description: "`approved` only, exactly once: the restricted test key including `secret`. Store it; it is never shown again."
        object:
          const: cli_login_poll
          description: Always `cli_login_poll`.
          type: string
        status:
          description: "`pending`: waiting for the user. `approved`: the key is ready (the poll that sees it receives it). `denied`: the user refused. `expired`: not approved within 15 min. `redeemed`: the key was already delivered."
          type: string
          x-extensible-enum:
            - pending
            - approved
            - denied
            - expired
            - redeemed
      required:
        - object
        - status
        - interval
      type: object
    CliLoginRequest:
      additionalProperties: {}
