        - subtotal
        - tax
        - total
        - total_excluding_tax
        - total_tax_amounts
        - amount_due
        - amount_paid
        - amount_remaining
        - days_until_due
        - due_date
        - period_start
        - period_end
        - settlement_destination
        - reminder_days
        - reminders_sent
        - next_reminder_at
        - hosted_invoice_url
        - invoice_pdf
        - checkout_session
        - payment_intent
        - payment_intents
        - status_transitions
        - uncollectible_reason
        - metadata
        - sequence
      type: object
    InvoiceCreate:
      additionalProperties: false
      description: Parameters to create a draft invoice.
      properties:
        asset_id:
          description: Pricing asset; required when `currency` is `asset`.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        collection_method:
          const: send_invoice
          description: "`send_invoice` (the only method in v1, ADR-0008; default)."
          type: string
        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: "Invoice currency; default: the currency of the first price line. Required when every line has a custom amount."
        customer:
          description: Customer to bill (not deleted).
          examples:
            - cus_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cus_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        days_until_due:
          description: Due this many days after finalize (default 30). Exclusive with `due_date`.
          maximum: 365
          minimum: 0
          type: integer
        default_tax_rates:
          description: Tax rates for lines without their own `tax_rates`.
          items:
            description: tax_rate id (`txr_` + 26 base32 chars).
            examples:
              - txr_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^txr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
          maxItems: 5
          type: array
        description:
          description: Memo shown on the invoice.
          maxLength: 1000
          type: string
        due_date:
          description: Fixed due date (must be in the future at finalize). Exclusive with `days_until_due`.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        footer:
          description: Footer shown on the invoice.
          maxLength: 1000
          type: string
        lines:
          description: Lines (at most 100); a draft may start empty.
          items:
            anyOf:
              - additionalProperties: false
                description: A line from a price.
                properties:
                  description:
                    description: Overrides the product name on the invoice.
                    maxLength: 500
                    minLength: 1
                    type: string
                  price:
                    description: A `one_time` price in the invoice currency.
                    examples:
                      - price_01jbz9k3m4n5p6q7r8s9t0v1w2
                    pattern: ^price_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                    type: string
                  quantity:
                    description: Quantity (default 1).
                    maximum: 1000000
                    minimum: 1
                    type: integer
                  tax_rates:
                    description: "Tax rates of this line; default: the invoice's `default_tax_rates`."
                    items:
                      description: tax_rate id (`txr_` + 26 base32 chars).
                      examples:
                        - txr_01jbz9k3m4n5p6q7r8s9t0v1w2
                      pattern: ^txr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                      type: string
                    maxItems: 5
                    type: array
                required:
                  - price
                type: object
              - additionalProperties: false
                description: A line with a custom amount.
                properties:
                  description:
                    description: Text on the invoice.
                    maxLength: 500
                    minLength: 1
                    type: string
                  quantity:
                    description: Quantity (default 1).
                    maximum: 1000000
                    minimum: 1
                    type: integer
                  tax_rates:
                    description: "Tax rates of this line; default: the invoice's `default_tax_rates`."
                    items:
                      description: tax_rate id (`txr_` + 26 base32 chars).
                      examples:
                        - txr_01jbz9k3m4n5p6q7r8s9t0v1w2
                      pattern: ^txr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                      type: string
                    maxItems: 5
                    type: array
                  unit_amount:
                    anyOf:
                      - description: Fiat amount in minor units (e.g. cents), integer.
                        maximum: 9007199254740991
                        minimum: 0
                        type: integer
                      - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
                        pattern: ^(0|[1-9][0-9]{0,77})$
                        type: string
                    description: Price per unit in the invoice currency.
                required:
                  - unit_amount
                  - description
                type: object
            description: "A line: `{price, quantity?}` or `{unit_amount, description, quantity?}`."
          maxItems: 100
          type: array
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Up to 50 key/value pairs (key ≤ 40 chars, value ≤ 500 chars) for your own use.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        reminder_days:
          description: Reminder schedule relative to the due date (default `[-3, 0, 1, 3, 7]`); `[]` sends none.
          items:
            description: Days relative to the due date (negative = before).
            maximum: 60
            minimum: -30
            type: integer
          maxItems: 10
          type: array
        settlement_destination:
          description: "Destination to settle to; default: the account default."
          examples:
            - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
      required:
        - customer
      type: object
    InvoiceLineItem:
      additionalProperties: {}
      description: One line of an invoice.
      properties:
        amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "`unit_amount × quantity` (inclusive taxes stay inside)."
        amount_excluding_tax:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "`amount` less this line's inclusive taxes."
        description:
          description: Text on the invoice (product name or the given description).
          type: string
        id:
          description: invoice_line_item id (`il_` + 26 base32 chars).
          examples:
            - il_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^il_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        object:
          const: line_item
          description: Always `line_item`.
          type: string
        period:
          anyOf:
            - additionalProperties: {}
              properties:
                end:
                  description: Period end (exclusive).
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                start:
                  description: Period start.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
              required:
                - start
                - end
              type: object
            - type: "null"
          description: Service period of a `subscription` line; null for one-off lines.
        price:
          anyOf:
            - description: price id (`price_` + 26 base32 chars).
              examples:
                - price_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^price_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Price the line was created from; null for a custom amount.
        product:
          anyOf:
            - description: product id (`prod_` + 26 base32 chars).
              examples:
                - prod_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^prod_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Product of `price`.
        quantity:
          description: Quantity.
          maximum: 9007199254740991
          minimum: 1
          type: integer
        subscription_item:
          anyOf:
            - description: subscription_item id (`si_` + 26 base32 chars).
              examples:
                - si_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^si_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Subscription item of a `subscription` line.
        tax_amounts:
          description: Tax per rate for this line.
          items:
            $ref: "#/components/schemas/InvoiceTaxAmount"
          type: array
        tax_rates:
          description: Tax rates applied to the line (all inclusive or all exclusive).
          items:
            description: tax_rate id (`txr_` + 26 base32 chars).
            examples:
              - txr_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^txr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
          type: array
        type:
          description: A one-off line or a subscription item's line.
          type: string
          x-extensible-enum:
            - invoiceitem
            - subscription
        unit_amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Price per unit in the invoice currency.
      required:
        - id
        - object
        - type
        - price
        - product
        - subscription_item
        - description
        - quantity
        - unit_amount
        - amount
        - amount_excluding_tax
        - tax_rates
        - tax_amounts
        - period
      type: object
    InvoiceList:
      additionalProperties: {}
      description: A page of invoices.
      properties:
        data:
          description: Objects on this page.
          items:
            $ref: "#/components/schemas/Invoice"
          type: array
        has_more:
          description: Whether more objects exist after this page.
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          description: Path of this list endpoint.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    InvoicePaymentSession:
      additionalProperties: {}
      description: The checkout session that pays an invoice.
      properties:
        checkout_session:
          description: checkout_session id (`cs_` + 26 base32 chars).
          examples:
            - cs_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cs_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        client_secret:
          description: Client secret of the session; the page continues with the payer API (`/c/:id` flow) in place.
          pattern: ^cs_[0-9a-z]{26}_secret_[0-9A-Za-z]{32}$
          type: string
        expires_at:
          description: When the session stops accepting new payments.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        object:
          const: invoice_payment_session
          description: Always `invoice_payment_session`.
          type: string
        reused:
          description: "`true` when an already open session of the invoice was returned."
          type: boolean
      required:
        - object
        - checkout_session
        - client_secret
        - expires_at
        - reused
      type: object
    InvoiceTaxAmount:
      additionalProperties: {}
      description: One tax rate applied to an amount (snapshot; immutable once open).
      properties:
        amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Tax of this line for this rate, rounded half-up per line.
        display_name:
          description: Tax-rate name at finalize (snapshot).
          type: string
        inclusive:
          description: The line amount contains this tax.
          type: boolean
        percentage:
          description: Exact percentage as a decimal string, 0–100 with at most 4 decimals (the rate is the rational `ppm / 1 000 000`, ppm = percentage × 10 000). No floats.
          examples:
            - "19"
            - "8.875"
          pattern: ^(100(\.0{1,4})?|[1-9]?[0-9](\.[0-9]{1,4})?)$
          type: string
        tax_rate:
          description: tax_rate id (`txr_` + 26 base32 chars).
          examples:
            - txr_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^txr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        taxable_amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "Amount the rate applies to: the line amount (exclusive) or the line amount less its inclusive taxes."
      required:
        - tax_rate
        - display_name
        - percentage
        - inclusive
        - amount
        - taxable_amount
      type: object
    InvoiceUpdate:
      additionalProperties: false
      description: Invoice fields to change.
      properties:
        asset_id:
          anyOf:
            - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            - type: "null"
          description: Pricing asset when `currency` is `asset`.
        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: Invoice currency (lines must match).
        customer:
          description: Customer to bill.
          examples:
            - cus_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cus_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        days_until_due:
          description: Due this many days after finalize (default 30). Exclusive with `due_date`.
          maximum: 365
          minimum: 0
          type: integer
        default_tax_rates:
          description: Default tax rates (re-applied to lines without their own).
          items:
            description: tax_rate id (`txr_` + 26 base32 chars).
            examples:
              - txr_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^txr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
          maxItems: 5
          type: array
        description:
          anyOf:
            - maxLength: 1000
              type: string
            - type: "null"
          description: Memo (`null` clears it).
        due_date:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Fixed due date (`null` clears it).
        footer:
          anyOf:
            - maxLength: 1000
              type: string
            - type: "null"
          description: Footer (`null` clears it).
        lines:
          description: Replaces every line.
          items:
            anyOf:
              - additionalProperties: false
                description: A line from a price.
                properties:
                  description:
                    description: Overrides the product name on the invoice.
                    maxLength: 500
                    minLength: 1
                    type: string
                  price:
                    description: A `one_time` price in the invoice currency.
                    examples:
                      - price_01jbz9k3m4n5p6q7r8s9t0v1w2
                    pattern: ^price_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                    type: string
                  quantity:
                    description: Quantity (default 1).
                    maximum: 1000000
                    minimum: 1
                    type: integer
                  tax_rates:
                    description: "Tax rates of this line; default: the invoice's `default_tax_rates`."
                    items:
                      description: tax_rate id (`txr_` + 26 base32 chars).
                      examples:
                        - txr_01jbz9k3m4n5p6q7r8s9t0v1w2
                      pattern: ^txr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                      type: string
                    maxItems: 5
                    type: array
                required:
                  - price
                type: object
              - additionalProperties: false
                description: A line with a custom amount.
                properties:
                  description:
                    description: Text on the invoice.
                    maxLength: 500
                    minLength: 1
                    type: string
                  quantity:
                    description: Quantity (default 1).
                    maximum: 1000000
                    minimum: 1
                    type: integer
                  tax_rates:
                    description: "Tax rates of this line; default: the invoice's `default_tax_rates`."
                    items:
                      description: tax_rate id (`txr_` + 26 base32 chars).
                      examples:
                        - txr_01jbz9k3m4n5p6q7r8s9t0v1w2
                      pattern: ^txr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                      type: string
                    maxItems: 5
                    type: array
                  unit_amount:
                    anyOf:
                      - description: Fiat amount in minor units (e.g. cents), integer.
                        maximum: 9007199254740991
                        minimum: 0
                        type: integer
                      - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
                        pattern: ^(0|[1-9][0-9]{0,77})$
                        type: string
                    description: Price per unit in the invoice currency.
                required:
                  - unit_amount
                  - description
                type: object
            description: "A line: `{price, quantity?}` or `{unit_amount, description, quantity?}`."
          maxItems: 100
          type: array
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Up to 50 key/value pairs (key ≤ 40 chars, value ≤ 500 chars) for your own use.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        reminder_days:
          description: When reminders go out, in days relative to the due date (negative = before), strictly increasing, at most 10; `[]` sends none.
          items:
            description: Days relative to the due date (negative = before).
            maximum: 60
            minimum: -30
            type: integer
          maxItems: 10
          type: array
        settlement_destination:
          anyOf:
            - description: settlement_destination id (`sd_` + 26 base32 chars).
              examples:
                - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Destination (`null` = account default).
      type: object
    KybCase:
      additionalProperties: {}
      description: The account's KYB case.
      properties:
        decided_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Last ops decision.
        editable:
          description: Whether the profile can be updated and submitted now (`not_started` or `needs_info`).
          type: boolean
        object:
          const: kyb_case
          description: Always `kyb_case`.
          type: string
        profile:
          $ref: "#/components/schemas/KybProfile"
          description: Declared business details (all null before the first update).
        requested_info:
          description: What ops asked for (`needs_info` only). Internal decision reasons are never shown.
          type:
            - string
            - "null"
        status:
          description: KYB case status.
          type: string
          x-extensible-enum:
            - not_started
            - pending
            - needs_info
            - approved
            - rejected
        submitted_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Last submission for review.
        vendor_flow_url:
          anyOf:
            - format: uri
              type: string
            - type: "null"
          description: "Always null: KYB is self-declared and decided by NearPay ops; there is no vendor flow (ADR-0020)."
      required:
        - object
        - status
        - vendor_flow_url
      type: object
    KybProfile:
      additionalProperties: {}
      description: Self-declared minimum business details (KYB).
      properties:
        business_address:
          anyOf:
            - $ref: "#/components/schemas/BusinessAddress"
            - type: "null"
          description: Registered address.
        business_type:
          anyOf:
            - description: Legal form of the business.
              type: string
              x-extensible-enum:
                - sole_proprietorship
                - partnership
                - company
                - non_profit
                - other
            - type: "null"
        country_of_incorporation:
          anyOf:
            - description: ISO 3166-1 alpha-2 country code, upper-case.
              pattern: ^[A-Z]{2}$
              type: string
            - type: "null"
          description: Country where the business is registered.
        expected_monthly_volume:
          anyOf:
            - description: Expected monthly payment volume in USD.
              type: string
              x-extensible-enum:
                - under_10k
                - 10k_to_100k
                - 100k_to_1m
                - over_1m
            - type: "null"
        legal_name:
          description: Registered legal name (or the owner's full name for a sole proprietor).
          type:
            - string
            - "null"
        registration_number:
          description: Company or trade register number (tax id if none).
          type:
            - string
            - "null"
        representative:
          anyOf:
            - additionalProperties: {}
              properties:
                name:
                  description: Full name of the person declaring the details.
                  type: string
                title:
                  description: Their role, e.g. `Director`, `Founder`.
                  type: string
              required:
                - name
                - title
              type: object
            - type: "null"
          description: Who declares the details on behalf of the business.
        website:
          anyOf:
            - description: Absolute URL.
              format: uri
              maxLength: 2048
              type: string
            - type: "null"
          description: Public website or store front, if any.
      required:
        - legal_name
        - country_of_incorporation
        - registration_number
        - business_type
        - website
        - business_address
        - representative
        - expected_monthly_volume
      type: object
    KybProfileUpdate:
      additionalProperties: false
      description: Changes to the draft business details.
      properties:
        business_address:
          anyOf:
            - additionalProperties: false
              properties:
                city:
                  description: City.
                  maxLength: 100
                  minLength: 1
                  type: string
                country:
                  description: Country of the address.
                  pattern: ^[A-Z]{2}$
                  type: string
                line1:
                  description: Street and number.
                  maxLength: 200
                  minLength: 1
                  type: string
                line2:
                  anyOf:
                    - maxLength: 200
                      type: string
                    - type: "null"
                  description: Additional address line.
                postal_code:
                  anyOf:
                    - maxLength: 20
                      type: string
                    - type: "null"
                  description: Postal code (if the country uses one).
                region:
                  anyOf:
                    - maxLength: 100
                      type: string
                    - type: "null"
                  description: State, province or region.
              required:
                - line1
                - city
                - country
              type: object
            - type: "null"
          description: Registered address (replaces the stored one).
        business_type:
          anyOf:
            - description: Legal form of the business.
              type: string
              x-extensible-enum:
                - sole_proprietorship
                - partnership
                - company
                - non_profit
                - other
            - type: "null"
        country_of_incorporation:
          anyOf:
            - description: ISO 3166-1 alpha-2 country code, upper-case.
              pattern: ^[A-Z]{2}$
              type: string
            - type: "null"
          description: Country of incorporation.
        expected_monthly_volume:
          anyOf:
            - description: Expected monthly payment volume in USD.
              type: string
              x-extensible-enum:
                - under_10k
                - 10k_to_100k
                - 100k_to_1m
                - over_1m
            - type: "null"
        legal_name:
          anyOf:
            - maxLength: 200
              minLength: 1
              type: string
            - type: "null"
          description: Registered legal name.
        registration_number:
          anyOf:
            - maxLength: 64
              minLength: 1
              type: string
            - type: "null"
          description: Register number.
        representative:
          anyOf:
            - additionalProperties: false
              properties:
                name:
                  description: Full name.
                  maxLength: 200
                  minLength: 1
                  type: string
                title:
                  description: Role in the business.
                  maxLength: 100
                  minLength: 1
                  type: string
              required:
                - name
                - title
              type: object
            - type: "null"
          description: Declaring representative.
        website:
          anyOf:
            - description: Absolute URL.
              format: uri
              maxLength: 2048
              type: string
            - type: "null"
          description: Website (https).
      type: object
    Mandate:
      additionalProperties: {}
      description: "An auto-debit mandate: NearPay's mirror of a subscription-vault mandate the payer funded (FR-BIL-02/04)."
      properties:
        amount_per_period:
          description: Tokens collected per period.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          description: The token as a NEAR Intents asset id (`nep141:<token>`).
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        balance:
          description: Tokens on the mandate available for the next periods (mirror of the vault events).
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        canceled:
          anyOf:
            - additionalProperties: {}
              properties:
                by:
                  description: Who canceled (the payer or the merchant receiver).
                  pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
                  type: string
                by_role:
                  description: Role of `by`.
                  type: string
                  x-extensible-enum:
                    - payer
                    - merchant_receiver
                canceled_at:
                  description: Block time of the `canceled` event.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                refunded:
                  description: Returned to the payer by the cancel; `"0"` if that refund failed (then withdrawable).
                  pattern: ^(0|[1-9][0-9]{0,77})$
                  type: string
              required:
                - by
                - by_role
                - refunded
                - canceled_at
              type: object
            - type: "null"
          description: Set once canceled.
        collect_failures:
          description: Consecutive `collect_failed` outcomes (merchant leg delivered nothing); reset by a collection.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        collected_periods:
          description: Periods the vault has counted.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        collecting:
          description: "Billing's keeper collects renewal invoices from this mandate: linked, on-chain active, and its subscription is active and `auto_debit`. Turns false for good when the subscription ends or leaves `auto_debit` (`mandate.released`)."
          type: boolean
        created:
          description: Block time of `mandate_created`.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        customer:
          description: Customer of that subscription.
          examples:
            - cus_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cus_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        ext_ref:
          description: The mandate's on-chain reference (the subscription id for NearPay mandates).
          maxLength: 64
          type: string
        fee_bps:
          description: NearPay fee in basis points, fixed on chain at creation.
          maximum: 10000
          minimum: 0
          type: integer
        funded_periods:
          description: "`floor(balance / amount_per_period)`: periods the balance still covers."
          maximum: 9007199254740991
          minimum: 0
          type: integer
        id:
          description: mandate id (`md_` + 26 base32 chars).
          examples:
            - md_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^md_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        last_collection:
          anyOf:
            - $ref: "#/components/schemas/MandateCollection"
            - type: "null"
          description: Most recent collected period.
        link_status:
          description: "`linked`: billing collects this mandate for its subscription. `unlinked`: the on-chain terms do not match what billing prepared; billing never collects it and the payer is asked to cancel it."
          type: string
          x-extensible-enum:
            - linked
            - unlinked
        livemode:
          description: "`true` for the mainnet vault, `false` for the sandbox vault stand-in."
          type: boolean
        max_periods:
          anyOf:
            - maximum: 9007199254740991
              minimum: 1
              type: integer
            - type: "null"
          description: Maximum periods; null = until canceled.
        merchant_receiver:
          description: Receiver of the merchant share (the merchant's NEAR Intents account).
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        next_collect_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the next vault period becomes due; null unless on-chain active below `max_periods`.
        object:
          const: mandate
          description: Always `mandate`.
          type: string
        onchain_id:
          description: The vault's `mandate_id`.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        payer:
          description: "Payer: the NEAR account that signed the funding transaction (always its owner)."
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        period_secs:
          description: Vault period length (seconds).
          maximum: 9007199254740991
          minimum: 86400
          type: integer
        receiver_kind:
          description: "How the merchant share is delivered: `intents_account` = `ft_transfer_call(intents.near, msg = merchant_receiver)` (credits the merchant's NEAR Intents balance); `near_account` = plain `ft_transfer`."
          enum:
            - intents_account
            - near_account
          type: string
        sequence:
          description: Increases with every change; discard webhook objects with a lower sequence.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        settlement_destination:
          anyOf:
            - description: settlement_destination id (`sd_` + 26 base32 chars).
              examples:
                - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Settlement destination that matches `merchant_receiver` (linked mandates); null otherwise.
        start_at:
          description: When vault period 1 became (or becomes) due.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        status:
          description: "Mandate status (domain-model §4.5): `active` = on-chain active with at least one period funded; `insufficient` = on-chain active but the balance is below one period (top up, or the due invoice falls back to `send_invoice`); `exhausted` = `max_periods` collected; `canceled` = canceled by the payer or the merchant receiver."
          type: string
          x-extensible-enum:
            - active
            - insufficient
            - exhausted
            - canceled
        subscription:
          description: Subscription named by the mandate's `ext_ref`.
          examples:
            - sub_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sub_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        token:
          description: NEP-141 token contract.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        unlinked_reason:
          anyOf:
            - description: "Why a mandate is `unlinked` (billing §6 linkage rule): the subscription is not `auto_debit` or has ended, another mandate is already linked, or a term differs from the prepared one (receiver kind, receiver = an active Intents-account destination of the account, token, amount per period, period, fee, `start_at` after the current period end, `max_periods` below the remaining periods), or a test-vault mandate names a live subscription (or the reverse)."
              type: string
              x-extensible-enum:
                - subscription_not_auto_debit
                - subscription_ended
                - already_linked
                - receiver_kind_mismatch
                - receiver_not_destination
                - token_mismatch
                - amount_mismatch
                - period_mismatch
                - fee_mismatch
                - start_too_late
                - max_periods_too_low
                - mode_mismatch
            - type: "null"
          description: Set when `link_status` is `unlinked`.
        vault_contract:
          description: Vault account (`v1.vault.nearpay.near`; the stand-in's in test mode).
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        withdrawn:
          description: Total the payer withdrew after cancel/exhaustion (`withdrawn` events).
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
      required:
        - id
        - object
        - created
        - livemode
        - status
        - link_status
        - unlinked_reason
        - collecting
        - subscription
        - customer
        - vault_contract
        - onchain_id
        - payer
        - token
        - asset_id
        - merchant_receiver
        - receiver_kind
        - settlement_destination
        - amount_per_period
        - period_secs
        - start_at
        - max_periods
        - fee_bps
        - collected_periods
        - balance
        - funded_periods
        - next_collect_at
        - last_collection
        - collect_failures
        - canceled
        - withdrawn
        - ext_ref
        - sequence
      type: object
    MandateCancelInstructions:
      additionalProperties: {}
      description: The transaction the merchant receiver signs to cancel a mandate. NearPay cannot cancel (it holds no key the vault accepts, INV-1).
      properties:
        mandate:
          description: mandate id (`md_` + 26 base32 chars).
          examples:
            - md_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^md_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        object:
          const: mandate_cancel_instructions
          description: Always `mandate_cancel_instructions`.
          type: string
        transaction:
          $ref: "#/components/schemas/NearTransactionRequest"
          description: "`cancel({mandate_id})` on the vault, signed by `merchant_receiver` (100 Tgas, 1 yoctoNEAR): the whole balance returns to the payer."
      required:
        - object
        - mandate
        - transaction
      type: object
    MandateCollection:
      additionalProperties: {}
      description: "A period collected by the vault (evidence: the `collected` event)."
      properties:
        amount:
          description: "`merchant_share + fee` actually paid (token base units)."
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        collected_at:
          description: Block time of the receipt.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        fee:
          description: NearPay fee; `"0"` when the fee leg failed (the fee stayed with the payer).
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        invoice:
          anyOf:
            - description: invoice id (`in_` + 26 base32 chars).
              examples:
                - in_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^in_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Invoice the collection paid (or applied to).
        merchant_share:
          description: Share delivered to the merchant receiver.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        period:
          description: 1-based vault period.
          maximum: 9007199254740991
          minimum: 1
          type: integer
        receipt_id:
          description: Vault receipt that logged `collected` (evidence).
          maxLength: 64
          minLength: 1
          type: string
        short:
          description: "The merchant share was below the expected share (partial delivery): the invoice is not marked paid; billing issues a `send_invoice` balance invoice for the shortfall."
          type: boolean
        tx_hash:
          description: NEAR transaction of the `collect`.
          maxLength: 128
          minLength: 8
          type: string
      required:
        - period
        - amount
        - merchant_share
        - fee
        - short
        - invoice
        - tx_hash
        - receipt_id
        - collected_at
      type: object
    MandateFundingInstructions:
      additionalProperties: {}
      description: What the payer signs to authorise auto-debit for a subscription (lld/billing.md §5, §14). Computing it has no side effects.
      properties:
        amount:
          description: "Initial funding: `periods × amount_per_period`."
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        amount_per_period:
          description: "Tokens per period: the subscription's per-period total (items and tax) in the token (USD at par for USDC/USDT, or the pricing asset itself)."
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          description: The token as a NEAR Intents asset id.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        ext_ref:
          description: The subscription id, written as the mandate's `ext_ref`.
          maxLength: 64
          type: string
        fee_bps:
          description: The account's agreed NearPay fee (ADR-0006).
          maximum: 10000
          minimum: 0
          type: integer
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        merchant_receiver:
          description: The merchant's NEAR Intents account (an active destination).
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        msg:
          description: Exact `ft_transfer_call` msg (`{"create_mandate":{…}}`, compact JSON, the contract's key order). A mandate whose on-chain terms differ is not linked.
          maxLength: 2048
          type: string
        object:
          const: mandate_funding_instructions
          description: Always `mandate_funding_instructions`.
          type: string
        payer:
          anyOf:
            - description: NEAR account id (named, implicit or eth-implicit), 2–64 chars.
              pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
              type: string
            - type: "null"
          description: Payer the storage check was made for; null when none was given.
        payer_notice:
          description: "Text the funding UI must show before signing (billing v1.9 §5): sign from your own NEAR account and pay your own gas; relayer/gasless wallets (NEP-366 meta-transactions), NEAR Intents balances, bridges and smart wallets cannot fund (the vault refunds such deposits). Cancel and withdraw are accepted only from the paying account (from any wallet holding it, meta-transactions included); the remaining balance returns to that account."
          type: string
        period_secs:
          description: Vault period for the subscription's interval (billing §14 d3).
          maximum: 9007199254740991
          minimum: 86400
          type: integer
        periods:
          description: Periods the initial funding covers.
          maximum: 9007199254740991
          minimum: 1
          type: integer
        receiver_kind:
          description: "How the merchant share is delivered: `intents_account` = `ft_transfer_call(intents.near, msg = merchant_receiver)` (credits the merchant's NEAR Intents balance); `near_account` = plain `ft_transfer`."
          enum:
            - intents_account
            - near_account
          type: string
        settlement_destination:
          description: Destination `merchant_receiver` belongs to.
          examples:
            - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        start_at:
          anyOf:
            - pattern: ^(0|[1-9][0-9]{0,19})$
              type: string
            - type: "null"
          description: Period 1 due time in ns as written in `msg`; null = the block time (the mandate pays the subscription's open invoice right away).
        storage:
          additionalProperties: {}
          description: Vault storage (NEP-145) the payer pays for.
          properties:
            deposit:
              description: yoctoNEAR the payer must add with `storage_deposit` before funding (0.002 NEAR registration + 0.01 NEAR per open mandate, minus what is available); `"0"` = none.
              pattern: ^(0|[1-9][0-9]{0,38})$
              type: string
            payer_registered:
              description: Whether the payer has a vault storage balance; null when no payer was given.
              type:
                - boolean
                - "null"
          required:
            - payer_registered
            - deposit
          type: object
        subscription:
          description: subscription id (`sub_` + 26 base32 chars).
          examples:
            - sub_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sub_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        token:
          description: NEP-141 token the payer funds with.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        token_asset:
          $ref: "#/components/schemas/PricingAssetDisplay"
          description: Display data of `token` (asset id, symbol, decimals) for the funding UI. Spec 0.4.1; absent from older billing builds.
        transactions:
          description: "Transactions to sign from the payer's own NEAR account, in order: `storage_deposit` on the vault (only when `storage.deposit` > 0 or the payer is unknown), then `ft_transfer_call` on the token (`receiver_id` = the vault, `amount`, `msg`; 100 Tgas, 1 yoctoNEAR). Deposits relayed by contracts, smart wallets or NEP-366 meta-transactions are refunded (`ERR_UNSUPPORTED_SENDER`)."
          items:
            $ref: "#/components/schemas/NearTransactionRequest"
          maxItems: 2
          minItems: 1
          type: array
        vault_contract:
          description: Vault the mandate is created in.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
      required:
        - object
        - livemode
        - subscription
        - vault_contract
        - token
        - asset_id
        - amount
        - periods
        - amount_per_period
        - period_secs
        - start_at
        - fee_bps
        - merchant_receiver
        - receiver_kind
        - settlement_destination
        - ext_ref
        - msg
        - payer
        - storage
        - payer_notice
        - transactions
      type: object
