        asset:
          description: "Asset the merchant receives (NearPay: the NEAR Intents asset id)."
          maxLength: 256
          minLength: 1
          type: string
        network:
          description: "CAIP-2 network the merchant receives on (NearPay: `near:mainnet`)."
