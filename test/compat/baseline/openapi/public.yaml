          type: array
      type: object
    CustomerList:
      additionalProperties: {}
      description: A page of customers.
      properties:
        data:
          description: Objects on this page.
          items:
            $ref: "#/components/schemas/Customer"
          type: array
        has_more:
          description: Whether more objects exist after this page.
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          description: Path of this list endpoint.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    CustomerUpdate:
      additionalProperties: false
      description: Customer fields to change.
      properties:
        description:
          anyOf:
            - description: Internal description.
              maxLength: 500
              type: string
            - type: "null"
        email:
          anyOf:
            - description: Receipt email.
              format: email
              maxLength: 254
              pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              type: string
            - type: "null"
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Up to 50 key/value pairs (key ≤ 40 chars, value ≤ 500 chars) for your own use.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        name:
          anyOf:
            - description: Name.
              maxLength: 200
              minLength: 1
              type: string
            - type: "null"
        wallets:
          description: Replaces the wallet list.
          items:
            additionalProperties: false
            properties:
              address:
                description: Wallet address or NEAR account.
                maxLength: 256
                minLength: 1
                type: string
              chain:
                description: Chain of the wallet.
                examples:
                  - eip155:8453
                pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
                type: string
            required:
              - chain
              - address
            type: object
          maxItems: 20
          type: array
      type: object
    CustomerWallet:
      additionalProperties: {}
      description: A wallet the customer pays from.
      properties:
        address:
          description: Wallet address or NEAR account.
          maxLength: 256
          minLength: 1
          type: string
        chain:
          description: Chain of the wallet (`near:mainnet` for NEAR and Intents accounts).
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
      required:
        - chain
        - address
      type: object
    DashboardSession:
      additionalProperties: {}
      description: A dashboard session. Sign-in responses set the session cookie `__Host-np_session`; `GET /v1/auth/session` returns the current session without setting it.
      properties:
        account:
          additionalProperties: {}
          description: Account the session acts for.
          properties:
            display_name:
              description: Account display name.
              type: string
            id:
              description: account id (`acct_` + 26 base32 chars).
              examples:
                - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
          required:
            - id
            - display_name
          type: object
        csrf_token:
          description: Send as `X-CSRF-Token` on every unsafe request.
          minLength: 32
          type: string
        expires_at:
          description: Absolute session expiry.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        object:
          const: dashboard_session
          description: Always `dashboard_session`.
          type: string
        role:
          description: Role of the user in the account.
          enum:
            - owner
            - admin
            - developer
            - finance
            - support
            - viewer
          type: string
        user:
          additionalProperties: {}
          description: Signed-in user.
          properties:
            email:
              description: Email of the signed-in user.
              format: email
              pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              type: string
            id:
              description: user id (`usr_` + 26 base32 chars).
              examples:
                - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
          required:
            - id
            - email
          type: object
      required:
        - object
        - user
        - account
        - role
        - csrf_token
        - expires_at
      type: object
    DeletedCustomer:
      additionalProperties: {}
      description: A deleted customer.
      properties:
        deleted:
          const: true
          description: Always `true`.
          type: boolean
        id:
          description: customer id (`cus_` + 26 base32 chars).
          examples:
            - cus_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cus_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        object:
          const: customer
          description: Always `customer`.
          type: string
      required:
        - id
        - object
        - livemode
        - deleted
      type: object
    DeletedInvoice:
      additionalProperties: {}
      description: A deleted draft invoice.
      properties:
        deleted:
          const: true
          description: Always `true`.
          type: boolean
        id:
          description: invoice id (`in_` + 26 base32 chars).
          examples:
            - in_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^in_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        object:
          const: invoice
          description: Always `invoice`.
          type: string
      required:
        - id
        - object
        - livemode
        - deleted
      type: object
    DepositInstructions:
      additionalProperties: {}
      description: Where and how much the payer sends (render only after sentinel attestation).
      properties:
        address:
          description: 1Click deposit address.
          maxLength: 256
          minLength: 1
          type: string
        amount_in:
          description: Amount to send, base units of the origin asset.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        chain:
          description: Chain to send on.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        deadline:
          description: Send before this time; later deposits are refunded.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        fee_amount:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: "Part of `amount_in` that pays NearPay's fee, base units of the origin asset — display only (not attested): `0` when the merchant bears the fee, null when unknown. Absent from older servers."
        memo:
          description: Memo the deposit must carry, if any.
          type:
            - string
            - "null"
        min_amount_in:
          description: Minimum the provider accepts; below it the deposit is refunded.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        origin_asset_id:
          description: Asset to send.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
      required:
        - address
        - memo
        - amount_in
        - min_amount_in
        - deadline
        - chain
        - origin_asset_id
      type: object
    DepositInstructionsAttestationRequest:
      additionalProperties: false
      description: Instructions checkout wants co-signed.
      properties:
        attempt_id:
          description: payment_attempt id (`pa_` + 26 base32 chars).
          examples:
            - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        attestation_ticket:
          description: "`base64url(JCS payload).base64url(Ed25519 signature)` issued by payments; pass it to sentinel unchanged."
          pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
          type: string
        deposit:
          additionalProperties: false
          description: Required for `route_quote`.
          properties:
            address:
              description: Deposit address.
              maxLength: 256
              minLength: 1
              type: string
            amount_in:
              description: Amount to send, base units.
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            chain:
              description: Origin chain.
              examples:
                - eip155:8453
              pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
              type: string
            deadline:
              description: Deposit deadline.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            memo:
              description: Deposit memo, or null.
              type:
                - string
                - "null"
            origin_asset_id:
              description: Asset to send.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
          required:
            - address
            - memo
            - chain
            - origin_asset_id
            - amount_in
            - deadline
          type: object
        kind:
          description: What is being attested.
          enum:
            - route_quote
            - intents_transfer
          type: string
        livemode:
          description: Mode of the attempt.
          type: boolean
        requirement:
          additionalProperties: false
          description: Required for `intents_transfer`.
          properties:
            amount:
              description: Amount.
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            binding:
              description: Binding memo.
              type: string
            deadline:
              description: Payload deadline.
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              type: string
            fee_amount:
              description: Fee.
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            fee_to:
              description: Treasury Intents account.
              type: string
            pay_to:
              description: Merchant Intents account.
              type: string
            token:
              description: Asset.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
          required:
            - pay_to
            - token
            - amount
            - fee_to
            - fee_amount
            - binding
            - deadline
          type: object
      required:
        - livemode
        - kind
        - attempt_id
        - attestation_ticket
      type: object
    DestinationSnapshot:
      additionalProperties: {}
      description: Settlement destination as snapshotted at creation (INV-6).
      properties:
        address:
          description: Settlement address or Intents account.
          maxLength: 256
          minLength: 1
          type: string
        asset_id:
          description: Settlement asset.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        chain:
          description: Settlement chain.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        fingerprint:
          anyOf:
            - pattern: ^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{2}$
              type: string
            - type: "null"
          description: Fingerprint of the destination as shown at checkout (CR-15-04, spec 0.2.0); optional so older servers stay valid.
        settlement_destination:
          description: settlement_destination id (`sd_` + 26 base32 chars).
          examples:
            - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        type:
          description: "Where funds settle: an address on a chain, or a NEAR Intents account."
          enum:
            - chain_address
            - intents_account
          type: string
      required:
        - settlement_destination
        - asset_id
        - type
        - chain
        - address
      type: object
    DunningSettings:
      additionalProperties: {}
      description: Reminder schedule and what happens when it runs out (FR-BIL-03).
      properties:
        on_exhausted:
          description: "After the last reminder of an unpaid invoice: `cancel` the subscription, or keep it as `unpaid` (no new invoices until paid or canceled)."
          type: string
          x-extensible-enum:
            - cancel
            - unpaid
        reminder_days:
          description: When reminders go out, in days relative to the due date (negative = before), strictly increasing, at most 10; `[]` sends none.
          items:
            description: Days relative to the due date (negative = before).
            maximum: 60
            minimum: -30
            type: integer
          maxItems: 10
          type: array
      required:
        - reminder_days
        - on_exhausted
      type: object
    Erc191MultiPayload:
      additionalProperties: {}
      description: Payload signed with ERC-191.
      properties:
        payload:
          description: JSON string of `IntentMessage`.
          minLength: 2
          type: string
        signature:
          description: secp256k1 signature r‖s‖v (v ∈ {0,1}), base58.
          pattern: ^(ed25519|secp256k1):[1-9A-HJ-NP-Za-km-z]{64,100}$
          type: string
        standard:
          const: erc191
          description: ERC-191 `personal_sign` (EVM wallets).
          type: string
      required:
        - standard
        - payload
        - signature
      type: object
    Error:
