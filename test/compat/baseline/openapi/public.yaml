          description: Always `event_stream_reset`.
          type: string
        reason:
          description: "`cursor_unknown`: the resume cursor is not an event of this account and mode. `cursor_expired`: it is older than the 30-day retention."
          type: string
          x-extensible-enum:
            - cursor_unknown
            - cursor_expired
      required:
        - object
        - reason
        - cursor
      type: object
    Evidence:
      additionalProperties: {}
      description: Independent on-chain proof that a settlement reached the merchant (INV-2).
      properties:
        amount:
          description: Amount received by the recipient, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          description: Asset that settled.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        bitcoin:
          anyOf:
            - $ref: "#/components/schemas/BitcoinEvidence"
            - type: "null"
          description: Bitcoin detail (txid, outputs, confirmations) when `chain` is Bitcoin; null/absent otherwise. Spec 0.4.0.
        block_ref:
          description: Block height or hash containing the transaction.
          type:
            - string
            - "null"
        chain:
          description: Chain where the settlement happened.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        explorer_url:
          anyOf:
            - format: uri
              type: string
            - type: "null"
          description: Block-explorer link for the transaction.
        finality:
          description: Finality reached when the evidence was accepted.
          type: string
          x-extensible-enum:
            - final
            - finalized
            - confirmed
        observed_at:
          description: When NearPay accepted the evidence.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        recipient:
          description: Recipient that received the funds (the merchant destination).
          maxLength: 256
          minLength: 1
          type: string
        sender:
          anyOf:
            - description: Address in the chain's canonical text form.
              maxLength: 256
              minLength: 1
              type: string
            - type: "null"
          description: "Account that sent the settlement transfer, when the detector saw it (NEAR Intents: the transferring Intents account); null if unknown. Spec 0.3.0."
        solana:
          anyOf:
            - $ref: "#/components/schemas/SolanaEvidence"
            - type: "null"
          description: Solana detail (signature, slot, mint, token-balance delta) when `chain` is Solana; null/absent otherwise. Spec 0.4.0.
        source:
          description: Detector that produced the evidence.
          type: string
          x-extensible-enum:
            - watcher
            - indexer
            - verifier
            - provider
            - operator
        tier:
          description: "Verification tier: A = independently verified on chain, B = provider-attested within limits."
          type: string
          x-extensible-enum:
            - A
            - B
        tx_hash:
          description: Settlement transaction (NEAR receipt / tx hash for Intents).
          maxLength: 128
          minLength: 8
          type: string
      required:
        - chain
        - tx_hash
        - block_ref
        - recipient
        - asset_id
        - amount
        - finality
        - tier
        - source
        - observed_at
        - explorer_url
      type: object
    FeeSummary:
      additionalProperties: {}
      description: Fee snapshot of a payment (INV-6).
      properties:
        bearer:
          description: Who bears the fee.
          enum:
            - payer
            - merchant
          type: string
        total_bps:
          description: NearPay fee applied to this payment's route, in basis points.
          maximum: 10000
          minimum: 0
          type: integer
      required:
        - bearer
        - total_bps
      type: object
    IntentMessage:
      additionalProperties: {}
      description: Verifier message (`DefusePayload`).
      properties:
        deadline:
          description: Latest time the Verifier accepts the payload.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        intents:
          description: Intents executed atomically.
          items:
            anyOf:
              - $ref: "#/components/schemas/TransferIntent"
              - additionalProperties: {}
                properties:
                  intent:
                    description: Intent kind.
                    type: string
                required:
                  - intent
                type: object
            description: A Verifier intent.
          minItems: 1
          type: array
        nonce:
          description: 32-byte nonce (4-byte Verifier salt ‖ 28 random bytes), standard base64.
          pattern: ^[A-Za-z0-9+/]{43}=$
          type: string
        signer_id:
          description: Intents account that signs (the payer).
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        verifying_contract:
          const: intents.near
          description: Verifier contract id.
          type: string
      required:
        - signer_id
        - verifying_contract
        - deadline
        - nonce
        - intents
      type: object
    IntentStreamEvent:
      additionalProperties: {}
      description: Payment intent status pushed to the checkout page.
      properties:
        amount_settled:
          description: Settled amount, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        id:
          description: payment_intent id (`pi_` + 26 base32 chars).
          examples:
            - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        late:
          description: Settled after expiry.
          type: boolean
        status:
          description: Payment intent status (domain-model §4.2).
          type: string
          x-extensible-enum:
            - requires_payment
            - processing
            - requires_review
            - succeeded
            - canceled
            - expired
      required:
        - id
        - status
        - amount_settled
        - late
      type: object
    IntentsRequirement:
      additionalProperties: {}
      description: "What a payer must sign: transfer(pay_to, amount) and transfer(fee_to, fee_amount), both with memo = binding."
      properties:
        amount:
          description: Amount the merchant receives, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        binding:
          description: Memo that both transfers must carry.
          pattern: ^np1:[1-9A-HJ-NP-Za-km-z]{43,44}$
          type: string
        deadline:
          description: Latest acceptable payload deadline.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        fee_amount:
          description: NearPay fee, base units, in the same asset.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        fee_to:
          description: NearPay treasury Intents account.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        pay_to:
          description: Merchant Intents account that receives the payment.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        token:
          description: Asset to transfer (equals the settlement asset).
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
      required:
        - pay_to
        - token
        - amount
        - fee_to
        - fee_amount
        - binding
        - deadline
      type: object
    Invitation:
      additionalProperties: {}
      description: An invitation to join the account with a role.
      properties:
        accepted_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When it was accepted.
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        email:
          description: Invited address; only a user with this email can accept.
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
          type: string
        expires_at:
          description: Expiry (7 days after sending).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        id:
          description: invitation id (`inv_` + 26 base32 chars).
          examples:
            - inv_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^inv_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        invited_by:
          description: user id (`usr_` + 26 base32 chars).
          examples:
            - usr_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^usr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        object:
          const: invitation
          description: Always `invitation`.
          type: string
        role:
          description: Role of a user in a merchant account.
          enum:
            - owner
            - admin
            - developer
            - finance
            - support
            - viewer
          type: string
        status:
          description: Invitation status.
          type: string
          x-extensible-enum:
            - pending
            - accepted
            - revoked
            - expired
      required:
        - id
        - object
        - created
        - email
        - role
        - status
        - invited_by
        - expires_at
        - accepted_at
      type: object
    InvitationList:
      additionalProperties: {}
      description: A page of invitations.
      properties:
        data:
          description: Objects on this page.
          items:
            $ref: "#/components/schemas/Invitation"
          type: array
        has_more:
          description: Whether more objects exist after this page.
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          description: Path of this list endpoint.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    Invoice:
      additionalProperties: {}
      description: A bill for a customer, paid on a hosted invoice page (FR-BIL-01).
      properties:
        amount_due:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Amount the customer owes in total (= `total`; no credits in v1).
        amount_paid:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Amount paid (`total` once paid, else 0).
        amount_remaining:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "`amount_due − amount_paid`."
        asset_id:
          anyOf:
            - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            - type: "null"
          description: Pricing asset when `currency` is `asset`.
        billing_reason:
          description: "Why the invoice exists: created by the merchant, the first invoice of a subscription, or a renewal."
          type: string
          x-extensible-enum:
            - manual
            - subscription_create
            - subscription_cycle
        checkout_session:
          anyOf:
            - description: checkout_session id (`cs_` + 26 base32 chars).
              examples:
                - cs_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^cs_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Open payments checkout session paying the invoice (created on demand by the hosted page).
        collection_method:
          description: "How the invoice is collected: `send_invoice` = the customer pays the hosted invoice; `auto_debit` (Stage 4) = billing's keeper collects it from the subscription's vault mandate, falling back to `send_invoice` (emailed) when the mandate cannot pay it (lld/billing.md §7.1, §14)."
          type: string
          x-extensible-enum:
            - send_invoice
            - auto_debit
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: ISO 4217 code for fiat pricing, or `asset` when priced in an asset (then `asset_id` is set).
        customer:
          description: Customer billed (owned by payments).
          examples:
            - cus_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cus_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        days_until_due:
          anyOf:
            - maximum: 365
              minimum: 0
              type: integer
            - type: "null"
          description: Days after finalize until due (when no fixed `due_date` was given).
        default_tax_rates:
          description: Tax rates applied to lines created without `tax_rates`.
          items:
            description: tax_rate id (`txr_` + 26 base32 chars).
            examples:
              - txr_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^txr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
          type: array
        description:
          description: Memo shown on the invoice.
          type:
            - string
            - "null"
        due_date:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When payment is due; set at finalize at the latest.
        footer:
          description: Footer shown on the invoice.
          type:
            - string
            - "null"
        hosted_invoice_url:
          anyOf:
            - description: Absolute URL.
              format: uri
              maxLength: 2048
              type: string
            - type: "null"
          description: Customer page `<pay origin>/i/<id>#<invoice secret>` (the secret is in the fragment); set once finalized. Always null in events and webhooks (secrets never travel on the bus).
        id:
          description: invoice id (`in_` + 26 base32 chars).
          examples:
            - in_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^in_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        invoice_pdf:
          anyOf:
            - description: Absolute URL.
              format: uri
              maxLength: 2048
              type: string
            - type: "null"
          description: API URL of the PDF (`GET /v1/invoices/{id}/pdf`, needs your credentials); null for drafts.
        lines:
          description: All lines (at most 100).
          items:
            $ref: "#/components/schemas/InvoiceLineItem"
          type: array
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        mandate:
          anyOf:
            - description: mandate id (`md_` + 26 base32 chars).
              examples:
                - md_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^md_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Mandate the keeper collects (or collected) this invoice from; null/absent when none (Stage 4).
        mandate_collection:
          anyOf:
            - additionalProperties: {}
              properties:
                fee:
                  description: NearPay fee taken by the vault.
                  pattern: ^(0|[1-9][0-9]{0,77})$
                  type: string
                mandate:
                  description: mandate id (`md_` + 26 base32 chars).
                  examples:
                    - md_01jbz9k3m4n5p6q7r8s9t0v1w2
                  pattern: ^md_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                  type: string
                merchant_share:
                  description: Tokens delivered to the merchant's Intents account.
                  pattern: ^(0|[1-9][0-9]{0,77})$
                  type: string
                period:
                  description: Vault period that paid the invoice.
                  maximum: 9007199254740991
                  minimum: 1
                  type: integer
                receipt_id:
                  description: Vault receipt that logged `collected` (the evidence, INV-2).
                  maxLength: 64
                  minLength: 1
                  type: string
                token:
                  description: Token received, as a NEAR Intents asset id.
                  examples:
                    - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
                  maxLength: 256
                  pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
                  type: string
                tx_hash:
                  description: NEAR transaction of the `collect`.
                  maxLength: 128
                  minLength: 8
                  type: string
              required:
                - mandate
                - period
                - token
                - merchant_share
                - fee
                - tx_hash
                - receipt_id
              type: object
            - type: "null"
          description: Set when the invoice was paid by a vault collection instead of a payment intent (Stage 4).
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Up to 50 key/value pairs (key ≤ 40 chars, value ≤ 500 chars) for your own use.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        next_reminder_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the next reminder goes out; null when none is due.
        number:
          anyOf:
            - maxLength: 32
              type: string
            - type: "null"
          description: Invoice number `<prefix>-<5+ digits>`, unique per account and mode, assigned at finalize; null for drafts.
        object:
          const: invoice
          description: Always `invoice`.
          type: string
        payment_intent:
          anyOf:
            - description: payment_intent id (`pi_` + 26 base32 chars).
              examples:
                - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Payment intent that paid the invoice.
        payment_intents:
          description: Every payment intent opened for the invoice, newest first. A settlement that arrives after the invoice is already paid or void (INV-3) stays listed here; refund it like an overpayment.
          items:
            description: payment_intent id (`pi_` + 26 base32 chars).
            examples:
              - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
          type: array
        period_end:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: End of the billed subscription period (exclusive).
        period_start:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Start of the billed subscription period.
        reminder_days:
          description: When reminders go out, in days relative to the due date (negative = before), strictly increasing, at most 10; `[]` sends none.
          items:
            description: Days relative to the due date (negative = before).
            maximum: 60
            minimum: -30
            type: integer
          maxItems: 10
          type: array
        reminders_sent:
          description: Reminders sent so far.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        sequence:
          description: Increases with every change; discard webhook objects with a lower sequence.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        settlement_destination:
          anyOf:
            - description: settlement_destination id (`sd_` + 26 base32 chars).
              examples:
                - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Destination the payment settles to; null = the account default when the payment session opens.
        status:
          description: "Invoice status (domain-model §4.5): `uncollectible` invoices can still be paid (INV-3)."
          type: string
          x-extensible-enum:
            - draft
            - open
            - paid
            - void
            - uncollectible
        status_transitions:
          additionalProperties: {}
          description: When status changes happened.
          properties:
            finalized_at:
              anyOf:
                - description: Unix time in seconds.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                - type: "null"
              description: Finalized (draft → open).
            marked_uncollectible_at:
              anyOf:
                - description: Unix time in seconds.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                - type: "null"
              description: Marked uncollectible.
            paid_at:
              anyOf:
                - description: Unix time in seconds.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                - type: "null"
              description: Paid.
            sent_at:
              anyOf:
                - description: Unix time in seconds.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                - type: "null"
              description: Last emailed to the customer.
            voided_at:
              anyOf:
                - description: Unix time in seconds.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                - type: "null"
              description: Voided.
          required:
            - finalized_at
            - sent_at
            - paid_at
            - voided_at
            - marked_uncollectible_at
          type: object
        subscription:
          anyOf:
            - description: subscription id (`sub_` + 26 base32 chars).
              examples:
                - sub_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^sub_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Subscription that produced the invoice.
        subtotal:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Σ line amounts as priced.
        tax:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Σ every tax amount (inclusive and exclusive).
        total:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "`subtotal` + exclusive taxes: what the customer pays."
        total_excluding_tax:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "`total − tax`."
        total_tax_amounts:
          description: Tax per rate across all lines (Σ of the per-line, already rounded amounts).
