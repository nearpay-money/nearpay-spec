            - attempt_in_flight
            - client_secret_invalid
            - session_not_open
            - too_many_attempts
            - route_too_slow
            - refund_address_invalid
            - geo_blocked
            - intent_invalid
            - insufficient_balance
            - rail_unavailable
            - route_unavailable
            - pricing_unavailable
            - deadline_too_short
            - quote_rejected
            - quote_integrity_failed
            - ticket_invalid
            - attestation_refused
            - attestation_stale
            - attestation_unavailable
            - destination_not_intents_account
            - amount_below_minimum
            - screening_unavailable
            - url_invalid
            - event_type_unknown
            - last_owner
            - member_exists
            - invitation_invalid
            - approver_conflict
            - two_person_required
            - authenticator_not_allowed
            - kyb_profile_incomplete
            - intent_not_succeeded
            - attempt_not_settled
            - amount_exceeds_refundable
            - leg_expired
            - signed_intent_mismatch
            - review_requires_evidence
            - link_inactive
            - customer_deleted
            - reconciliation_day_open
            - fx_rate_unavailable
            - currency_mismatch
            - interval_mismatch
            - price_inactive
            - price_type_invalid
            - tax_rate_inactive
            - tax_rates_mixed
            - invoice_empty
