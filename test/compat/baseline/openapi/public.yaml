          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        paymentFlow:
          const: upfront
          description: The client deposits before the resource is served.
          type: string
        refundDeadline:
          description: "Quoted entry only: deposits not swapped by then are refunded to `refundTo`; deposit early enough to confirm before it."
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        slippageTolerance:
          $ref: "#/components/schemas/X402SlippageRange"
          description: "NearPay: accepted `slippageTolerance` range."
      required:
        - assetTransferMethod
        - paymentFlow
        - destination
      type: object
    X402NearIntentsPaymentPayload:
