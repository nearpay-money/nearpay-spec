  /v1/events/stream:
    get:
      description: |-
        Frames: `event: ready` once (`EventStreamReady`), then `event: event` per public event (`Event`, rendered in the latest API version, exactly the object `GET /v1/events/{id}` returns) with `id: <evt_…>`; `event: reset` (`EventStreamReset`) when a resume cursor cannot be honoured. A comment heartbeat every 15 s; `retry: 3000`.

        Resume: `Last-Event-ID` (sent by `EventSource` on reconnect) or `starting_after` (the header wins) replays every later event of the last 30 days in id order, then continues live; without a cursor the stream is live only. Delivery is at-least-once in id order: dedupe by `id`.

        Mode comes from the credential (INV-8): API keys stream **test mode only** (a live key is `403 livemode_forbidden`); dashboard sessions stream the mode of `NearPay-Mode`. At most 5 concurrent streams per account and mode (`429 rate_limited`). The server closes a stream after 1 h, and closes a client that does not read (more than 1 MiB unsent for 30 s); reconnect with `Last-Event-ID`.

        Streamed events are not webhook deliveries: they are neither signed nor retried, and do not affect endpoints.
      operationId: streamEvents
      parameters:
        - description: Comma-separated event types, or `*` (default). A type that is not a webhook type is `400 event_type_unknown` (`param types[i]`).
          in: query
          name: types
          schema:
            description: Comma-separated event types, or `*` (default). A type that is not a webhook type is `400 event_type_unknown` (`param types[i]`).
            maxLength: 4096
            minLength: 1
            type: string
        - description: Resume after this event (ignored when `Last-Event-ID` is sent).
          in: query
          name: starting_after
          schema:
            description: Resume after this event (ignored when `Last-Event-ID` is sent).
            examples:
              - evt_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^evt_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
        - description: Resume after this event (set by `EventSource` on reconnect).
          in: header
          name: last-event-id
          schema:
            description: Resume after this event (set by `EventSource` on reconnect).
            examples:
              - evt_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^evt_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
        - description: "API version (default: the account's pinned version)."
          in: header
          name: NearPay-Version
          schema:
            description: "API version (default: the account's pinned version)."
            type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/EventStreamReady"
                  - $ref: "#/components/schemas/Event"
                  - $ref: "#/components/schemas/EventStreamReset"
                description: "`data:` payload of each event; the `event:` name selects the schema."
          description: New events as server-sent events (CLI `listen`, dashboard live tail).
          x-sse-events:
            - ready
            - event
            - reset
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `event_type_unknown`."
          x-error-codes:
            - event_type_unknown
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `livemode_forbidden`."
