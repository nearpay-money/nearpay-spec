          type: integer
        status:
          description: "Mandate status (domain-model §4.5): `active` = on-chain active with at least one period funded; `insufficient` = on-chain active but the balance is below one period (top up, or the due invoice falls back to `send_invoice`); `exhausted` = `max_periods` collected; `canceled` = canceled by the payer or the merchant receiver."
          type: string
          x-extensible-enum:
            - active
            - insufficient
            - exhausted
            - canceled
        token:
          description: Token contract.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        token_asset:
          $ref: "#/components/schemas/PricingAssetDisplay"
          description: Display data of `token` (asset id, symbol, decimals) for the hosted page. Spec 0.4.1; absent from older billing builds.
        top_up_msg:
          description: "`ft_transfer_call` msg to top up (`{\"top_up\":{\"mandate_id\":n}}`) while on-chain active; send it to the vault from the payer's account with any amount."
          type:
            - string
            - "null"
        transactions:
          additionalProperties: {}
          description: Payer transactions the page offers.
          properties:
            cancel:
              anyOf:
                - $ref: "#/components/schemas/NearTransactionRequest"
                - type: "null"
              description: "`cancel` signed by the payer (100 Tgas, 1 yoctoNEAR); null unless on-chain active."
            withdraw:
              anyOf:
                - $ref: "#/components/schemas/NearTransactionRequest"
                - type: "null"
              description: "`withdraw` signed by the payer after cancel/exhaustion while a balance remains; null otherwise."
          required:
            - cancel
            - withdraw
          type: object
        vault_contract:
          description: Vault account.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
      required:
        - id
        - object
        - livemode
        - status
        - link_status
        - payer
        - vault_contract
        - onchain_id
        - token
        - asset_id
        - amount_per_period
        - period_secs
        - balance
        - funded_periods
        - collected_periods
        - next_collect_at
        - collecting
        - top_up_msg
        - transactions
      type: object
    PublicPaymentLink:
      additionalProperties: {}
      description: A payment link as the payer sees it (no PII, no address).
      properties:
        active:
          description: False when the link no longer accepts payments (inactive or used up).
          type: boolean
        amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "Fiat: integer minor units. Asset: base units as a decimal string."
        asset_id:
          anyOf:
            - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            - type: "null"
          description: Pricing asset when `currency` is `asset`.
        collect_email:
          description: Ask the payer for a receipt email before opening the session.
          type: boolean
        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: ISO 4217 code for fiat pricing, or `asset` when priced in an asset (then `asset_id` is set).
        display:
          additionalProperties: {}
          description: What the payer is paying for.
          properties:
            description:
              description: What the payer pays for.
              type: string
            merchant_name_unverified:
              description: Merchant display name (not authenticated; the attested name comes from sentinel per attempt).
              type: string
          required:
            - merchant_name_unverified
            - description
          type: object
        id:
          description: payment_link id (`plink_` + 26 base32 chars).
          examples:
            - plink_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^plink_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        object:
          const: payment_link
          description: Always `payment_link`.
          type: string
        pricing_asset:
          anyOf:
            - $ref: "#/components/schemas/PricingAssetDisplay"
            - type: "null"
          description: Display data of the pricing asset when `currency` is `asset`; null for fiat pricing. Spec 0.2.1.
        settlement:
          anyOf:
            - additionalProperties: {}
              properties:
                asset_id:
                  description: Asset the merchant receives.
                  examples:
                    - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
                  maxLength: 256
                  pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
                  type: string
                chain:
                  description: Chain the merchant receives on.
                  examples:
                    - eip155:8453
                  pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
                  type: string
                type:
                  description: "Where funds settle: an address on a chain, or a NEAR Intents account."
                  enum:
                    - chain_address
                    - intents_account
                  type: string
              required:
                - asset_id
                - chain
                - type
              type: object
            - type: "null"
          description: How the merchant is paid (never the raw address); null when no destination is usable now.
      required:
        - id
        - object
        - livemode
        - active
        - amount
        - currency
        - asset_id
        - display
        - settlement
        - collect_email
      type: object
    PublicReview:
      additionalProperties: {}
      description: A compliance review of a payment or destination (the payment stands).
      properties:
        closed_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the review closed.
        created:
          description: When the review opened.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        id:
          description: compliance_case id (`case_` + 26 base32 chars).
          examples:
            - case_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^case_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        object:
          const: review
          description: Always `review`.
          type: string
        reason:
          description: Why the review opened.
          type: string
          x-extensible-enum:
            - post_screen_hit
            - held_execution
            - audit_mismatch
            - screening_hit
        status:
          description: Review status.
          type: string
          x-extensible-enum:
            - open
            - closed
        subject:
          additionalProperties: {}
          description: What is under review.
          properties:
            id:
              description: Reviewed object id (`pi_…`, `ap_…` or `sd_…`).
              type: string
            type:
              description: Reviewed object type.
              type: string
              x-extensible-enum:
                - payment_intent
                - agent_payment
                - settlement_destination
          required:
            - type
            - id
          type: object
      required:
        - id
        - object
        - created
        - livemode
        - subject
        - reason
        - status
        - closed_at
      type: object
    RawEd25519MultiPayload:
      additionalProperties: {}
      description: Payload signed with raw ed25519.
      properties:
        payload:
          description: JSON string of `IntentMessage`.
          minLength: 2
          type: string
        public_key:
          description: ed25519 key of the signer.
          pattern: ^(ed25519|secp256k1):[1-9A-HJ-NP-Za-km-z]{32,90}$
          type: string
        signature:
          description: ed25519 signature over the UTF-8 payload.
          pattern: ^(ed25519|secp256k1):[1-9A-HJ-NP-Za-km-z]{64,100}$
          type: string
        standard:
          const: raw_ed25519
          description: Raw ed25519 over the payload bytes (agents).
          type: string
      required:
        - standard
        - payload
        - public_key
        - signature
      type: object
    Refund:
      additionalProperties: {}
      description: Money returned to a payer, signed by the merchant (non-custodial).
      properties:
        amount:
          description: Refunded amount, base units of `asset_id`.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        amount_received:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: What the payer received, base units of `recipient.asset_id` (from evidence).
        asset_id:
          description: Settlement asset the amount is in.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        canceled_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the merchant canceled.
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        decimals:
          description: Decimals of `asset_id`.
          maximum: 255
          minimum: 0
          type: integer
        evidence:
          anyOf:
            - $ref: "#/components/schemas/Evidence"
            - type: "null"
          description: Payer-side evidence of the leg that refunded the payer (INV-2).
        extra_amount_sent:
          description: Settlement-asset amount sent by duplicate legs (signed and sent after another leg had refunded the payer); `0` normally.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        failure_code:
          description: Why the refund failed (the last leg's code).
          type:
            - string
            - "null"
        fee_mode:
          description: "`payer_absorbs` (default, `EXACT_INPUT`): the merchant sends `amount`, the payer receives it minus route costs. `merchant_absorbs` (`EXACT_OUTPUT`): the payer receives the equivalent of `amount`; the merchant sends slightly more."
          enum:
            - payer_absorbs
            - merchant_absorbs
          type: string
        id:
          description: refund id (`re_` + 26 base32 chars).
          examples:
            - re_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^re_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        legs:
          description: Legs, newest first.
          items:
            $ref: "#/components/schemas/RefundLeg"
          type: array
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Up to 50 key/value pairs (key ≤ 40 chars, value ≤ 500 chars) for your own use.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        method:
          description: "`route_quote`: a 1Click route back to the payer's origin chain and asset. `intents_transfer`: a merchant-signed Verifier transfer to the payer's Intents account (refund of an `intents_transfer` payment; no route provider)."
          type: string
          x-extensible-enum:
            - route_quote
            - intents_transfer
        next_action:
          anyOf:
            - $ref: "#/components/schemas/RefundNextAction"
            - type: "null"
          description: Present in `requires_action` once the current leg is prepared; null while it is being prepared and in every other status.
        object:
          const: refund
          description: Always `refund`.
          type: string
        payment_attempt:
          description: Attempt whose settlement is refunded (the paying attempt, or an overpayment).
          examples:
            - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        payment_intent:
          description: payment_intent id (`pi_` + 26 base32 chars).
          examples:
            - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        reason:
          anyOf:
            - description: Why the merchant refunds.
              type: string
              x-extensible-enum:
                - requested_by_customer
                - duplicate
                - fraudulent
                - overpayment
                - other
            - type: "null"
        recipient:
          $ref: "#/components/schemas/RefundRecipient"
        sequence:
          description: Increases with every change; discard webhook objects with a lower sequence.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        source:
          description: What created the refund.
          type: string
          x-extensible-enum:
            - api
            - dashboard
            - review_rejection
        status:
          description: "Refund status (domain-model §4.4): `requires_action` = waiting for the merchant's signature; `pending` = the merchant's funds were detected and are on their way; `failed` = the provider returned them to the merchant (prepare again to retry)."
          type: string
          x-extensible-enum:
            - requires_action
            - pending
            - succeeded
            - failed
            - canceled
        succeeded_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the payer-side evidence was verified.
      required:
        - id
        - object
        - created
        - livemode
        - status
        - payment_intent
        - payment_attempt
        - amount
        - asset_id
        - decimals
        - fee_mode
        - reason
        - method
        - recipient
        - next_action
        - legs
        - amount_received
        - evidence
        - extra_amount_sent
        - source
        - failure_code
        - succeeded_at
        - canceled_at
        - sequence
        - metadata
      type: object
    RefundCreate:
      additionalProperties: false
      description: Parameters to create a refund.
      properties:
        amount:
          description: Amount in base units of the settlement asset; default everything still refundable.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        fee_mode:
          default: payer_absorbs
          description: "`payer_absorbs` (default, `EXACT_INPUT`): the merchant sends `amount`, the payer receives it minus route costs. `merchant_absorbs` (`EXACT_OUTPUT`): the payer receives the equivalent of `amount`; the merchant sends slightly more."
          enum:
            - payer_absorbs
            - merchant_absorbs
          type: string
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Up to 50 key/value pairs (key ≤ 40 chars, value ≤ 500 chars) for your own use.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        payment_attempt:
          description: Refund this settled attempt (e.g. an overpayment) instead of the attempt that paid the intent.
          examples:
            - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        payment_intent:
          description: Payment intent to refund.
          examples:
            - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        reason:
          description: Why the merchant refunds.
          type: string
          x-extensible-enum:
            - requested_by_customer
            - duplicate
            - fraudulent
            - overpayment
            - other
      required:
        - payment_intent
      type: object
    RefundLeg:
      additionalProperties: {}
      description: One prepared route or transfer for a refund.
      properties:
        amount:
          description: What the merchant sends, base units of the settlement asset.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        amount_out_expected:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: What the payer is expected to receive, base units of the recipient asset (route estimate).
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        deadline:
          description: Sign and send before this time.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        duplicate:
          description: Settled after another leg had already refunded the payer (recorded in `extra_amount_sent`).
          type: boolean
        evidence:
          anyOf:
            - $ref: "#/components/schemas/Evidence"
            - type: "null"
          description: Payer-side evidence once verified (INV-2).
        failure_code:
          description: Why the leg failed, returned or was held.
          type:
            - string
            - "null"
        method:
          description: "`route_quote`: a 1Click route back to the payer's origin chain and asset. `intents_transfer`: a merchant-signed Verifier transfer to the payer's Intents account (refund of an `intents_transfer` payment; no route provider)."
          type: string
          x-extensible-enum:
            - route_quote
            - intents_transfer
        number:
          description: Leg number, 1-based; a re-prepared refund gets a new leg.
          maximum: 9007199254740991
          minimum: 1
          type: integer
        status:
          description: "Leg status: `returned` = the provider sent the funds back to the merchant destination; `expired` = the deadline passed without a deposit."
          type: string
          x-extensible-enum:
            - awaiting_signature
            - submitted
            - processing
            - succeeded
            - returned
            - failed
            - expired
            - held
        submitted_tx:
          anyOf:
            - description: Transaction hash in the chain's text form.
              maxLength: 128
              minLength: 8
              type: string
            - type: "null"
          description: Transaction the merchant reported, or the relayed Intents transaction.
        swap_type:
          anyOf:
            - description: How the route leg was quoted.
              enum:
                - EXACT_INPUT
                - EXACT_OUTPUT
              type: string
            - type: "null"
          description: "Route legs: how the quote was made; null for Intents transfers."
      required:
        - number
        - status
        - method
        - swap_type
        - amount
        - amount_out_expected
        - deadline
        - submitted_tx
        - duplicate
        - evidence
        - failure_code
        - created
      type: object
    RefundList:
      additionalProperties: {}
      description: A page of refunds.
      properties:
        data:
          description: Objects on this page.
          items:
            $ref: "#/components/schemas/Refund"
          type: array
        has_more:
          description: Whether more objects exist after this page.
          type: boolean
        object:
          const: list
