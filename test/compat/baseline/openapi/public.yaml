      operationId: x402NearIntentsRequirements
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                amount:
                  description: Exact amount the merchant receives, base units of the asset.
                  pattern: ^(0|[1-9][0-9]{0,77})$
                  type: string
                asset_id:
                  description: "Asset; default: the asset of the default Intents destination."
                  examples:
                    - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
                  maxLength: 256
                  pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
                  type: string
                include_intents_transfer:
                  default: true
                  description: Also return the `intents-transfer` entry first (`max_timeout_s` applies to it).
                  type: boolean
                max_timeout_s:
                  default: 120
                  description: "`intents-transfer` settlement window, seconds."
                  maximum: 300
                  minimum: 30
                  type: integer
                origins:
                  description: Origins to offer, one unquoted entry each (duplicates refused).
                  items:
                    additionalProperties: false
                    description: An origin the payer may pay from.
                    properties:
                      asset_id:
                        description: Origin asset the payer may deposit (NEAR Intents id, from `GET /v1/assets`).
                        examples:
                          - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
                        maxLength: 256
                        pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
                        type: string
                      max_timeout_s:
                        description: Deposit window; default and minimum come from the origin chain's profile.
                        maximum: 86400
                        minimum: 60
                        type: integer
                    required:
                      - asset_id
                    type: object
                  maxItems: 20
                  minItems: 1
                  type: array
                pay_to:
                  description: Merchant Intents account; must be an active Intents destination.
                  pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
                  type: string
                quote_window_s:
                  default: 300
                  description: How long the unquoted entries can be quoted (`extra.deadline`), seconds.
                  maximum: 900
                  minimum: 30
                  type: integer
                resource:
                  additionalProperties: false
                  description: The resource being paid for.
                  properties:
                    description:
                      description: What is being paid for.
                      maxLength: 500
                      type: string
                    mimeType:
                      description: MIME type.
                      maxLength: 100
                      type: string
                    url:
                      description: Resource URL.
                      format: uri
                      type: string
                  required:
                    - url
                  type: object
              required:
                - resource
                - amount
                - origins
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/X402PaymentRequiredAny"
          description: Issue single-use requirements for one 402 response, with cross-chain (`near-intents`) entries.
        "400":
