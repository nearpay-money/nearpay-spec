components:
  schemas:
    Account:
      additionalProperties: {}
      description: A merchant account.
      properties:
        api_version:
          description: API version pinned for this account.
          enum:
            - 2026-11-01
          type: string
        country:
          anyOf:
            - description: ISO 3166-1 alpha-2 country code, upper-case.
              pattern: ^[A-Z]{2}$
              type: string
            - type: "null"
          description: Country of the merchant.
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        display_name:
          description: Name shown to payers until KYB verifies a legal name.
          maxLength: 100
          minLength: 1
          type: string
        fee_bearer:
          description: "Who bears NearPay's fee: the payer pays it on top (default) or it is deducted from the settlement."
          enum:
            - payer
            - merchant
          type: string
        id:
          description: account id (`acct_` + 26 base32 chars).
          examples:
            - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        kyb_status:
          description: KYB status.
          type: string
          x-extensible-enum:
            - not_started
            - pending
            - needs_info
            - approved
            - rejected
        live_enabled:
          description: "Live mode is enabled: KYB approved, an active live destination, status active."
          type: boolean
        object:
          const: account
          description: Always `account`.
          type: string
        settings:
          $ref: "#/components/schemas/AccountSettings"
        status:
          description: Account status.
          type: string
          x-extensible-enum:
            - active
            - suspended
            - closed
        verified_legal_name:
          description: Legal name approved by NearPay's KYB review (self-declared business details reviewed by ops), shown on checkout once set.
          type:
            - string
            - "null"
        website:
          anyOf:
            - description: Absolute URL.
              format: uri
              maxLength: 2048
              type: string
            - type: "null"
          description: Merchant website (account setting, shown in the dashboard and receipts); absent from older servers.
      required:
        - id
        - object
        - created
        - display_name
        - verified_legal_name
        - country
        - status
        - kyb_status
        - live_enabled
        - fee_bearer
        - api_version
        - settings
      type: object
    AccountRequirements:
      additionalProperties: {}
      description: What an account still needs to go live (FR-ACC-05).
      properties:
        live_enabled:
          description: Whether live mode is enabled.
          type: boolean
        missing:
          description: What is still needed before live mode is enabled.
          items:
            description: A missing live-mode requirement.
            type: string
            x-extensible-enum:
              - kyb
              - destination
              - account_status
          type: array
        object:
          const: account_requirements
          description: Always `account_requirements`.
          type: string
      required:
        - object
        - live_enabled
        - missing
      type: object
    AccountSettings:
      additionalProperties: {}
      description: Merchant settings that change checkout behaviour.
      properties:
        branding:
          additionalProperties: {}
          description: Checkout branding.
          properties:
            accent_color:
              anyOf:
                - pattern: ^#[0-9a-fA-F]{6}$
                  type: string
                - type: "null"
              description: Accent colour `#RRGGBB`.
            corner_radius:
              description: Corner radius of checkout cards and controls, px (default 8); absent from older servers.
              maximum: 24
              minimum: 0
              type: integer
            logo_url:
              anyOf:
                - description: Absolute URL.
                  format: uri
                  maxLength: 2048
                  type: string
                - type: "null"
              description: HTTPS URL of a square logo.
            theme:
              description: Checkout colour scheme (default `auto`); absent from older servers.
              type: string
              x-extensible-enum:
                - auto
                - light
                - dark
          required:
            - accent_color
            - logo_url
          type: object
        email_receipts:
          description: Email a receipt to the customer when a payment succeeds.
          type: boolean
        late_payments:
          description: Accept settlements that arrive after a session expired (INV-3); default false.
          type: boolean
        session_ttl_default:
          description: Default checkout-session lifetime in seconds.
          maximum: 86400
          minimum: 300
          type: integer
        underpay_tolerance_bps:
          description: Accept short settlements within this tolerance (0–100 bps); default 0.
          maximum: 10000
          minimum: 0
          type: integer
      required:
        - late_payments
        - underpay_tolerance_bps
        - session_ttl_default
        - email_receipts
        - branding
      type: object
    AgentPayRequirements:
      additionalProperties: {}
      description: What an agent must sign to pay a checkout session. Agents MUST obtain and verify a sentinel attestation for `requirement` before signing.
      properties:
        attempt_id:
          description: payment_attempt id (`pa_` + 26 base32 chars).
          examples:
            - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        attestation_ticket:
          description: "`base64url(JCS payload).base64url(Ed25519 signature)` issued by payments; pass it to sentinel unchanged."
          pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
          type: string
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        object:
          const: agent_pay_requirements
          description: Always `agent_pay_requirements`.
          type: string
        requirement:
          $ref: "#/components/schemas/IntentsRequirement"
      required:
        - object
        - livemode
        - attempt_id
        - attestation_ticket
        - requirement
      type: object
    AgentPaySubmission:
      additionalProperties: {}
      description: An accepted agent payment for a checkout session.
      properties:
        agent_payment:
          description: agent_payment id (`ap_` + 26 base32 chars).
          examples:
            - ap_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^ap_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        attempt:
          $ref: "#/components/schemas/PayerAttempt"
        object:
          const: agent_pay_submission
          description: Always `agent_pay_submission`.
          type: string
        status:
          const: submitted
          description: The payload was queued for relay.
          type: string
      required:
        - object
        - status
        - agent_payment
        - attempt
      type: object
    AgentPayment:
      additionalProperties: {}
      description: A payer-signed NEAR Intents payment relayed by NearPay.
      properties:
        amount:
          description: Amount to the merchant, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          description: Asset.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        binding:
          description: Binding memo `np1:` + base58(sha256(…)) tying a signed transfer to one requirement.
          pattern: ^np1:[1-9A-HJ-NP-Za-km-z]{43,44}$
          type: string
        block_height:
          anyOf:
            - maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Block of the transaction.
        checkout_session:
          anyOf:
            - description: checkout_session id (`cs_` + 26 base32 chars).
              examples:
                - cs_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^cs_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Checkout session paid (checkout kind).
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        error_reason:
          description: Why it failed.
          type:
            - string
            - "null"
        fee_amount:
          description: NearPay fee, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        id:
          description: agent_payment id (`ap_` + 26 base32 chars).
          examples:
            - ap_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^ap_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        kind:
          description: What the signed payload paid for.
          type: string
          x-extensible-enum:
            - x402
            - checkout
            - refund
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        object:
          const: agent_payment
          description: Always `agent_payment`.
          type: string
        origin:
          anyOf:
            - $ref: "#/components/schemas/AgentPaymentOrigin"
            - type: "null"
          description: "`near-intents` only (null otherwise): the cross-chain deposit. For `near-intents`, `payer` is the NEAR Intents account that delivered the funds to `pay_to` (from the evidence), `amount` the delivered amount and `fee_amount` `0` (NearPay's fee is taken from the deposit: `origin.fee`). Spec 0.3.0."
        pay_to:
          description: "Receiving Intents account: the merchant (`x402`, `checkout`) or, for a `refund`, the payer's Intents account or the 1Click deposit account of a route refund."
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        payer:
          description: "Intents account that signed: the payer (`x402`, `checkout`) or, for a `refund`, the merchant's Intents destination sending the refund."
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        refund:
          anyOf:
            - description: refund id (`re_` + 26 base32 chars).
              examples:
                - re_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^re_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Refund this payload pays a leg of (`refund` kind); null otherwise. Spec 0.2.1.
        resource_url:
          anyOf:
            - format: uri
              type: string
            - type: "null"
          description: Paid resource (x402).
        sequence:
          description: Increases with every change; discard webhook objects with a lower sequence. Servers MUST send it (optional in the 0.1.x schema only so readers built on 0.1.4 stay compatible).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        settled_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When it settled (final).
        status:
          description: Relay status.
          type: string
          x-extensible-enum:
            - verified
            - queued
            - submitted
            - settled
            - failed
        transfer_method:
          description: "How the payment reached the merchant: a payer-signed Verifier payload (`intents-transfer`) or a cross-chain 1Click deposit (`near-intents`, kind `x402` only). Absent from servers older than spec 0.3.0 (= `intents-transfer`)."
          type: string
          x-extensible-enum:
            - intents-transfer
            - near-intents
        tx_hash:
          anyOf:
            - description: Transaction hash in the chain's text form.
              maxLength: 128
              minLength: 8
              type: string
            - type: "null"
          description: NEAR transaction that executed the payload.
      required:
        - id
        - object
        - created
        - livemode
        - kind
        - status
        - payer
        - pay_to
        - asset_id
        - amount
        - fee_amount
        - binding
        - resource_url
        - checkout_session
        - tx_hash
        - block_height
        - error_reason
        - settled_at
      type: object
    AgentPaymentList:
      additionalProperties: {}
      description: A page of agent payments.
      properties:
        data:
          description: Objects on this page.
          items:
            $ref: "#/components/schemas/AgentPayment"
          type: array
        has_more:
          description: Whether more objects exist after this page.
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          description: Path of this list endpoint.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    AgentPaymentOrigin:
      additionalProperties: {}
      description: The cross-chain deposit behind a `near-intents` agent payment.
      properties:
        amount_in:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: What the payer deposited, base units of `asset_id`; null if not reported.
        asset_id:
          description: Origin asset (NEAR Intents id).
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        deposit_address:
          description: 1Click deposit address the payer paid.
          maxLength: 256
          minLength: 1
          type: string
        deposit_memo:
          description: Deposit memo, if the origin network needs one.
          type:
            - string
            - "null"
        fee:
          anyOf:
            - additionalProperties: {}
              properties:
                amount:
                  description: Fee, base units of `asset_id`.
                  pattern: ^(0|[1-9][0-9]{0,77})$
                  type: string
                asset_id:
                  description: Asset the fee was taken in.
                  examples:
                    - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
                  maxLength: 256
                  pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
                  type: string
              required:
                - amount
                - asset_id
              type: object
            - type: "null"
          description: NearPay's fee as observed for the route (provider app fee); null when not reported.
        network:
          description: Origin network (CAIP-2) the payer deposited on.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        refund_to:
          description: The payer's refund address on the origin network (from the quote payload).
          maxLength: 256
          minLength: 1
          type: string
        tx_hashes:
          description: Deposit transactions on the origin network.
          items:
            description: Transaction hash in the chain's text form.
            maxLength: 128
            minLength: 8
            type: string
          type: array
      required:
        - network
        - asset_id
        - amount_in
        - refund_to
        - deposit_address
        - deposit_memo
        - tx_hashes
        - fee
      type: object
    ApiKey:
      additionalProperties: {}
      description: An API key record (the secret itself is shown once).
      properties:
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        display_prefix:
          description: Key prefix, e.g. `sk_live_`.
          type: string
        expires_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Expiry, if set.
        id:
          description: api_key id (`key_` + 26 base32 chars).
          examples:
            - key_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^key_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        ip_allowlist:
          description: CIDR ranges allowed to use the key; empty = any.
          items:
            type: string
          type: array
        last4:
          description: Last four characters of the key.
          maxLength: 4
          minLength: 4
          type: string
        last_used_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Last use (updated at most every minute).
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        name:
          description: Name given when the key was created.
          type: string
        object:
          const: api_key
          description: Always `api_key`.
          type: string
        scopes:
          description: Scopes of a restricted key; empty for secret and publishable keys.
          items:
            type: string
          type: array
        secret:
          description: The full key. Returned only once, when the key is created or rolled.
          pattern: ^(sk|pk|rk)_(live|test)_[0-9A-Za-z]{48}$
          type: string
        type:
          description: Key type.
          type: string
          x-extensible-enum:
            - secret
            - publishable
            - restricted
      required:
        - id
        - object
        - created
        - livemode
        - type
        - name
        - display_prefix
        - last4
        - scopes
        - ip_allowlist
        - expires_at
        - last_used_at
      type: object
    ApiKeyList:
      additionalProperties: {}
      description: A page of API keys.
      properties:
        data:
          description: Objects on this page.
          items:
            $ref: "#/components/schemas/ApiKey"
          type: array
        has_more:
          description: Whether more objects exist after this page.
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          description: Path of this list endpoint.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    Asset:
      additionalProperties: {}
      description: An asset NearPay can price, route and settle.
      properties:
        asset_id:
          description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        chain:
          description: Chain the asset lives on.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        decimals:
          description: Decimals.
          maximum: 255
          minimum: 0
          type: integer
        family:
          description: Asset family for same-asset routing (`USDC`, `USDT`, `ETH`, …).
          type: string
        is_usd_stable:
          description: A USD stablecoin.
          type: boolean
        object:
          const: asset
          description: Always `asset`.
          type: string
        symbol:
          description: Token symbol.
          type: string
      required:
        - asset_id
        - object
        - chain
        - symbol
        - decimals
        - family
        - is_usd_stable
      type: object
    AssetList:
      additionalProperties: {}
      description: All enabled assets.
      properties:
        data:
          description: Enabled assets.
          items:
            $ref: "#/components/schemas/Asset"
          type: array
        has_more:
          const: false
          description: Always `false` (not paginated).
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          const: /v1/assets
          description: Path.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    Attestation:
      additionalProperties: {}
      description: What sentinel vouches for.
      properties:
        asset:
          additionalProperties: {}
          description: "Display data of the asset the payer sends, attested so checkout renders `amount_in` with signed decimals (CR-15-07, spec 0.2.0). Optional: older sentinels omit it."
          properties:
            asset_id:
              description: Asset the payer sends (`deposit.origin_asset_id` or `requirement.token`).
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            decimals:
              description: Token decimals from sentinel's own registry read.
              maximum: 255
              minimum: 0
              type: integer
            symbol:
              description: Token symbol from sentinel's own registry read.
              maxLength: 32
              minLength: 1
              type: string
            token:
              anyOf:
                - $ref: "#/components/schemas/TokenContract"
                - type: "null"
              description: Token contract from sentinel's own registry read (signed, so the wallet path transfers the attested contract); null when the registry has none (manual path). Spec 0.2.1.
          required:
            - asset_id
            - symbol
            - decimals
          type: object
        attempt_id:
          description: payment_attempt id (`pa_` + 26 base32 chars).
          examples:
            - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        deposit:
          $ref: "#/components/schemas/AttestedDeposit"
          description: Present for `route_quote`.
        destination:
          additionalProperties: {}
          description: Matched settlement destination.
          properties:
            asset_id:
              description: Settlement asset.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            chain:
              description: Settlement chain.
              examples:
                - eip155:8453
              pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
              type: string
            fingerprint:
              description: Destination fingerprint (also shown in the merchant dashboard).
              pattern: ^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{2}$
              type: string
          required:
            - asset_id
            - chain
            - fingerprint
          type: object
        expires_at:
          description: Expiry; never after the deposit/payload deadline.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        issued_at:
          description: Issue time.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        kind:
          description: What is being attested.
          enum:
            - route_quote
            - intents_transfer
          type: string
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        merchant:
          additionalProperties: {}
          description: Who receives the payment.
          properties:
            kyb_verified:
              description: Whether `name` is KYB-verified.
              type: boolean
            name:
              description: Merchant name (KYB-verified legal name when available).
              type: string
          required:
            - name
            - kyb_verified
          type: object
        requirement:
          $ref: "#/components/schemas/IntentsRequirement"
          description: Present for `intents_transfer`.
        v:
          const: 1
          description: Attestation format version.
          type: number
      required:
        - v
        - kind
        - attempt_id
        - livemode
        - merchant
        - destination
        - issued_at
        - expires_at
      type: object
    AttestationChallenge:
      additionalProperties: {}
      description: Message proving control of a settlement destination (FR-SET-02).
      properties:
        expires_at:
          description: Challenge expiry (10 minutes).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        id:
          description: attestation_challenge id (`chl_` + 26 base32 chars).
          examples:
            - chl_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^chl_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        message:
          description: Exact UTF-8 message the destination key must sign.
          type: string
        nonce:
          anyOf:
            - pattern: ^[A-Za-z0-9+/]{43}=$
              type: string
            - type: "null"
          description: NEP-413 nonce (32 bytes, base64); null for other standards.
        recipient:
          description: NEP-413 recipient (`nearpay.money`); null for other standards.
          type:
            - string
            - "null"
        signing_standard:
          description: How to sign the message.
          type: string
          x-extensible-enum:
            - nep413
            - eip191
            - solana
            - bip322
      required:
        - id
        - message
        - signing_standard
        - nonce
        - recipient
        - expires_at
      type: object
    AttestedDeposit:
      additionalProperties: {}
      description: Deposit instructions as attested.
      properties:
        address:
          description: Deposit address.
          maxLength: 256
          minLength: 1
          type: string
        amount_in:
          description: Amount to send, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        chain:
          description: Origin chain.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        deadline:
          description: Deposit deadline.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        memo:
          description: Deposit memo, or null.
          type:
            - string
            - "null"
        origin_asset_id:
          description: Asset to send.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
      required:
        - address
        - memo
        - chain
        - origin_asset_id
        - amount_in
        - deadline
      type: object
    AuditEvent:
      additionalProperties: {}
      description: An append-only audit record (identity §12).
      properties:
        account:
          anyOf:
            - description: account id (`acct_` + 26 base32 chars).
              examples:
                - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Account the action concerns; null for platform actions.
        action:
          description: Action, e.g. `destination.created`, `member.invited`, `api_key.rolled`.
          type: string
        actor:
          additionalProperties: {}
          description: Who performed the action.
          properties:
            id:
              description: "`usr_…` (user or operator), `key_…`, a service name or `system`."
              type: string
            type:
              description: Who acted.
              type: string
              x-extensible-enum:
                - user
                - api_key
                - operator
                - service
                - system
          required:
            - type
            - id
          type: object
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        details:
          additionalProperties: {}
          description: Action details (no secrets, no personal data beyond ids).
          propertyNames:
            type: string
          type: object
        id:
          description: audit_event id (`aud_` + 26 base32 chars).
          examples:
            - aud_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^aud_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        object:
          const: audit_event
          description: Always `audit_event`.
          type: string
        target:
          anyOf:
            - additionalProperties: {}
              properties:
                id:
                  description: Object id.
                  type: string
                type:
                  description: Object type.
                  type: string
              required:
                - type
                - id
              type: object
            - type: "null"
          description: Object acted on.
      required:
        - id
        - object
        - created
        - account
        - actor
        - action
        - target
        - details
      type: object
    AuditEventList:
      additionalProperties: {}
      description: A page of audit events.
      properties:
        data:
          description: Objects on this page.
          items:
            $ref: "#/components/schemas/AuditEvent"
          type: array
        has_more:
          description: Whether more objects exist after this page.
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          description: Path of this list endpoint.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    BalanceTransaction:
      additionalProperties: {}
      description: "A statement line: what settled where, with its evidence."
      properties:
        created:
          description: When the line was recorded.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        evidence:
          $ref: "#/components/schemas/Evidence"
          description: On-chain proof behind the line.
        fee:
          anyOf:
            - additionalProperties: {}
              properties:
                amount_estimated:
                  description: Estimated fee in the fee asset, base units.
                  pattern: ^(0|[1-9][0-9]{0,77})$
                  type: string
                asset_id:
                  description: Asset the fee was taken in.
                  examples:
                    - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
                  maxLength: 256
                  pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
                  type: string
                bps:
                  description: Fee rate applied.
                  maximum: 10000
                  minimum: 0
                  type: integer
              required:
                - bps
                - amount_estimated
                - asset_id
              type: object
            - type: "null"
          description: Fee for `payment` lines.
        fee_adjustment:
          anyOf:
            - additionalProperties: {}
              properties:
                asset_id:
                  description: Fee asset.
                  examples:
                    - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
                  maxLength: 256
                  pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
                  type: string
                expected:
                  description: Fee expected from the fee snapshot, base units of `asset_id`.
                  pattern: ^(0|[1-9][0-9]{0,77})$
                  type: string
                observed:
                  description: Fee observed by reconciliation (Explorer `appFees`), base units of `asset_id`.
                  pattern: ^(0|[1-9][0-9]{0,77})$
                  type: string
                payment_attempt:
                  description: Attempt whose fee was corrected.
                  examples:
                    - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
                  pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                  type: string
                reconciliation_run:
                  description: Reconciliation run that found the difference.
                  examples:
                    - rcn_01jbz9k3m4n5p6q7r8s9t0v1w2
                  pattern: ^rcn_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                  type: string
              required:
                - payment_attempt
                - expected
                - observed
                - asset_id
                - reconciliation_run
              type: object
            - type: "null"
          description: "`fee_adjustment` lines: the corrected fee (`settled` and `evidence` repeat the payment's)."
        gross:
          anyOf:
            - additionalProperties: {}
              properties:
                amount:
                  description: Fiat amount in minor units (e.g. cents), integer.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                currency:
                  description: ISO 4217 currency code, lower-case (e.g. `usd`).
                  pattern: ^[a-z]{3}$
                  type: string
              required:
                - amount
                - currency
              type: object
            - type: "null"
          description: Priced amount for `payment` lines of fiat-priced intents (minor units).
        id:
          description: balance_transaction id (`txn_` + 26 base32 chars).
          examples:
            - txn_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^txn_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        object:
          const: balance_transaction
          description: Always `balance_transaction`.
          type: string
        payment_intent:
          anyOf:
            - description: payment_intent id (`pi_` + 26 base32 chars).
              examples:
                - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Payment intent the line belongs to.
        received:
          anyOf:
            - additionalProperties: {}
              properties:
                amount:
                  description: Amount the payer received, base units of `asset_id`.
                  pattern: ^(0|[1-9][0-9]{0,77})$
                  type: string
                asset_id:
                  description: Asset the payer received (the refund recipient asset).
                  examples:
                    - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
                  maxLength: 256
                  pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
                  type: string
                chain:
                  description: Chain the payer received on.
                  examples:
                    - eip155:8453
                  pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
                  type: string
              required:
                - amount
                - asset_id
                - chain
              type: object
            - type: "null"
          description: "Refund lines: what reached the payer, from the evidence (`settled` is what left the merchant destination)."
        refund:
          anyOf:
            - description: refund id (`re_` + 26 base32 chars).
              examples:
                - re_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^re_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Refund the line belongs to (refund lines, Stage 2).
        refund_leg:
          anyOf:
            - maximum: 9007199254740991
              minimum: 1
              type: integer
            - type: "null"
          description: "Refund lines: number of the refund leg that settled (a duplicate leg gets its own line)."
        settled:
          $ref: "#/components/schemas/SettlementValue"
          description: Amount of the settlement asset the line records (received by, or returned from, the destination).
        type:
          description: "What the line records: a succeeded payment, extra settlement, a refund (Stage 2) or a reconciliation fee correction (Stage 2)."
          type: string
          x-extensible-enum:
            - payment
            - overpayment
            - refund
            - fee_adjustment
      required:
        - id
        - object
        - created
        - livemode
        - type
        - payment_intent
        - refund
        - gross
        - settled
        - fee
        - evidence
      type: object
    BalanceTransactionList:
      additionalProperties: {}
      description: A page of statement lines.
      properties:
        data:
          description: Objects on this page.
          items:
            $ref: "#/components/schemas/BalanceTransaction"
          type: array
        has_more:
          description: Whether more objects exist after this page.
          type: boolean
        object:
          const: list
          description: Always `list`.
          type: string
        url:
          description: Path of this list endpoint.
          type: string
      required:
        - object
        - data
        - has_more
        - url
      type: object
    BitcoinEvidence:
      additionalProperties: {}
      description: Bitcoin-specific settlement detail (outputs and confirmations).
      properties:
        block_hash:
          description: Hash of the confirming block, hex.
          pattern: ^[0-9a-f]{64}$
          type: string
        block_height:
          description: Height of the confirming block (= `Evidence.block_ref`).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        confirmations:
          description: Confirmations when the evidence was accepted (`tip − block_height + 1`).
          maximum: 9007199254740991
          minimum: 1
          type: integer
        outputs:
          description: Outputs of the transaction that pay the destination address.
          items:
            additionalProperties: {}
            description: An output paying the destination.
            properties:
              script_pubkey:
                description: Output scriptPubKey, hex (`0014…` P2WPKH, `5120…` P2TR).
                pattern: ^[0-9a-f]{2,200}$
                type: string
              value:
                description: Output value, satoshis.
                pattern: ^(0|[1-9][0-9]{0,77})$
                type: string
              vout:
                description: Output index.
                maximum: 9007199254740991
                minimum: 0
                type: integer
            required:
              - vout
              - value
              - script_pubkey
            type: object
          minItems: 1
          type: array
        required_confirmations:
          description: Confirmations the chain profile required for this settlement's USD value (`confirmation_tiers`).
          maximum: 9007199254740991
          minimum: 1
          type: integer
        txid:
          description: Transaction id (= `Evidence.tx_hash`).
          pattern: ^[0-9a-f]{64}$
          type: string
      required:
        - txid
        - outputs
        - block_height
        - block_hash
        - confirmations
        - required_confirmations
      type: object
    BusinessAddress:
      additionalProperties: {}
      description: Registered business address.
      properties:
        city:
          description: City.
          maxLength: 100
          minLength: 1
          type: string
        country:
          description: Country of the address.
          pattern: ^[A-Z]{2}$
          type: string
        line1:
          description: Street and number.
          maxLength: 200
          minLength: 1
          type: string
        line2:
          anyOf:
            - maxLength: 200
              type: string
            - type: "null"
          description: Additional address line.
        postal_code:
          anyOf:
            - maxLength: 20
              type: string
            - type: "null"
          description: Postal code (if the country uses one).
        region:
          anyOf:
            - maxLength: 100
              type: string
            - type: "null"
          description: State, province or region.
      required:
        - line1
        - line2
        - city
        - postal_code
        - region
        - country
      type: object
    CheckoutSession:
      additionalProperties: {}
      description: A checkout page or embed for one payment intent.
      properties:
        allowed_origins:
          description: Origins that may embed the session (embedded mode).
          items:
            type: string
          type: array
        amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "Fiat: integer minor units. Asset: base units as a decimal string."
        asset_id:
          anyOf:
            - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            - type: "null"
          description: Pricing asset when `currency` is `asset`.
        cancel_url:
          anyOf:
            - description: Absolute URL.
              format: uri
              maxLength: 2048
              type: string
            - type: "null"
          description: Where the payer goes on cancel.
        client_secret:
          anyOf:
            - pattern: ^cs_[0-9a-z]{26}_secret_[0-9A-Za-z]{32}$
              type: string
            - type: "null"
          description: Secret for the payer-facing API; returned only when the session is created.
        completed_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the session completed.
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: ISO 4217 code for fiat pricing, or `asset` when priced in an asset (then `asset_id` is set).
        customer:
          anyOf:
            - description: customer id (`cus_` + 26 base32 chars).
              examples:
                - cus_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^cus_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Customer attached to the session (Stage 2).
        description:
          description: Description shown to the payer.
          type:
            - string
            - "null"
        expires_at:
          description: When the session stops accepting new payments.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        id:
          description: checkout_session id (`cs_` + 26 base32 chars).
          examples:
            - cs_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cs_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        invoice:
          anyOf:
            - description: invoice id (`in_` + 26 base32 chars).
              examples:
                - in_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^in_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Invoice the session pays (opened by the hosted invoice page, Stage 3); null otherwise.
        late:
          description: Completed by a settlement after expiry.
          type: boolean
        late_payments:
          description: Accept settlements after expiry.
          type: boolean
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        locale:
          description: Checkout locale.
          type:
            - string
            - "null"
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Up to 50 key/value pairs (key ≤ 40 chars, value ≤ 500 chars) for your own use.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        object:
          const: checkout_session
          description: Always `checkout_session`.
          type: string
        payment_intent:
          anyOf:
            - description: payment_intent id (`pi_` + 26 base32 chars).
              examples:
                - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - $ref: "#/components/schemas/PaymentIntent"
          description: Payment intent id, or the object with `expand[]=payment_intent`.
        payment_link:
          anyOf:
            - description: payment_link id (`plink_` + 26 base32 chars).
              examples:
                - plink_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^plink_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Payment link that opened the session (Stage 2).
        sequence:
          description: Increases with every change; discard webhook objects with a lower sequence. Servers MUST send it (optional in the 0.1.x schema only so readers built on 0.1.4 stay compatible).
          maximum: 9007199254740991
          minimum: 0
          type: integer
        settlement_destination:
          description: settlement_destination id (`sd_` + 26 base32 chars).
          examples:
            - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        status:
          description: Session status; `expiring` means past `expires_at` with money possibly in flight (INV-3).
          type: string
          x-extensible-enum:
            - open
            - expiring
            - complete
            - expired
        success_url:
          description: Where the payer goes after paying (`?session_id=` is appended).
          format: uri
          maxLength: 2048
          type: string
        ui_mode:
          description: Hosted page or embedded iframe.
          enum:
            - hosted
            - embedded
          type: string
        url:
          anyOf:
            - description: Absolute URL.
              format: uri
              maxLength: 2048
              type: string
            - type: "null"
          description: Checkout URL including the client secret; returned only when the session is created.
      required:
        - id
        - object
        - created
        - livemode
        - status
        - url
        - client_secret
        - expires_at
        - payment_intent
        - amount
        - currency
        - asset_id
        - settlement_destination
        - ui_mode
        - success_url
        - cancel_url
        - description
        - allowed_origins
        - late_payments
        - locale
        - completed_at
        - late
        - metadata
      type: object
    CheckoutSessionCreate:
