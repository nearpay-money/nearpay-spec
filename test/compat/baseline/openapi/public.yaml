        account:
          anyOf:
            - description: account id (`acct_` + 26 base32 chars).
              examples:
                - acct_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^acct_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Account the key was minted for (after approval).
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        device_name:
          description: Shown to the approving user and used in the key name, e.g. the host name.
          maxLength: 64
          minLength: 1
          type: string
        expires_at:
          description: Approve before this instant.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        key:
          anyOf:
            - description: api_key id (`key_` + 26 base32 chars).
              examples:
                - key_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^key_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: The minted key (after approval).
        object:
          const: cli_login_request
          description: Always `cli_login_request`.
          type: string
        requested_from:
          additionalProperties: {}
          description: Where the login was created (shown so the user can recognise it).
          properties:
