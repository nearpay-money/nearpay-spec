    Nep413MultiPayload:
      additionalProperties: {}
      description: Payload signed with NEP-413.
      properties:
        payload:
          additionalProperties: {}
          description: NEP-413 payload.
          properties:
            callbackUrl:
              description: NEP-413 callback URL (NearPay never sets it).
              type:
                - string
                - "null"
            message:
              description: JSON string of `Nep413IntentMessage`.
              minLength: 2
              type: string
            nonce:
              description: 32-byte nonce (4-byte Verifier salt ‖ 28 random bytes), standard base64.
              pattern: ^[A-Za-z0-9+/]{43}=$
              type: string
            recipient:
              const: intents.near
              description: NEP-413 recipient (the Verifier).
              type: string
          required:
            - recipient
            - nonce
            - message
          type: object
        public_key:
          description: ed25519 key of the signer.
          pattern: ^(ed25519|secp256k1):[1-9A-HJ-NP-Za-km-z]{32,90}$
          type: string
        signature:
          description: ed25519 signature over the NEP-413 borsh hash.
          pattern: ^(ed25519|secp256k1):[1-9A-HJ-NP-Za-km-z]{64,100}$
          type: string
        standard:
          const: nep413
          description: NEP-413 (NEAR wallets `signMessage`).
          type: string
      required:
        - standard
        - payload
        - public_key
        - signature
      type: object
    PayerAttempt:
      additionalProperties: {}
      description: A payment attempt as the payer sees it.
      properties:
        amount_received:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: What the payer's deposit actually delivered, base units of the origin asset; null until a deposit is detected. Shows “received X of Y” for an `incomplete_deposit`. Absent from older servers.
        attestation_ticket:
          anyOf:
            - description: "`base64url(JCS payload).base64url(Ed25519 signature)` issued by payments; pass it to sentinel unchanged."
              pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
              type: string
            - type: "null"
          description: Ticket for sentinel; present while instructions are live.
        deposit:
          anyOf:
            - $ref: "#/components/schemas/DepositInstructions"
            - type: "null"
          description: Deposit instructions (`route_quote`).
        failure_code:
          description: Reason the attempt failed or was refunded.
          type:
            - string
            - "null"
        id:
          description: payment_attempt id (`pa_` + 26 base32 chars).
          examples:
            - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        intents_requirement:
          anyOf:
            - $ref: "#/components/schemas/IntentsRequirement"
            - type: "null"
          description: What to sign (`intents_transfer`).
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        method:
          description: "`route_quote`: deposit to a 1Click address from any chain. `intents_transfer`: signed transfer from a NEAR Intents balance."
          enum:
            - route_quote
            - intents_transfer
          type: string
        object:
          const: payment_attempt
          description: Always `payment_attempt`.
          type: string
        origin_asset_id:
          description: Asset the payer pays with.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        refunded_amount:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Amount the provider refunded to the payer, if any.
        status:
          description: Attempt status (mirrors the rails execution, domain-model §4.3).
          type: string
          x-extensible-enum:
            - quoting
            - awaiting_deposit
            - deposit_detected
            - incomplete_deposit
            - settling
            - verifying
            - succeeded
            - refunded
            - failed
            - expired_unpaid
            - held
        visible:
          description: False once a newer attempt replaced it ("don't send again").
          type: boolean
      required:
        - id
        - object
        - livemode
        - status
        - method
        - visible
        - origin_asset_id
        - deposit
        - intents_requirement
        - attestation_ticket
        - failure_code
        - refunded_amount
      type: object
    PaymentAttemptSummary:
      additionalProperties: {}
      description: One payment attempt of an intent, as merchants see it.
      properties:
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        deadline:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Deposit deadline.
        evidence:
          anyOf:
            - $ref: "#/components/schemas/Evidence"
            - type: "null"
          description: Settlement evidence, once verified.
        failure_code:
          description: Why the attempt failed, refunded or was held.
          type:
            - string
            - "null"
        id:
          description: payment_attempt id (`pa_` + 26 base32 chars).
          examples:
            - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        is_overpayment:
          description: Settled after another attempt already paid the intent.
          type: boolean
        method:
          description: "`route_quote`: deposit to a 1Click address from any chain. `intents_transfer`: signed transfer from a NEAR Intents balance."
          enum:
            - route_quote
            - intents_transfer
          type: string
        object:
          const: payment_attempt
          description: Always `payment_attempt`.
          type: string
        origin_amount:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: What the payer actually sent, base units of `origin_asset_id` (rails `deposited_amount`); null until a deposit is detected. Spec 0.2.1.
        origin_asset_id:
          description: Asset the payer pays with.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        origin_chain:
          description: Chain the payer pays from.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        refund_to:
          anyOf:
            - description: Address in the chain's canonical text form.
              maxLength: 256
              minLength: 1
              type: string
            - type: "null"
          description: "The payer's own address as given at checkout, where refunds go (INV-7): the refund address on the origin chain (`route_quote`; the connected wallet or a typed address, which may differ from the wallet that sent the deposit) or the payer's Intents account (`intents_transfer`). Spec 0.2.1."
        settled_amount:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Amount that settled, base units.
        settlement_amount:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Expected settlement including the amount tag, base units.
        status:
          description: Attempt status (mirrors the rails execution, domain-model §4.3).
          type: string
          x-extensible-enum:
            - quoting
            - awaiting_deposit
            - deposit_detected
            - incomplete_deposit
            - settling
            - verifying
            - succeeded
            - refunded
            - failed
            - expired_unpaid
            - held
      required:
        - id
        - object
        - created
        - status
        - method
        - origin_asset_id
        - origin_chain
        - settlement_amount
        - settled_amount
        - deadline
        - is_overpayment
        - failure_code
        - evidence
      type: object
    PaymentIntent:
      additionalProperties: {}
      description: One payment the merchant expects (FR-PAY-01).
      properties:
        amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "Fiat: integer minor units. Asset: base units as a decimal string."
        amount_refund_pending:
          description: Amount of refunds in `requires_action` or `pending`, base units of the settlement asset (Stage 2).
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        amount_refunded:
          description: Refunded amount, base units of the settlement asset.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        amount_settled:
          description: Settled amount, base units of the settlement asset.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          anyOf:
            - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            - type: "null"
          description: Pricing asset when `currency` is `asset`.
        attempts:
          description: Attempts, newest first.
          items:
            $ref: "#/components/schemas/PaymentAttemptSummary"
          type: array
        canceled_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the intent was canceled.
        cancellation_reason:
          description: Reason given on cancel.
          type:
            - string
            - "null"
        checkout_session:
          anyOf:
            - description: checkout_session id (`cs_` + 26 base32 chars).
              examples:
                - cs_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^cs_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Checkout session that owns the intent.
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: ISO 4217 code for fiat pricing, or `asset` when priced in an asset (then `asset_id` is set).
        customer:
          anyOf:
            - description: customer id (`cus_` + 26 base32 chars).
              examples:
                - cus_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^cus_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Customer the intent belongs to (Stage 2).
        description:
          description: Description shown to the payer.
          type:
            - string
            - "null"
        destination:
          $ref: "#/components/schemas/DestinationSnapshot"
        fee:
          $ref: "#/components/schemas/FeeSummary"
        id:
          description: payment_intent id (`pi_` + 26 base32 chars).
          examples:
            - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        invoice:
          anyOf:
            - description: invoice id (`in_` + 26 base32 chars).
              examples:
                - in_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^in_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: "Invoice the intent pays (`source: invoice`, Stage 3); null otherwise. Servers from 0.3.0 send it."
        late:
          description: Settled after its checkout session expired (INV-3).
