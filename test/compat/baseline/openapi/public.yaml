      properties:
        assetTransferMethod:
          const: near-intents
          description: Transfer method.
          type: string
        binding:
          description: "NearPay: the issued requirement this entry belongs to (single use: one quote). Always set by NearPay."
          pattern: ^np1:[1-9A-HJ-NP-Za-km-z]{43,44}$
          type: string
        deadline:
          description: "NearPay: the unquoted entry must be quoted before this instant (the binding's `expires_at`)."
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        depositMemo:
          description: Quoted entry only, when the origin network needs a memo or destination tag.
          maxLength: 256
          minLength: 1
          type: string
        destination:
          $ref: "#/components/schemas/X402NearIntentsDestination"
        indicativeAmount:
          description: Indicative deposit amount of `asset` (not binding; may change between responses).
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        minAmountIn:
          description: "Quoted entry only (NearPay): smallest deposit 1Click executes; the unused part of `amount` returns to `refundTo`."
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        operationToken:
          description: "Quoted entry only: authorises redemption of this quote. Opaque bearer credential; persist it before depositing."
          maxLength: 512
          minLength: 16
          type: string
        originAssetId:
          description: "NearPay: NEAR Intents asset id of the origin asset (`asset`)."
          examples:
