          description: Payloads are rendered in this API version.
          enum:
            - 2026-11-01
          type: string
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        description:
          description: Description.
          type:
            - string
            - "null"
        disabled_reason:
          anyOf:
            - description: Why the endpoint is disabled.
