    X402NearIntentsSettleExtra:
      additionalProperties: {}
      description: "`extra` of a `near-intents` settlement response."
      properties:
        agentPayment:
          description: "NearPay, success: the agent payment recorded for the merchant."
          examples:
            - ap_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^ap_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        originNetwork:
          description: "Success: the origin network."
          pattern: ^[^:\s]+:[^:\s]+$
          type: string
        originTxHash:
          description: "Success: the deposit transaction that paid the instrument."
          maxLength: 128
          minLength: 8
          type: string
        refundTo:
          description: "Failure: where 1Click returns the deposit."
          maxLength: 256
          minLength: 1
          type: string
        status:
          description: "Not success: the operation's 1Click status (raw)."
          maxLength: 64
          type: string
      type: object
    X402NearIntentsSettleResponse:
      additionalProperties: {}
      description: Facilitator `/x402/near-intents/settle` result; body of `PAYMENT-RESPONSE`. Never carries the token.
      properties:
        amount:
          description: "Success: amount delivered to the merchant (destination base units)."
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        errorMessage:
          description: Human-readable detail.
          type: string
        errorReason:
          description: Why a `near-intents` settlement did not (yet) succeed; `settlement_pending` is not terminal. `exact_near_intents_operation_executed` is answered by resource servers, never by the facilitator.
          type: string
          x-extensible-enum:
            - invalid_x402_version
            - invalid_scheme
            - invalid_network
            - invalid_payment_requirements
            - requirement_unknown
            - requirement_expired
            - requirement_consumed
            - invalid_payload
            - payer_blocked
            - quota_exceeded
            - invalid_exact_near_intents_quote_unavailable
            - invalid_exact_near_intents_token_invalid
            - invalid_exact_near_intents_token_expired
            - invalid_exact_near_intents_quote_mismatch
            - invalid_exact_near_intents_deposit_not_found
            - settlement_pending
            - unexpected_settle_error
            - exact_near_intents_insufficient_deposit
            - exact_near_intents_payment_failed
            - exact_near_intents_operation_executed
        extra:
          $ref: "#/components/schemas/X402NearIntentsSettleExtra"
        network:
          description: "Success: the destination network (`near:mainnet`). Otherwise the origin network."
          pattern: ^[^:\s]+:[^:\s]+$
          type: string
        payer:
          description: The quote's `refundTo` on the origin network.
          maxLength: 256
          minLength: 1
          type: string
        replayed:
          description: True when an earlier response already carried this final result; serve the resource at most once.
          type: boolean
        success:
          description: The merchant was paid (evidence on the destination network).
          type: boolean
        transaction:
          anyOf:
            - description: Transaction hash in the chain's text form.
              maxLength: 128
              minLength: 8
              type: string
            - const: ""
              type: string
          description: 'Success: the delivery transaction on `network`. Pending: the deposit `txHash`. Failure: `""`.'
      required:
        - success
        - transaction
        - network
      type: object
    X402NearIntentsVerifyRequest:
      additionalProperties: {}
      description: Facilitator `/x402/near-intents/verify` and `/settle` request.
      properties:
        paymentPayload:
          $ref: "#/components/schemas/X402NearIntentsPaymentPayload"
        paymentRequirements:
          $ref: "#/components/schemas/X402NearIntentsPaymentRequirements"
          description: The resource server's own **unquoted** entry for `accepted.network` and `accepted.asset` (never `accepted`).
        x402Version:
          const: 2
          description: x402 protocol version.
          type: number
      required:
        - x402Version
        - paymentPayload
        - paymentRequirements
      type: object
    X402NearIntentsVerifyResponse:
      additionalProperties: {}
      description: Facilitator `/x402/near-intents/verify` result.
      properties:
        extra:
          $ref: "#/components/schemas/X402NearIntentsQuote"
          description: "`quote` payloads with `isValid: true`: the minted quote."
        invalidMessage:
          description: Human-readable detail.
          type: string
        invalidReason:
          description: Why a `near-intents` payload is invalid.
          type: string
          x-extensible-enum:
            - invalid_x402_version
            - invalid_scheme
            - invalid_network
            - invalid_payment_requirements
            - requirement_unknown
            - requirement_expired
            - requirement_consumed
            - invalid_payload
            - payer_blocked
            - quota_exceeded
            - invalid_exact_near_intents_quote_unavailable
            - invalid_exact_near_intents_token_invalid
            - invalid_exact_near_intents_token_expired
            - invalid_exact_near_intents_quote_mismatch
            - invalid_exact_near_intents_deposit_not_found
        isValid:
          description: "`quote`: a quote was minted. `deposit`: the token and terms verify."
          type: boolean
        payer:
          description: "`deposit`: the quote's `refundTo` on the origin network."
          maxLength: 256
          minLength: 1
          type: string
      required:
        - isValid
      type: object
    X402PaymentPayload:
      additionalProperties: {}
      description: Body of `PAYMENT-SIGNATURE` (base64 JSON).
      properties:
        accepted:
          $ref: "#/components/schemas/X402PaymentRequirements"
          description: The requirement the payer chose (must equal one in `accepts`).
        extensions:
          additionalProperties: {}
          description: Protocol extensions.
          propertyNames:
            type: string
          type: object
        payload:
          additionalProperties: {}
          description: Signed Verifier payload with exactly the two transfers.
          properties:
            signed:
              $ref: "#/components/schemas/MultiPayload"
          required:
            - signed
          type: object
        resource:
          $ref: "#/components/schemas/X402ResourceInfo"
        x402Version:
          const: 2
          description: x402 protocol version.
          type: number
      required:
        - x402Version
        - accepted
        - payload
      type: object
    X402PaymentRequired:
      additionalProperties: {}
      description: Body of `PAYMENT-REQUIRED` (base64 JSON).
      properties:
        accepts:
          description: Accepted payment requirements.
          items:
            $ref: "#/components/schemas/X402PaymentRequirements"
          minItems: 1
          type: array
        error:
          description: Why payment is (still) required.
          type: string
        extensions:
          additionalProperties: {}
          description: Protocol extensions.
          propertyNames:
            type: string
          type: object
        resource:
          $ref: "#/components/schemas/X402ResourceInfo"
        x402Version:
          const: 2
          description: x402 protocol version.
          type: number
      required:
        - x402Version
        - resource
        - accepts
      type: object
    X402PaymentRequiredAny:
      additionalProperties: {}
      description: Body of `PAYMENT-REQUIRED` with `intents-transfer` and/or `near-intents` entries (clients skip methods they do not implement).
      properties:
        accepts:
          description: Accepted payment requirements.
          items:
            anyOf:
              - $ref: "#/components/schemas/X402PaymentRequirements"
              - $ref: "#/components/schemas/X402NearIntentsPaymentRequirements"
            description: An `intents-transfer` or a `near-intents` entry (`extra.assetTransferMethod` tells them apart).
          minItems: 1
          type: array
        error:
          description: Why payment is (still) required.
          type: string
        extensions:
          additionalProperties: {}
          description: Protocol extensions.
          propertyNames:
            type: string
          type: object
        resource:
          $ref: "#/components/schemas/X402ResourceInfo"
        x402Version:
          const: 2
          description: x402 protocol version.
          type: number
      required:
        - x402Version
        - resource
        - accepts
      type: object
    X402PaymentRequirements:
      additionalProperties: {}
      description: One accepted way to pay (`accepts[]` entry).
      properties:
        amount:
          description: Amount the merchant receives, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset:
          description: Asset to pay (NEAR Intents asset id).
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        extra:
          $ref: "#/components/schemas/X402IntentsTransferExtra"
        maxTimeoutSeconds:
          description: Payment must be settled within this time.
          maximum: 300
          minimum: 30
          type: integer
        network:
          const: near:mainnet
          description: Network.
          type: string
        payTo:
          description: Merchant Intents account.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        scheme:
          const: exact
          description: x402 scheme.
          type: string
      required:
        - scheme
        - network
        - amount
        - asset
        - payTo
        - maxTimeoutSeconds
        - extra
      type: object
    X402ResourceInfo:
      additionalProperties: {}
      description: The resource a payment unlocks.
      properties:
        description:
          description: What is being paid for.
          maxLength: 500
          type: string
        mimeType:
          description: MIME type of the resource.
          maxLength: 100
          type: string
        url:
          description: URL of the paid resource.
          format: uri
          type: string
      required:
        - url
      type: object
    X402SettleResponse:
      additionalProperties: {}
      description: Facilitator `/settle` result; body of `PAYMENT-RESPONSE`.
      properties:
        amount:
          description: Amount settled to `payTo`.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        errorMessage:
          description: Human-readable detail.
          type: string
        errorReason:
          description: Why settlement did not (yet) succeed; `settlement_pending` is not terminal.
          type: string
          x-extensible-enum:
            - invalid_x402_version
            - invalid_scheme
            - invalid_network
            - invalid_payment_requirements
            - requirement_unknown
            - requirement_expired
            - requirement_consumed
            - invalid_payload
            - invalid_signature
            - recipient_mismatch
            - amount_mismatch
            - deadline_invalid
            - insufficient_funds
            - nonce_used
            - payer_blocked
            - quota_exceeded
            - settlement_pending
            - unexpected_settle_error
        network:
          const: near:mainnet
          description: Network.
          type: string
        payer:
          description: Payer Intents account.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        replayed:
          description: True when this payment payload was settled before and this response repeats that result (settle is idempotent on the payload); deliver the resource at most once per settlement.
          type: boolean
        success:
          description: Settled on NEAR (final).
          type: boolean
        transaction:
          anyOf:
            - description: Transaction hash in the chain's text form.
              maxLength: 128
              minLength: 8
              type: string
            - const: ""
              type: string
          description: NEAR transaction hash (empty when not submitted).
      required:
        - success
        - transaction
        - network
      type: object
    X402SlippageRange:
      additionalProperties: {}
      description: Slippage range the facilitator clamps a quote payload's `slippageTolerance` into.
      properties:
        default:
          description: Applied when the quote payload omits `slippageTolerance`, bps.
          maximum: 10000
          minimum: 0
          type: integer
        max:
          description: Highest accepted `slippageTolerance`, bps.
          maximum: 10000
          minimum: 0
          type: integer
        min:
          description: Lowest accepted `slippageTolerance`, bps.
          maximum: 10000
          minimum: 0
          type: integer
      required:
        - min
        - max
        - default
      type: object
    X402SupportedResponse:
      additionalProperties: {}
      description: Facilitator `/supported`.
      properties:
        extensions:
          description: Supported extensions.
          items:
            type: string
          type: array
        kinds:
          description: Supported kinds.
          items:
            additionalProperties: {}
            description: A supported scheme/network.
            properties:
              extra:
                additionalProperties: {}
                description: Details.
                properties:
                  assetTransferMethod:
                    const: intents-transfer
                    description: Method.
                    type: string
                required:
                  - assetTransferMethod
                type: object
              network:
                const: near:mainnet
                description: Network.
                type: string
              scheme:
                const: exact
                description: Scheme.
                type: string
              x402Version:
                const: 2
                description: Version.
                type: number
            required:
              - x402Version
              - scheme
              - network
              - extra
            type: object
          type: array
        signers:
          additionalProperties:
            items:
              type: string
            type: array
          description: Network pattern → relayer accounts that submit transactions.
          propertyNames:
            type: string
          type: object
      required:
        - kinds
        - extensions
        - signers
      type: object
    X402VerifyRequest:
      additionalProperties: {}
      description: Facilitator `/verify` and `/settle` request.
      properties:
        paymentPayload:
          $ref: "#/components/schemas/X402PaymentPayload"
        paymentRequirements:
          $ref: "#/components/schemas/X402PaymentRequirements"
        x402Version:
          const: 2
          description: x402 protocol version.
          type: number
      required:
        - x402Version
        - paymentPayload
        - paymentRequirements
      type: object
    X402VerifyResponse:
      additionalProperties: {}
      description: Facilitator `/verify` result.
      properties:
        invalidMessage:
          description: Human-readable detail.
          type: string
        invalidReason:
          description: Why a payment payload is invalid.
          type: string
          x-extensible-enum:
            - invalid_x402_version
            - invalid_scheme
            - invalid_network
            - invalid_payment_requirements
            - requirement_unknown
            - requirement_expired
            - requirement_consumed
            - invalid_payload
            - invalid_signature
            - recipient_mismatch
            - amount_mismatch
            - deadline_invalid
            - insufficient_funds
            - nonce_used
            - payer_blocked
            - quota_exceeded
        isValid:
          description: Whether the payload would settle.
          type: boolean
        payer:
          description: Payer Intents account.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
      required:
        - isValid
      type: object
  securitySchemes:
    apiKey:
      description: Secret (`sk_`), restricted (`rk_`) or publishable (`pk_`) key.
      scheme: bearer
      type: http
    clientSecret:
      description: Checkout session client secret (payer API).
      in: header
      name: X-NearPay-Client-Secret
      type: apiKey
    session:
      description: Dashboard session (+ `X-CSRF-Token` on unsafe methods).
      in: cookie
      name: __Host-np_session
      type: apiKey
info:
  description: NearPay public API. Generated from `nearpay-spec` (zod sources); do not edit by hand.
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  title: NearPay API
  version: 0.4.1
openapi: 3.1.0
paths:
  /v1/account:
    get:
      operationId: getAccount
      parameters:
        - description: "API version (default: the account's pinned version)."
          in: header
          name: NearPay-Version
          schema:
            description: "API version (default: the account's pinned version)."
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: Retrieve the account.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - session: []
      summary: Retrieve the account.
      tags:
        - identity
      x-nearpay:
        auth:
          - session
        idempotent: false
        service: identity
        stage: 1
    patch:
      description: Changing `fee_bearer`, `settings.late_payments` or `settings.underpay_tolerance_bps` needs a fresh step-up (`step_up_required` otherwise).
      operationId: updateAccount
      parameters:
        - description: Makes the request safe to retry for 24 h (same key + same body = same result).
          in: header
          name: Idempotency-Key
          schema:
            description: Makes the request safe to retry for 24 h (same key + same body = same result).
            maxLength: 255
            minLength: 1
            type: string
        - description: "API version (default: the account's pinned version)."
          in: header
          name: NearPay-Version
          schema:
            description: "API version (default: the account's pinned version)."
            type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                country:
                  description: Country.
                  pattern: ^[A-Z]{2}$
                  type: string
                display_name:
                  description: Display name.
                  maxLength: 100
                  minLength: 1
                  type: string
                fee_bearer:
                  description: Who bears NearPay's fee.
                  enum:
                    - payer
                    - merchant
                  type: string
                settings:
                  additionalProperties: false
                  description: Settings to change.
                  properties:
                    branding:
                      additionalProperties: false
                      description: Checkout branding.
                      properties:
                        accent_color:
                          anyOf:
                            - pattern: ^#[0-9a-fA-F]{6}$
                              type: string
                            - type: "null"
                          description: Accent colour.
                        corner_radius:
                          description: Corner radius, px. Spec 0.2.1.
                          maximum: 24
                          minimum: 0
                          type: integer
                        logo_url:
                          anyOf:
                            - description: Absolute URL.
                              format: uri
                              maxLength: 2048
                              type: string
                            - type: "null"
                          description: HTTPS logo URL.
                        theme:
                          description: Checkout colour scheme. Spec 0.2.1.
                          type: string
                          x-extensible-enum:
                            - auto
                            - light
                            - dark
                      type: object
                    email_receipts:
                      description: Email receipts to customers.
                      type: boolean
                    late_payments:
                      description: Accept late settlements.
                      type: boolean
                    session_ttl_default:
                      description: Default session lifetime, seconds.
                      maximum: 86400
                      minimum: 300
                      type: integer
                    underpay_tolerance_bps:
                      description: Short-settlement tolerance (≤ 100 bps).
                      maximum: 100
                      minimum: 0
                      type: integer
                  type: object
                website:
                  anyOf:
                    - description: Absolute URL.
                      format: uri
                      maxLength: 2048
                      type: string
                    - type: "null"
                  description: Merchant website, HTTPS (`null` clears it). Spec 0.2.1.
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: Update account settings.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Error: `invalid_setting`."
          x-error-codes:
            - invalid_setting
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - session: []
      summary: Update account settings.
      tags:
        - identity
      x-nearpay:
        auth:
          - session
        idempotent: true
        roles:
          - owner
          - admin
        service: identity
        stage: 1
  /v1/account/audit_events:
    get:
      description: Cursor list over the whole retention period; the dashboard's export walks it with `created[…]` filters and writes CSV client-side.
      operationId: listAccountAuditEvents
      parameters:
        - description: Number of objects to return, 1–100 (default 10).
          in: query
          name: limit
          schema:
            default: 10
            description: Number of objects to return, 1–100 (default 10).
            maximum: 100
            minimum: 1
            type: integer
        - description: "Cursor: id of the last object of the previous page."
          in: query
          name: starting_after
          schema:
            description: "Cursor: id of the last object of the previous page."
            maxLength: 64
            type: string
        - description: "Cursor: id of the first object of the next page."
          in: query
          name: ending_before
          schema:
            description: "Cursor: id of the first object of the next page."
            maxLength: 64
            type: string
        - description: Only objects created at or after this time.
          in: query
          name: created[gte]
          schema:
            description: Only objects created at or after this time.
            type: number
        - description: Only objects created at or before this time.
          in: query
          name: created[lte]
          schema:
            description: Only objects created at or before this time.
            type: number
        - description: Only this action.
          in: query
          name: action
          schema:
            description: Only this action.
            maxLength: 100
            type: string
        - description: Only this actor id.
          in: query
          name: actor
          schema:
            description: Only this actor id.
            maxLength: 64
            type: string
        - description: "API version (default: the account's pinned version)."
          in: header
          name: NearPay-Version
          schema:
            description: "API version (default: the account's pinned version)."
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
          description: The account's audit log, newest first (audit export).
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - session: []
      summary: The account's audit log, newest first (audit export).
      tags:
        - identity
      x-nearpay:
        auth:
          - session
        idempotent: false
        roles:
          - owner
          - admin
        service: identity
        stage: 2
  /v1/account/invitations:
    get:
      operationId: listInvitations
      parameters:
        - description: Number of objects to return, 1–100 (default 10).
          in: query
          name: limit
          schema:
            default: 10
            description: Number of objects to return, 1–100 (default 10).
            maximum: 100
            minimum: 1
            type: integer
        - description: "Cursor: id of the last object of the previous page."
          in: query
          name: starting_after
          schema:
            description: "Cursor: id of the last object of the previous page."
            maxLength: 64
            type: string
        - description: "Cursor: id of the first object of the next page."
          in: query
          name: ending_before
          schema:
            description: "Cursor: id of the first object of the next page."
            maxLength: 64
            type: string
        - in: query
          name: status
          schema:
            description: Only invitations with this status.
            type: string
            x-extensible-enum:
              - pending
              - accepted
              - revoked
              - expired
        - description: "API version (default: the account's pinned version)."
          in: header
          name: NearPay-Version
          schema:
            description: "API version (default: the account's pinned version)."
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
          description: List invitations.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Generic errors that apply to every route: `invalid_request`, `resource_missing`, `authentication_required`, `invalid_api_key`, `permission_denied`, `csrf_token_invalid`, `ip_not_allowed`, `account_suspended`, `step_up_required`, `rate_limited`, `idempotency_key_reused`, `idempotency_in_progress`, `api_error`."
      security:
        - session: []
      summary: List invitations.
      tags:
        - identity
      x-nearpay:
        auth:
          - session
        idempotent: false
        roles:
          - owner
          - admin
        service: identity
        stage: 2
    post:
