    WebhookDelivery:
      additionalProperties: {}
      description: One event's delivery to one endpoint, with a summary of its attempts.
      properties:
        attempts:
          description: Attempts made so far, including a successful one.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        event:
          description: event id (`evt_` + 26 base32 chars).
