          minimum: 1
          type: integer
        object:
          const: cli_login
          description: Always `cli_login`.
          type: string
        user_code:
          description: Code the user confirms in the dashboard, `XXXX-XXXX` (consonants only).
          pattern: ^[BCDFGHJKLMNPQRSTVWXZ]{4}-[BCDFGHJKLMNPQRSTVWXZ]{4}$
          type: string
        verification_url:
          description: Dashboard page where the user enters `user_code`.
          format: uri
          type: string
