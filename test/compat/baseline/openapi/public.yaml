                - string
                - "null"
            user_agent:
              description: User agent of the CLI.
              type:
                - string
                - "null"
          required:
            - ip
            - country
            - user_agent
          type: object
        status:
          description: "`pending`: waiting for the user. `approved`: the key is ready (the poll that sees it receives it). `denied`: the user refused. `expired`: not approved within 15 min. `redeemed`: the key was already delivered."
          type: string
          x-extensible-enum:
            - pending
            - approved
            - denied
            - expired
            - redeemed
        user_code:
          description: Code the user confirms in the dashboard, `XXXX-XXXX` (consonants only).
          pattern: ^[BCDFGHJKLMNPQRSTVWXZ]{4}-[BCDFGHJKLMNPQRSTVWXZ]{4}$
          type: string
      required:
        - object
        - user_code
        - device_name
        - status
        - created
        - expires_at
        - requested_from
        - account
        - key
      type: object
