    Evidence:
      additionalProperties: {}
      description: Independent on-chain proof that a settlement reached the merchant (INV-2).
      properties:
        amount:
          description: Amount received by the recipient, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          description: Asset that settled.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        block_ref:
          description: Block height or hash containing the transaction.
          type:
            - string
            - "null"
        chain:
          description: Chain where the settlement happened.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        explorer_url:
          anyOf:
            - format: uri
              type: string
            - type: "null"
          description: Block-explorer link for the transaction.
        finality:
          description: Finality reached when the evidence was accepted.
          type: string
          x-extensible-enum:
            - final
            - finalized
            - confirmed
        observed_at:
          description: When NearPay accepted the evidence.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        recipient:
          description: Recipient that received the funds (the merchant destination).
          maxLength: 256
          minLength: 1
          type: string
        source:
          description: Detector that produced the evidence.
          type: string
          x-extensible-enum:
            - watcher
            - indexer
            - verifier
            - provider
            - operator
        tier:
          description: "Verification tier: A = independently verified on chain, B = provider-attested within limits."
          type: string
          x-extensible-enum:
            - A
            - B
        tx_hash:
          description: Settlement transaction (NEAR receipt / tx hash for Intents).
          maxLength: 128
          minLength: 8
          type: string
      required:
        - chain
        - tx_hash
        - block_ref
        - recipient
        - asset_id
        - amount
        - finality
        - tier
        - source
        - observed_at
        - explorer_url
      type: object
    FeeSummary:
      additionalProperties: {}
      description: Fee snapshot of a payment (INV-6).
      properties:
        bearer:
          description: Who bears the fee.
          enum:
            - payer
            - merchant
          type: string
        total_bps:
          description: NearPay fee applied to this payment's route, in basis points.
          maximum: 10000
          minimum: 0
          type: integer
      required:
        - bearer
        - total_bps
      type: object
    IntentMessage:
      additionalProperties: {}
      description: Verifier message (`DefusePayload`).
      properties:
        deadline:
          description: Latest time the Verifier accepts the payload.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        intents:
          description: Intents executed atomically.
          items:
            anyOf:
              - $ref: "#/components/schemas/TransferIntent"
              - additionalProperties: {}
                properties:
                  intent:
                    description: Intent kind.
                    type: string
                required:
                  - intent
                type: object
            description: A Verifier intent.
          minItems: 1
          type: array
        nonce:
          description: 32-byte nonce (4-byte Verifier salt ‖ 28 random bytes), standard base64.
          pattern: ^[A-Za-z0-9+/]{43}=$
          type: string
        signer_id:
          description: Intents account that signs (the payer).
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        verifying_contract:
          const: intents.near
          description: Verifier contract id.
          type: string
      required:
        - signer_id
        - verifying_contract
        - deadline
        - nonce
        - intents
      type: object
    PaymentAttemptSummary:
      additionalProperties: {}
      description: One payment attempt of an intent, as merchants see it.
      properties:
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        deadline:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Deposit deadline.
        evidence:
          anyOf:
            - $ref: "#/components/schemas/Evidence"
            - type: "null"
          description: Settlement evidence, once verified.
        failure_code:
          description: Why the attempt failed, refunded or was held.
          type:
            - string
            - "null"
        id:
          description: payment_attempt id (`pa_` + 26 base32 chars).
          examples:
            - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        is_overpayment:
          description: Settled after another attempt already paid the intent.
          type: boolean
        method:
          description: "`route_quote`: deposit to a 1Click address from any chain. `intents_transfer`: signed transfer from a NEAR Intents balance."
          enum:
            - route_quote
            - intents_transfer
          type: string
        object:
          const: payment_attempt
          description: Always `payment_attempt`.
          type: string
        origin_asset_id:
          description: Asset the payer pays with.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        origin_chain:
          description: Chain the payer pays from.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        settled_amount:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Amount that settled, base units.
        settlement_amount:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: Expected settlement including the amount tag, base units.
        status:
          description: Attempt status (mirrors the rails execution, domain-model §4.3).
          type: string
          x-extensible-enum:
            - quoting
            - awaiting_deposit
            - deposit_detected
            - incomplete_deposit
            - settling
            - verifying
            - succeeded
            - refunded
            - failed
            - expired_unpaid
            - held
      required:
        - id
        - object
        - created
        - status
        - method
        - origin_asset_id
        - origin_chain
        - settlement_amount
        - settled_amount
        - deadline
        - is_overpayment
        - failure_code
        - evidence
      type: object
    PaymentIntent:
      additionalProperties: {}
      description: One payment the merchant expects (FR-PAY-01).
      properties:
        amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "Fiat: integer minor units. Asset: base units as a decimal string."
        amount_refund_pending:
          description: Amount of refunds in `requires_action` or `pending`, base units of the settlement asset (Stage 2).
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        amount_refunded:
          description: Refunded amount, base units of the settlement asset.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        amount_settled:
          description: Settled amount, base units of the settlement asset.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          anyOf:
            - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            - type: "null"
          description: Pricing asset when `currency` is `asset`.
        attempts:
          description: Attempts, newest first.
          items:
            $ref: "#/components/schemas/PaymentAttemptSummary"
          type: array
        canceled_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the intent was canceled.
        cancellation_reason:
          description: Reason given on cancel.
          type:
            - string
            - "null"
        checkout_session:
          anyOf:
            - description: checkout_session id (`cs_` + 26 base32 chars).
              examples:
                - cs_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^cs_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Checkout session that owns the intent.
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: ISO 4217 code for fiat pricing, or `asset` when priced in an asset (then `asset_id` is set).
        customer:
          anyOf:
            - description: customer id (`cus_` + 26 base32 chars).
              examples:
                - cus_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^cus_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Customer the intent belongs to (Stage 2).
        description:
          description: Description shown to the payer.
          type:
            - string
            - "null"
        destination:
          $ref: "#/components/schemas/DestinationSnapshot"
        fee:
          $ref: "#/components/schemas/FeeSummary"
        id:
          description: payment_intent id (`pi_` + 26 base32 chars).
          examples:
            - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        late:
          description: Settled after its checkout session expired (INV-3).
          type: boolean
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Up to 50 key/value pairs (key ≤ 40 chars, value ≤ 500 chars) for your own use.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        object:
          const: payment_intent
          description: Always `payment_intent`.
          type: string
        overpayments:
          description: Settlements beyond the one that paid the intent (refund recommended).
          items:
            additionalProperties: {}
            description: An extra settlement.
            properties:
              amount:
                description: Extra amount that settled, base units.
                pattern: ^(0|[1-9][0-9]{0,77})$
                type: string
              attempt:
                description: payment_attempt id (`pa_` + 26 base32 chars).
                examples:
                  - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
                pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                type: string
              reason:
                description: Why it counts as an overpayment.
                type: string
                x-extensible-enum:
                  - duplicate
                  - after_cancel
                  - after_expiry
            required:
              - attempt
              - amount
              - reason
            type: object
          type: array
        payment_link:
          anyOf:
            - description: payment_link id (`plink_` + 26 base32 chars).
              examples:
                - plink_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^plink_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: "Payment link that created the intent (`source: payment_link`)."
        refunds:
          description: Refunds of this intent, newest first (Stage 2).
          items:
            description: refund id (`re_` + 26 base32 chars).
            examples:
              - re_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^re_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
          type: array
        review_decision:
          anyOf:
            - additionalProperties: {}
              properties:
                decided_at:
                  description: When the decision was recorded.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                decision:
                  description: Merchant decision.
                  enum:
                    - accept
                    - reject
                  type: string
                refund:
                  anyOf:
                    - description: refund id (`re_` + 26 base32 chars).
                      examples:
                        - re_01jbz9k3m4n5p6q7r8s9t0v1w2
                      pattern: ^re_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                      type: string
                    - type: "null"
                  description: Refund created by a `reject` of a settled amount (draft, merchant signs).
              required:
                - decision
                - decided_at
                - refund
              type: object
            - type: "null"
          description: Merchant decision on a `requires_review` intent (Stage 2).
        review_reason:
          anyOf:
            - description: Why the intent needs review.
              type: string
              x-extensible-enum:
                - short_settlement
                - verification_held
            - type: "null"
        sequence:
          description: Increases with every change; discard webhook objects with a lower sequence.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        settlement_asset_id:
          description: Asset the merchant receives.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        source:
          description: What created the intent.
          type: string
          x-extensible-enum:
            - checkout
            - invoice
            - payment_link
            - api
        status:
          description: Payment intent status (domain-model §4.2).
          type: string
          x-extensible-enum:
            - requires_payment
            - processing
            - requires_review
            - succeeded
            - canceled
            - expired
        succeeded_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the intent succeeded.
      required:
        - id
        - object
        - created
        - livemode
        - status
        - amount
        - currency
        - asset_id
        - description
        - source
        - checkout_session
        - destination
        - fee
        - settlement_asset_id
        - amount_settled
        - amount_refunded
        - succeeded_at
        - late
        - canceled_at
        - cancellation_reason
        - review_reason
        - attempts
        - overpayments
        - sequence
        - metadata
      type: object
    Ping:
      additionalProperties: {}
      description: Test delivery to a webhook endpoint.
      properties:
        object:
          const: ping
          description: Always `ping`.
          type: string
        webhook_endpoint:
          description: webhook_endpoint id (`we_` + 26 base32 chars).
          examples:
            - we_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^we_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
      required:
        - object
        - webhook_endpoint
      type: object
    PublicReview:
      additionalProperties: {}
      description: A compliance review of a payment or destination (the payment stands).
      properties:
        closed_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the review closed.
        created:
          description: When the review opened.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        id:
          description: compliance_case id (`case_` + 26 base32 chars).
          examples:
            - case_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^case_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        object:
          const: review
          description: Always `review`.
          type: string
        reason:
          description: Why the review opened.
          type: string
          x-extensible-enum:
            - post_screen_hit
            - held_execution
            - audit_mismatch
            - screening_hit
        status:
          description: Review status.
          type: string
          x-extensible-enum:
            - open
            - closed
        subject:
          additionalProperties: {}
          description: What is under review.
          properties:
            id:
              description: Reviewed object id (`pi_…`, `ap_…` or `sd_…`).
              type: string
            type:
              description: Reviewed object type.
              type: string
              x-extensible-enum:
                - payment_intent
                - agent_payment
                - settlement_destination
          required:
            - type
            - id
          type: object
      required:
        - id
        - object
        - created
        - livemode
        - subject
        - reason
        - status
        - closed_at
      type: object
    Refund:
      additionalProperties: {}
      description: Money returned to a payer, signed by the merchant (non-custodial).
      properties:
        amount:
          description: Refunded amount, base units of `asset_id`.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        amount_received:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: What the payer received, base units of `recipient.asset_id` (from evidence).
        asset_id:
          description: Settlement asset the amount is in.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        canceled_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the merchant canceled.
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        decimals:
          description: Decimals of `asset_id`.
          maximum: 255
          minimum: 0
          type: integer
        evidence:
          anyOf:
            - $ref: "#/components/schemas/Evidence"
            - type: "null"
          description: Payer-side evidence of the leg that refunded the payer (INV-2).
        extra_amount_sent:
          description: Settlement-asset amount sent by duplicate legs (signed and sent after another leg had refunded the payer); `0` normally.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        failure_code:
          description: Why the refund failed (the last leg's code).
          type:
            - string
            - "null"
        fee_mode:
          description: "`payer_absorbs` (default, `EXACT_INPUT`): the merchant sends `amount`, the payer receives it minus route costs. `merchant_absorbs` (`EXACT_OUTPUT`): the payer receives the equivalent of `amount`; the merchant sends slightly more."
          enum:
            - payer_absorbs
            - merchant_absorbs
          type: string
        id:
          description: refund id (`re_` + 26 base32 chars).
          examples:
            - re_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^re_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        legs:
          description: Legs, newest first.
          items:
            $ref: "#/components/schemas/RefundLeg"
          type: array
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Up to 50 key/value pairs (key ≤ 40 chars, value ≤ 500 chars) for your own use.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        method:
          description: "`route_quote`: a 1Click route back to the payer's origin chain and asset. `intents_transfer`: a merchant-signed Verifier transfer to the payer's Intents account (refund of an `intents_transfer` payment; no route provider)."
          type: string
          x-extensible-enum:
            - route_quote
            - intents_transfer
        next_action:
          anyOf:
            - $ref: "#/components/schemas/RefundNextAction"
            - type: "null"
          description: Present in `requires_action` once the current leg is prepared; null while it is being prepared and in every other status.
        object:
          const: refund
          description: Always `refund`.
          type: string
        payment_attempt:
          description: Attempt whose settlement is refunded (the paying attempt, or an overpayment).
          examples:
            - pa_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pa_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        payment_intent:
          description: payment_intent id (`pi_` + 26 base32 chars).
          examples:
            - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        reason:
          anyOf:
            - description: Why the merchant refunds.
              type: string
              x-extensible-enum:
                - requested_by_customer
                - duplicate
                - fraudulent
                - overpayment
                - other
            - type: "null"
        recipient:
          $ref: "#/components/schemas/RefundRecipient"
        sequence:
          description: Increases with every change; discard webhook objects with a lower sequence.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        source:
          description: What created the refund.
          type: string
          x-extensible-enum:
            - api
            - dashboard
            - review_rejection
        status:
          description: "Refund status (domain-model §4.4): `requires_action` = waiting for the merchant's signature; `pending` = the merchant's funds were detected and are on their way; `failed` = the provider returned them to the merchant (prepare again to retry)."
          type: string
          x-extensible-enum:
            - requires_action
            - pending
            - succeeded
            - failed
            - canceled
        succeeded_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the payer-side evidence was verified.
      required:
        - id
        - object
        - created
        - livemode
        - status
        - payment_intent
        - payment_attempt
        - amount
        - asset_id
        - decimals
        - fee_mode
        - reason
        - method
        - recipient
        - next_action
        - legs
        - amount_received
        - evidence
        - extra_amount_sent
        - source
        - failure_code
        - succeeded_at
        - canceled_at
        - sequence
        - metadata
      type: object
    RefundLeg:
      additionalProperties: {}
      description: One prepared route or transfer for a refund.
      properties:
        amount:
          description: What the merchant sends, base units of the settlement asset.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        amount_out_expected:
          anyOf:
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            - type: "null"
          description: What the payer is expected to receive, base units of the recipient asset (route estimate).
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        deadline:
          description: Sign and send before this time.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        duplicate:
          description: Settled after another leg had already refunded the payer (recorded in `extra_amount_sent`).
          type: boolean
        evidence:
          anyOf:
            - $ref: "#/components/schemas/Evidence"
            - type: "null"
          description: Payer-side evidence once verified (INV-2).
        failure_code:
          description: Why the leg failed, returned or was held.
          type:
            - string
            - "null"
        method:
          description: "`route_quote`: a 1Click route back to the payer's origin chain and asset. `intents_transfer`: a merchant-signed Verifier transfer to the payer's Intents account (refund of an `intents_transfer` payment; no route provider)."
          type: string
          x-extensible-enum:
            - route_quote
            - intents_transfer
        number:
          description: Leg number, 1-based; a re-prepared refund gets a new leg.
          maximum: 9007199254740991
          minimum: 1
          type: integer
        status:
          description: "Leg status: `returned` = the provider sent the funds back to the merchant destination; `expired` = the deadline passed without a deposit."
          type: string
          x-extensible-enum:
            - awaiting_signature
            - submitted
            - processing
            - succeeded
            - returned
            - failed
            - expired
            - held
        submitted_tx:
          anyOf:
            - description: Transaction hash in the chain's text form.
              maxLength: 128
              minLength: 8
              type: string
            - type: "null"
          description: Transaction the merchant reported, or the relayed Intents transaction.
        swap_type:
          anyOf:
            - description: How the route leg was quoted.
              enum:
                - EXACT_INPUT
                - EXACT_OUTPUT
              type: string
            - type: "null"
          description: "Route legs: how the quote was made; null for Intents transfers."
      required:
        - number
        - status
        - method
        - swap_type
        - amount
        - amount_out_expected
        - deadline
        - submitted_tx
        - duplicate
        - evidence
        - failure_code
        - created
      type: object
    RefundNextAction:
      description: What the merchant signs for the current leg. Wallets build exactly this (never another recipient or amount; dashboard §1).
      discriminator:
        mapping:
          sign_and_send: "#/components/schemas/RefundSignAndSend"
          sign_intent: "#/components/schemas/RefundSignIntent"
        propertyName: type
      oneOf:
        - $ref: "#/components/schemas/RefundSignAndSend"
        - $ref: "#/components/schemas/RefundSignIntent"
      type: object
    RefundRecipient:
      additionalProperties: {}
      description: "Where the refund goes (INV-7: the payer's recorded refund address)."
      properties:
        address:
          description: Payer's refund address (or Intents account).
          maxLength: 256
          minLength: 1
          type: string
        asset_id:
          description: Asset the payer receives (the asset they paid with).
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        chain:
          description: Chain the payer receives on.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        overridden:
          description: An owner replaced the recorded refund address (INV-7).
          type: boolean
        type:
          description: Address on the origin chain, or a NEAR Intents account.
          enum:
            - origin_chain
            - intents
          type: string
      required:
        - address
        - asset_id
        - chain
        - type
        - overridden
      type: object
    RefundSignAndSend:
      additionalProperties: {}
      description: "Next action: transfer exactly `amount` of `asset_id` from `from` to `to` on `chain`."
      properties:
        amount:
          description: Exact amount to send, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          description: Asset to send (the settlement asset).
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        chain:
          description: Chain to send on (the settlement destination's chain).
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        deadline:
          description: Send before this time; later deposits return to `from`.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        decimals:
          description: Token decimals.
          maximum: 255
          minimum: 0
          type: integer
        display:
          description: Human-readable summary, e.g. `Send 2.000000 USDC on Base to 0xab…`.
          type: string
        from:
          description: The settlement destination address; sign with this wallet (refunds of the route go back to it).
          maxLength: 256
          minLength: 1
          type: string
        memo:
          description: Memo the transfer must carry, if any.
          type:
            - string
            - "null"
        symbol:
          description: Token symbol.
          type: string
        to:
          description: 1Click deposit address of this leg.
          maxLength: 256
          minLength: 1
          type: string
        token:
          $ref: "#/components/schemas/TokenRef"
        type:
          const: sign_and_send
          description: Sign and broadcast a transfer on `chain`.
          type: string
      required:
        - type
        - chain
        - from
        - to
        - asset_id
        - token
        - symbol
        - decimals
        - amount
        - memo
        - deadline
        - display
      type: object
    RefundSignIntent:
      additionalProperties: {}
      description: "Next action: sign this Verifier transfer with the merchant's Intents account."
      properties:
        deadline:
          description: The payload's deadline; after it, prepare a new leg.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        display:
          description: Human-readable summary, e.g. `Transfer 2.000000 USDC to payer.near`.
          type: string
        message:
          $ref: "#/components/schemas/IntentMessage"
          description: Parsed payload, for display and checks; sign `nep413.message` or `payload`.
        nep413:
          additionalProperties: {}
          description: Arguments for a NEP-413 `signMessage` call, used verbatim.
          properties:
            message:
              description: Exact NEP-413 `message` (JSON string of `Nep413IntentMessage`).
              minLength: 2
              type: string
            nonce:
              description: 32-byte nonce (4-byte Verifier salt ‖ 28 random bytes), standard base64.
              pattern: ^[A-Za-z0-9+/]{43}=$
              type: string
            recipient:
              const: intents.near
              description: NEP-413 recipient.
              type: string
          required:
            - recipient
            - nonce
            - message
          type: object
        payload:
          description: Exact string to sign for `erc191` / `raw_ed25519` (JSON of `IntentMessage`, same nonce).
          minLength: 2
          type: string
        signer_id:
          description: The merchant's Intents account (the settlement destination).
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        standards:
          description: Signing standards accepted for `signer_id` (`nep413` for NEAR wallets, `erc191` for 0x accounts).
          items:
            description: Signing standard supported by NearPay.
            enum:
              - nep413
              - erc191
              - raw_ed25519
            type: string
          minItems: 1
          type: array
        transfer:
          additionalProperties: {}
          description: The single transfer the payload contains (for the human-readable summary).
          properties:
            amount:
              description: Amount, base units.
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
            memo:
              description: Binding memo of this leg.
              pattern: ^np1:[1-9A-HJ-NP-Za-km-z]{43,44}$
              type: string
            receiver_id:
              description: Payer's Intents account (`intents_transfer`) or the 1Click Intents deposit address (`route_quote`).
              pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
              type: string
            token:
              description: Asset transferred.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
          required:
            - receiver_id
            - token
            - amount
            - memo
          type: object
        type:
          const: sign_intent
          description: Sign a NEAR Intents payload; submit it with `submit_tx`.
          type: string
      required:
        - type
        - signer_id
        - transfer
        - standards
        - nep413
        - payload
        - message
        - deadline
        - display
      type: object
    TokenRef:
      additionalProperties: {}
      description: How to transfer an asset on its chain.
      properties:
        address:
          description: Token contract / mint / NEP-141 account; null for native assets.
          type:
            - string
            - "null"
        standard:
          description: Token standard on the chain.
          type: string
          x-extensible-enum:
            - native
            - erc20
            - nep141
            - spl
            - other
      required:
        - standard
        - address
      type: object
    TransferIntent:
      additionalProperties: {}
      description: NEAR Intents `transfer` intent.
      properties:
        intent:
          const: transfer
          description: Intent kind.
          type: string
        memo:
          description: Memo; NearPay puts the binding here.
          maxLength: 512
          type: string
        receiver_id:
          description: Receiving Intents account.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        tokens:
          additionalProperties:
            description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
            pattern: ^(0|[1-9][0-9]{0,77})$
            type: string
          description: Asset id → amount in base units.
          propertyNames:
            description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
            examples:
              - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
            maxLength: 256
            pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
            type: string
          type: object
      required:
        - intent
        - receiver_id
        - tokens
      type: object
info:
  title: webhooks (compat)
  version: 0.2.0
openapi: 3.1.0
paths:
  /account.updated:
    get:
      operationId: account_updated
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAccountUpdated"
          description: account.updated
  /agent_payment.failed:
    get:
      operationId: agent_payment_failed
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAgentPaymentFailed"
          description: agent_payment.failed
  /agent_payment.settled:
    get:
      operationId: agent_payment_settled
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAgentPaymentSettled"
          description: agent_payment.settled
  /checkout.session.completed:
    get:
      operationId: checkout_session_completed
      responses:
        "200":
          content:
            application/json:
              schema:
