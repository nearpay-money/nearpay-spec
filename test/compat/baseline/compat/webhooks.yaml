    Evidence:
      additionalProperties: {}
      description: Independent on-chain proof that a settlement reached the merchant (INV-2).
      properties:
        amount:
          description: Amount received by the recipient, base units.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          description: Asset that settled.
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        bitcoin:
          anyOf:
            - $ref: "#/components/schemas/BitcoinEvidence"
            - type: "null"
          description: Bitcoin detail (txid, outputs, confirmations) when `chain` is Bitcoin; null/absent otherwise. Spec 0.4.0.
        block_ref:
          description: Block height or hash containing the transaction.
          type:
            - string
            - "null"
        chain:
          description: Chain where the settlement happened.
          examples:
            - eip155:8453
          pattern: ^[-a-z0-9]{3,8}:[-_a-zA-Z0-9]{1,32}$
          type: string
        explorer_url:
          anyOf:
            - format: uri
              type: string
            - type: "null"
          description: Block-explorer link for the transaction.
        finality:
          description: Finality reached when the evidence was accepted.
          type: string
          x-extensible-enum:
            - final
            - finalized
            - confirmed
        observed_at:
          description: When NearPay accepted the evidence.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        recipient:
          description: Recipient that received the funds (the merchant destination).
          maxLength: 256
          minLength: 1
          type: string
        sender:
          anyOf:
            - description: Address in the chain's canonical text form.
              maxLength: 256
              minLength: 1
              type: string
            - type: "null"
          description: "Account that sent the settlement transfer, when the detector saw it (NEAR Intents: the transferring Intents account); null if unknown. Spec 0.3.0."
        solana:
          anyOf:
            - $ref: "#/components/schemas/SolanaEvidence"
            - type: "null"
          description: Solana detail (signature, slot, mint, token-balance delta) when `chain` is Solana; null/absent otherwise. Spec 0.4.0.
        source:
          description: Detector that produced the evidence.
          type: string
          x-extensible-enum:
            - watcher
            - indexer
            - verifier
            - provider
            - operator
        tier:
          description: "Verification tier: A = independently verified on chain, B = provider-attested within limits."
          type: string
          x-extensible-enum:
            - A
            - B
        tx_hash:
          description: Settlement transaction (NEAR receipt / tx hash for Intents).
          maxLength: 128
          minLength: 8
          type: string
      required:
        - chain
        - tx_hash
        - block_ref
        - recipient
        - asset_id
        - amount
        - finality
        - tier
        - source
        - observed_at
        - explorer_url
      type: object
    FeeSummary:
      additionalProperties: {}
      description: Fee snapshot of a payment (INV-6).
      properties:
        bearer:
          description: Who bears the fee.
          enum:
            - payer
            - merchant
          type: string
        total_bps:
          description: NearPay fee applied to this payment's route, in basis points.
          maximum: 10000
          minimum: 0
          type: integer
      required:
        - bearer
        - total_bps
      type: object
    IntentMessage:
      additionalProperties: {}
      description: Verifier message (`DefusePayload`).
      properties:
        deadline:
          description: Latest time the Verifier accepts the payload.
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
          type: string
        intents:
          description: Intents executed atomically.
          items:
            anyOf:
              - $ref: "#/components/schemas/TransferIntent"
              - additionalProperties: {}
                properties:
                  intent:
                    description: Intent kind.
                    type: string
                required:
                  - intent
                type: object
            description: A Verifier intent.
          minItems: 1
          type: array
        nonce:
          description: 32-byte nonce (4-byte Verifier salt ‖ 28 random bytes), standard base64.
          pattern: ^[A-Za-z0-9+/]{43}=$
          type: string
        signer_id:
          description: Intents account that signs (the payer).
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        verifying_contract:
          const: intents.near
          description: Verifier contract id.
          type: string
      required:
        - signer_id
        - verifying_contract
        - deadline
        - nonce
        - intents
      type: object
    Invoice:
      additionalProperties: {}
      description: A bill for a customer, paid on a hosted invoice page (FR-BIL-01).
      properties:
        amount_due:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Amount the customer owes in total (= `total`; no credits in v1).
        amount_paid:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Amount paid (`total` once paid, else 0).
        amount_remaining:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "`amount_due − amount_paid`."
        asset_id:
          anyOf:
            - description: NEAR Intents asset id, e.g. `nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1`.
              examples:
                - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
              maxLength: 256
              pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
              type: string
            - type: "null"
          description: Pricing asset when `currency` is `asset`.
        billing_reason:
          description: "Why the invoice exists: created by the merchant, the first invoice of a subscription, or a renewal."
          type: string
          x-extensible-enum:
            - manual
            - subscription_create
            - subscription_cycle
        checkout_session:
          anyOf:
            - description: checkout_session id (`cs_` + 26 base32 chars).
              examples:
                - cs_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^cs_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Open payments checkout session paying the invoice (created on demand by the hosted page).
        collection_method:
          description: "How the invoice is collected: `send_invoice` = the customer pays the hosted invoice; `auto_debit` (Stage 4) = billing's keeper collects it from the subscription's vault mandate, falling back to `send_invoice` (emailed) when the mandate cannot pay it (lld/billing.md §7.1, §14)."
          type: string
          x-extensible-enum:
            - send_invoice
            - auto_debit
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        currency:
          anyOf:
            - description: ISO 4217 currency code, lower-case (e.g. `usd`).
              pattern: ^[a-z]{3}$
              type: string
            - const: asset
              type: string
          description: ISO 4217 code for fiat pricing, or `asset` when priced in an asset (then `asset_id` is set).
        customer:
          description: Customer billed (owned by payments).
          examples:
            - cus_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cus_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        days_until_due:
          anyOf:
            - maximum: 365
              minimum: 0
              type: integer
            - type: "null"
          description: Days after finalize until due (when no fixed `due_date` was given).
        default_tax_rates:
          description: Tax rates applied to lines created without `tax_rates`.
          items:
            description: tax_rate id (`txr_` + 26 base32 chars).
            examples:
              - txr_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^txr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
          type: array
        description:
          description: Memo shown on the invoice.
          type:
            - string
            - "null"
        due_date:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When payment is due; set at finalize at the latest.
        footer:
          description: Footer shown on the invoice.
          type:
            - string
            - "null"
        hosted_invoice_url:
          anyOf:
            - description: Absolute URL.
              format: uri
              maxLength: 2048
              type: string
            - type: "null"
          description: Customer page `<pay origin>/i/<id>#<invoice secret>` (the secret is in the fragment); set once finalized. Always null in events and webhooks (secrets never travel on the bus).
        id:
          description: invoice id (`in_` + 26 base32 chars).
          examples:
            - in_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^in_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        invoice_pdf:
          anyOf:
            - description: Absolute URL.
              format: uri
              maxLength: 2048
              type: string
            - type: "null"
          description: API URL of the PDF (`GET /v1/invoices/{id}/pdf`, needs your credentials); null for drafts.
        lines:
          description: All lines (at most 100).
          items:
            $ref: "#/components/schemas/InvoiceLineItem"
          type: array
        livemode:
          description: "`true` for live mode, `false` for test mode."
          type: boolean
        mandate:
          anyOf:
            - description: mandate id (`md_` + 26 base32 chars).
              examples:
                - md_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^md_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Mandate the keeper collects (or collected) this invoice from; null/absent when none (Stage 4).
        mandate_collection:
          anyOf:
            - additionalProperties: {}
              properties:
                fee:
                  description: NearPay fee taken by the vault.
                  pattern: ^(0|[1-9][0-9]{0,77})$
                  type: string
                mandate:
                  description: mandate id (`md_` + 26 base32 chars).
                  examples:
                    - md_01jbz9k3m4n5p6q7r8s9t0v1w2
                  pattern: ^md_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
                  type: string
                merchant_share:
                  description: Tokens delivered to the merchant's Intents account.
                  pattern: ^(0|[1-9][0-9]{0,77})$
                  type: string
                period:
                  description: Vault period that paid the invoice.
                  maximum: 9007199254740991
                  minimum: 1
                  type: integer
                receipt_id:
                  description: Vault receipt that logged `collected` (the evidence, INV-2).
                  maxLength: 64
                  minLength: 1
                  type: string
                token:
                  description: Token received, as a NEAR Intents asset id.
                  examples:
                    - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
                  maxLength: 256
                  pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
                  type: string
                tx_hash:
                  description: NEAR transaction of the `collect`.
                  maxLength: 128
                  minLength: 8
                  type: string
              required:
                - mandate
                - period
                - token
                - merchant_share
                - fee
                - tx_hash
                - receipt_id
              type: object
            - type: "null"
          description: Set when the invoice was paid by a vault collection instead of a payment intent (Stage 4).
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Up to 50 key/value pairs (key ≤ 40 chars, value ≤ 500 chars) for your own use.
          propertyNames:
            maxLength: 40
            minLength: 1
            type: string
          type: object
        next_reminder_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the next reminder goes out; null when none is due.
        number:
          anyOf:
            - maxLength: 32
              type: string
            - type: "null"
          description: Invoice number `<prefix>-<5+ digits>`, unique per account and mode, assigned at finalize; null for drafts.
        object:
          const: invoice
          description: Always `invoice`.
          type: string
        payment_intent:
          anyOf:
            - description: payment_intent id (`pi_` + 26 base32 chars).
              examples:
                - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Payment intent that paid the invoice.
        payment_intents:
          description: Every payment intent opened for the invoice, newest first. A settlement that arrives after the invoice is already paid or void (INV-3) stays listed here; refund it like an overpayment.
          items:
            description: payment_intent id (`pi_` + 26 base32 chars).
            examples:
              - pi_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^pi_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
          type: array
        period_end:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: End of the billed subscription period (exclusive).
        period_start:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: Start of the billed subscription period.
        reminder_days:
          description: When reminders go out, in days relative to the due date (negative = before), strictly increasing, at most 10; `[]` sends none.
          items:
            description: Days relative to the due date (negative = before).
            maximum: 60
            minimum: -30
            type: integer
          maxItems: 10
          type: array
        reminders_sent:
          description: Reminders sent so far.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        sequence:
          description: Increases with every change; discard webhook objects with a lower sequence.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        settlement_destination:
          anyOf:
            - description: settlement_destination id (`sd_` + 26 base32 chars).
              examples:
                - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Destination the payment settles to; null = the account default when the payment session opens.
        status:
          description: "Invoice status (domain-model §4.5): `uncollectible` invoices can still be paid (INV-3)."
          type: string
          x-extensible-enum:
            - draft
            - open
            - paid
            - void
            - uncollectible
        status_transitions:
          additionalProperties: {}
          description: When status changes happened.
          properties:
            finalized_at:
              anyOf:
                - description: Unix time in seconds.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                - type: "null"
              description: Finalized (draft → open).
            marked_uncollectible_at:
              anyOf:
                - description: Unix time in seconds.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                - type: "null"
              description: Marked uncollectible.
            paid_at:
              anyOf:
                - description: Unix time in seconds.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                - type: "null"
              description: Paid.
            sent_at:
              anyOf:
                - description: Unix time in seconds.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                - type: "null"
              description: Last emailed to the customer.
            voided_at:
              anyOf:
                - description: Unix time in seconds.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                - type: "null"
              description: Voided.
          required:
            - finalized_at
            - sent_at
            - paid_at
            - voided_at
            - marked_uncollectible_at
          type: object
        subscription:
          anyOf:
            - description: subscription id (`sub_` + 26 base32 chars).
              examples:
                - sub_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^sub_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Subscription that produced the invoice.
        subtotal:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Σ line amounts as priced.
        tax:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Σ every tax amount (inclusive and exclusive).
        total:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "`subtotal` + exclusive taxes: what the customer pays."
        total_excluding_tax:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "`total − tax`."
        total_tax_amounts:
          description: Tax per rate across all lines (Σ of the per-line, already rounded amounts).
          items:
            $ref: "#/components/schemas/InvoiceTaxAmount"
          type: array
        uncollectible_reason:
          anyOf:
            - description: Why the invoice became uncollectible.
              type: string
              x-extensible-enum:
                - merchant
                - dunning_exhausted
            - type: "null"
          description: Set when `status` is or was `uncollectible`.
      required:
        - id
        - object
        - created
        - livemode
        - status
        - number
        - customer
        - subscription
        - billing_reason
        - collection_method
        - currency
        - asset_id
        - description
        - footer
        - lines
        - default_tax_rates
        - subtotal
        - tax
        - total
        - total_excluding_tax
        - total_tax_amounts
        - amount_due
        - amount_paid
        - amount_remaining
        - days_until_due
        - due_date
        - period_start
        - period_end
        - settlement_destination
        - reminder_days
        - reminders_sent
        - next_reminder_at
        - hosted_invoice_url
        - invoice_pdf
        - checkout_session
        - payment_intent
        - payment_intents
        - status_transitions
        - uncollectible_reason
        - metadata
        - sequence
      type: object
    InvoiceLineItem:
      additionalProperties: {}
      description: One line of an invoice.
      properties:
        amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "`unit_amount × quantity` (inclusive taxes stay inside)."
        amount_excluding_tax:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "`amount` less this line's inclusive taxes."
        description:
          description: Text on the invoice (product name or the given description).
          type: string
        id:
          description: invoice_line_item id (`il_` + 26 base32 chars).
          examples:
            - il_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^il_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        object:
          const: line_item
          description: Always `line_item`.
          type: string
        period:
          anyOf:
            - additionalProperties: {}
              properties:
                end:
                  description: Period end (exclusive).
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                start:
                  description: Period start.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
              required:
                - start
                - end
              type: object
            - type: "null"
          description: Service period of a `subscription` line; null for one-off lines.
        price:
          anyOf:
            - description: price id (`price_` + 26 base32 chars).
              examples:
                - price_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^price_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Price the line was created from; null for a custom amount.
        product:
          anyOf:
            - description: product id (`prod_` + 26 base32 chars).
              examples:
                - prod_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^prod_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Product of `price`.
        quantity:
          description: Quantity.
          maximum: 9007199254740991
          minimum: 1
          type: integer
        subscription_item:
          anyOf:
            - description: subscription_item id (`si_` + 26 base32 chars).
              examples:
                - si_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^si_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Subscription item of a `subscription` line.
        tax_amounts:
          description: Tax per rate for this line.
          items:
            $ref: "#/components/schemas/InvoiceTaxAmount"
          type: array
        tax_rates:
          description: Tax rates applied to the line (all inclusive or all exclusive).
          items:
            description: tax_rate id (`txr_` + 26 base32 chars).
            examples:
              - txr_01jbz9k3m4n5p6q7r8s9t0v1w2
            pattern: ^txr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
            type: string
          type: array
        type:
          description: A one-off line or a subscription item's line.
          type: string
          x-extensible-enum:
            - invoiceitem
            - subscription
        unit_amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Price per unit in the invoice currency.
      required:
        - id
        - object
        - type
        - price
        - product
        - subscription_item
        - description
        - quantity
        - unit_amount
        - amount
        - amount_excluding_tax
        - tax_rates
        - tax_amounts
        - period
      type: object
    InvoiceTaxAmount:
      additionalProperties: {}
      description: One tax rate applied to an amount (snapshot; immutable once open).
      properties:
        amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: Tax of this line for this rate, rounded half-up per line.
        display_name:
          description: Tax-rate name at finalize (snapshot).
          type: string
        inclusive:
          description: The line amount contains this tax.
          type: boolean
        percentage:
          description: Exact percentage as a decimal string, 0–100 with at most 4 decimals (the rate is the rational `ppm / 1 000 000`, ppm = percentage × 10 000). No floats.
          examples:
            - "19"
            - "8.875"
          pattern: ^(100(\.0{1,4})?|[1-9]?[0-9](\.[0-9]{1,4})?)$
          type: string
        tax_rate:
          description: tax_rate id (`txr_` + 26 base32 chars).
          examples:
            - txr_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^txr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        taxable_amount:
          anyOf:
            - description: Fiat amount in minor units (e.g. cents), integer.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - description: Asset amount in base units as a decimal string (no sign, no decimals, ≤ 78 digits).
              pattern: ^(0|[1-9][0-9]{0,77})$
              type: string
          description: "Amount the rate applies to: the line amount (exclusive) or the line amount less its inclusive taxes."
      required:
        - tax_rate
        - display_name
        - percentage
        - inclusive
        - amount
        - taxable_amount
      type: object
    Mandate:
      additionalProperties: {}
      description: "An auto-debit mandate: NearPay's mirror of a subscription-vault mandate the payer funded (FR-BIL-02/04)."
      properties:
        amount_per_period:
          description: Tokens collected per period.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        asset_id:
          description: The token as a NEAR Intents asset id (`nep141:<token>`).
          examples:
            - nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
          maxLength: 256
          pattern: ^(nep141:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+|nep245:(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+:[\x21-\x7e]{1,128})$
          type: string
        balance:
          description: Tokens on the mandate available for the next periods (mirror of the vault events).
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        canceled:
          anyOf:
            - additionalProperties: {}
              properties:
                by:
                  description: Who canceled (the payer or the merchant receiver).
                  pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
                  type: string
                by_role:
                  description: Role of `by`.
                  type: string
                  x-extensible-enum:
                    - payer
                    - merchant_receiver
                canceled_at:
                  description: Block time of the `canceled` event.
                  maximum: 9007199254740991
                  minimum: 0
                  type: integer
                refunded:
                  description: Returned to the payer by the cancel; `"0"` if that refund failed (then withdrawable).
                  pattern: ^(0|[1-9][0-9]{0,77})$
                  type: string
              required:
                - by
                - by_role
                - refunded
                - canceled_at
              type: object
            - type: "null"
          description: Set once canceled.
        collect_failures:
          description: Consecutive `collect_failed` outcomes (merchant leg delivered nothing); reset by a collection.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        collected_periods:
          description: Periods the vault has counted.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        collecting:
          description: "Billing's keeper collects renewal invoices from this mandate: linked, on-chain active, and its subscription is active and `auto_debit`. Turns false for good when the subscription ends or leaves `auto_debit` (`mandate.released`)."
          type: boolean
        created:
          description: Block time of `mandate_created`.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        customer:
          description: Customer of that subscription.
          examples:
            - cus_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^cus_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        ext_ref:
          description: The mandate's on-chain reference (the subscription id for NearPay mandates).
          maxLength: 64
          type: string
        fee_bps:
          description: NearPay fee in basis points, fixed on chain at creation.
          maximum: 10000
          minimum: 0
          type: integer
        funded_periods:
          description: "`floor(balance / amount_per_period)`: periods the balance still covers."
          maximum: 9007199254740991
          minimum: 0
          type: integer
        id:
          description: mandate id (`md_` + 26 base32 chars).
          examples:
            - md_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^md_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        last_collection:
          anyOf:
            - $ref: "#/components/schemas/MandateCollection"
            - type: "null"
          description: Most recent collected period.
        link_status:
          description: "`linked`: billing collects this mandate for its subscription. `unlinked`: the on-chain terms do not match what billing prepared; billing never collects it and the payer is asked to cancel it."
          type: string
          x-extensible-enum:
            - linked
            - unlinked
        livemode:
          description: "`true` for the mainnet vault, `false` for the sandbox vault stand-in."
          type: boolean
        max_periods:
          anyOf:
            - maximum: 9007199254740991
              minimum: 1
              type: integer
            - type: "null"
          description: Maximum periods; null = until canceled.
        merchant_receiver:
          description: Receiver of the merchant share (the merchant's NEAR Intents account).
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        next_collect_at:
          anyOf:
            - description: Unix time in seconds.
              maximum: 9007199254740991
              minimum: 0
              type: integer
            - type: "null"
          description: When the next vault period becomes due; null unless on-chain active below `max_periods`.
        object:
          const: mandate
          description: Always `mandate`.
          type: string
        onchain_id:
          description: The vault's `mandate_id`.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        payer:
          description: "Payer: the NEAR account that signed the funding transaction (always its owner)."
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        period_secs:
          description: Vault period length (seconds).
          maximum: 9007199254740991
          minimum: 86400
          type: integer
        receiver_kind:
          description: "How the merchant share is delivered: `intents_account` = `ft_transfer_call(intents.near, msg = merchant_receiver)` (credits the merchant's NEAR Intents balance); `near_account` = plain `ft_transfer`."
          enum:
            - intents_account
            - near_account
          type: string
        sequence:
          description: Increases with every change; discard webhook objects with a lower sequence.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        settlement_destination:
          anyOf:
            - description: settlement_destination id (`sd_` + 26 base32 chars).
              examples:
                - sd_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^sd_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Settlement destination that matches `merchant_receiver` (linked mandates); null otherwise.
        start_at:
          description: When vault period 1 became (or becomes) due.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        status:
          description: "Mandate status (domain-model §4.5): `active` = on-chain active with at least one period funded; `insufficient` = on-chain active but the balance is below one period (top up, or the due invoice falls back to `send_invoice`); `exhausted` = `max_periods` collected; `canceled` = canceled by the payer or the merchant receiver."
          type: string
          x-extensible-enum:
            - active
            - insufficient
            - exhausted
            - canceled
        subscription:
          description: Subscription named by the mandate's `ext_ref`.
          examples:
            - sub_01jbz9k3m4n5p6q7r8s9t0v1w2
          pattern: ^sub_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
          type: string
        token:
          description: NEP-141 token contract.
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        unlinked_reason:
          anyOf:
            - description: "Why a mandate is `unlinked` (billing §6 linkage rule): the subscription is not `auto_debit` or has ended, another mandate is already linked, or a term differs from the prepared one (receiver kind, receiver = an active Intents-account destination of the account, token, amount per period, period, fee, `start_at` after the current period end, `max_periods` below the remaining periods), or a test-vault mandate names a live subscription (or the reverse)."
              type: string
              x-extensible-enum:
                - subscription_not_auto_debit
                - subscription_ended
                - already_linked
                - receiver_kind_mismatch
                - receiver_not_destination
                - token_mismatch
                - amount_mismatch
                - period_mismatch
                - fee_mismatch
                - start_too_late
                - max_periods_too_low
                - mode_mismatch
            - type: "null"
          description: Set when `link_status` is `unlinked`.
        vault_contract:
          description: Vault account (`v1.vault.nearpay.near`; the stand-in's in test mode).
          pattern: ^(?=.{2,64}$)(([a-z\d]+[-_])*[a-z\d]+\.)*([a-z\d]+[-_])*[a-z\d]+$
          type: string
        withdrawn:
          description: Total the payer withdrew after cancel/exhaustion (`withdrawn` events).
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
      required:
        - id
        - object
        - created
        - livemode
        - status
        - link_status
        - unlinked_reason
        - collecting
        - subscription
        - customer
        - vault_contract
        - onchain_id
        - payer
        - token
        - asset_id
        - merchant_receiver
        - receiver_kind
        - settlement_destination
        - amount_per_period
        - period_secs
        - start_at
        - max_periods
        - fee_bps
        - collected_periods
        - balance
        - funded_periods
        - next_collect_at
        - last_collection
        - collect_failures
        - canceled
        - withdrawn
        - ext_ref
        - sequence
      type: object
    MandateCollection:
      additionalProperties: {}
      description: "A period collected by the vault (evidence: the `collected` event)."
      properties:
        amount:
          description: "`merchant_share + fee` actually paid (token base units)."
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        collected_at:
          description: Block time of the receipt.
          maximum: 9007199254740991
          minimum: 0
          type: integer
        fee:
          description: NearPay fee; `"0"` when the fee leg failed (the fee stayed with the payer).
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        invoice:
          anyOf:
            - description: invoice id (`in_` + 26 base32 chars).
              examples:
                - in_01jbz9k3m4n5p6q7r8s9t0v1w2
              pattern: ^in_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
              type: string
            - type: "null"
          description: Invoice the collection paid (or applied to).
        merchant_share:
          description: Share delivered to the merchant receiver.
          pattern: ^(0|[1-9][0-9]{0,77})$
          type: string
        period:
          description: 1-based vault period.
          maximum: 9007199254740991
          minimum: 1
          type: integer
        receipt_id:
          description: Vault receipt that logged `collected` (evidence).
          maxLength: 64
          minLength: 1
          type: string
        short:
          description: "The merchant share was below the expected share (partial delivery): the invoice is not marked paid; billing issues a `send_invoice` balance invoice for the shortfall."
          type: boolean
        tx_hash:
          description: NEAR transaction of the `collect`.
          maxLength: 128
          minLength: 8
          type: string
      required:
        - period
        - amount
        - merchant_share
        - fee
        - short
        - invoice
        - tx_hash
        - receipt_id
        - collected_at
      type: object
    PaymentAttemptSummary:
      additionalProperties: {}
      description: One payment attempt of an intent, as merchants see it.
      properties:
        created:
          description: Unix time in seconds.
          maximum: 9007199254740991
          minimum: 0
