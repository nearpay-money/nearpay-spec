    doc_url: https://docs.nearpay.money/errors/link_expired
    since: 0.1.0
  - code: link_used
    status: 410
    type: invalid_request_error
    retryable: false
    generic: false
    message: The link was already used; request a new one.
    example: The link was already used; request a new one.
    doc_url: https://docs.nearpay.money/errors/link_used
    since: 0.1.0
  - code: webauthn_failed
    status: 400
    type: invalid_request_error
    retryable: false
    generic: false
    message: "The passkey operation could not be verified: {reason}"
    example: "The passkey operation could not be verified: challenge mismatch"
    doc_url: https://docs.nearpay.money/errors/webauthn_failed
    since: 0.1.0
  - code: invalid_client
    status: 401
    type: authentication_error
    retryable: false
    generic: false
    message: The service client credentials are invalid.
    example: The service client credentials are invalid.
    doc_url: https://docs.nearpay.money/errors/invalid_client
    since: 0.1.0
  - code: turnstile_failed
    status: 403
    type: permission_error
    retryable: false
    generic: false
