    example: The human-verification challenge failed; reload and try again.
    doc_url: https://docs.nearpay.money/errors/turnstile_failed
    since: 0.1.0
  - code: invalid_setting
    status: 400
    type: invalid_request_error
    retryable: false
    generic: false
