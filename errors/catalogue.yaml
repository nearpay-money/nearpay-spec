  - code: api_error
    status: 500
    type: api_error
    retryable: true
    generic: true
    message: An internal error occurred; retry with the same Idempotency-Key.
    example: An internal error occurred; retry with the same Idempotency-Key.
    doc_url: https://docs.nearpay.money/errors/api_error
    since: 0.1.0
  - code: state_conflict
    status: 409
    type: state_conflict
    retryable: false
    generic: false
    message: The {object} is {state}; this action is not allowed.
    example: The checkout_session is complete; this action is not allowed.
    doc_url: https://docs.nearpay.money/errors/state_conflict
    since: 0.1.0
  - code: livemode_forbidden
    status: 403
    type: permission_error
    retryable: false
    generic: false
