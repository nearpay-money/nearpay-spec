version: 0.1.5
errors:
  - code: invalid_request
    status: 400
    type: invalid_request_error
    retryable: false
    generic: true
    message: "The request is invalid: {detail}"
    example: "The request is invalid: amount must be an integer."
    doc_url: https://docs.nearpay.money/errors/invalid_request
    since: 0.1.0
  - code: resource_missing
    status: 404
    type: invalid_request_error
    retryable: false
    generic: true
    message: "No such {object}: {id}"
    example: "No such checkout_session: cs_01jbz9k3m4n5p6q7r8s9t0v1w2"
    doc_url: https://docs.nearpay.money/errors/resource_missing
    since: 0.1.0
  - code: authentication_required
    status: 401
    type: authentication_error
    retryable: false
    generic: true
    message: This request needs a credential.
    example: This request needs a credential.
    doc_url: https://docs.nearpay.money/errors/authentication_required
    since: 0.1.0
  - code: invalid_api_key
    status: 401
    type: authentication_error
    retryable: false
    generic: true
    message: The API key is invalid, expired or revoked.
    example: The API key is invalid, expired or revoked.
    doc_url: https://docs.nearpay.money/errors/invalid_api_key
    since: 0.1.0
  - code: permission_denied
    status: 403
    type: permission_error
    retryable: false
    generic: true
    message: This credential is not allowed to {action}.
    example: This credential is not allowed to write checkout_sessions.
    doc_url: https://docs.nearpay.money/errors/permission_denied
    since: 0.1.0
  - code: csrf_token_invalid
    status: 403
    type: permission_error
    retryable: false
    generic: true
    message: The CSRF token is missing or does not match the session.
    example: The CSRF token is missing or does not match the session.
    doc_url: https://docs.nearpay.money/errors/csrf_token_invalid
    since: 0.1.0
  - code: ip_not_allowed
    status: 403
    type: permission_error
    retryable: false
    generic: true
    message: Requests with this API key are not allowed from {ip}.
    example: Requests with this API key are not allowed from 203.0.113.7.
    doc_url: https://docs.nearpay.money/errors/ip_not_allowed
    since: 0.1.0
  - code: account_suspended
    status: 403
    type: permission_error
    retryable: false
    generic: true
    message: The account is suspended; live-mode changes are not allowed.
    example: The account is suspended; live-mode changes are not allowed.
    doc_url: https://docs.nearpay.money/errors/account_suspended
    since: 0.1.0
  - code: step_up_required
    status: 401
    type: authentication_error
    retryable: false
    generic: true
    message: This action needs a fresh passkey confirmation (step-up).
    example: This action needs a fresh passkey confirmation (step-up).
    doc_url: https://docs.nearpay.money/errors/step_up_required
    since: 0.1.0
  - code: rate_limited
    status: 429
    type: rate_limit_error
    retryable: true
    generic: true
    message: Too many requests; retry after {retry_after} seconds.
    example: Too many requests; retry after 2 seconds.
    doc_url: https://docs.nearpay.money/errors/rate_limited
    since: 0.1.0
  - code: idempotency_key_reused
    status: 409
    type: idempotency_error
    retryable: false
    generic: true
    message: This Idempotency-Key was used with a different request.
    example: This Idempotency-Key was used with a different request.
    doc_url: https://docs.nearpay.money/errors/idempotency_key_reused
    since: 0.1.0
  - code: idempotency_in_progress
    status: 409
    type: idempotency_error
    retryable: true
    generic: true
    message: A request with this Idempotency-Key is still in progress.
    example: A request with this Idempotency-Key is still in progress.
    doc_url: https://docs.nearpay.money/errors/idempotency_in_progress
